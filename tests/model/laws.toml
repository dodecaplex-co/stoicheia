# tests/model/laws.toml
#
# The laws the model checks: one for each axiom in Certificate/axioms.lock, under the
# lock's name for it, with the name of its law in the harness; and the laws that must
# fail in the hyperbolic plane. tests/model/run.py checks this file against the lock and
# against facts.json in both directions, and search.py and hyperbolic.py against it,
# before anything runs.
#
# Like the lock, it is a value pinned to the edition: a line here changes only with its
# axiom's entry in the lock, in one pull request with the lock, lock.sha256 and the law's
# code (MODEL.md, "Changing the axioms", says how). Any other change to it is a change to
# the checks, and lands in a pull request of its own (docs/WORKFLOW.md, section 10).

