# False positives of the secret scan in scripts/safe_push.py, each with its reason.
#
# safe_push.py reads this file from the commit it pushes. An entry lets a flagged line
# through when its file matches `path` (a glob), the line (or, for a file-name rule, the
# file's path) contains `match`, and, if `rule` is given, the rule that flagged it is
# that one. Every entry needs a `reason`; one without is refused. The allow-listed lines
# are printed in safe_push's report, so they stay visible. Commit messages are scanned
# too, as the path "commit <sha12> message".
#
# [[allow]]
# path = "docs/reports/example.md"
# match = "the part of the line that was flagged"
# rule = "key, token or secret"
# reason = "Why this is not a secret."
