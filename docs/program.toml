# docs/program.toml: the columns of PROGRAM.md's status table that the edition's own
# files cannot give. scripts/render.py reads it, with facts.json (the propositions proved)
# and review/ (the records, current or stale, at stage "full" or "exceptions"), and writes
# the table between <!-- status --> and <!-- /status --> in docs/PROGRAM.md; CI checks
# that the table is current. The coordinator keeps this file with PROGRAM.md, and brings
# it up to date at the end of every stage and every book (docs/WORKFLOW.md, section 10).
#
# One table for each book begun, named by its numeral:
#   stage    where the book stands, one of brief, statements, proofs, voice, records,
#            acceptance or released, with a few words in brackets where they help:
#            "records (exceptions)".
#   outside  Astra's cold outside reading of 17 October 2026 at 676244a:
#            its score, who read, and the commit read.
#   tag      the release tag, once there is one; or else
#   release  a few words on the release still to come.
# A book with no table here and nothing in facts.json is shown as not begun.

[I]
stage = "released (I.45 for any figure given by its outline, done 22 Oct, #116; next: acceptance, then the consolidation release of Books I–III)"
outside = { score = 90, by = "Astra", commit = "676244a" }
tag = "book-I"

[II]
stage = "released (II.14 for any figure given by its outline, done 22 Oct, #116; next: acceptance, then the consolidation release of Books I–III)"
outside = { score = 85, by = "Astra", commit = "676244a" }
tag = "book-II"

[III]
stage = "released (next: the arc's field order, #165, and the centre-given tag's removal, #59; then acceptance and the consolidation release of Books I–III)"
outside = { score = 80, by = "Astra", commit = "676244a" }
tag = "book-III"

[IV]
stage = "brief (draft, awaiting approval)"
