# review/III/01.toml
[statement]
scope = "full"
note = "Given a circle and two of its points A, B, constructs D, C, E and F as Euclid does and proves that F is its centre; the porism keeps its given centre."
fingerprint = "sha256:7d6a58eb751858ff"

[route]
kind = "euclid"

[overlap]
rule = "Tacit.exists_centre"
kind = "step"
note = "Our foundations assume that every circle has a centre. The rule supplies two steps: inside `Prop1.construction`, a centre for the proof that D is within the circle, by III.2's argument in `Prop1.within`; and, in the reductio, the supposed centre G. The centre taken inside the construction supplies none of its points, so the bisections, the perpendicular and the proof that F is the centre are III.1's own work. The rule gives bare existence; `Prop1.of_circle` gives Euclid's construction for any circle, first taking two of its points, A and B."

[[passage]]
at = "Let a straight line AB be drawn through it at random"
kind = "grouped"
helper = "Prop1.construction"
note = "One call carries Euclid's three construction sentences: bisect AB at D, draw DC at right angles and through to E, then bisect CE at F. `Prop1.construction` receives the circle and A, B, with no centre supplied; the proof that F is the centre follows under Euclid's sentences."

[[passage]]
at = "from D let DC be drawn at right angles to AB and let it be drawn through to E"
kind = "helper"
helper = "Prop1.within"
note = "Drawing DC through to E needs D within the circle, which Euclid proves only in III.2, as Todhunter observes. Inside `Prop1.construction`, `exists_centre` supplies a centre only for this proof: `Prop1.within` takes III.2's own argument, by I.5, I.16 and I.19; were the centre on AB, it would be D itself."

[[passage]]
at = "let CE be bisected at F"
kind = "helper"
helper = "BookI.Prop10"
note = "Euclid bisects AB and CE and draws DC at right angles without references from Heath here. Within `Prop1.construction`, the Lean uses I.10 (`BookI.Prop10`) for both bisections, I.11 (`BookI.Prop11`) for DC, and `Tacit.line_circle_beyond`, the rule we assume as System E, Intersections 5, twice to find C and E through the interior point D."

[[passage]]
at = "For suppose it is not, but, if possible, let G be the centre"
kind = "helper"
helper = "Tacit.exists_centre"
note = "Euclid supposes a centre G other than F. The Lean takes G from `Tacit.exists_centre`, the rule that every circle has a centre, and supposes G off CE to reach the contradiction."

[[passage]]
at = "and let GA, GD, GB be joined"
kind = "case"
helper = "Prop1.middle"
note = "Euclid's figure keeps the supposed centre G off AB. On AB it would be AB's middle point D, which is already on CE, so the Lean sets that case aside first; then DAG and DBG are triangles for I.8."

[[passage]]
at = "But the angle FDB is also right"
kind = "case"
note = "If AB passes through the centre, F is D and there is no angle FDB, so the Lean takes the angle CDB, right by construction. For \"the greater to the less\" it shows that at D only one straight line is at right angles to DB, wherever G lies, so G is on CE."

[[passage]]
at = "therefore the angle FDB is equal to the angle GDB"
kind = "helper"
helper = "Prop1.perpendicular"
note = "Euclid rules out equal angles when one is greater; `Prop1.perpendicular` proves that the two perpendiculars lie on one straight line, using `onRay_of_angle_eq` and its argument that a part is less than the whole. For G on the other side of AB, the Lean produces CD beyond D by Postulate 2 and makes the adjacent angle right by I.13 and Common Notion 3, for which Heath gives no reference here."

[[passage]]
at = "Therefore G is not the centre of the circle ABC."
kind = "grouped"
note = "The reductio shows that the supposed centre G lies on CE, and the Lean beneath makes it the middle point F. One argument, for any centre G, carries all three sentences."

[[passage]]
at = "Therefore the point F is the centre of the circle ABC."
kind = "helper"
helper = "Prop1.middle"
note = "Euclid takes for granted that a centre on CE is its middle point. The Lean puts G between C and E by Book Zero's `between_of_centre_chord`, Circle 1 (`Tacit.between_of_inside_chord`) for a centre, proved without that rule from Definition I.15, the three orders of three points on a straight line (System E, Between 6) and our radius rule: either other order would make one radius a part of the other. It does the same in the earlier case on AB, and in the porism's. Then equal radii and `Prop1.middle` identify G with F."

[[passage]]
at = "PORISM. From this it is manifest"
kind = "carried"
helper = "Prop1.porism"
note = "Proved as its own theorem, III.1 Por., by the argument of Euclid's reductio from the given centre G: on AB it is D by `Prop1.middle`; off AB, the shared I.8 step `Prop1.equal_adjacent` makes the adjacent angles equal, Definition I.10 makes them right, Postulate 4 identifies their measure with `∟`, and `Prop1.perpendicular` puts G on DC. It neither calls III.1 nor uses `centre_unique` or `exists_centre`."

[figure]
case = "AB not through F, with the supposed centre G off CE in the reductio"
note = "Like Heath's, this figure draws the impossible supposition: G, off CE, as a centre of the circle ABC."

