# review/III/01.toml
[statement]
scope = "full"
note = "Given a circle and two of its points A, B, constructs D, C, E and F as Euclid does and proves that F is its centre; the porism keeps its given centre."
fingerprint = "sha256:7d6a58eb751858ff"

[route]
kind = "euclid"

[overlap]
rule = "Tacit.exists_centre"
kind = "step"
note = "Our foundations assume that every circle has a centre. The rule supplies a centre for D within in the unchanged construction, by III.2's argument in `Prop1.within`, and supplies G for the correctness reductio. The construction's witness supplies none of its points: the bisections, perpendicular and proof that F is the centre remain III.1's work. The rule gives bare existence; `Prop1.of_circle` gives Euclid's construction for any circle, first taking its two points A, B."

[[passage]]
at = "Let a straight line AB be drawn through it at random"
kind = "grouped"
helper = "Prop1.construction"
note = "One call carries Euclid's three construction sentences: bisect AB at D, draw DC at right angles and through to E, then bisect CE at F. `Prop1.construction` receives the circle and A, B, with no centre supplied; the proof that F is the centre follows under Euclid's sentences."

[[passage]]
at = "from D let DC be drawn at right angles to AB and let it be drawn through to E"
kind = "helper"
helper = "Prop1.within"
note = "Drawing DC through to E needs D within the circle, which Euclid proves only in III.2, as Todhunter observes. Inside `Prop1.construction`, `exists_centre` supplies a centre only for this proof: `Prop1.within` takes III.2's own argument, by I.5, I.16 and I.19; were the centre on AB, it would be D itself."

[[passage]]
at = "and let GA, GD, GB be joined"
kind = "case"
helper = "Prop1.middle"
note = "Euclid's figure keeps the supposed centre G off AB. On AB it would be AB's middle point D, which is already on CE, so the Lean sets that case aside first; then DAG and DBG are triangles for I.8."

[[passage]]
at = "But the angle FDB is also right"
kind = "helper"
helper = "Prop1.perpendicular"
note = "If AB passes through the centre, F is D and there is no angle FDB, so the Lean takes the angle CDB, right by construction. For \"the greater to the less\" it shows that at D only one straight line is at right angles to DB, wherever G lies, so G is on CE."

[[passage]]
at = "Therefore G is not the centre of the circle ABC."
kind = "grouped"
note = "The reductio shows that the supposed centre G lies on CE, and the Lean beneath makes it the middle point F. One argument, for any centre G, carries all three sentences."

[[passage]]
at = "PORISM. From this it is manifest"
kind = "carried"
helper = "Prop1.porism"
note = "Proved as its own theorem, III.1 Por., by the argument of Euclid's reductio from the given centre G: on AB it is D by `Prop1.middle`; off AB, the shared I.8 step `Prop1.equal_adjacent` makes the adjacent angles equal, Postulate 4 makes them right, and `Prop1.perpendicular` puts G on DC. It neither calls III.1 nor uses `centre_unique` or `exists_centre`."

[figure]
case = "AB not through F, with the supposed centre G off CE in the reductio"

