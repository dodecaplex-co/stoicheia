# review/III/01.toml
[statement]
scope = "full"
note = "Given A, B on the circle, constructs D, C, E, F as Euclid does and proves F its centre; `Prop1.of_circle` takes A, B itself; the porism keeps its given centre."
companions = ["III.1 of_circle"]
fingerprint = "sha256:d2246e211a57259d"

[route]
kind = "euclid"

[overlap]
rule = "Tacit.exists_centre"
kind = "step"
note = "Our foundations assume that every circle has a centre, as Definitions I.15 and I.16 presuppose. The rule supplies two steps, and neither supplies a point the construction returns. In the reductio it is the supposed centre G, taken under the supposition that the constructed F is not the centre; the argument proves G = F and returns F. In `Prop1.midpoint_inside` it gives a centre for the proof that D is within the circle, by III.2's argument in `Prop1.within`. The rule gives bare existence; `Prop1.of_circle` gives Euclid's construction for any circle, first taking two of its points, A and B."

[[passage]]
at = "Let a straight line AB be drawn through it at random"
kind = "helper"
helper = "BookI.Prop10"
note = "A and B are the given distinct circumference points; `Prop1.of_circle` takes them when only the circle is given. I.10 bisects AB at D here, before the perpendicular is drawn."

[[passage]]
at = "from D let DC be drawn at right angles to AB and let it be drawn through to E"
kind = "helper"
helper = "Prop1.perpendicular_chord"
note = "I.11 draws the perpendicular, and Intersections 5, the rule we assume as System E's, finds C and then E through D. Drawing DC through to E needs D within the circle, which Euclid proves only in III.2, as Todhunter observes (Heath, vol. 2, p. 7). III.2 cannot be cited, since it takes its centre from III.1, so `Prop1.midpoint_inside` takes a centre from `exists_centre` for this proof alone, and `Prop1.within` gives III.2's own argument, by I.5, I.16 and I.19; were the centre on AB, it would be D itself."

[[passage]]
at = "let CE be bisected at F"
kind = "helper"
helper = "BookI.Prop10"
note = "I.10 bisects the constructed CE at F. This F is the point returned by the theorem; the later centre witness G is used only in the reductio. `Prop1.construction` retains its interface and assembles the same three construction steps."

[[passage]]
at = "For suppose it is not, but, if possible, let G be the centre"
kind = "helper"
helper = "Tacit.exists_centre"
note = "The Lean supposes that F is not the centre and takes G from the existence presupposed by Definitions I.15 and I.16. Thus G differs from F; the adjacent-angle argument puts G on CE, and its equal radii make G = F, contradicting the supposition."

[[passage]]
at = "and let GA, GD, GB be joined"
kind = "case"
helper = "Prop1.middle"
note = "Euclid's figure keeps the supposed centre G off AB. On AB it would be AB's middle point D, which is already on CE, so the Lean sets that case aside first; then DAG and DBG are triangles for I.8."

[[passage]]
at = "But the angle FDB is also right"
kind = "case"
note = "If AB passes through the centre, F is D and there is no angle FDB, so the Lean takes the angle CDB, right by construction. For \"the greater to the less\" it shows that at D only one straight line is at right angles to DB, wherever G lies, so G is on CE."

[[passage]]
at = "therefore the angle FDB is equal to the angle GDB"
kind = "helper"
helper = "Prop1.perpendicular"
note = "Euclid rules out equal angles when one is greater; `Prop1.perpendicular` proves that the two perpendiculars lie on one straight line, using `onRay_of_angle_eq` and its argument that a part is less than the whole. For G on the other side of AB, the Lean produces CD beyond D by Postulate 2 and makes the adjacent angle right by I.13 and Common Notion 3, for which Heath gives no reference here."

[[passage]]
at = "Therefore G is not the centre of the circle ABC."
kind = "grouped"
note = "The reductio puts G on CE. `between_of_centre_chord` and `Prop1.middle` then identify G with its middle point F, contradicting G ≠ F. The witness G was unrestricted, so the same argument excludes any other centre."

[[passage]]
at = "Therefore the point F is the centre of the circle ABC."
kind = "grouped"
note = "The preceding reductio discharges the supposition that F is not the centre. The final witness is the F obtained by bisecting CE, with all its construction data, rather than a substitution of the centre G for F."

[[passage]]
at = "PORISM. From this it is manifest"
kind = "carried"
helper = "Prop1.porism"
note = "Proved as its own theorem, III.1 Por., by the argument of Euclid's reductio from the given centre G: on AB it is D by `Prop1.middle`; off AB, the shared I.8 step `Prop1.equal_adjacent` makes the adjacent angles equal, Definition I.10 makes them right, Postulate 4 identifies their measure with `∟`, and `Prop1.perpendicular` puts G on DC. It makes no direct call to III.1, `centre_unique` or `exists_centre`; inherited facts still depend on `exists_centre`."

[figure]
case = "AB not through F, with the supposed centre G off CE in the reductio"
note = "Like Heath's, this figure draws the impossible supposition: G, off CE, as a centre of the circle ABC."

