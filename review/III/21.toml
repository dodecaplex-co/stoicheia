[statement]
scope = "full"
note = "The angles at any two points of one segment are equal, in a segment of any size."
fingerprint = "sha256:60a9c816badb070c"

[route]
kind = "modified"
note = "Euclid's two steps: the angles BAD and BED are each half of the one angle at the centre standing on the circumference BCD (III.20), and halves of one angle are equal. Heath says that with Euclid's angle at the centre, less than two right angles, his proof applies only to a segment greater than a semicircle (vol. 2, p. 49); the semicircle and the less segment are cases of his statement all the same. The Lean takes them in the same two steps, the first argued another way: there the angle at the centre standing on BCD is two right angles or more (`angleAtCentre`), a reading that is ours, made after Heath's notes, and not Euclid's, and III.20 doubles BAD and BED in every segment, so Simson's completion is not needed. III.20, cited as Heath cites it, itself cites I.13 and III.2, which Heath's references for III.20 do not give."

[[passage]]
at = "Let ABCD be a circle"
kind = "helper"
helper = "exists_oppositeSidesOf"
note = "In Euclid's figure C only names the circle and its circumference BCD. The Lean takes a point C across BD from A and E by `exists_oppositeSidesOf` (System E, Points 6) to name that circumference for III.20; the angle at the centre reads only the side (`angleAtCentre.congr`)."

[[passage]]
at = "For let the centre of the circle ABCD be taken"
kind = "helper"
helper = "Tacit.exists_centre"
note = "Euclid takes the centre F without a reference from Heath here. The Lean obtains F from `Tacit.exists_centre`, a rule we assume from Definitions I.15 and I.16, not a proved lemma or a rule of System E. III.20 takes the centre itself, so nothing below names F; it is that centre, for a circle has one centre (`centre_unique`)."
unused = ["F", "hF"]

[[passage]]
at = "let BF, FD be joined"
kind = "given"
note = "The angle at the centre is the circle's, standing on the circumference BCD (`angleAtCentre`), and III.20 makes it up from angles at the centre itself, so the joins BF, FD need no construction in the Lean."

[[passage]]
at = "Now, since the angle BFD is at the centre"
kind = "different"
note = "Heath says that with Euclid's angle BFD, less than two right angles, his proof applies only to a segment greater than a semicircle (vol. 2, p. 49). The Lean takes the angle at the centre standing on the circumference BCD (`angleAtCentre`): the angle BFD in the greater segment, two right angles in a semicircle and more in a less segment (`angleAtCentre.size`). III.20 (`Prop20`) makes it double of BAD in every segment, and, under \"For the same reason\", double of BED."

[[passage]]
at = "therefore the angle BAD is equal to the angle BED"
kind = "helper"
helper = "Magnitude.eq_of_add_self_eq"
note = "Euclid infers that BAD and BED are equal because both are halves of BFD. `Magnitude.eq_of_add_self_eq` proves that equal doubles have equal halves by ruling out either strict inequality."

[figure]
case = "the segment BAED greater than a semicircle, with F on A's and E's side of BD"

