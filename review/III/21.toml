[statement]
scope = "full"
note = "The angles at any two points of one segment are equal, in a segment of any size."
fingerprint = "sha256:60a9c816badb070c"

[route]
kind = "euclid"
note = "Euclid's two steps, on the angle BFD, carry the segment greater than a semicircle, the case his figure draws and the one his proof reaches (Heath, vol. 2, p. 49). The semicircle and the less segment are taken after his sentences by Robert Simson's completion, as Heath gives it (vol. 2, p. 50): AF is drawn through the centre to C, and Euclid's case, `Prop21.greater`, is taken twice. No sentence of Euclid's is argued another way."

[[passage]]
at = "For let the centre of the circle ABCD be taken"
kind = "helper"
helper = "Tacit.exists_centre"
note = "Euclid takes the centre F without a reference from Heath here. The Lean takes F from `Tacit.exists_centre`, a rule we assume from Definitions I.15 and I.16, not a proved lemma or a rule of System E."

[[passage]]
at = "let BF, FD be joined"
kind = "given"
note = "The angle BFD is named by its three points, so joining BF and FD needs no further construction in the Lean."

[[passage]]
at = "Now, since the angle BFD is at the centre"
kind = "helper"
helper = "Prop20.special"
note = "Heath's reference here is III.20. With F on A's side of BD, and so on E's, the Lean cites III.20's companion `Prop20.special`, where the angle at the centre is the angle BFD itself, less than two right angles, as Euclid's is; it doubles BAD here, and BED under \"For the same reason\"."

[[passage]]
at = "therefore the angle BAD is equal to the angle BED"
kind = "helper"
helper = "Magnitude.eq_of_add_self_eq"
note = "Euclid infers that BAD and BED are equal because both are halves of BFD. `Magnitude.eq_of_add_self_eq` proves that equal doubles have equal halves by ruling out either strict inequality."

[[passage]]
at = "Therefore etc."
kind = "case"
helper = "Prop21.greater"
note = "Heath says Euclid's proof reaches only the segment greater than a semicircle (vol. 2, p. 49). For F on BD or across it from A, the Lean takes Simson's completion, which Heath gives (vol. 2, p. 50): AF is drawn through the centre to C, across BD from A and E. AC and EC cross BD within the circle, by III.2, for which Heath prints no reference, and so between B and D (`Tacit.between_of_inside_chord`, System E, Circle 1, proved after III.2). So A, E and F lie on D's side of BC and on B's side of CD (`SameSideOf.of_cross`), and Euclid's case, written for any base as `Prop21.greater`, makes BAC equal to BEC and CAD equal to CED, \"by the first case\"; C falls within the angles BAD and BED, which those pairs make up."

[figure]
case = "the segment BAED greater than a semicircle, with F on A's and E's side of BD"

