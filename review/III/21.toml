[statement]
scope = "full"
note = "The angles at any two points of one segment are equal, in a segment of any size."
fingerprint = "sha256:60a9c816badb070c"

[route]
kind = "modified"
note = "Euclid's argument for a segment greater than a semicircle, where it works; for the semicircle and the less segment, Simson's completion (Heath, vol. 2, pp. 49–50): AF drawn through the centre to C, and Euclid's case twice."

[[passage]]
at = "For let the centre of the circle ABCD be taken"
kind = "helper"
helper = "Tacit.exists_centre"
note = "Euclid takes the centre F without a reference from Heath here. The Lean obtains F from `Tacit.exists_centre`, a rule we assume from Definitions I.15 and I.16, not a proved lemma or a rule of System E."

[[passage]]
at = "let BF, FD be joined"
kind = "given"
note = "The angle BFD is named by its three points, so joining BF and FD needs no further construction in the Lean."

[[passage]]
at = "therefore the angle BAD is equal to the angle BED"
kind = "helper"
helper = "Magnitude.eq_of_add_self_eq"
note = "Euclid infers that BAD and BED are equal because both are halves of BFD. `Magnitude.eq_of_add_self_eq` proves that equal doubles have equal halves by ruling out either strict inequality."

[[passage]]
at = "Therefore etc."
kind = "different"
note = "For a segment equal to or less than a semicircle, the Lean uses Simson's completion: produce AF to C, apply Euclid's greater-segment case on BC and CD, and add the equal angles. The Lean puts the crossings of AC and EC with BD within the circle by III.2, for which Heath prints no reference here, and between B and D by `Tacit.between_of_inside_chord`, the rule we assume as System E, Circle 1, so `angle_add_of_between` splits both angles."

[figure]
case = "the segment BAED greater than a semicircle, with F on A's and E's side of BD"

