[statement]
scope = "full"
note = "The angles at any two points of one segment are equal, in a segment of any size."
fingerprint = "sha256:60a9c816badb070c"

[route]
kind = "modified"
note = "Euclid's argument for a segment greater than a semicircle, where it works; for the semicircle and the less segment, Simson's completion (Heath, vol. 2, pp. 49–50): AF drawn through the centre to C, and Euclid's case twice."

[[passage]]
at = "For let the centre of the circle ABCD be taken"
kind = "helper"
helper = "Tacit.exists_centre"
note = "Euclid takes the centre F without a reference from Heath here. The Lean obtains F from `Tacit.exists_centre`, a rule we assume from Definitions I.15 and I.16, not a proved lemma or a rule of System E."

[[passage]]
at = "let BF, FD be joined"
kind = "given"
note = "The angle BFD is named by its three points, so joining BF and FD needs no further construction in the Lean."

[[passage]]
at = "therefore the angle BAD is equal to the angle BED"
kind = "helper"
helper = "Magnitude.eq_of_add_self_eq"
note = "Euclid infers that BAD and BED are equal because both are halves of BFD. `Magnitude.eq_of_add_self_eq` proves that equal doubles have equal halves by ruling out either strict inequality."

[[passage]]
at = "Therefore etc."
kind = "different"
note = "For a segment equal to or less than a semicircle, the Lean uses Simson's completion: produce AF to C by `Tacit.line_circle_beyond` (System E, Intersections 5), a rule we assume, with F within the circle by `Tacit.centre_inside` (System E, Generalities 3), proved in `Elements/Figure/RuleBase.lean`, and put C across BD from A and E: when F is on BD, `Tacit.pasch3` (System E, Pasch 3), also proved there, separates A and C; when F is beyond BD, `OppositeSides.exists_between` finds X on BD between A and F using the assumed rule `Tacit.lines_meet_of_opposite_sides` (System E, Intersection 1) and `Tacit.pasch4` (System E, Pasch 4), also proved there, `between_inner` puts F between X and C by sorting the orders with the assumed rule `Tacit.between_cases` (System E, Between 6), and `Tacit.pasch2` (System E, Pasch 2) puts F and C on the same side of BD, opposite A and E, Pasch 2 being assumed. The Lean then finds the crossings Y of AC and Z of EC with BD by `OppositeSides.exists_between`, puts them within the circle by III.2, for which Heath prints no reference here, and between B and D by `Tacit.between_of_inside_chord`, the rule we assume as System E, Circle 1, so `angle_add_of_between` splits both angles; from the crossings Y and Z, four applications of `SameSideOf.of_cross` use Pasch 2 to put A and E on D's side of BC and on B's side of DC, the same-segment placings Simson reads off his figure; in both positions of F, Pasch 2 also puts F on A's side of BC and DC because F lies between C and A, so the Lean applies Euclid's greater-segment argument, proved above from III.20, to both new chords and adds the equal angles; Heath prints no further reference here."

[figure]
case = "the segment BAED greater than a semicircle, with F on A's and E's side of BD"

