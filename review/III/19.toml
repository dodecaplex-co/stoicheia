[statement]
scope = "full"
note = "A may be any point off DE with CA at right angles to DE: it need not be on the circle, and may lie across DE from the centre."
fingerprint = "sha256:00cc8901a89cd013"

[route]
kind = "euclid"

[[passage]]
at = "For let a straight line DE touch the circle ABC at the point C"
kind = "given"
note = "The statement gives DE touching at C and CA at right angles to it. For Euclid's E in the angle names, the Lean uses E unless C is E, when it uses D."

[[passage]]
at = "and let CF be joined"
kind = "helper"
helper = "Touches.not_inside"
note = "Euclid joins CF with F off the tangent, as the figure shows. The Lean proves F off DE by `Touches.not_inside` and `Tacit.centre_inside` (System E, Generalities 3), proved in `Elements/Figure/RuleBase.lean`; CF itself is named by its ends."

[[passage]]
at = "But the angle ACE is also right"
kind = "given"
note = "CA is perpendicular to DE by hypothesis, so its angle with the chosen point of DE is right."

[[passage]]
at = "the less to the greater: which is impossible"
kind = "helper"
helper = "Prop1.perpendicular"
note = "At C only one straight line is at right angles to DE, which Euclid takes for granted here as in III.1; it puts F on CA on whichever side of DE A lies. When A and F lie on opposite sides of DE, the Lean produces AC beyond C by Postulate 2 and makes the adjacent angle right by I.13 and Common Notion 3; Heath prints no reference to I.13 here."

[[passage]]
at = "Therefore F is not the centre of the circle ABC"
kind = "grouped"
note = "The reductio is made for any point F off AC, so one argument gives this sentence and Euclid's \"similarly\" for every other point."

[figure]
case = "A on the circumference and F inside angle ACE, as in Heath's figure"
note = "Like Heath's, this figure draws the impossible supposition: F, off CA, as the centre of the circle ABC."

