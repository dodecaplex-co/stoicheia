[statement]
scope = "full"
note = "Both angles at the tangent are equal to the angles in the alternate segments, at every point of each segment; the circle comes with a centre."
fingerprint = "sha256:7ea76618660f96c2"

[route]
kind = "euclid"

[representation]
tags = ["centre-given"]
note = "The circle comes with a centre (`∃ O, Centre O ABCD`), on which III.19 finds the diameter BA."

[[passage]]
at = "let a point C be taken at random on the circumference BD"
kind = "given"
note = "The statement's second conclusion is said of every point C of the segment DCB, so C comes with it; the Lean takes C up where that conclusion is proved."

[[passage]]
at = "Therefore BA is a diameter of the circle ABCD"
kind = "helper"
helper = "Prop32.sameSide"
note = "Euclid takes for granted that A and D lie on one side of EF; the Lean proves it, since no point of a straight line touching a circle is within it, as in III.18."

[[passage]]
at = "therefore the angle ADB, being an angle in a semicircle, is right"
kind = "case"
note = "When D is A, BD is itself the diameter and there is no triangle ABD: every angle in either segment is right by III.31, as are the angles FBD and EBD."

[[passage]]
at = "Let the angle ABD be subtracted from each"
kind = "case"
note = "Euclid's figure has D on F's side of BA, within the angle ABF; when D is on E's side, the Lean gives the same argument with E and F exchanged."

[[passage]]
at = "therefore the angle DBF which remains"
kind = "case"
note = "Euclid's A is the end of the diameter; the statement says this of every point of the segment BAD, and III.21 makes each such angle equal to BAD."

