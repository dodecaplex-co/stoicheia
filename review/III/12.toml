# review/III/12.toml
[statement]
scope = "full"
note = "The point of contact lies between the centres (`Between F A G`). Heath prints III.12 in square brackets; it is stated and proved like the rest."
fingerprint = "sha256:3ed7384603af15f7"

[route]
kind = "euclid"

[representation]
tags = ["touching-whole-circles"]
note = "The centres F and G are given, as the setting-out takes them. Touching without is read of the whole circles: no point is within both."

[[passage]]
at = "For let the two circles ABC, ADE touch one another externally"
kind = "helper"
helper = "Prop6"
note = "Euclid takes F and G as the centres and treats them as different points, so that FG can be joined. The statement supplies the centres, and the Lean proves them different by III.6 (`Prop6`), for which Heath prints no reference here."

[[passage]]
at = "For suppose it does not, but, if possible, let it pass as FCDG"
kind = "case"
note = "Euclid's figure has A off FG; the Lean uses `Tacit.between_cases` (System E, Between 6) to split the three orders of F, A and G on FG and excludes A on FG produced either way, the case Heath says Euclid would have left to the reader (vol. 2, p. 29), because `InsideCircle.of_between_centre` would put one centre within the other circle. Each centre is within its own circle by `Tacit.centre_inside` (System E, Generalities 3), proved in `Elements/Figure/RuleBase.lean`, and `Prop12.centre_outside` proves it outside the other, so `Tacit.line_circle_between` (System E, Intersections 4) supplies C and D between F and G. `Tacit.between_cases` and `Tacit.line_circle_between` are rules we assume."

[[passage]]
at = "so that the whole FG is greater than FA, AG"
kind = "helper"
helper = "Tacit.len_add_of_between"
note = "C and D may be one point, as Heath allows (vol. 2, p. 28), so the Lean proves only that FA, AG together are not greater than FG; I.20's \"less\" still gives the contradiction. The Lean excludes C within ADE by `exists_between_nearer`: a point towards F sufficiently near C would be within both circles, by `InsideCircle.of_between_centre` and `Tacit.inside_of_len_lt` (System E, Diagram-segment 4), proved in `Elements/Figure/Incidence.lean`, and then writes FG as FC and CG together by `Tacit.len_add_of_between`, a rule we assume (System E, Diagram-segment 1), and compares the lengths by `Magnitude.lt_of_add_lt_add_left`."

[[passage]]
at = "Therefore the straight line joined from F to G will not fail to pass"
kind = "grouped"
note = "The Lean's single reductio proves that A lies between F and G. That conclusion carries both closing sentences, including the double negative Heath preserves."

[figure]
case = "A off FG, and C and D apart on it, as in Heath's figure"
note = "Like Heath's, this figure draws the impossible supposition: FG passing as FCDG, away from A, so the F and G drawn are not the centres of ABC and ADE."

