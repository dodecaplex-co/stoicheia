[statement]
scope = "full"
note = "With its companions: `Prop25` sees only the segment's points; `Prop25.complete` makes its circle the segment's; `Prop25.of_circle` is handed the circle."
companions = ["III.25 complete", "III.25 of_circle"]
fingerprint = "sha256:cea48281c16e35be"

[route]
kind = "euclid"
note = "The core is Euclid's construction, in his three cases. His step \"[III. 9]\", that the circle described is the one the segment came from, is the companion `Prop25.complete`, by III.9 and `circle_eq`. `Prop25.of_circle` runs the core on the arc of a given circle, the meeting fact coming from `Prop25.meets` [III. 2]."

[representation]
tags = ["segment-with-circle", "centre-given"]
note = "The core is given the base AC, a point P on the segment's side and the segment's points as a predicate `S`, with the fact Euclid reads off the figure: a straight line drawn from within the base towards P's side meets the segment. It never sees a circle or a centre, and describes its circle with centre E (Postulate 3). The companions are given the segment as the arc of a circle with a centre, the ends of its base and a point naming its side (`Arc`), and `Prop25.complete` shows that the core's circle is that circle, so the pair says all that Heath's enunciation says."

[[passage]]
at = "For let AC be bisected at D"
kind = "given"
note = "That DB, drawn at right angles to AC, meets the segment's circumference at B Euclid reads off the figure. The core is given it, as the meeting fact; for the arc of a circle, `Prop25.meets` proves it, since D is within the circle [III. 2]."

[[passage]]
at = "let DB be drawn through to E"
kind = "helper"
helper = "Postulate5"
note = "Euclid takes for granted that AE meets DB drawn through; Postulate 5 gives it, the angles BAE, ABD being less than two right angles, since ABD is acute (I.17)."

[[passage]]
at = "Therefore the circle drawn with centre E and distance one of the straight lines"
kind = "carried"
helper = "Prop25.complete"
note = "The core describes the circle with centre E through A (Postulate 3), and B and C are on it, EB and EC being equal to EA. That it is the circle of the given segment, Euclid's [III. 9], is proved as its own theorem, the companion `Prop25.complete`, for each of the three cases."

[[passage]]
at = "And it is manifest that the segment ABC is less than a semicircle"
kind = "unformalized"
note = "The statement says where the centre falls, here across AC from B, which is Euclid's reason, and how `Arc.Less` reads a segment less than a semicircle; it does not name the segment's kind."

[[passage]]
at = "and ABC will clearly be a semicircle"
kind = "unformalized"
note = "The statement says that D is the centre of the circle described, which `Prop25.complete` makes the given one; it does not say that the segment is then a semicircle."

[[passage]]
at = "But, if the angle ABD be less than the angle BAD"
kind = "unformalized"
note = "The Lean carries the construction, and the statement says that the centre falls on DB, on B's side of AC; that the segment is greater than a semicircle is not stated."

