# review/III/13.toml
[statement]
scope = "full"
note = "`Prop13`: touching circles meet only at the point of contact. Its companions prove Heath's reading at that point the same as ours, for any two circles."
companions = ["III.13 touchesInternally_iff", "III.13 touchesExternally_iff", "III.13 circlesTouch_iff"]
fingerprint = "sha256:0ca42ca60b0cd210"

[route]
kind = "euclid"
note = "`Prop13` follows Euclid. The companions come after it and are not his: they read Definition III.3 at the point of contact, as Heath prefers, and prove it the same as our reading of the whole circles, by Book I, III.2 and the rule that every circle has a centre, citing nothing later than III.13 and neither III.11 nor III.12. On the way, `TouchesInternallyAt.between` and `TouchesExternallyAt.between` reach the conclusions of III.11 and III.12 from contact at the point, by I.24, with I.20 for contact within and III.2 for contact without, a route that is not Euclid's; they are steps of the companions, and replace neither proof."

[representation]
tags = ["touching-whole-circles"]
note = "Touching is read of the whole circles: for contact within a point of the inner circle is within the outer and none is outside it. Both clauses carry unchanged from contact at D to a supposed second common point B, so the circles touch within at B too; III.13 applies III.11 at both points to show that they cannot meet again. For contact without no point is within both circles, so the point of AC that III.2 puts within both is at once absurd. The companions read contact at the point as well (`TouchesInternallyAt`, `TouchesExternallyAt`, `CirclesTouchAt`): the circles meet at C, and within some circle about C no point of the inner circle falls outside the outer, the circles being two, or, for contact without, no point is within both. They prove that reading the same as the whole-circle one for any two circles, so III.13's statement may be read either way."

[[passage]]
at = "Let the centre G of the circle ABDC"
kind = "helper"
helper = "Tacit.exists_centre"
note = "Euclid takes the centres G and H without citing III.1. The Lean takes both from `Tacit.exists_centre`, a rule we assume from Definitions I.15 and I.16, not a proved lemma or a rule of System E."

[[passage]]
at = "Let it so fall, as BGHD"
kind = "helper"
helper = "Tacit.between_of_inside_chord"
note = "Euclid places B, G, H and D in that order. The Lean puts G between B and D by `Tacit.between_of_inside_chord` (System E, Circle 1), a rule we assume, and `Tacit.centre_inside` (System E, Generalities 3), proved in `Elements/Figure/RuleBase.lean`, and combines this with G, H, D from III.11 by `between_cut`."

[[passage]]
at = "therefore BG is greater than HD"
kind = "helper"
helper = "len_lt_of_between"
note = "Euclid compares HD with the equal radii GD and BG. The Lean uses `len_lt_of_between` to make HD less than GD from the order G, H, D, then substitutes BG for GD."

[[passage]]
at = "therefore BH is much greater than HD"
kind = "helper"
helper = "len_lt_of_between"
note = "Euclid passes from BG to the greater straight line BH. The Lean uses `len_lt_of_between` on B, G, H and combines BG less than BH with the preceding inequality."

[[passage]]
at = "Therefore a circle does not touch a circle internally"
kind = "case"
note = "Euclid's figure puts EBFD within ABDC. The Lean also takes ABDC within EBFD, applying the internal-contact argument with the circles' names exchanged."

[[passage]]
at = "and let AC be joined"
kind = "helper"
helper = "Tacit.exists_point_between"
note = "Euclid joins AC and next argues that it falls within both circles. The Lean chooses a point P between A and C by `Tacit.exists_point_between` (System E, Points 3), proved in `Elements/Figure/Incidence.lean`, so that III.2 can put that point within each circle."

[figure]
case = "EBFD within ABDC, and ACK touching ABDC externally, under the two impossible suppositions"
note = "Like Heath's, this figure draws both impossible suppositions: EBFD touching ABDC internally at B and D, drawn as an oval, since no second circle can; and ACK touching ABDC externally at A and C, drawn as a true circle that crosses ABDC there."

