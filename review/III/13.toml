# review/III/13.toml
[statement]
scope = "full"
note = "Circles touching within, either inside the other, or touching without, have no common point but the point of contact."
fingerprint = "sha256:d8295ba59c1312b2"

[route]
kind = "euclid"

[representation]
tags = ["centre-given", "touching-whole-circles"]
note = "Each circle comes with a centre. Touching is read of the whole circles: for contact within a point of the inner circle is within the outer and none is outside it. Both clauses carry unchanged from contact at D to a supposed second common point B, so the circles touch within at B too; III.13 applies III.11 at both points to show that they cannot meet again. Contact without is unchanged."

[figure]
note = "Like Heath's, this figure draws both impossible suppositions: EBFD touching ABDC internally at B and D, drawn as an oval, since no second circle can; and ACK touching ABDC externally at A and C, drawn as a true circle that crosses ABDC there."

