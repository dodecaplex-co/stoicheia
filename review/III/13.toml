# review/III/13.toml
[statement]
scope = "full"
note = "Circles touching within, either inside the other, or touching without, have no common point but the point of contact."
fingerprint = "sha256:103b3c1a26cf5fff"

[route]
kind = "euclid"

[representation]
tags = ["touching-whole-circles"]
note = "Touching is read of the whole circles: for contact within a point of the inner circle is within the outer and none is outside it. Both clauses carry unchanged from contact at D to a supposed second common point B, so the circles touch within at B too; III.13 applies III.11 at both points to show that they cannot meet again. For contact without no point is within both circles, so the point of AC that III.2 puts within both is at once absurd."

[figure]
note = "Like Heath's, this figure draws both impossible suppositions: EBFD touching ABDC internally at B and D, drawn as an oval, since no second circle can; and ACK touching ABDC externally at A and C, drawn as a true circle that crosses ABDC there."

