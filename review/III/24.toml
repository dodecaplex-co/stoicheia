[statement]
scope = "full"
note = "With its companions: `Prop24` lays one segment on the other, `Prop24.equalCircles` gives equal circles and measures, `Prop24.equalMeasure` equal measures."
companions = ["III.24 equalCircles", "III.24 equalMeasure"]
fingerprint = "sha256:34772fdbf2230d5d"

[route]
kind = "modified"
note = "Euclid's application of one segment to the other is kept (`placement`: A on C, AB on CD, B on D); the coincidence of the circumferences is argued directly, point by point, by the angles (I.8 at each point and its image, then III.23's companion `Prop23.point`), in place of his reductio, and III.10 is not needed. The companion `Prop24.equalCircles` keeps the proof by the radii (III.20, III.22, `Prop24.isosceles`), shown on the page as the alternative."

[representation]
tags = ["segment-with-circle", "centre-given", "redundant-hypothesis"]
note = "A segment is its circle, the ends of its base and a point naming its side (`Arc`), each circle with a centre. \"Equal\" segments are read through Common Notion 4 as segments that coincide (`Arc.Congruent`): one map puts A on C and B on D, the segment on the segment and the circumference on the circumference, keeping every distance between their points; no magnitude of a segment is defined. The main theorem says nothing of a measure. Its companions measure circumferences by the angle standing on them, taken twice, a measure with no radius in it, and the measure clause of `Prop24.equalCircles` follows from the equal angles at E and F alone; the equal bases are needed for its equal circles, as for the congruence."

[[passage]]
at = "For, if the segment AEB be applied to CFD"
kind = "helper"
helper = "placement"
note = "The application is `placement`: on the equal straight lines AB, CD, the side of AB where E is, with AB itself, is carried onto the side of CD where F is, with CD, keeping every distance, A going to C and B to D. No motion is assumed beyond I.4 and I.8, which give each distance."

[[passage]]
at = "the point B will also coincide with the point D"
kind = "grouped"
note = "Carried by the placement under the sentence before, which puts B on D because AB is equal to CD; under the next sentence the points of AB go to points of CD, an end to an end and a point between to a point between."

[[passage]]
at = "the segment AEB will also coincide with CFD"
kind = "grouped"
note = "The sentences after it show it; the Lean begins that argument here: a point on E's side of AB goes to a point on F's side of CD, and the angle AB subtends there is the angle CD subtends at its image [I. 8]."

[[passage]]
at = "it will either fall within it, or outside it"
kind = "different"
note = "Euclid leaves these two cases to a tacit reference to III.23 (Heath, vol. 2, p. 54), to be refuted. The Lean settles every point directly by III.23's companion `Prop23.point`: on F's side of CD a point is on the circle CFD exactly when CD subtends at it the angle at F, and within it exactly when the angle is greater; so no point of the one segment falls within the other or outside it."

[[passage]]
at = "or it will fall awry"
kind = "different"
note = "III.10 is not needed: the angles have settled every point of the circumference, so the segment cannot fall awry, and no third case is left to refute."

[[passage]]
at = "Therefore, if the straight line AB be applied to CD"
kind = "helper"
helper = "Prop24.chord_cases"
note = "On the bases the points are settled by their ends and their order: a point of AB is on the circle exactly when it is an end, and within it exactly when it lies between the ends, by III.2 (`Prop24.chord_cases`), and the placement keeps both."

[figure]
case = "segments less than semicircles, as in Heath's figure"
note = "Like Heath's, this figure draws the last supposition the text refutes: the segment falling awry, as CGD, so that a circle would cut a circle at more points than two."

