[statement]
scope = "full"
note = "With its companions: `Prop24` lays one segment on the other, `Prop24.equalCircles` gives equal circles and measures, `Prop24.equalMeasure` equal measures."
companions = ["III.24 equalCircles", "III.24 equalMeasure"]
fingerprint = "sha256:f026c2536b478ed3"

[route]
kind = "euclid"
note = "Euclid's application of one segment to the other is kept (`placement`: A on C, AB on CD, B on D), and so is his reductio. The applied segment is a segment of a circle through C and D, the moved circle (`Prop24.moved`); supposing it is not CFD, the image of E is neither within CFD nor outside it, by III.23's companion `Prop23.point`, so it is a third point common to the two circles, and III.10 makes them one. Euclid divides the cases by how the whole segment falls; the Lean takes them at the image of E. The companion `Prop24.equalCircles` keeps the proof by the radii (III.20, III.22, `Prop24.isosceles`), shown on the page as the alternative."

[representation]
tags = ["segment-with-circle", "angle-measure", "redundant-hypothesis"]
note = "A segment is its circle, the ends of its base and a point naming its side (`Arc`). \"Equal\" segments are read through Common Notion 4 as segments that coincide (`Arc.Congruent`): one map puts A on C and B on D, the segment on the segment and the circumference on the circumference, keeping every distance between their points; no magnitude of a segment is defined. The main theorem says nothing of a measure. Its companions measure circumferences by the angle standing on them, taken twice, a measure with no radius in it, and the measure clause of `Prop24.equalCircles` follows from the equal angles at E and F alone; the equal bases are needed for its equal circles, as for the congruence."

[[passage]]
at = "For, if the segment AEB be applied to CFD"
kind = "helper"
helper = "placement"
note = "The application is `placement`: on the equal straight lines AB, CD, the side of AB where E is, with AB itself, is carried onto the side of CD where F is, with CD, keeping every distance, A going to C and B to D. No motion is assumed beyond I.4 and I.8: I.22 finds each point's place, or I.3 and I.2 on the straight line AB, I.7 and I.20 make it the only one, and I.8 and I.4 keep every distance, with I.20's order of points on AB; Heath prints no reference here for any of them."

[[passage]]
at = "the point B will also coincide with the point D"
kind = "grouped"
helper = "placement"
note = "Carried by the placement under the sentence before, which puts B on D because AB is equal to CD, and every point of AB on the point of CD as far from C and from D as it was from A and from B: AB coincides with CD."

[[passage]]
at = "the segment AEB will also coincide with CFD"
kind = "helper"
helper = "Prop24.moved"
note = "The sentences after it show the coincidence; the Lean begins with a step Euclid takes for granted in them, that the applied segment is a segment of a circle on CD. `Prop24.moved` draws that circle, the moved circle, about the place of the centre of AEB, which it takes from `Tacit.exists_centre`, through C [Post. 3], and shows that the application carries the circle AEB onto it: each point of E's side of AB, or of AB, is as far from the centre's place as it was from the centre, and so on the one circle or within it as it was on the other or within it (Definition I.15, with System E's Diagram-segments 3 and 4, proved in `Elements/Figure/RuleBase.lean` and `Elements/Figure/Incidence.lean`). A centre across AB from E is placed by applying its own side of AB to the other side of CD (`Prop24.across`), by I.8, I.13 and I.14; Heath prints no reference here for any of them."

[[passage]]
at = "it will either fall within it, or outside it"
kind = "helper"
helper = "Prop23.point"
note = "Euclid leaves these two cases to a tacit reference to III.23 (Heath, vol. 2, p. 54). The Lean takes them at one point of the applied circumference, the image of E: CD subtends there the angle that AB subtends at E, by I.8, for which Heath prints no reference here, and so the angle at F. By III.23's companion `Prop23.point`, which uses I.21, III.2 and III.21, a point on F's side of CD is within the circle CFD exactly when CD subtends a greater angle there than at F, and on it exactly when the angle is the same; so the image of E is neither within CFD nor outside it, and under the next sentence it is the third common point that III.10 forbids."

[figure]
case = "segments less than semicircles, as in Heath's figure"
note = "Like Heath's, this figure draws the last supposition the text refutes: the segment falling awry, as CGD, so that a circle would cut a circle at more points than two. The figure at a glance draws another case: both segments greater than semicircles, with acute angles at E and F."

