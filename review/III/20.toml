[statement]
scope = "full"
note = "The angle at the centre on BC, of any size, our reading after Heath; III.20 special has E on A's side and the angle BEC, as III.20 had before."
companions = ["III.20 special", "III.20 circumference"]
fingerprint = "sha256:5c9c150cc4d1d5a6"

[route]
kind = "euclid"
note = "Euclid's own proof, for the angle at the centre of any size: the diameter AEF, the isosceles triangles and I.32, then the sum of BEF and FEC in his first figure, which now takes the centre within the angle BAC on A's side of BC, on BC or beyond it, or their difference in his second. That BEF and FEC make up the angle at the centre wherever the centre lies is `angleAtCentre.diameter`, which cites I.13 and III.2; Heath's references for III.20 give neither. `Prop20.special` follows from III.20 by `angleAtCentre.within`, and `Prop20.circumference` from it, III.2 and the definition of the measure."

[representation]
tags = ["angle-measure"]
note = "The angle at the centre standing on the circumference BKC is `angleAtCentre`: a diameter AEF, A and F on opposite sides of BC and F on K's side, divides it into the angles BEF and FEC, as in Euclid's first figure, and it is the two together, so it may be two right angles or more. That reading is ours, made after Heath's notes; Euclid's angles at the centre are less than two right angles. It depends on neither the diameter, nor the centre, nor the point naming the side, and it is the angle BEC when the centre lies on A's side of BC (`angleAtCentre.within`), two right angles when the centre is on BC, and greater when the centre lies beyond BC. `Prop20.circumference` shows that our measure of a circumference, twice the angle standing on it, is its angle at the centre."

[[passage]]
at = "Let ABC be a circle"
kind = "helper"
helper = "Tacit.exists_centre"
note = "The statement names no centre, for the angle at the centre is the circle's. Under Euclid's setting-out the Lean takes the centre E by `Tacit.exists_centre`, a rule we assume from Definitions I.15 and I.16."

[[passage]]
at = "For let AE be joined and drawn through to F"
kind = "helper"
helper = "Tacit.line_circle_beyond"
note = "Euclid draws AE through to F on the circle. The Lean names AE by Postulate 1 and finds F beyond E by `Tacit.line_circle_beyond`, the rule we assume as System E, Intersections 5, using `Tacit.centre_inside` (System E, Generalities 3), proved in `Elements/Figure/RuleBase.lean`."

[[passage]]
at = "Then, since EA is equal to EB"
kind = "helper"
helper = "Definition15"
note = "Euclid takes the radii EA and EB to be equal without giving a reason. The Lean obtains their equality from `Definition15`, Euclid's definition of a circle, which we assume as a rule."

[[passage]]
at = "For the same reason"
kind = "grouped"
note = "Euclid gives the same reason at C without writing out the isosceles-triangle argument. The Lean proves that argument once over any letters, under the preceding sentences, and applies it to AEC as well as AEB."

[[passage]]
at = "Therefore the whole angle BEC is double of the whole angle BAC"
kind = "helper"
helper = "angleAtCentre.diameter"
note = "Euclid reads off his figure that AE falls within the angle BAC and that BEF and FEC make up the angle at the centre. The Lean finds X between B and C on AE by `crossbar`, puts X within the circle by III.2, for which Heath gives no reference here, and so between A and F by `Tacit.between_of_inside_chord` (System E, Circle 1), proved after III.2, so that F lies across BC from A; then `angleAtCentre.diameter` makes BEF and FEC the angle at the centre standing on BC, whether E lies on A's side of BC, on BC or beyond it, and `angle_add_of_between` makes BAE and EAC the angle BAC."

[[passage]]
at = "let DE be joined and produced to G"
kind = "helper"
helper = "Tacit.line_circle_beyond"
note = "Euclid draws DE through to G on the circle. As for F, the Lean names DE by Postulate 1 and finds G beyond E by `Tacit.line_circle_beyond`, the rule we assume as System E, Intersections 5, with E inside by `Tacit.centre_inside` (System E, Generalities 3), proved as above."

[[passage]]
at = "Similarly then we can prove that the angle GEC is double of the angle EDC"
kind = "grouped"
note = "Euclid invokes the same isosceles-triangle argument for GEC and GEB without writing it out. The Lean applies the same argument, proved above over any letters, to DEC and DEB."

[[passage]]
at = "therefore the angle BEC which remains is double of the angle BDC"
kind = "helper"
helper = "angle_add_of_within"
note = "Euclid reads DB within EDC and EB within GEC, then subtracts the smaller double. Beneath the construction of G, `OppositeSides.exists_between` finds Y between E and C, `InsideCircle.of_between_centre` puts Y inside the circle, and `Tacit.between_of_inside_chord`, System E's Circle 1, proved after III.2, puts Y between D and B; the Lean then puts B on C's side of EG by two uses of `Tacit.pasch2` (System E, Pasch 2), a rule we assume, and on G's side of EC using the proved rule `Tacit.pasch3` (System E, Pasch 3), splits the angles by `angle_add_of_between` and `angle_add_of_within`, and subtracts by Common Notion 3."

[[passage]]
at = "Therefore etc."
kind = "case"
note = "Euclid leaves out E on AB or on AC (Heath, vol. 2, p. 49); the Lean puts E between A and B or between A and C using `Tacit.between_of_inside_chord` (System E, Circle 1), proved after III.2, and the proved rule `Tacit.centre_inside` (System E, Generalities 3), so that the angle at the centre is the angle BEC (`angleAtCentre.within`), then uses his argument for one isosceles triangle. In all other positions the Lean sorts E by the sides of AB and AC: within BAC it adds the doubles as in Euclid's first argument; outside BAC the centre lies on A's side of BC (`Prop20.across_side`), the angle at the centre is the angle BEC, and the Lean applies his second argument, by subtraction, to A in place of D, exchanging B and C when E lies across AC from B."

