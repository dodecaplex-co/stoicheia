[statement]
scope = "full"
note = "The given centre E is on A's side of BC: its angle stands on the same circumference as BAC and is less than two right angles, as Euclid's are."
fingerprint = "sha256:fb6f51cf124385c5"

[route]
kind = "euclid"

[[passage]]
at = "For let AE be joined and drawn through to F"
kind = "helper"
helper = "Tacit.line_circle_beyond"
note = "Euclid draws AE through to F on the circle. The Lean names AE by Postulate 1 and finds F beyond E by `Tacit.line_circle_beyond`, the rule we assume as System E, Intersections 5, using `Tacit.centre_inside`, the rule we assume as System E, Generalities 3."

[[passage]]
at = "Then, since EA is equal to EB"
kind = "helper"
helper = "Definition15"
note = "Euclid takes the radii EA and EB to be equal without giving a reason. The Lean obtains their equality from `Definition15`, Euclid's definition of a circle, which we assume as a rule."

[[passage]]
at = "For the same reason"
kind = "grouped"
note = "Euclid repeats the isosceles-triangle argument at C. The Lean proves that argument once over any letters, under the preceding sentences, and applies it to AEC as well as AEB."

[[passage]]
at = "Therefore the whole angle BEC is double of the whole angle BAC"
kind = "helper"
helper = "crossbar"
note = "Euclid reads AE within BAC and EF within BEC from his figure. The Lean finds X between B and C by `crossbar`, puts E between A and X because E and A lie on one side of BC, and uses `angle_add_of_between` and `angle_add_of_within` to add the two doubles."

[[passage]]
at = "let DE be joined and produced to G"
kind = "helper"
helper = "Tacit.line_circle_beyond"
note = "Euclid draws DE through to G on the circle. As for F, the Lean names DE by Postulate 1 and finds G beyond E by `Tacit.line_circle_beyond`, the rule we assume as System E, Intersections 5, with E inside by `Tacit.centre_inside`, the rule we assume as System E, Generalities 3."

[[passage]]
at = "Similarly then we can prove that the angle GEC is double of the angle EDC"
kind = "grouped"
note = "Euclid repeats the isosceles-triangle argument for GEC and GEB. The Lean applies the same argument, proved above over any letters, to DEC and DEB."

[[passage]]
at = "therefore the angle BEC which remains is double of the angle BDC"
kind = "helper"
helper = "angle_add_of_within"
note = "Euclid reads DB within EDC and EB within GEC, then subtracts the smaller double. Beneath the construction of G, `OppositeSides.exists_between` finds Y between E and C, `InsideCircle.of_between_centre` puts Y inside the circle, and `Tacit.between_of_inside_chord`, the rule we assume as System E, Circle 1, puts Y between D and B; the Lean then uses these orders and the side rules to split the angles by `angle_add_of_between` and `angle_add_of_within`, and subtracts by Common Notion 3."

[[passage]]
at = "Therefore etc."
kind = "case"
note = "Euclid leaves out E on AB or on AC, which his proof plainly covers (Heath, vol. 2, p. 49); the Lean writes it out with his argument for one isosceles triangle."

[figure]
case = "E within the angle BAC and outside the angle BDC"

