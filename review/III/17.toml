# review/III/17.toml
[statement]
scope = "full"
note = "A is outside the circle or on it: from a point within no straight line touches (`Prop17.inside`). `Prop17` takes A outside; `Prop17.general`, any A not within."
companions = ["III.17 general"]
fingerprint = "sha256:105a583195d3f19f"

[route]
kind = "euclid"
note = "Euclid's A is outside the circle. `Prop17.general` takes A on the circle too, a case Euclid leaves out, Heath explains, because III.16's porism so directly indicates it (vol. 2, p. 44): AX drawn at right angles to the radius EA at A (I.11) touches by that porism. The construction is not on Euclid's page. The companion returns a straight line named by A and X; its point of contact is not returned beside X (`Touches.contact` reads it off). From a point within no straight line touches (`Prop17.inside`), so not being within is the condition for a solution."

[[passage]]
at = "For let the centre E of the circle be taken"
kind = "helper"
helper = "Prop1.of_circle"
note = "Euclid takes the centre E, and Heath's reference is III.1; the Lean takes it by III.1 too: `Prop1.of_circle` takes two points of the circle, the ends of a straight line drawn through it at random, and runs III.1 on them, its construction and its proof that the point found is the centre; the proof keeps the centre alone, as Euclid does. `Prop17.general` takes its centre in the same way when A is on the circle."

[[passage]]
at = "let AE be joined, and with centre E"
kind = "helper"
helper = "Tacit.line_circle_between"
note = "Euclid joins AE and treats its meeting D with BCD as available. The Lean puts E within BCD by `Tacit.centre_inside` (System E, Generalities 3), proved in `Elements/Figure/RuleBase.lean`, gets D between E and A from `Tacit.line_circle_between`, the rule we assume as System E, Intersections 4, and describes AFG by Postulate 3."

[[passage]]
at = "from D let DF be drawn at right angles to EA"
kind = "helper"
helper = "BookI.Prop11"
note = "Euclid draws DF perpendicular to EA; the Lean uses I.11, for which Heath prints no reference here. `InsideCircle.of_between_centre` puts D within AFG, and `Tacit.line_circle_beyond`, the rule we assume as System E, Intersections 5, takes F on AFG beyond D from the point first supplied by I.11."

[[passage]]
at = "and let EF, AB be joined"
kind = "helper"
helper = "Tacit.line_circle_between"
note = "Euclid's joining EF presupposes its meeting B with BCD. The Lean compares the radii to put F outside BCD by `outside_of_len_gt`, puts E within BCD by `Tacit.centre_inside` (System E, Generalities 3), proved as above, then gets B between E and F from `Tacit.line_circle_between`, the rule we assume as System E, Intersections 4."

[[passage]]
at = "therefore the base DF is equal to the base AB"
kind = "grouped"
helper = "BookI.Prop4"
note = "Euclid's three conclusions about the base, triangle and remaining angles come together from I.4. The Lean calls `BookI.Prop4` once and retains the angle equality needed in the next sentence."

[[passage]]
at = "But the angle EDF is right"
kind = "helper"
helper = "Tacit.adjacent_eq_of_right"
note = "Euclid recalls the right angle at D, but the Lean's point F lies beyond D from the point first drawn by I.11. `Tacit.adjacent_eq_of_right`, proved from I.13 and Common Notion 3, transfers the right angle to DF; Heath prints no reference to I.13 here."

[figure]
case = "A outside the circle, as in Heath's figure"

