[statement]
scope = "full"
note = "A straight line DB whose square is the rectangle AD, DC touches the circle."
fingerprint = "sha256:68600420107e4625"

[route]
kind = "euclid"
note = "The proof takes F from the rule where Euclid takes the centre without a bracket for III.1. III.17 supplies the touching straight line, and III.36 the equality of squares, as before."

[[passage]]
at = "and FD is the common base of the triangles"
kind = "helper"
helper = "Prop37.triangle"
note = "Euclid's figure makes DBF a triangle; the Lean proves it: B, with DB equal to DE, is not on the straight line through D and the centre F."

[[passage]]
at = "And FB produced is a diameter"
kind = "given"
note = "Our porism to III.16 is said at the end of a radius, so the Lean applies it to FB itself and does not produce FB to a diameter."

[[passage]]
at = "Similarly this can be proved to be the case even if the centre be on AC"
kind = "grouped"
note = "No second case is needed: III.36 is cited by its statement, which holds wherever the centre lies, and nothing else in the argument looks at AC."

[figure]
case = "F off AC, with distinct contacts B and E on opposite sides of DF"

