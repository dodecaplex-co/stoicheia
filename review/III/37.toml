[[passage]]
at = "And FB produced is a diameter"
kind = "given"
note = "Our porism to III.16 is said at the end of a radius, so the Lean applies it to FB itself and does not produce FB to a diameter."

[[passage]]
at = "Similarly this can be proved to be the case even if the centre be on AC"
kind = "helper"
helper = "Prop37.centre_on_secant"
note = "The first branch makes this already covered case explicit: the diameter calculation of III.36 and the given equality give equal squares on DE and DB, and Euclid's two-triangle argument finishes the proof. The other branch keeps the argument through the general III.36 statement."

