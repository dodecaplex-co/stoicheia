[statement]
scope = "full"
note = "A straight line DB whose square is the rectangle AD, DC touches the circle; the circle comes with a centre."

[route]
kind = "euclid"

[representation]
tags = ["centre-given"]
note = "The circle comes with a centre (`∃ F, Centre F ABC`), and the proof finds it by III.1 where Euclid takes it."

[[passage]]
at = "and FD is the common base of the triangles"
kind = "helper"
helper = "Prop37.triangle"
note = "Euclid's figure makes DBF a triangle; the Lean proves it: B, with DB equal to DE, is not on the straight line through D and the centre F."

[[passage]]
at = "And FB produced is a diameter"
kind = "different"
note = "Our porism to III.16 is said at the end of a radius, so Lean applies it to FB itself and does not produce FB to a diameter."

[[passage]]
at = "Similarly this can be proved to be the case even if the centre be on AC"
kind = "grouped"
note = "No second case is needed: III.36 is cited by its statement, which holds wherever the centre lies, and nothing else in the argument looks at AC."

