[statement]
scope = "full"
note = "Euclid's two cases, each stated on its own, with equal circumferences read as equal in measure and congruent, which says more than Heath's words."
fingerprint = "sha256:fdd1449580f76ce4"

[route]
kind = "modified"
note = "Euclid's argument where the angles at the circumferences are acute; where they are right, BC and EF are diameters, and where obtuse, III.22 passes to the acute angle, as Heath proposes (vol. 2, p. 57). The remainders are equal in measure by Euclid's subtraction, and congruent by III.24 applied to the remaining segments, since a congruence cannot be subtracted."

[representation]
tags = ["angle-measure", "centre-given"]
note = "\"Equal circumferences\" is read as equal in measure and congruent (`Arc.Congruent`), the congruence through Common Notion 4, as circumferences that coincide. So \"in equal circles\" does real work: in unequal circles equal angles give equal measures, but no congruence. The centres G and H are given, as the enunciation speaks of angles at the centres."

[[passage]]
at = "therefore the base BC is equal to the base EF"
kind = "different"
note = "Given the angles at A and D, the Lean sorts them as acute, right or obtuse: if right, BC and EF are diameters, each two radii; if obtuse, III.22 passes to the acute angle in the other segment."

[[passage]]
at = "therefore the segment BAC is equal to EDF"
kind = "helper"
helper = "Prop24.equalMeasure"
note = "III.24 makes the segments BAC, EDF congruent, and its companion `Prop24.equalMeasure` gives what Euclid takes with them: their circumferences are equal in measure."

[[passage]]
at = "therefore the circumference BKC which remains is equal to the circumference ELF"
kind = "different"
note = "The remainders BKC, ELF are equal in measure by Euclid's subtraction [C.N. 3]. Their congruence cannot come by subtraction: it comes from III.24 applied to the remaining segments, which are similar, their angles making two right angles with the equal angles at A and D [III. 22]."

