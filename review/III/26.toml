[statement]
scope = "full"
note = "Euclid's two cases, each stated on its own, with equal circumferences read as equal in measure and congruent, which says more than Heath's words."
fingerprint = "sha256:fdd1449580f76ce4"

[route]
kind = "modified"
note = "Euclid's argument, with I.4 on the angles BGC, EHF, where those are the angles at the centres, as in his figure (Heath, vol. 2, pp. 56–57). For the other cases the Lean takes the way Heath gives under III.26: \"if Euclid's proof is to cover all cases, it requires us to take cognisance of 'angles at the centre' which are equal to or greater than two right angles\" (vol. 2, p. 57). Where the angles at the circumferences are obtuse, the angles at the centres standing on BKC, ELF (`angleAtCentre`, which III.20 makes double of them) are greater than two right angles, while the triangle angles BGC, EHF are each less than two, so I.4 cannot use the angles at the centres, and `angleAtCentre.reflex` with Common Notion 3 takes them from four right angles, leaving the angles BGC, EHF for I.4. That subtraction is a step his written argument lacks, for a case within the statement, so the route is modified. Where the angles at the circumferences are right, the angles at the centres are two right angles and the bases are diameters, each the sum of two radii, the case Heath completes by showing that two radii \"are in a straight line, whence they make equal bases in the two circles as in Euclid's proof\" (vol. 2, p. 57); `Prop26.alike` sorts the cases. The subtraction of the remaining circumferences follows Euclid: Common Notion 3 gives equal measures, and `Prop26.extend` extends the given segment congruence to one application of the whole circles, which `Prop26.remainder` restricts to the remaining segments and arcs."

[representation]
tags = ["angle-measure"]
note = "\"Equal circumferences\" is read as equal in measure and congruent (`Arc.Congruent`), the congruence through Common Notion 4, as circumferences that coincide. So \"in equal circles\" does real work: in unequal circles equal angles give equal measures, but no congruence. The centres G and H are given, as the enunciation speaks of angles at the centres. The clause given at the centres speaks of the angles BGC, EHF themselves, less than two right angles, as Euclid's are, and so asks that G lie across BC from K, and H across EF from L, where those angles stand on BKC and ELF; within the proof the angles at the centres standing on BKC and ELF are of any size (`angleAtCentre`)."

[[passage]]
at = "and the angle at G is equal to the angle at H"
kind = "helper"
helper = "Prop26.alike"
note = "Euclid's figure has the centres on A's and D's sides, where the angles at G and H are angles of the triangles GBC, HEF. The Lean shows that equal angles at the centres lie alike, both less than two right angles, both two right angles, or both greater, so that G and H lie alike (`Prop26.alike`, by `angleAtCentre.size`); this tells which case of I.4 follows."

[[passage]]
at = "therefore the base BC is equal to the base EF"
kind = "different"
note = "In Euclid's figure I.4 applies to the angles BGC, EHF, which are the angles at the centres (`angleAtCentre.within`). Where the angles at A and D are obtuse, the angles at the centres are greater than two right angles, which no angle of a triangle is, so I.4 cannot take them: `angleAtCentre.reflex` makes each, with the angle BGC or EHF, four right angles, and Common Notion 3 leaves the angles BGC, EHF equal for I.4, a step within the statement that Euclid's written argument lacks. Where they are right, G and H lie on BC and EF, and the bases are diameters, each the sum of two equal radii, as Heath completes that case (vol. 2, p. 57)."

[[passage]]
at = "therefore the segment BAC is equal to EDF"
kind = "helper"
helper = "Prop24.equalMeasure"
note = "III.24 makes the segments BAC, EDF congruent, and its companion `Prop24.equalMeasure` gives what Euclid takes with them: their circumferences are equal in measure. That companion uses I.8, III.2, III.21 and III.22, for which Heath prints no references here, to compare angles at corresponding points and subtract their doubles from the whole circles."

[[passage]]
at = "But the whole circle ABC is also equal to the whole circle DEF"
kind = "helper"
helper = "Circumference.whole"
note = "Euclid subtracts the equal segment circumferences from the equal whole circles. `Circumference.whole` proves that the two circumferences cut off by each chord together measure four right angles, using III.2, III.21 and III.22, for which Heath gives no references here."

[[passage]]
at = "therefore the circumference BKC which remains is equal to the circumference ELF"
kind = "helper"
helper = "Prop26.remainder"
note = "Common Notion 3 gives the equal measures. For congruence, `Prop26.extend` extends the given map radially from a small circle inside the segment; the reverse construction makes it onto, and III.9 identifies the image of the centre. Definition I.15 and the radius rules carry the disks and circumferences across, while collinearity and betweenness preserve the sides of the chord. In all, `Prop26.extend` uses I.2, I.4, I.8, I.12, I.17, I.19, I.20, III.2 and III.9. Restricting that same map to the complementary closed sides gives both remaining figures, including their bases, as Euclid's subtraction requires (Heath, vol. 2, pp. 56–57)."

[[passage]]
at = "Therefore etc."
kind = "helper"
helper = "Prop20"
note = "Our statement takes Euclid's two pairs of equal angles one at a time, and under his closing words III.20, for which Heath gives no reference here, supplies the other pair: given at the centres, the angles at the centres standing on BKC, ELF are the angles BGC, EHF themselves (`angleAtCentre.within`), and the angles at A and D are their halves; given at the circumferences, the angles at the centres are their doubles."

