[statement]
scope = "full"
note = "Euclid's two cases, each stated on its own, with equal circumferences read as equal in measure and congruent, which says more than Heath's words."
fingerprint = "sha256:fdd1449580f76ce4"

[route]
kind = "modified"
note = """\
In the acute case, equal radii and I.4 give equal bases, III.24 gives equal segments, and \
subtraction from equal whole circles gives equal circumferences (\
Heath, vol. 2, pp. 56–57). The obtuse case is the edition's own route, resting on III.22: \
\"The opposite angles of quadrilaterals in circles are equal to two right angles.\" \
(Heath, vol. 2, pp. 51–52). Thus the angles in the opposite segments \
are acute and equal; Euclid's acute argument gives equal complementary circumferences. \
Subtraction from the equal whole circles gives the circumferences in question, as in \
III.28 (Heath, vol. 2, pp. 59–60) and \
III.26 (Heath, vol. 2, pp. 56–57). \
For right angles the bases are diameters, each two radii. \
For the remainders, Common Notion 3 \
equates the measures, and `Prop26.extend` extends the segment map to the whole circles so that \
`Prop26.remainder` can restrict it to the complementary segments."""

[representation]
tags = ["angle-measure"]
note = "\"Equal circumferences\" is read as equal in measure and congruent (`Arc.Congruent`), the congruence through Common Notion 4, as circumferences that coincide. So \"in equal circles\" does real work: in unequal circles equal angles give equal measures, but no congruence. The centres G and H are given, as the enunciation speaks of angles at the centres. The clause given at the centres speaks of the angles BGC, EHF themselves, less than two right angles, as Euclid's are, and so asks that G lie across BC from K, and H across EF from L, where those angles stand on BKC and ELF; within the proof the angles at the centres standing on BKC and ELF are of any size (`angleAtCentre`)."

[[passage]]
at = "and the angle at G is equal to the angle at H"
kind = "helper"
helper = "Prop26.alike"
note = """\
Equal angles at the centres place G and H alike: across BC and EF from K and L, between their \
ends, or on K's and L's sides (`Prop26.alike`). The last position calls for the reduction by \
III.22 (Heath, vol. 2, pp. 51–52), in the edition's own route."""

[[passage]]
at = "therefore the base BC is equal to the base EF"
kind = "different"
note = """\
I.4 gives BC equal to EF in the acute case, and addition of the equal radii gives the \
bases when they are diameters. For obtuse angles at A and D, the Lean applies I.4 in the \
opposite segments by our route through III.22, and obtains BAC \
and EDF by Euclid's subtraction."""

[[passage]]
at = "therefore the segment BAC is equal to EDF"
kind = "helper"
helper = "Prop24.equalMeasure"
note = """\
For acute or right angles at A and D, III.24 gives congruent segments BAC and EDF, and \
`Prop24.equalMeasure` equates their circumferences. For obtuse angles, the acute argument in the \
opposite segments gives BAC and EDF as equal and congruent remainders."""

[[passage]]
at = "But the whole circle ABC is also equal to the whole circle DEF"
kind = "helper"
helper = "Circumference.whole"
note = """\
Euclid subtracts the equal segment circumferences from the equal whole circles. \
`Circumference.whole` proves that the two circumferences cut off by each straight line together \
measure four right angles, using III.2, III.21 and III.22, for which Heath gives no references \
here."""

[[passage]]
at = "therefore the circumference BKC which remains is equal to the circumference ELF"
kind = "helper"
helper = "Prop26.remainder"
note = """\
Common Notion 3 gives the equal measures; for congruence, `Prop26.extend` extends the given map \
radially from a small circle inside the segment; the reverse construction makes it onto, and \
III.9 identifies the image of the centre. Definition I.15 and the radius rules carry the disks \
and circumferences across, while collinearity and betweenness preserve the sides of the straight \
line; in all, `Prop26.extend` uses I.2, I.4, I.8, I.12, I.17, I.19, I.20, III.2 and III.9; \
restricting that same map to the complementary closed sides gives both remaining figures, \
including their bases."""

[[passage]]
at = "Therefore etc."
kind = "helper"
helper = "Prop20"
note = "Our statement takes Euclid's two pairs of equal angles one at a time, and under his closing words III.20, for which Heath gives no reference here, supplies the other pair: given at the centres, the angles at the centres standing on BKC, ELF are the angles BGC, EHF themselves (`angleAtCentre.within`), and the angles at A and D are their halves; given at the circumferences, the angles at the centres are their doubles."

[figure]
case = "acute angles at A and D, with BKC and ELF less than semicircles"

