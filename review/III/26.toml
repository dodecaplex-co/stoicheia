[statement]
scope = "full"
note = "Euclid's two cases, each stated on its own, with equal circumferences read as equal in measure and congruent, which says more than Heath's words."
fingerprint = "sha256:fdd1449580f76ce4"

[route]
kind = "modified"
note = "Euclid's one argument for angles of every size: equal angles at the circumferences give equal angles at the centres, their doubles (III.20), the bases are equal by I.4, the segments by III.24, and the remainders are equal in measure by his subtraction. The angles at the centres may be two right angles or more (`angleAtCentre`), a reading that is ours, made after Heath's notes, and not Euclid's; III.20 cites I.13 and III.2 for it, which Heath's references for III.20 do not give. One division into cases stays, at I.4: where the angles at the centres are two right angles, BC and EF are diameters, and where they are greater, I.4 takes the angles BGC, EHF that remain of four right angles. The congruence of the remainders comes from III.22 and III.24 in place of Euclid's subtraction, since a congruence cannot be subtracted."

[representation]
tags = ["angle-measure"]
note = "\"Equal circumferences\" is read as equal in measure and congruent (`Arc.Congruent`), the congruence through Common Notion 4, as circumferences that coincide. So \"in equal circles\" does real work: in unequal circles equal angles give equal measures, but no congruence. The centres G and H are given, as the enunciation speaks of angles at the centres. The clause given at the centres speaks of the angles BGC, EHF themselves, less than two right angles, as Euclid's are, and so asks that G lie across BC from K, and H across EF from L, where those angles stand on BKC and ELF; within the proof the angles at the centres standing on BKC and ELF are of any size (`angleAtCentre`)."

[[passage]]
at = "and the angle at G is equal to the angle at H"
kind = "helper"
helper = "Prop26.alike"
note = "Euclid's figure has the centres on A's and D's sides, where the angles at G and H are angles of the triangles GBC, HEF. The Lean shows that equal angles at the centres lie alike, both less than two right angles, both two right angles, or both greater, so that G and H lie alike (`Prop26.alike`, by `angleAtCentre.size`); this tells which case of I.4 follows."

[[passage]]
at = "therefore the base BC is equal to the base EF"
kind = "case"
note = "In Euclid's figure I.4 gives the bases from the angles BGC, EHF (`angleAtCentre.within`). Two cases his figure leaves aside are taken as well: where the angles at the centres are two right angles, G is on BC and H on EF, there are no triangles for I.4, and BC and EF are diameters, each two radii (`Tacit.len_add_of_between`, System E, Diagram-segment 1, a rule we assume); where they are greater, the angles BGC, EHF are what remains of four right angles (`angleAtCentre.reflex`), equal by Common Notion 3, and I.4 applies to them."

[[passage]]
at = "therefore the segment BAC is equal to EDF"
kind = "helper"
helper = "Prop24.equalMeasure"
note = "III.24 makes the segments BAC, EDF congruent, and its companion `Prop24.equalMeasure` gives what Euclid takes with them: their circumferences are equal in measure. That companion uses I.8, III.2, III.21 and III.22, for which Heath prints no references here, to compare angles at corresponding points and subtract their doubles from the whole circles."

[[passage]]
at = "But the whole circle ABC is also equal to the whole circle DEF"
kind = "helper"
helper = "Circumference.whole"
note = "Euclid subtracts the equal segment circumferences from the equal whole circles. `Circumference.whole` proves that the two circumferences cut off by each chord together measure four right angles, using III.2, III.21 and III.22, for which Heath gives no references here."

[[passage]]
at = "therefore the circumference BKC which remains is equal to the circumference ELF"
kind = "different"
note = "The remainders BKC, ELF are equal in measure by Euclid's subtraction [C.N. 3]. Their congruence cannot come by subtraction: `Prop2.sameSide` (III.2) supplies points of the remaining segments, III.22 makes their angles supplementary to the equal angles at A and D, and III.24 makes the similar segments congruent, with `Arc.Congruent.congr_side` transferring the result to K and L; Heath prints no references here."

[[passage]]
at = "Therefore etc."
kind = "helper"
helper = "Prop20"
note = "Our statement takes Euclid's two pairs of equal angles one at a time, and under his closing words III.20, for which Heath gives no reference here, supplies the other pair: given at the centres, the angles at the centres standing on BKC, ELF are the angles BGC, EHF themselves (`angleAtCentre.within`), and the angles at A and D are their halves; given at the circumferences, the angles at the centres are their doubles."

[figure]
case = "acute angles at A and D, with BKC and ELF less than semicircles"

