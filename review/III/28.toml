[statement]
scope = "full"
note = "Equal circumferences read as equal in measure and congruent; \"the greater\" taken as no less, so two diameters, cutting off four semicircles, are covered."
fingerprint = "sha256:27e77d5577435ccb"

[route]
kind = "euclid"
note = "Euclid's argument: equal radii and bases give equal angles at the centres by I.8, III.26 gives the equal less circumferences, and subtraction gives the greater, in measure by Common Notion 3 and in congruence by restricting the same application of the whole circles (`Prop26.remainder`). Two diameters, which leave no triangles AKB, DLE for I.8, are a case his proof does not in terms cover and Heath calls \"scarcely worth giving, as the proof can easily be supplied\" (vol. 2, p. 60); the Lean takes it in a step of its own, declared as a passage."

[representation]
tags = ["angle-measure"]
note = "\"Equal circumferences\" is read as in III.26, equal in measure and congruent (`Arc.Congruent`), which says more than Heath's words. The equal circles do real work: equal straight lines in unequal circles cut off unequal measures, and no congruent circumferences."

[[passage]]
at = "For let the centres K, L of the circles be taken"
kind = "given"
note = "Euclid takes K and L as centres and joins the radii. The hypothesis that the circles are equal supplies both centres through `EqualCircles`, and the radii are named by their ends."

[[passage]]
at = "the radii are also equal"
kind = "case"
note = "If K is on AB, both straight lines are diameters and the four circumferences semicircles, a case Euclid's proof does not in terms cover and Heath supplies by III.15 and the equal circles (vol. 2, p. 60). The Lean takes it in a step of its own: `Prop28.diameter` uses I.20 to make DE a diameter, `Circumference.semicircle` gives the measures, and `Prop28.right` gives the right angle in each semicircle, so that III.24 makes them congruent. Otherwise `Prop28.sides` and `Prop28.beyond` place each centre across its straight line from the less circumference, as Euclid's figure has it. These helpers use I.5, I.32, III.2, III.20, III.21 and III.22, for which Heath prints no references here, as for I.20 and III.24."

[[passage]]
at = "But equal angles stand on equal circumferences"
kind = "helper"
helper = "Prop2.oppositeSide"
note = "Euclid applies III.26 to the equal central angles. Since C and F name sides and need not be on their circles, the Lean takes points X and Y there by `Prop2.oppositeSide` (III.2, for which Heath prints no reference here), supplying the points at the circumferences that III.26 also asks for."

[[passage]]
at = "And the whole circle ABC is also equal to the whole circle DEF"
kind = "helper"
helper = "Circumference.whole"
note = "Euclid subtracts the equal lesser circumferences from the equal whole circles. `Circumference.whole` proves that the two circumferences cut off by each chord together measure four right angles, using III.2, III.21 and III.22, for which Heath prints no references here."

[[passage]]
at = "therefore the circumference ACB which remains"
kind = "helper"
helper = "Prop26.remainder"
note = "Common Notion 3 gives the remaining measures. The congruence of the lesser segments supplied by III.26 extends to one application of the whole disks and circumferences (`Prop26.extend`); restricting it to the complementary closed sides gives the congruent greater segments and arcs. This is the same subtraction as in III.26, with the common bases retained. `Prop26.extend` uses I.2, I.4, I.12, I.17, I.19, I.20, III.2 and III.9, for which Heath prints no references here."

[figure]
case = "non-diameter chords, with K on C's side of AB and L on F's side of DE"

