[statement]
scope = "full"
note = "Equal circumferences read as equal in measure and congruent; \"the greater\" taken as no less, so two diameters, cutting off four semicircles, are covered."
fingerprint = "sha256:27e77d5577435ccb"

[route]
kind = "modified"
note = "Provisional subtraction skeleton, with the statement unchanged. For non-diameters, equal radii and bases give equal central angles by I.8, and III.26 gives the equal lesser circumferences. Common Notion 3 gives the remaining measures; Prop26.remainder restricts a common application of the whole circles to the remaining segments and arcs, but depends on the unproved Prop26.extend. This replaces the former separate III.20/III.24 argument for the greater segments, without claiming the replacement complete. In the diameter case there are no triangles for I.8 or ordinary central angles for III.26's first clause: Prop28.right and III.24 still supply congruence. Heath's subtraction is at vol. 2, pp. 59–60; both the missing extension and this diameter case remain disclosed, and the route stays modified."

[representation]
tags = ["angle-measure"]
note = "\"Equal circumferences\" is read as in III.26, equal in measure and congruent (`Arc.Congruent`), which says more than Heath's words. The equal circles do real work: equal straight lines in unequal circles cut off unequal measures, and no congruent circumferences."

[[passage]]
at = "For let the centres K, L of the circles be taken"
kind = "given"
note = "Euclid takes K and L as centres and joins the radii. The hypothesis that the circles are equal supplies both centres through `EqualCircles`, and the radii are named by their ends."

[[passage]]
at = "the radii are also equal"
kind = "different"
note = "Euclid's figure has the centre K off AB, on C's side. If K is on AB, AB and DE are diameters and the four circumferences semicircles; the angle at the centre of each semicircle is two right angles (`angleAtCentre.semicircle`), but the proof obtains congruence from the right angle in each semicircle (`Prop28.right`) and III.24; `Prop28.beyond` shows K is not on G's side; `Prop28.sides` sorts the positions, `Prop28.diameter` uses I.20, and `Prop28.right` through `Prop24.angle_type`, `Prop28.beyond`, `Circumference.semicircle` and `Prop2.sameSide` use I.5, I.32, III.2, III.20, III.21 and III.22, for which, as for I.20 and III.24, Heath prints no references here; the placing of the centres between the diameter's ends uses `Tacit.centre_inside` (System E, Generalities 3), proved in `Elements/Figure/RuleBase.lean`, and `Tacit.between_of_inside_chord` (System E, Circle 1), proved after III.2, and the sum of the radii uses `Tacit.len_add_of_between` (System E, Diagram-segment 1), a rule we assume."

[[passage]]
at = "But equal angles stand on equal circumferences"
kind = "helper"
helper = "Prop2.oppositeSide"
note = "Euclid applies III.26 to the equal central angles. Since C and F name sides and need not be on their circles, the Lean takes points X and Y there by `Prop2.oppositeSide` (III.2, for which Heath prints no reference here), supplying the points at the circumferences that III.26 also asks for."

[[passage]]
at = "And the whole circle ABC is also equal to the whole circle DEF"
kind = "helper"
helper = "Circumference.whole"
note = "Euclid subtracts the equal lesser circumferences from the equal whole circles. `Circumference.whole` proves that the two circumferences cut off by each chord together measure four right angles, using III.2, III.21 and III.22, for which Heath prints no references here."

[[passage]]
at = "therefore the circumference ACB which remains"
kind = "helper"
helper = "Prop26.remainder"
note = "The remaining measures are equal by Common Notion 3. Prop26.remainder now takes the congruence hless.2 proved by III.26 and restricts the common application of the whole circles to the complementary segments ACB, DFE. The restriction is proved; the whole-circle extension Prop26.extend remains unproved in this skeleton. No second use of III.24 to prove similarity of these remaining segments is made in the non-diameter branch."

