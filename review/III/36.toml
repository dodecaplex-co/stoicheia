[statement]
scope = "full"
note = "The rectangle AD, DC is equal to the square on the tangent DB, whether or not DCA passes through the centre."
fingerprint = "sha256:7af5806c7b62458d"

[route]
kind = "euclid"
note = "In each case the proof takes the centre from `exists_centre` where Euclid takes it with no reference from Heath to III.1; the perpendiculars and the argument with squares remain his. Where Heath cites I.47, `BookI.Prop47.sq` describes the squares by I.46 and identifies their areas through `Square.described` (I.4, I.28 and I.34); Heath prints no references to these four propositions there."

[[passage]]
at = "First let it be through the centre, and let F be the centre of the circle ABC"
kind = "helper"
helper = "Tacit.exists_centre"
note = "The Lean takes F from `Tacit.exists_centre`, as the [introduction](index.md) explains."

[[passage]]
at = "let FB be joined"
kind = "given"
note = "FB is named by its ends, the centre F just obtained and the given point of contact B, so joining it needs no separate construction in the Lean."

[[passage]]
at = "And, since AC has been bisected at F"
kind = "helper"
helper = "Tacit.between_of_inside_chord"
note = "Euclid takes F to bisect AC. Since the centre is within the circle (`Tacit.centre_inside`), `Tacit.between_of_inside_chord` puts F between A and C. `Definition15`, a rule we assume, makes the two radii equal."

[[passage]]
at = "But FC is equal to FB"
kind = "helper"
helper = "Definition15"
note = "`Definition15` again gives the equal radii FC and FB."

[[passage]]
at = "And the squares on FB, BD are equal to the square on FD"
kind = "helper"
helper = "Touches.not_inside"
note = "For I.47, F must be off DB. The centre is within the circle (`Tacit.centre_inside`), and `Touches.not_inside` excludes every point within it from DB."

[[passage]]
at = "let the centre E be taken, and from E let EF be drawn perpendicular to AC"
kind = "helper"
helper = "BookI.Prop12"
note = "The Lean takes E from `Tacit.exists_centre` as above. `Tacit.centre_unique` puts it off AC in this branch, and I.12 draws EF, with no reference from Heath for that construction."

[[passage]]
at = "let EB, EC, ED be joined"
kind = "given"
note = "EB, EC and ED are named by their ends, so the Lean needs no separate construction for these joins."

[[passage]]
at = "And, since a straight line EF through the centre"
kind = "helper"
helper = "foot_between"
note = "Euclid reads F between A and C from the figure. `foot_between` proves it: I.17 and I.19 make EF shorter than a radius, so F is within the circle and between the ends. Heath gives no reference to I.17 or I.19 here."

[[passage]]
at = "And EC is equal to EB"
kind = "helper"
helper = "Definition15"
note = "`Definition15` gives the equal radii EC and EB, as it gave FC and FB above."

[[passage]]
at = "But the squares on EB, BD are equal to the square on ED"
kind = "helper"
helper = "Touches.not_inside"
note = "For I.47, `Touches.not_inside` puts E off DB, since E is within the circle (`Tacit.centre_inside`), as for F in the diameter case."

[figure]
case = "DCA through the centre F (left), and DCA off the centre E with EF perpendicular to AC (right)"
every_case = true

