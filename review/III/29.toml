[statement]
scope = "full"
note = "Equal circumferences that coincide in `Prop29`, equal in measure in `Prop29.of_measure`; of any size, less than a semicircle, a semicircle or greater."
companions = ["III.29 of_measure"]
fingerprint = "sha256:c480aaed8eb6d304"

[route]
kind = "modified"
note = "For lesser circumferences, III.27 gives equal angles at the centres, and equal radii and I.4 give equal bases. The edition's own route for greater circumferences rests on the subtraction that ends Euclid's III.28: equal whole circles leave equal circumferences after equal circumferences are taken away (Heath, vol. 2, p. 60). In both proofs, under the base passage, this subtraction (Common Notion 3) gives equal lesser remainders; `standing_eq_circumference` expresses their measures as standing measures for `Prop27.of_measure`, and I.4 gives BC = EF. At Euclid's sentence on the equality of BKC and ELF, `Prop27` gives the main proof its conditional equality of the angles at the centres for the lesser case; the companion uses `Prop27.of_measure`. Under the base passage, `Prop29` obtains equal measures by `Prop24.equalMeasure`; `Prop29.of_measure` has them as its hypothesis, and both proofs use `Prop29.matchSizes` to match the cases. For semicircles the Lean makes each diameter a sum of two equal radii. The split into cases by the size of the circumference rests on III.20's special case, III.21 and III.22, and the greater case's passage to the remaining circumferences on III.21 and III.22; III.29's own proof cites III.20 in no other form and turns no angle at the centre past two right angles."

[representation]
tags = ["angle-measure", "redundant-hypothesis"]
note = "Euclid's equal circumferences are read through Common Notion 4 as circumferences that coincide (`Arc.Congruent`), as III.28 concludes them. `Prop29` uses `Prop24.equalMeasure` for the size split and subtraction, `Prop27` for the lesser case, and `Prop27.of_measure` on the greater case's remainders. `Prop29.of_measure` starts from equal measures and uses `Prop27.of_measure` in both non-diameter cases. The agreement of the congruence and measure readings in equal circles is proved after III.29 (`Arc.congruent_iff`, `Arc.measure_eq_iff`). `Prop24.image` and `Prop24.equalCircles` show that the main congruence hypothesis gives equal straight lines and circles; the proof uses the equal circles for the radii. In the measure companion equal circles are necessary: equal measures in unequal circles need not cut off equal straight lines."

[[passage]]
at = "and let the straight lines BC, EF be joined"
kind = "helper"
helper = "Prop2.oppositeSide"
note = "Euclid's figure puts A and D on the circles beyond BC and EF from G and H. The Lean supplies those points by `Prop2.oppositeSide` (III.2, for which Heath prints no reference here), to give III.27 points at the circumferences as well as the centres."

[[passage]]
at = "For let the centres of the circles be taken"
kind = "given"
note = "The hypothesis that the circles are equal supplies K and L through `EqualCircles`; the radii are named by their ends."

[[passage]]
at = "Now, since the circumference BGC is equal to the circumference EHF"
kind = "given"
note = "The circumferences BGC, EHF are given as circumferences that coincide, and III.27, as `Prop27` states it, takes them so at the next clause, so no step stands between. The companion `Prop29.of_measure` first makes its given equal measures those of the circumferences on which the angles at A and D stand (`standing_eq_circumference`), as `Prop27.of_measure` takes them."

[[passage]]
at = "therefore the base BC is equal to the base EF"
kind = "different"
helper = "Prop29.matchSizes"
note = "Both proofs call `Prop29.matchSizes` with equal measures obtained by `Prop24.equalMeasure` in the main proof and given in the companion. Both use III.27 and I.4 for lesser circumferences, `Prop27.of_measure` and I.4 on the equal lesser remainders for greater circumferences by the edition's own route from III.28's closing subtraction, and the Lean adds two equal radii for each semicircle diameter."

[figure]
case = "circumferences BGC and EHF less than semicircles, with K and L beyond BC and EF from G and H"

