[statement]
scope = "full"
note = "Equal circumferences of any size, less than a semicircle, a semicircle or greater, by the angle measure; `Prop29.of_congruent` takes them to be congruent."
companions = ["III.29 of_congruent"]
fingerprint = "sha256:b15027ff1b86720a"

[route]
kind = "modified"
note = "Euclid's argument where the circumferences are less than semicircles; when they are semicircles, BC and EF are diameters, and when greater, his argument runs on the circumferences that remain. The route stays so for this release, a deliberate limitation. Semicircles give diameters, which make no triangles for I.4, so the proof adds the equal radii instead; for greater circumferences the rectilineal angles at the centres stand on the less circumferences that remain, so III.27 is applied to those before I.4. A theory of arc magnitudes of their own is left for a later release, and would not by itself remove the case of semicircles. The companion `Prop29.of_congruent` passes from congruent circumferences to equal measures by III.24's companion `Prop24.equalMeasure`, and then applies `Prop29`, so its route is the one above."

[representation]
tags = ["angle-measure", "redundant-hypothesis"]
note = "Equal circumferences are equal measures, which in equal circles is what Euclid means; in `Prop29` the equal circles do real work, giving I.4 its equal radii. In `Prop29.of_congruent` the circumferences are congruent, and the map that lays one on the other keeps the distance between their ends, so the congruence already gives the equal straight lines (`Prop24.image`), and the equal circles with them (`Prop24.equalCircles`): in that companion alone the hypothesis is redundant, kept as Euclid's setting and used along the same route, for the radii of I.4."

[[passage]]
at = "and let the straight lines BC, EF be joined"
kind = "helper"
helper = "Prop2.oppositeSide"
note = "Euclid's figure puts A and D on the circles beyond BC and EF from G and H. The Lean supplies those points by `Prop2.oppositeSide` (III.2, for which Heath prints no reference here), to give III.27 points at the circumferences as well as the centres."

[[passage]]
at = "For let the centres of the circles be taken"
kind = "different"
note = "The given equal circles supply K and L, as the [introduction](index.md) explains. When K lies on BC, `Circumference.semicircle` makes BGC a semicircle and `Prop29.size` makes EHF one too. BC and EF are diameters, each twice the equal radius, so the Lean adds the radii by `Tacit.len_add_of_between` instead of applying III.27 and I.4."

[[passage]]
at = "Now, since the circumference BGC is equal to the circumference EHF"
kind = "different"
note = "`Prop29.size` puts both circumferences in the same size case. For circumferences greater than semicircles, `Circumference.whole` gives equal wholes, so Common Notion 3 leaves equal remainders BAC and EDF. `Prop2.sameSide` supplies the points at the circumferences needed to apply III.27 to those remainders."

[figure]
case = "circumferences BGC and EHF less than semicircles, with K and L beyond BC and EF from G and H"

