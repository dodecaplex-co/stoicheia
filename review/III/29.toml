[route]
kind = "modified"
note = "Euclid's argument, III.27 for the angles BKC, ELF and then I.4, where BGC and EHF are less than semicircles, as in his figure (Heath, vol. 2, p. 60). Where they are greater, the angles at K and L standing on them are greater than two right angles. The triangle angles BKC and ELF are each less than two right angles, so I.4 cannot use the reflex angles; Heath's note on III.29 does not take up this case. A step of ours carries it: III.20 (`Prop20`) doubles III.27's equal angles at A and D into equal angles at the centres standing on BGC and EHF (`angleAtCentre`), and `angleAtCentre.reflex` with Common Notion 3 takes those from four right angles, leaving the angles BKC, ELF for I.4. That is an argument of our own for a case within the statement, so the route is modified. The case of semicircles Heath calls \"even easier than the corresponding case of III. 28 itself\" (vol. 2, p. 61); he completes that case of III.28 from the equal diameters of equal circles (vol. 2, p. 60), and the Lean completes III.29's the same way: BC and EF are diameters, each the sum of two equal radii. `Prop29` gives III.27 the congruence as it stands (`Prop27`); the companion `Prop29.of_measure` makes its equal measures those of the circumferences on which the angles at A and D stand, gives them to III.27's companion `Prop27.of_measure`, and then follows the same argument."

[representation]
tags = ["angle-measure", "redundant-hypothesis"]
note = "Euclid's equal circumferences are read through Common Notion 4 as circumferences that coincide when one is placed on the other (`Arc.Congruent`), as III.28 concludes them, and `Prop29` states III.29 with them; its proof carries Euclid's argument, taking its equal angles from III.27, which `Prop27` states with the same congruence. `Prop29.of_measure` states it with circumferences equal in measure, the form in which `Arc.measure_eq_iff`, after III.29, cites it, and repeats the argument through III.27's companion `Prop27.of_measure`. In equal circles the two readings agree: drawn circumferences coincide exactly when they are equal in measure (`Arc.congruent_iff`). In `Prop29` the map that lays one circumference on the other keeps the distance between their ends, so the congruence already gives the equal straight lines (`Prop24.image`), and the equal circles with them (`Prop24.equalCircles`): there the hypothesis is redundant, kept as Euclid's setting and used along his route, for the radii of I.4. In `Prop29.of_measure` the equal circles do real work: in unequal circles, circumferences equal in measure are cut off by unequal straight lines, and the equal circles give I.4 its equal radii."

[[passage]]
at = "and let the straight lines BC, EF be joined"
kind = "helper"
helper = "Prop2.oppositeSide"
note = "Euclid's figure puts A and D on the circles beyond BC and EF from G and H. The Lean supplies those points by `Prop2.oppositeSide` (III.2, for which Heath prints no reference here), to give III.27 points at the circumferences as well as the centres."

[[passage]]
at = "For let the centres of the circles be taken"
kind = "given"
note = "The hypothesis that the circles are equal supplies K and L through `EqualCircles`; the radii are named by their ends."

[[passage]]
at = "Now, since the circumference BGC is equal to the circumference EHF"
kind = "given"
note = "The circumferences BGC, EHF are given as circumferences that coincide, and III.27, as `Prop27` states it, takes them so at the next clause, so no step stands between. The companion `Prop29.of_measure` first makes its given equal measures those of the circumferences on which the angles at A and D stand (`standing_eq_circumference`), as `Prop27.of_measure` takes them."

[[passage]]
at = "the angle BKC is also equal to the angle ELF"
kind = "different"
helper = "Prop20"
note = "III.20 (`Prop20`) doubles III.27's equal angles at A and D into equal angles at the centres standing on BGC and EHF (`angleAtCentre`), and these tell which case both circles are in. Where BGC and EHF are less than semicircles, as in Euclid's figure, III.27 (`Prop27`) gives the angles BKC, ELF equal, as he takes them. Where they are greater, the angles at the centres standing on them are greater than two right angles, and so not the angles BKC, ELF, which are less and which III.27 does not give there; the step at I.4 below takes them from four right angles. The companion `Prop29.of_measure` takes the same angles from III.27's companion `Prop27.of_measure`."

[[passage]]
at = "therefore the base BC is equal to the base EF"
kind = "different"
helper = "Prop26.alike"
note = "Equal angles at the centres put K and L alike (`Prop26.alike`). Where BGC and EHF are less than semicircles, the equal radii and III.27's angles BKC, ELF give the bases by I.4, as Euclid has it. Where they are greater, the angles at the centres are more than two right angles, which I.4 cannot take: `angleAtCentre.reflex` makes each, with the angle BKC or ELF, four right angles, and Common Notion 3 takes the equal angles at the centres away, leaving the angle BKC equal to ELF for I.4. Where they are semicircles there are no triangles: BC and EF are diameters, each the sum of two equal radii, the case Heath calls \"even easier\" than III.28's (vol. 2, p. 61)."

