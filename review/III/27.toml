[statement]
scope = "full"
note = "Angles at the circumferences of any size, and at the centres where they stand on BC; since our measure carries no radius, it holds in any two circles."
fingerprint = "sha256:76827ffe8edda107"

[route]
kind = "modified"
note = "Euclid's reductio for the angles at the centres, and his halving by III.20 where the angles at the circumferences are acute, which the Lean cites as III.20's companion `Prop20.special`, III.20 with the centre on A's side of BC, where the angle at the centre is the angle BGC, the statement III.20 had before; where they are obtuse, his argument runs on the circumferences that remain, as III.26 does for the congruence of the remaining segments, and III.22 gives back the angles at A and D; where they are right, each is an angle in a semicircle, read off the measure of the circumference (`Prop24.angle_type`)."

[representation]
tags = ["angle-measure", "redundant-hypothesis"]
note = "\"In equal circles\" is kept from Euclid, and the proof uses it through III.26 as he does; but the circumferences are measured by angles, so the statement would hold without it. The centres G and H are given, as the enunciation speaks of angles at the centres."

[[passage]]
at = "and on the straight line BG, and at the point G on it"
kind = "helper"
helper = "OnRay.exists_len_eq"
note = "Euclid constructs BGK by I.23 and takes K on the circle; I.23 in the Lean gives only the direction of GK. `OnRay.exists_len_eq` takes GK equal to GB, using Postulate 3 and `Tacit.centre_inside` (System E, Generalities 3), proved in `Elements/Figure/RuleBase.lean`, and `Tacit.line_circle_beyond` (System E, Intersections 5), a rule we assume, and `Tacit.on_circle_of_len_eq` (System E, Diagram-segment 3), also proved there, puts K on ABC."

[[passage]]
at = "Now equal angles stand on equal circumferences"
kind = "helper"
helper = "Prop2.sameSide"
note = "Euclid applies III.26 to the equal central angles. The Lean first takes a point of each circle on its centre's side of the chord by `Prop2.sameSide` (III.2, for which Heath gives no reference here), supplying the points at the circumferences that III.26 also asks for."

[[passage]]
at = "therefore BK is also equal to BC"
kind = "helper"
helper = "Circumference.centre"
note = "Euclid reads BK as less than BC and rules out their equality. `Circumference.centre` turns that equality into equality of BGK and BGC, contradicting BGK equal to the smaller angle EHF; the lemma uses III.2, III.20 (by its companion `Prop20.special`) and III.21, for which Heath gives no references here."

[[passage]]
at = "Therefore the angle BGC is not unequal to the angle EHF"
kind = "case"
note = "Euclid supposes BGC greater than EHF; the Lean proves the reductio once over any letters and applies it again with the circles exchanged to rule out EHF greater than BGC. The Lean concludes that BGC equals EHF by `Tacit.lt_trichotomy`, a rule we assume about magnitudes (System E §3.5), not a proof: of two unequal angles, one is greater."

[[passage]]
at = "therefore the angle at A is also equal to the angle at D"
kind = "different"
note = "Euclid infers that the angles at A and D are equal because they are halves of equal angles, which holds where they are acute, as in his figure; the Lean writes his reductio and halving once, for any points of the circles on the centres' sides, and `Magnitude.eq_of_add_self_eq` proves that equal doubles have equal halves by ruling out either strict inequality. `Prop27.sides` puts the centres alike in both circles; where the angles at A and D are obtuse, the Lean takes points X, Y on the centres' sides by `Prop2.sameSide`, makes the circumferences that remain equal by `Circumference.whole` and Common Notion 3, makes the angles at X and Y equal by Euclid's argument, and by III.22 leaves those at A and D as what remains of two right angles; where they are right, the centres lie on BC and EF, with no angles BGC, EHF of ours, our angles never being straight, and the angle at the centre, two right angles (`angleAtCentre.semicircle`), is not halved; `Prop24.angle_type` reads each angle off the measure as an angle in a semicircle; Heath prints no reference here for I.5, I.32, III.2, III.21 or III.22, which these use."

[figure]
case = "acute angles at the circumferences"
note = "Euclid's figure draws the impossible supposition that BGC is greater than EHF, with BGK equal to EHF."

