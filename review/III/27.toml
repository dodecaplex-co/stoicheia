[statement]
scope = "full"
note = "Angles at the circumferences of any size, and at the centres where they stand on BC; `Prop27.of_congruent` takes the circumferences to be congruent."
companions = ["III.27 of_congruent"]
fingerprint = "sha256:9195621c03fb5343"

[route]
kind = "modified"
note = "Euclid's reductio for the angles at the centres, and his halving by III.20 at A and D in every case: where the angles at A and D are acute, of the angles BGC, EHF, by III.20's companion `Prop20.special`; where they are right or obtuse, of the angles at the centres standing on BC and EF, two right angles or more (`angleAtCentre`), a reading that is ours, made after Heath's notes, and not Euclid's, by III.20 itself. Where the angles at A and D are obtuse, the angles at the centres are greater than two right angles, which I.23 does not construct and III.26's statement does not speak of, so the reductio runs on the angles BGC, EHF, which stand on the circumferences that remain, and the angles at the centres are what remains when those are taken from four right angles. The companion `Prop27.of_congruent` passes from congruent circumferences to equal measures by III.24's companion `Prop24.equalMeasure`, and then applies `Prop27`, so its route is the one above."

[representation]
tags = ["angle-measure", "redundant-hypothesis"]
note = "\"In equal circles\" is kept from Euclid, and the proof uses it through III.26 as he does; but the circumferences are measured by angles, so the statement would hold without it. In `Prop27.of_congruent` the circumferences are congruent, and congruent circumferences already lie in equal circles (`Prop24.image`, `Prop24.equalCircles`): the hypothesis is redundant there too, kept as Euclid's setting and used through III.26. The centres G and H are given, as the enunciation speaks of angles at the centres."

[[passage]]
at = "and on the straight line BG, and at the point G on it"
kind = "helper"
helper = "OnRay.exists_len_eq"
note = "Euclid constructs BGK by I.23 and takes K on the circle; I.23 in the Lean gives only the direction of GK. `OnRay.exists_len_eq` takes GK equal to GB, using Postulate 3 and `Tacit.centre_inside` (System E, Generalities 3), proved in `Elements/Figure/RuleBase.lean`, and `Tacit.line_circle_beyond` (System E, Intersections 5), a rule we assume, and `Tacit.on_circle_of_len_eq` (System E, Diagram-segment 3), also proved there, puts K on ABC."

[[passage]]
at = "Now equal angles stand on equal circumferences"
kind = "helper"
helper = "Prop2.sameSide"
note = "Euclid applies III.26 to the equal central angles. The Lean first takes a point of each circle on its centre's side of the chord by `Prop2.sameSide` (III.2, for which Heath gives no reference here), supplying the points at the circumferences that III.26 also asks for."

[[passage]]
at = "therefore BK is also equal to BC"
kind = "helper"
helper = "Circumference.centre"
note = "Euclid reads BK as less than BC and rules out their equality. `Circumference.centre` turns that equality into equality of BGK and BGC, contradicting BGK equal to the smaller angle EHF; the lemma uses III.2, III.20 (by its companion `Prop20.special`) and III.21, for which Heath gives no references here."

[[passage]]
at = "Therefore the angle BGC is not unequal to the angle EHF"
kind = "case"
note = "Euclid supposes BGC greater than EHF; the Lean proves the reductio once over any letters and applies it again with the circles exchanged to rule out EHF greater than BGC. The Lean concludes that BGC equals EHF by `Tacit.lt_trichotomy`, a rule we assume about magnitudes (System E §3.5), not a proof: of two unequal angles, one is greater."

[[passage]]
at = "And the angle at A is half of the angle BGC"
kind = "case"
note = "Euclid's figure has the angles at A and D acute and the centres on their sides, where III.20 halves the angles BGC, EHF, as its companion `Prop20.special` states it. Equal circumferences put the centres alike (`Prop27.sides`, which sorts them by `Prop24.angle_type`), and the Lean takes his halving in each case. Where the angles at A and D are right, the centres lie on BC and EF, the angles at the centres standing on BC and EF are each two right angles (`angleAtCentre.semicircle`), and so equal with no reductio, and III.20 (`Prop20`) halves them."

[[passage]]
at = "therefore the angle at A is also equal to the angle at D"
kind = "different"
note = "Where the angles at A and D are obtuse, the centres lie beyond BC and EF, and the angles at the centres standing on BC and EF are greater than two right angles. The Lean makes the circumferences BAC, EDF that remain equal by `Circumference.whole` and Common Notion 3, runs Euclid's reductio on the angles BGC, EHF, which stand on them, and takes those from four right angles (`angleAtCentre.reflex`, Common Notion 3) to make the angles at the centres equal; III.20 (`Prop20`) halves them. In each case `Magnitude.eq_of_add_self_eq` proves that equal doubles have equal halves. Heath prints no reference here for I.5, I.13, I.32, III.2, III.21 or III.22, which these use."

[figure]
case = "acute angles at the circumferences"
note = "Euclid's figure draws the impossible supposition that BGC is greater than EHF, with BGK equal to EHF."

