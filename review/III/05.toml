# review/III/05.toml
[statement]
scope = "full"
note = "The circles are taken to be two (`ABC ≠ CDG`), as Euclid's figure takes for granted, cutting at two points; the proof uses only one of them."
fingerprint = "sha256:d7cdfb6a9d4b4196"

[route]
kind = "euclid"

[overlap]
rule = "Tacit.circle_eq"
kind = "gives"
note = "System E's Diagram-segment 2, that one centre and one radius make one circle, gives III.5 at once from a common point. The proof follows Euclid, and names that rule to show that F and G are two points. It also rests on that axiom and Postulate 3 through proved rules such as `Tacit.centre_inside`, whose proof uses circles to compare lengths."

[[passage]]
at = "therefore EF is also equal to EG, the less to the greater"
kind = "helper"
helper = "Tacit.circle_eq"
note = "That F and G are two points is the step Euclid leaves tacit: were they one, ABC and CDG, about the one centre E, would be one circle (System E, Diagram-segment 2), and the statement says they are two. Then whichever of F and G is the nearer E gives the less, as in his figure, where F is."

[[passage]]
at = "Therefore the point E is not the centre of the circles ABC, CDG."
kind = "grouped"
note = "The reductio's conclusion. The Lean supposed E the centre of both circles at the start and has reached the contradiction above, which proves it."

[figure]
note = "Like Heath's, this figure draws the impossible supposition: E as one centre of ABC and CDG, two circles that cut."

