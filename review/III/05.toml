[statement]
scope = "full"
note = "Cutting (`CirclesCut`) means two common points and a point of each circle within the other; the proof uses one common point and one point within."
fingerprint = "sha256:79b17524d08f12e0"

[route]
kind = "euclid"

[overlap]
rule = "Tacit.circle_eq"
also = ["Tacit.inside_not_on"]
kind = "gives"
note = "Diagram-segment 2 with Generalities 4 gives III.5 at once: one centre and a common point make the circles one, making F both within that circle and on it. Definition I.15 with Diagram-segment 4 and a magnitude law gives another short proof; with Diagram-segment 3's second half and Generalities 4 it gives a third. Our proof follows Euclid by Definition I.15 and the order on EFG, using neither Diagram-segment 2, Diagram-segment 3's second half, Diagram-segment 4 nor Circle 4."

[[passage]]
at = "let EC be joined"
kind = "helper"
helper = "Tacit.line_circle_beyond"
note = "Euclid takes from his figure where EFG meets the circles, F on ABC before G on CDG; EC is drawn for the eye, and the Lean uses only its ends. The Lean draws EFG through F, a point of ABC within CDG, and produces it beyond F to meet CDG at G by `Tacit.line_circle_beyond`, a rule we assume (System E, Intersections 5): this gives the order in Euclid's figure, and one straight line from E meeting the circles at different points is enough for his contradiction."

[[passage]]
at = "therefore EF is also equal to EG"
kind = "helper"
helper = "len_lt_of_between"
note = "Euclid reads off his figure that EF is the less. F lies between E and G by `Tacit.line_circle_beyond`, beneath the drawing of EFG, so `len_lt_of_between` makes EF less than EG, the part less than the whole (Common Notion 5)."

[[passage]]
at = "Therefore the point E is not the centre of the circles ABC, CDG."
kind = "grouped"
note = "The reductio's conclusion. The Lean supposed E the centre of both circles at the start and has reached the contradiction above, which proves it."

[figure]
note = "Like Heath's, this figure draws the impossible supposition: E as one centre of ABC and CDG, two circles that cut."

