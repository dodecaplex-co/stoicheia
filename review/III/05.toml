[overlap]
rule = "Tacit.circle_eq"
kind = "gives"
note = "Diagram-segment 2 with Generalities 4 gives III.5 at once: one centre and a common point make the circles one, making F both within that circle and on it. Definition I.15 with Diagram-segment 4 and a magnitude law gives another short proof; with Diagram-segment 3's second half and Generalities 4 it gives a third. Generalities 4 and those halves of Diagram-segments 3 and 4 have been theorems since 19 October 2026, proved in Elements/Figure/RuleBase.lean and Elements/Figure/Incidence.lean, so Diagram-segment 2 is the one assumption among them. Our proof follows Euclid by Definition I.15 and the order on EFG, citing neither Diagram-segment 2, Diagram-segment 3's second half, Diagram-segment 4 nor Circle 4. It rests on Diagram-segment 2 and Postulate 3 all the same, through proved rules such as `Tacit.centre_inside`, whose proof uses circles to compare lengths."

[[passage]]
at = "For, if possible, let it be E"
kind = "carried"
note = "EFG is drawn through F, a point of ABC within CDG, and produced beyond F to meet CDG at G. This gives the order in Euclid's figure; one straight line from E meeting the circles at different points is enough for his contradiction."

[[passage]]
at = "Therefore the point E is not the centre of the circles ABC, CDG."
kind = "grouped"
note = "The reductio's conclusion. The Lean supposed E the centre of both circles at the start and has reached the contradiction above, which proves it."

[figure]
note = "Like Heath's, this figure draws the impossible supposition: E as one centre of ABC and CDG, two circles that cut."

