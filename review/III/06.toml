# review/III/06.toml
[statement]
scope = "full"
note = "Covers contact within, either circle the inner, with a point within the outer, and contact without, the case Euclid leaves to the reader."
fingerprint = "sha256:6300244ecb552653"

[route]
kind = "euclid"

[representation]
tags = ["touching-whole-circles"]
note = "Touching is read of the whole circles. For contact within the inner has a point within the outer and none outside it; for contact without no point is within both. The point within does not make this Heath's preferred local reading of Definition III.3."

[overlap]
rule = "Tacit.circle_eq"
kind = "gives"
note = "Diagram-segment 2 with Generalities 4 ends contact within at once; Generalities 3 ends contact without, so the three rules give III.6 at once. Generalities 3 (`Tacit.centre_inside`) and 4 are former assumptions, proved since 19 October 2026 in Elements/Figure/RuleBase.lean, so Diagram-segment 2 is the one assumption among them. Our proof cites neither Diagram-segment 2 nor Circle 4: contact within follows Euclid by Definition I.15 and the order on FEB. Contact without does end by Generalities 3, the clause of Definition I.15 placing the centre within the figure; it is the case Euclid leaves to the reader and Heath regards as self-evident (vol. 2, p. 13). Our proof rests on Diagram-segment 2 and Postulate 3 all the same, through proved rules such as `Tacit.centre_inside`, whose proof uses circles to compare lengths."

[[passage]]
at = "For, if possible, let it be F"
kind = "case"
note = "Contact without ends here: F would be within both circles, which contact without forbids. It is the case Euclid leaves to the reader, and the Lean puts F within each circle by the proved rule `Tacit.centre_inside` (System E, Generalities 3)."

[[passage]]
at = "let FC be joined"
kind = "helper"
helper = "Tacit.line_circle_beyond"
note = "Euclid takes from his figure where FEB meets the circles, E on CDE before B on ABC; FC is drawn for the eye, and the Lean uses only its ends. For contact within, either circle the inner, the Lean draws FEB through a point of the inner within the outer and produces it to the outer by `Tacit.line_circle_beyond`, a rule we assume (System E, Intersections 5): the one line meeting the circles at different points that Heath says suffices in his answer to J. G. Camerer (vol. 2, p. 13)."

[[passage]]
at = "therefore FE is also equal to FB"
kind = "helper"
helper = "len_lt_of_between"
note = "Euclid reads off his figure that FE is the less. The point on the inner circle lies between F and the point on the outer, by `Tacit.line_circle_beyond` beneath the drawing of FEB, so `len_lt_of_between` makes its distance from F the less, the part less than the whole (Common Notion 5): FE in Euclid's figure, where CDE is the inner, and FB when ABC is."

[[passage]]
at = "Therefore F is not the centre of the circles ABC, CDE."
kind = "grouped"
note = "The reductio's conclusion. The Lean supposed F the centre of both circles at the start and has reached a contradiction in each kind of contact: at once for contact without, and by Euclid's argument for contact within."

[figure]
case = "the circles touching within, as in Heath's figure"
note = "Like Heath's, this figure draws the impossible supposition: F as one centre of ABC and CDE, two circles that touch."

