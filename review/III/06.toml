# review/III/06.toml
[statement]
scope = "full"
note = "Covers contact within, either circle the inner, with a point within the outer, and contact without, the case Euclid leaves to the reader."
fingerprint = "sha256:6300244ecb552653"

[route]
kind = "euclid"

[representation]
tags = ["touching-whole-circles"]
note = "Touching is read of the whole circles. For contact within the inner has a point within the outer and none outside it; for contact without no point is within both. The point within does not make this Heath's preferred local reading of Definition III.3."

[overlap]
rule = "Tacit.circle_eq"
also = ["Tacit.centre_inside", "Tacit.inside_not_on"]
kind = "gives"
note = "Diagram-segment 2 with Generalities 4 ends contact within at once; Generalities 3 ends contact without, so the three rules give III.6 at once. Our proof uses neither Diagram-segment 2 nor Circle 4: contact within follows Euclid by Definition I.15 and the order on FEB. Contact without does end by Generalities 3, the clause of Definition I.15 placing the centre within the figure; it is the case Euclid leaves to the reader and Heath regards as self-evident (vol. 2, p. 13)."

[[passage]]
at = "For, if possible, let it be F"
kind = "case"
note = "Contact without ends here: F would be within both circles, which contact without forbids. For contact within, either circle the inner, FEB is drawn through a point of the inner within the outer and produced to the outer, the one line meeting the circles at different points that Heath says suffices in his answer to J. G. Camerer (vol. 2, p. 13)."

[[passage]]
at = "Therefore F is not the centre of the circles ABC, CDE."
kind = "grouped"
note = "The reductio's conclusion. The Lean supposed F the centre of both circles at the start and has reached a contradiction in each kind of contact: at once for contact without, and by Euclid's argument for contact within."

[figure]
case = "the circles touching within, as in Heath's figure"
note = "Like Heath's, this figure draws the impossible supposition: F as one centre of ABC and CDE, two circles that touch."

