# review/III/16.toml
[statement]
scope = "full"
note = "With its companions: `Prop16.semicircle` and `Prop16.remaining` compare the two angles with every acute angle placed at A; `Prop16.acute` with any acute angle."
companions = ["III.16 semicircle", "III.16 remaining", "III.16 acute"]
fingerprint = "sha256:bbe980064221ec4c"

[route]
kind = "euclid"
note = "The angle clauses follow Euclid's reductio from the second part, in the companions' steps `Prop16.semicircle_gt` and `Prop16.horn_lt`: an acute angle BAF that the angle of the semicircle did not exceed, or an acute angle EAF that the remaining angle did not fall short of, would leave the straight line AF with no point within the circle, interposed between AE and the circumference; and the second part, used there once, says that it cannot be. How near A the comparisons hold is said by the perpendicular from A, by I.12, I.17 and I.19, which Euclid leaves unsaid."

[representation]
tags = ["mixed-angles-local"]
note = "An angle contained by a straight line and a circumference is a mixed angle (`MixedAngle`), read as the region it opens near its vertex: the angle of the semicircle is the points within the circle on E's side of AB, and the remaining angle the points without it, between AE and the circumference. We read it so because Euclid compares these angles only by where their arms lie at A: a rectilineal angle greater than the angle of the semicircle would have its arm interposed between the circumference and AE, so what he uses of an angle is which of two angles at A lies within the other, which is settled near A, and for two rectilineal angles on one arm is their ordinary order (`WithinAngle.locallyLess_iff`). A mixed angle is greater than a rectilineal angle placed at A along its straight arm, on its side, when near A the rectilineal angle lies within it with whole small circles to spare, and less the other way about. The companions place every acute rectilineal angle so, and prove that A, B and E make each a mixed angle as Euclid draws one (`MixedAngle.WellFormed`): A on the circle, the ray AB passing within it, E off AB, and AE touching it; no addition, ratio or motion of mixed angles is claimed. The centre D is given, as Euclid's setting-out names it."

[[passage]]
at = "Since DA is equal to DC"
kind = "helper"
helper = "Definition15"
note = "Euclid uses the equality of the radii DA and DC without giving a reason. The Lean obtains it from `Definition15`, Euclid's definition of a circle, which we assume as a rule."

[[passage]]
at = "But the angle DAC is right"
kind = "helper"
helper = "Tacit.adjacent_eq_of_right"
note = "Euclid takes DAC to be right, as supposed. The Lean proves this for either ray of AE beneath the setting-out, using `Tacit.adjacent_eq_of_right`, proved from I.13 and Common Notion 3, for the ray beyond A from E; Heath prints no reference to I.13 here."

[[passage]]
at = "Therefore the straight line drawn from the point A at right angles to BA will not fall within"
kind = "helper"
helper = "Tacit.line_circle_beyond"
note = "Euclid rules out a straight line entering the circle by the contradiction at C. From a supposed interior point P, the Lean obtains C on the circumference beyond P from A by `Tacit.line_circle_beyond`, the rule we assume as System E, Intersections 5, and applies the preceding contradiction."

[[passage]]
at = "Similarly we can prove that neither will it fall on the circumference"
kind = "grouped"
note = "One step shows that no point of AE but A is on the circle; it gives both \"not within\" and \"not on the circumference\"."

[[passage]]
at = "For, if possible, let another straight line be so interposed"
kind = "case"
helper = "Prop1.perpendicular"
note = "Euclid's figure keeps FA off the centre and G, the foot of DG, away from A. If FA passes through the centre, `Tacit.centre_inside` (System E, Generalities 3), proved in `Elements/Figure/RuleBase.lean`, supplies D within; otherwise I.12 draws DG and `Prop1.perpendicular`, proved using I.13, rules out G at A, since only one straight line there is at right angles to AD, with no reference to either proposition printed by Heath here."

[[passage]]
at = "and the angle DAG is less than a right angle"
kind = "helper"
helper = "BookI.Prop17"
note = "Euclid takes the angle DAG to be less than a right angle without a printed reference here. The Lean uses I.17 in triangle DGA and removes the right angle at G from the inequality by `Magnitude.lt_of_add_lt_add_left`."

[[passage]]
at = "But DA is equal to DH"
kind = "grouped"
note = "Our proof names no point H: DG, less than the radius DA, puts G within the circle by `Tacit.inside_of_len_lt` (System E, Diagram-segment 4), proved in `Elements/Figure/Incidence.lean`, which the supposed interposition forbids. One step carries both sentences."

[[passage]]
at = "Therefore another straight line cannot be interposed"
kind = "grouped"
note = "The conclusion of the second reductio, which the contradiction above has proved: the supposed FA has a point G within the circle."

[[passage]]
at = "I say further that the angle of the semicircle"
kind = "carried"
helper = "Prop16.semicircle"
note = "Proved as its own companion, III.16 semicircle."

[[passage]]
at = "and the remaining angle contained by the circumference CHA"
kind = "carried"
helper = "Prop16.remaining"
note = "For the remaining angle, `Prop16.horn_within_of` excludes points on AF and on its far side, which would be within the circle near A. It uses `Tacit.same_side_or` (System E, Same side 5), proved in `Elements/Figure/Incidence.lean`, to put every point of the horn on E's side of AF."

[[passage]]
at = "For, if there is any rectilineal angle greater than the angle contained"
kind = "helper"
helper = "Prop16.semicircle_gt_of_inside"
note = "Euclid asserts without argument that such angles would put a straight line between AE and the circumference. The companions' steps prove it turned about: a point G of AF within the circle puts the acute angle BAF within the angle of the semicircle near A, and the remaining angle within the acute angle EAF, each with whole small circles to spare (`Prop16.semicircle_gt_of_inside`, `Prop16.horn_lt_of_inside`). Euclid takes the two angles in one reductio, and the Lean in two, one in each companion; each supposes its comparison false, where Euclid supposes the rectilineal angle greater than the angle of the semicircle or less than the remaining angle, since two angles compared near A need not compare either way. Containment comes by `Prop16.near_inside_of`, and the whole small circles by `near_across`, through I.12, I.17, I.19, I.20 and III.2, for which Heath prints no references here. To put G on the ray AF, `Prop16.sameSideOf_of_inside` uses III.2 with `Tacit.lines_meet_of_opposite_sides` (System E, Intersection 1) and `Tacit.pasch4` (System E, Pasch 4), proved in `Elements/Figure/RuleBase.lean`; `near_across` takes a crossing of the circumference by `Tacit.line_circle_between` (System E, Intersections 4), the two intersection rules being assumed."

[[passage]]
at = "But such a straight line cannot be interposed"
kind = "carried"
helper = "Prop16.semicircle"
note = "In each companion's reductio (`Prop16.semicircle_gt`, `Prop16.horn_lt`), the second part of III.16, which the companion takes from the theorem, is used here and only here: it gives the supposed AF a point within the circle."

[[passage]]
at = "therefore there will not be any acute angle contained by straight lines"
kind = "carried"
helper = "Prop16.acute"
note = "The conclusion of the reductio, in each companion. Euclid concludes for any acute rectilineal angle; `Prop16.acute` places it at A along AB and along AE by I.23, for which Heath prints no reference here, and applies the two comparisons."

[[passage]]
at = "PORISM. From this it is manifest"
kind = "carried"
helper = "Prop16.porism"
note = "Proved as its own theorem, III.16 Por., from the first part of the statement."

[figure]
case = "FA off the centre, with G distinct from A and between D and H; the mixed angles are on E's side of AB"
note = "G is drawn within the circle, where the proof puts it, and H, where DG produced meets the circumference, beyond it; Heath's figure draws the supposition, with H between D and G. CA is drawn as the first reductio supposes it, within the circle; the true perpendicular to AB is AE."

