# review/III/16.toml
[statement]
scope = "full"
note = "With its companions: `Prop16.semicircle` and `Prop16.remaining` compare the two angles with every acute angle placed at A; `Prop16.acute` with any acute angle."
companions = ["III.16 semicircle", "III.16 remaining", "III.16 acute"]
fingerprint = "sha256:9fd59073303dbcdc"

[route]
kind = "modified"
note = "Euclid proves the angle clauses by reductio from the second part, since a straight line would be interposed; the companions argue directly from it. The straight line of an acute angle falls within the circle, so near A the acute angle lies within the angle of the semicircle, and the remaining angle within the acute angle, each with whole small circles to spare (`Prop16.semicircle_gt`, `Prop16.horn_lt`). How near A is said by the perpendicular from A, by I.12, I.17 and I.19, which Euclid leaves unsaid."

[representation]
tags = ["mixed-angles-local", "centre-given"]
note = "An angle contained by a straight line and a circumference is a mixed angle (`MixedAngle`), read as the region it opens near its vertex: the angle of the semicircle is the points within the circle on E's side of AB, and the remaining angle the points without it, between AE and the circumference. A mixed angle is greater than a rectilineal angle placed at A along its straight arm, on its side, when near A the rectilineal angle lies within it with whole small circles to spare, and less the other way about. The companions place every angle so, and prove that the named points give the angles Euclid draws (`MixedAngle.WellFormed`); no addition, ratio or motion of mixed angles is claimed. The centre D is given, as Euclid's setting-out names it."

[[passage]]
at = "Similarly we can prove that neither will it fall on the circumference"
kind = "grouped"
note = "One step shows that no point of AE but A is on the circle; it gives both \"not within\" and \"not on the circumference\"."

[[passage]]
at = "For, if possible, let another straight line be so interposed"
kind = "case"
helper = "Prop1.perpendicular"
note = "Euclid's figure keeps FA off the centre and G, the foot of DG, away from A. If FA passes through the centre, D itself is the point within; and G is not A, for at A only one straight line is at right angles to AD, as in III.1."

[[passage]]
at = "But DA is equal to DH"
kind = "grouped"
note = "Our proof names no point H: DG, less than the radius DA, puts G within the circle (Diagram-segment 4), which the supposed interposition forbids. One step carries both sentences."

[[passage]]
at = "Therefore another straight line cannot be interposed"
kind = "grouped"
note = "The conclusion of the second reductio, which the contradiction above has proved: the supposed FA has a point G within the circle."

[[passage]]
at = "I say further that the angle of the semicircle"
kind = "different"
helper = "Prop16.semicircle"
note = "Proved after the theorem, by the companions `Prop16.semicircle` and `Prop16.remaining`, directly: by the second part, the straight line of an acute angle falls within the circle. Euclid argues by reductio that no acute angle is greater than the one, or less than the other."

[[passage]]
at = "PORISM. From this it is manifest"
kind = "carried"
helper = "Prop16.porism"
note = "Proved as its own theorem, III.16 Por., from the first part of the statement."

[figure]
note = "G is drawn within the circle and H beyond G, on the circumference, as the proof finds them; Heath's figure draws the supposition, with H between D and G."

