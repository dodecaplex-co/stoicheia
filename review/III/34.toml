[statement]
scope = "full"
note = "Cuts off from the given circle a segment BAC admitting the given angle at A."
fingerprint = "sha256:86be646b296586e5"

[route]
kind = "euclid"
note = "Euclid reads C off his figure. The Lean finds it: by III.16 the straight line BC passes within the circle, so it meets the circle again, on the centre's side of EF."

[representation]
tags = ["segment-with-circle"]
note = "The segment cut off from the given circle is named by its points B, A and C. To draw EF touching the circle by III.16's porism, the proof takes a centre from `exists_centre`."

[[passage]]
at = "Let EF be drawn touching ABC at the point B"
kind = "helper"
helper = "Prop16.porism"
note = "The Lean takes the centre from `Tacit.exists_centre`, as the [introduction](index.md) explains, and B from `Tacit.exists_point_on_circle`. I.11 draws the perpendicular at B and III.16's porism makes EF touch, neither with a reference from Heath here."

[[passage]]
at = "and on the straight line FB"
kind = "helper"
helper = "Prop16"
note = "Heath gives I.23 for copying the angle, but no reference to III.16, which supplies a point of BC within the circle. `Tacit.line_circle_beyond`, a rule we assume, finds the other end of the diameter needed for III.16, then C beyond the interior point."

[[passage]]
at = "the angle FBC is equal to the angle constructed in the alternate segment BAC"
kind = "helper"
helper = "Prop2.oppositeSide"
note = "Euclid takes an angle in the alternate segment BAC. The Lean first chooses A across BC from F by `Prop2.oppositeSide` (III.2, for which Heath prints no reference here), then applies III.32 as printed."

[[passage]]
at = "But the angle FBC is equal to the angle at D"
kind = "helper"
helper = "OnRay.of_sameSideOf"
note = "Beneath the sentence that copies the angle, the Lean puts C on the centre's side of EF: otherwise `OppositeSides.exists_between` would give a crossing of OC with EF within the circle by `InsideCircle.of_between_centre`, contrary to `Touches.not_inside`. `OnRay.of_sameSideOf` then puts C on the ray where the angle was copied, so that here `angle_onRay_right` gives the copied angle."

[figure]
case = "an acute given angle, with BAC the greater segment"

