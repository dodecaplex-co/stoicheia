# review/III/08.toml
[statement]
scope = "restricted"
hypotheses = [
  "the two straight lines compared as nearer and more remote, on the concave or on the convex circumference, lie on one side of DA (`SameSideOf E F D A`, `SameSideOf K L D A`). As in III.7, the statement gives the equal straight line on the other side by its length, not its inclination, so a comparison across DA does not follow from it.",
]
note = "Nearer and more remote are compared only on one side of DA, as in Euclid's figure; a straight line on one side is not compared with one on the other."
fingerprint = "sha256:5924e258038472ae"

[route]
kind = "modified"
note = "Euclid's argument, but the last step, that no third straight line equals DK, compares the angles at the centre M by I.24, which reaches every point of the circle."

[representation]
tags = ["centre-given"]
note = "The circle comes with a centre, which the proof takes by III.1. The convex circumference is read as where a straight line from D first meets the circle, the concave as where it meets it again. A straight line touching the circle from D falls on neither, as Euclid's lines are drawn through."

[[passage]]
at = "Similarly we can prove that FD is greater than CD"
kind = "grouped"
note = "The comparison above is proved for any two points of the concave circumference on one side of DA, F and C among them, so these sentences need no Lean of their own."

[[passage]]
at = "Similarly we can prove that DL is also less than DH"
kind = "grouped"
note = "The comparison above is proved for any two points of the convex circumference on one side of DA, L and H among them, so these sentences need no Lean of their own."

[[passage]]
at = "that is, the nearer to the least DG equal to the more remote"
kind = "different"
note = "Lean does not appeal to the convex order, which misses a DN ending on the concave circumference or a DK touching the circle; I.24 at the centre M rules out equal straight lines on one side."

[review]
stage = "exceptions"
