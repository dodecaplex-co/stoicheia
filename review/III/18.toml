# review/III/18.toml
[statement]
scope = "full"
note = "For any straight line touching a circle, `Prop18.contact_lt` and `Prop18.semicircle_gt` compare III.16's two angles with acute angles; `Prop18.acute` with any."
companions = ["III.18 contact_locallyEqual", "III.18 contact_lt", "III.18 semicircle_gt", "III.18 acute"]
fingerprint = "sha256:c091c8d1991be2a0"

[route]
kind = "euclid"
note = "`Prop18` follows Euclid, with the centre F given; F is off DE, for it is within the circle and no point of DE is. The companions follow in Euclid's order and cite nothing later than III.18. Let AE touch the circle at A, and AB be the diameter through A: III.18 puts AE at right angles to AB (`Prop18.diameter`), so AE is III.16's straight line and III.16's two parts hold for it (`Prop18.parts`); III.16's comparisons then hold for AE, cited from III.16's own steps (`Prop16.horn_lt`, `Prop16.semicircle_gt`), which follow Euclid's reductio from its second part, as III.16's record declares. `Prop18.contact_locallyEqual` and `Prop18.contact_lt` take the centre from `Tacit.exists_centre`, a rule we assume; `Prop18.semicircle_gt` and `Prop18.acute` keep the centre D, through which the diameter is drawn, and `Prop18.acute` places every acute angle at A by I.23."

[representation]
tags = ["mixed-angles-local"]
note = "The angle of the semicircle and the angle of contact are mixed angles (`MixedAngle`), read and compared near A as in III.16. An angle of contact is as Euclid draws it (`MixedAngle.WellFormed`) when A is on the circle, AE touches it there, and a point B off AE names a branch of the circumference, the ray AB passing within the circle. Every such B is on the diameter's side of AE (`Prop18.branch`), and near A every such B names the same region, the angle of contact of III.16's figure (`Prop18.contact_locallyEqual`). No addition, ratio or motion of mixed angles is claimed."

[[passage]]
at = "For let a straight line DE touch the circle ABC at the point C"
kind = "given"
note = "The statement gives the tangent DE, the contact C and the centre F; the radius FC is named by its ends."

[[passage]]
at = "For, if not, let FG be drawn from F perpendicular to DE"
kind = "helper"
helper = "BookI.Prop12"
note = "Euclid draws FG perpendicular to DE; the Lean uses I.12, for which Heath prints no reference here. Beneath the setting-out, the Lean first proves F off DE with `Touches.not_inside` and `Tacit.centre_inside` (System E, Generalities 3), proved in `Elements/Figure/RuleBase.lean`."

[[passage]]
at = "But FC is equal to FB"
kind = "helper"
helper = "Tacit.line_circle_between"
note = "Euclid reads B on FG between F and G and takes FC equal to FB. The Lean proves G outside the circle using `Touches.not_inside` and the definition of touching, puts F within it by the proved rule `Tacit.centre_inside` (System E, Generalities 3) and takes B by `Tacit.line_circle_between` (System E, Intersections 4), a rule we assume, and equates the radii by `Definition15`, Euclid's definition of a circle, which we also assume as a rule."

[[passage]]
at = "the less than the greater: which is impossible"
kind = "helper"
helper = "len_lt_of_between"
note = "Euclid reads FB as less than FG because B lies between F and G. The Lean obtains that strict inequality from `len_lt_of_between`, using length addition and Common Notion 5, and contradicts the inequality just proved."

[[passage]]
at = "Therefore FG is not perpendicular to DE."
kind = "grouped"
note = "The reductio shows that the foot G of the perpendicular from F is C itself, so FC is that perpendicular, and no other straight line is left to prove."

[figure]
case = "the radius FC to the point of contact C, as in the main theorem; the angles its companions compare are drawn in III.16's figure"
note = "The figure shows the impossible supposition with G distinct from C: FG is supposed perpendicular to DE, but the perpendicular in the drawn geometry is FC."

