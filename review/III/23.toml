[statement]
scope = "full"
note = "Stated as an equality: two circles through A and B with similar segments on one side of AB are one circle; `Prop23.point` says it point by point."
companions = ["III.23 point"]
fingerprint = "sha256:48c3c7a485375f21"

[route]
kind = "euclid"
note = "The companion `Prop23.point` goes through a point M between A and B, within the circle (III.2): a point on the circle subtends the angle in the segment (III.21); one outside it, or within it, subtends a less, or a greater, angle, through a point Q where MP meets the circle (I.21, III.21), with `Prop23.insideTriangle_of_between` for the step read off the figure."

[representation]
tags = ["segment-with-circle"]
note = "Each segment is given as its circle, the straight line AB and a point C or D on one side. III.10 and III.21 obtain their centres internally."

[[passage]]
at = "let ACD be drawn through, and let CB, DB be joined"
kind = "helper"
helper = "Prop10"
note = "Simson's preliminary (Heath, vol. 2, p. 53): by III.10 the circles meet only at A and B, so one segment falls within the other; III.21 carries the angle to where AC drawn through meets the other circle. If C is outside ADB, the Lean uses III.2 and `Prop2.within` to reverse the roles through a point M taken between A and B by `Tacit.exists_point_between` (System E, Points 3), proved in `Elements/Figure/Incidence.lean`; Heath prints no reference here for III.2, III.10 or III.21, and the meetings use `Tacit.line_circle_between` and `Tacit.line_circle_beyond`, rules we assume as System E, Intersections 4 and 5."

[figure]
case = "the segment ACB within ADB, as in Heath's figure"
note = "Like Heath's, this figure draws the impossible supposition: two similar and unequal segments, ACB and ADB, on the same side of AB."

