[statement]
scope = "full"
note = "Stated as an equality: two circles through A and B with similar segments on one side of AB are one circle; `Prop23.point` says it point by point."
companions = ["III.23 point"]
fingerprint = "sha256:3f7601e5fce9aeab"

[route]
kind = "euclid"
note = "The companion `Prop23.point` goes through a point M between A and B, within the circle: a point on the circle subtends the angle in the segment [III. 21]; one outside it, or within it, subtends a less, or a greater, angle, through a point Q where MP meets the circle [I. 21, III. 21], with `Prop23.insideTriangle_of_between` for the step read off the figure."

[representation]
tags = ["segment-with-circle", "centre-given"]
note = "Each segment is given as its circle, the straight line AB and a point C or D on one side, and each circle comes with a centre, which III.10 and III.21 need."

[[passage]]
at = "let ACD be drawn through, and let CB, DB be joined"
kind = "helper"
helper = "Prop10"
note = "Simson's preliminary (Heath, vol. 2, p. 53): by III.10 the circles meet only at A and B, so one segment falls within the other; III.21 carries the angle to where AC drawn through meets the other circle."

