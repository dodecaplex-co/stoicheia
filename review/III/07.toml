# review/III/07.toml
[statement]
scope = "restricted"
hypotheses = [
  "the two straight lines compared as nearer and more remote lie on one side of the diameter AD (`SameSideOf B C A D`). Across AD the comparison follows, Heath notes, from Euclid's equal and equally inclined straight line on the other side (vol. 2, p. 17); the statement gives that line's length but not its inclination.",
]
note = "Nearer and more remote are compared only on one side of AD, as in Euclid's figure; a straight line on one side is not compared with one on the other."
fingerprint = ""

[route]
kind = "euclid"

[representation]
tags = ["centre-given"]
note = "The centre E is given, as Euclid's setting-out takes it. 'Nearer' is Euclid's meaning, the less angle at F with FA; the statement speaks of every point of the circle."

[[passage]]
at = "For the same reason"
kind = "grouped"
note = "Euclid's argument above is proved for any two points B, C of the circle on one side of AD; C and G are such a pair, so these words need no Lean of their own."

[[passage]]
at = "Therefore another straight line equal to GF will not fall"
kind = "grouped"
note = "The conclusion of the argument above, which has shown that every point K of the circle with FK equal to FG is G or H."

