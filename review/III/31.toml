[statement]
scope = "partial"
omitted = [
  "the angle of the greater segment is greater than a right angle",
  "the angle of the less segment less than a right angle",
]
note = "Proves the angles in the semicircle and in each segment, at every point of the segment; the clause map below shows what stays in Euclid's words."
short = "the angles of the segments stay in Euclid's words"
fingerprint = "sha256:9a6c82df950595b4"

[route]
kind = "euclid"

[representation]
tags = ["mixed-angles-omitted", "centre-given"]
note = "Our angles are made by two straight lines, so an angle contained by a straight line and a circumference has no Lean counterpart. A point is in the greater segment ABC when it is on B's side of AC, and in the less segment when it is on the other side. The centre E is given, as Euclid's setting-out names it."

[coverage]
checked = [
  "The angle BAC in the semicircle is right.",
  "The angle in the greater segment ABC is less than a right angle, at every point of the segment, not only at B.",
  "The angle in the less segment ADC is greater than a right angle, at every point of the segment.",
]
explains = [
  "The proof shows that the angles BAC and FAC are both right, as Euclid's \"each is right\" says. His sentences about the angles of the segments rest on these two facts.",
]
text_only = [
  "the angle of the greater segment is greater than a right angle",
  "the angle of the less segment less than a right angle",
]

[[passage]]
at = "and it is the angle in the segment ADC less than the semicircle"
kind = "case"
note = "Euclid shows the angle in the greater segment less than a right angle at B alone, by I.17. Our statement says it of every point of that segment, so the Lean adds a step here: with a point D of the less segment, III.22 makes the two angles together equal to two right angles, and the angle at D is greater than a right angle."

[[passage]]
at = "I say further that the angle of the greater segment"
kind = "unformalized"
note = "Euclid's argument for the angles of the segments, which the clause map above accounts for; the Lean beneath it only returns the three claims already proved."

