[statement]
scope = "full"
note = "The angles in the segments, at every point; its companions, the angles of the segments at either end of any straight line in the circle not through the centre."
companions = ["III.31 greater", "III.31 less"]
fingerprint = "sha256:c3d22dab733dbafc"

[route]
kind = "euclid"
note = "Euclid shows the angle in the greater segment less than a right angle at B alone, by I.17. Our statement says it of every point of that segment, so the Lean adds a step here: with a point D of the less segment, III.22 makes the two angles together equal to two right angles, and the angle at D is greater than a right angle."

[representation]
tags = ["mixed-angles-local"]
note = "An angle contained by a straight line and a circumference is a mixed angle (`MixedAngle`), read as the region it opens near its vertex: the angle of a segment is the points within the circle on the segment's side of AC. It is greater than a right angle placed at A along AC, on that side, when near A the right angle lies within it with whole small circles to spare, and less the other way about; the companions prove that the named points give the angles Euclid draws (`MixedAngle.WellFormed`), and claim no addition, ratio or motion of mixed angles. A point is in the greater segment ABC when it is on B's side of AC, and in the less segment when it is on the other side. The centre E is given, as Euclid's setting-out names it."

[[passage]]
at = "Let ABCD be a circle"
kind = "helper"
helper = "Prop2.triangle"
note = "Euclid joins the points of the circle and uses triangle ABC. The Lean excludes collinearity by `Prop2.triangle`, from III.2, for which Heath prints no reference here."

[[passage]]
at = "Then, since BE is equal to EA"
kind = "helper"
helper = "Definition15"
note = "Euclid takes the radii BE and EA to be equal without giving a reason. The Lean obtains their equality from `Definition15`, Euclid's definition of a circle, which we assume as a rule."

[[passage]]
at = "Again, since CE is equal to EA"
kind = "helper"
helper = "Definition15"
note = "Euclid takes the radii CE and EA to be equal without giving a reason. The Lean again applies `Definition15`."

[[passage]]
at = "Therefore the whole angle BAC is equal to the two angles ABC, ACB"
kind = "helper"
helper = "angle_add_of_between"
note = "Euclid adds the two angles at A to make the whole BAC. Since E lies between B and C, `angle_add_of_between` splits BAC at AE, using `Tacit.pasch2` (System E, Pasch 2) to place E within the angle and `Tacit.angle_add_of_inside` (System E, Diagram-angle 2) to add its parts, both rules we assume."

[[passage]]
at = "and it is the angle in the segment ADC less than the semicircle"
kind = "case"
note = "Euclid's figure supplies D; for the further case described above, `Prop2.oppositeSide` supplies a point of the circle across AC from B by III.2, for which Heath prints no reference here."

[[passage]]
at = "I say further that the angle of the greater segment"
kind = "carried"
helper = "Prop31.greater"
note = "What Euclid calls manifest, that near A the right angle BAC lies within the circle and so within the angle of the greater segment, is proved after the theorem, by the companion, for every straight line in the circle not through the centre, at either end; his figure is the case in which B is the far end of the diameter through C."

[[passage]]
at = "the angle contained by the circumference ABC and the straight line AC is greater"
kind = "carried"
helper = "Prop31.greater"
note = "Euclid reads the excess over the right angle from his figure. `Prop31.greater` takes B at the far end of the diameter through C (`Prop31.diameter_through`) and the right angle BAC from the first part of III.31; `Prop31.greater_gt_right` then proves the excess with `near_inside_of_angle`, which puts the right angle near A within the circle, and `near_across`, which finds whole small circles of excess, using I.12, I.17, I.19, I.20 and III.2, none referenced by Heath here."

[[passage]]
at = "Again, since the angle contained by the straight lines AC, AF is right"
kind = "carried"
helper = "Prop31.less"
note = "Likewise, that the less segment lies wholly within the right angle CAF is proved after the theorem, by the companion. The closing step beneath these sentences returns only the claims of the statement."

[[passage]]
at = "the angle contained by the straight line CA and the circumference ADC is less"
kind = "carried"
helper = "Prop31.less"
note = "Euclid reads the strict shortfall from his figure. `Prop31.less_lt_right` finds the angle CAF right, as its adjacent angle BAC is, by `Tacit.adjacent_eq_of_right` from I.13, with the right angle BAC and the diameter supplied as for the greater segment. To contain the less segment within CAF, it shows that a point within the circle on the straight line AB lies between A and B (`Tacit.between_of_inside_chord`), and so on B's side of AC: a point of the less segment on AB would be such a point on D's side, and one across AB from C would give one, for the straight line from it to C would cross AB within the circle (III.2). `Prop31.less_nearVertex` and `near_across` find whole small circles within the less segment near A, and within CAF outside the circle, using I.12, I.17, I.19, I.20 and III.2, none referenced by Heath here."

[figure]
case = "BC a diameter, with B in the greater segment ABC and D in the less segment ADC, as in Heath's figure"
note = "The figure at a glance finishes by adding the triangle's three angles. Euclid instead compares BAC with the exterior angle FAC."

