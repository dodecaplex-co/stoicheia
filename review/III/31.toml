[statement]
scope = "full"
note = "The angles in the segments, at every point; its companions, the angles of the segments at either end of any straight line in the circle not through the centre."
companions = ["III.31 greater", "III.31 less"]
fingerprint = "sha256:c3d22dab733dbafc"

[route]
kind = "euclid"

[representation]
tags = ["mixed-angles-local", "centre-given"]
note = "An angle contained by a straight line and a circumference is a mixed angle (`MixedAngle`), read as the region it opens near its vertex: the angle of a segment is the points within the circle on the segment's side of AC. It is greater than a right angle placed at A along AC, on that side, when near A the right angle lies within it with whole small circles to spare, and less the other way about; the companions prove that the named points give the angles Euclid draws (`MixedAngle.WellFormed`), and claim no addition, ratio or motion of mixed angles. A point is in the greater segment ABC when it is on B's side of AC, and in the less segment when it is on the other side. The centre E is given, as Euclid's setting-out names it."

[[passage]]
at = "and it is the angle in the segment ADC less than the semicircle"
kind = "case"
note = "Euclid shows the angle in the greater segment less than a right angle at B alone, by I.17. Our statement says it of every point of that segment, so the Lean adds a step here: with a point D of the less segment, III.22 makes the two angles together equal to two right angles, and the angle at D is greater than a right angle."

[[passage]]
at = "I say further that the angle of the greater segment"
kind = "helper"
helper = "Prop31.greater"
note = "What Euclid calls manifest, that near A the right angle BAC lies within the circle and so within the angle of the greater segment, is proved after the theorem, by the companion, for every straight line in the circle not through the centre, at either end; his figure is the case in which B is the far end of the diameter through C."

[[passage]]
at = "Again, since the angle contained by the straight lines AC, AF is right"
kind = "helper"
helper = "Prop31.less"
note = "Likewise, that the less segment lies wholly within the right angle CAF is proved after the theorem, by the companion. The `exact` beneath these sentences returns only the claims of the statement."

