[statement]
scope = "full"
note = "`Prop30` finds D, bisecting the given circumference in measure; `Prop30.halves` shows the halves congruent, adding to it, covering it and meeting only at D."
companions = ["III.30 halves"]
fingerprint = "sha256:d3f25afc0f876290"

[route]
kind = "euclid"
note = "`Prop30` follows Euclid. The companion `Prop30.halves` is handed D with III.30's conclusions alone, which keep inside the proof the equal straight lines AD, DB that I.4 gives; so it recovers them, a step Euclid does not take: the equal measures are twice the angles ABD, DAB, which are therefore equal, and DA is equal to DB [I. 6]. The halves are then III.28's less circumferences, each less than a semicircle [I. 17], and so congruent; they add to the given circumference (`Circumference.add`), and divide it point by point, ends included, by III.2."

[representation]
tags = ["segment-with-circle", "angle-measure"]
note = "The given circumference is put as a given segment is: its circle, the straight line AB and a point P on its side. Its halves are equal measures in one circle, by III.28. The companion takes them as arcs of that circle, named by points Q and R on their sides."

[[passage]]
at = "Let AB be joined and bisected at C"
kind = "helper"
helper = "BookI.Prop10"
note = "Euclid bisects AB without a printed reference here. The Lean obtains C and the equal halves AC, CB by I.10."

[[passage]]
at = "from the point C let CD be drawn at right angles"
kind = "helper"
helper = "BookI.Prop11"
note = "Euclid draws CD perpendicular to AB and reads its meeting with the given circumference from the figure; the Lean erects the perpendicular by I.11 and puts C within the circle by III.2, neither referenced by Heath here. It finds D beyond C on the required side by `Tacit.line_circle_beyond` (System E, Intersections 5), a rule we assume, and `Tacit.pasch3` (System E, Pasch 3), proved in `Elements/Figure/RuleBase.lean`."

[[passage]]
at = "and each of the circumferences AD, DB is less than a semicircle"
kind = "helper"
helper = "BookI.Prop17"
note = "Euclid takes both circumferences to be less than semicircles; the Lean uses I.17 on the equal base angles supplied by I.4 above, with no reference to I.17 printed by Heath here. `Circumference.standing` measures each circumference by twice its angle, using III.21, and `Circumference.whole` shows the circumference on the other side greater, using III.2, III.21 and III.22, none referenced by Heath here."

[[passage]]
at = "Therefore the given circumference has been bisected at the point D"
kind = "carried"
helper = "Prop30.halves"
note = "Euclid concludes that D bisects the circumference; `Prop30.halves` supplies congruence, addition and division point by point, using I.6, I.17, I.32, III.2, III.21, III.22 and III.28, none referenced by Heath at this sentence, with I.32 entering through `Circumference.add`. To exclude a point within triangle ADB or in an angle vertical to one of its angles, `Prop30.not_within` and `Prop30.not_vertical` use `Tacit.triple_incidence1` (System E, Triple incidence 1), proved in `Elements/Figure/RuleBase.lean`, `Tacit.lines_meet_of_opposite_sides` (System E, Intersection 1), `Tacit.pasch4` (System E, Pasch 4), also proved there, `Tacit.between_cases` (System E, Between 6), the proved rule `Tacit.pasch3` (System E, Pasch 3) and `Tacit.pasch2` (System E, Pasch 2), Intersection 1, Between 6 and Pasch 2 being assumed, with III.2 putting the crossing points within the circle; `Prop30.on_chord` accounts for the ends by III.2."

