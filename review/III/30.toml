[statement]
scope = "full"
note = "`Prop30` finds D, bisecting the given circumference in measure; `Prop30.halves` shows the halves congruent, adding to it, covering it and meeting only at D."
companions = ["III.30 halves"]
fingerprint = "sha256:d3f25afc0f876290"

[route]
kind = "euclid"
note = "`Prop30` follows Euclid. The companion `Prop30.halves` is handed D with III.30's conclusions alone, which keep inside the proof the equal straight lines AD, DB that I.4 gives; so it recovers them, a step Euclid does not take: the equal measures are twice the angles ABD, DAB, which are therefore equal, and DA is equal to DB (I.6). The halves are then III.28's less circumferences, each less than a semicircle (I.17), and so congruent; they add to the given circumference (`Circumference.add`), and divide it point by point, ends included, by III.2."

[representation]
tags = ["segment-with-circle", "angle-measure"]
note = "The given circumference is put as a given segment is: its circle, the straight line AB and a point P on its side. Its halves are equal measures in one circle, by III.28. The companion takes each half as a circumference of that circle (`Arc`), named by points Q and R on their sides."

[[passage]]
at = "Let AB be joined and bisected at C"
kind = "helper"
helper = "BookI.Prop10"
note = "Euclid bisects AB without a printed reference here. The Lean obtains C and the equal halves AC, CB by I.10."

[[passage]]
at = "from the point C let CD be drawn at right angles"
kind = "helper"
helper = "BookI.Prop11"
note = "Euclid draws CD perpendicular to AB and reads its meeting with the given circumference from the figure. The Lean draws the perpendicular by I.11 and puts C within the circle by III.2, neither referenced by Heath here. `Tacit.line_circle_beyond`, a rule we assume, finds D beyond C, and `Tacit.pasch3` puts it on the required side."

[[passage]]
at = "and each of the circumferences AD, DB is less than a semicircle"
kind = "helper"
helper = "BookI.Prop17"
note = "Euclid takes both circumferences to be less than semicircles; the Lean uses I.17 on the equal base angles supplied by I.4 above, with no reference to I.17 printed by Heath here. `Circumference.standing` measures each circumference by twice its angle, using III.21, and `Circumference.whole` shows the circumference on the other side greater, using III.2, III.21 and III.22, none referenced by Heath here."

[[passage]]
at = "Therefore the given circumference has been bisected at the point D"
kind = "carried"
helper = "Prop30.halves"
note = "`Prop30.halves` supplies congruence by III.28 and addition by `Circumference.add`. For the division point by point, `Prop30.not_within` and `Prop30.not_vertical` exclude a point of the circle within triangle ADB or in an angle vertical to one of its angles: III.2 would put a point of the circumference within the circle. `Prop30.on_chord` accounts for the ends, also by III.2. Thus the halves cover the given circumference and share only D, ends included."

