# review/III/15.toml
[statement]
scope = "full"
note = "E and the feet are given. `Prop15.le_diameter` bounds any straight line; `Prop15.nearer` compares any two, a diameter at no distance; `Prop15` keeps the figure."
companions = ["III.15 le_diameter", "III.15 nearer"]
fingerprint = "sha256:c0f5cead6405c5bd"

[route]
kind = "euclid"
note = "`Prop15.le_diameter` uses Euclid's step [I. 20], two sides of a triangle together greater than the third, when BC does not pass through E, and treats diameters and coincident endpoints separately. `Prop15.nearer` takes two straight lines not through the centre from `Prop15`, by his argument [III. 14, I. 24], and a nearer diameter from `Prop15.le_diameter`. `Prop15` and `Prop15.nearer` rest on `Tacit.exists_centre` through III.14 and III.2; `Prop15.le_diameter` does not. The centre E and the perpendiculars EH, EK are given, since Definition III.5 measures from them, and \"nearer\" is `‖E H‖ < ‖E K‖`. The companion `Prop15.nearer` is given the feet as `Foot`, the foot of the perpendicular, which is E itself for a straight line through E, so that the nearer may be a diameter, at no distance. Euclid shows AD greater than BC through MN, beside the more remote FG, and `Prop15` keeps his figure. `Prop15.le_diameter` bounds every BC by AD without MN: if BC does not pass through E, BE and EC together exceed BC [I. 20]; if E lies between B and C, BC equals AD; if B and C coincide, BC has length zero. Euclid's nearer straight line BC is not through the centre. `Prop15.nearer` lets it be a diameter, at no distance, and `Prop15.le_diameter` then makes FG the less, since FG, more remote, cannot pass through the centre."

[[passage]]
at = "For from the centre E let EH, EK be drawn"
kind = "helper"
helper = "foot_between"
note = "The statement supplies EH and EK; `foot_between` supplies the order F, K, G that Euclid reads from the figure. Its proof uses I.17 and I.19, for which Heath prints no reference here, and then `Tacit.between_of_inside_chord`, the rule we assume as System E, Circle 1."

[[passage]]
at = "Then, since BC is nearer to the centre and FG more remote"
kind = "given"
note = "The statement assumes that EH is less than EK (`‖E H‖ < ‖E K‖`), for Definition III.5 is how it says that BC is nearer; no Lean is needed beneath."

[[passage]]
at = "Let EL be made equal to EH"
kind = "helper"
helper = "Tacit.line_circle_beyond"
note = "Euclid cuts off EL and takes the perpendicular through L to meet the circle at M and N; Heath prints no reference here for I.3, I.11 or III.2, which the Lean uses to cut off EL, draw the perpendicular and put K and L within the circle. `Tacit.line_circle_beyond`, the rule we assume as System E, Intersections 5, supplies both meetings, and `Prop15.perp` extends the right angle to both directions along MN by I.13."

[[passage]]
at = "Again, since AE is equal to EM, and ED to EN"
kind = "helper"
helper = "Definition15"
note = "Euclid uses the equality of the radii AE and EM, and ED and EN, without giving a reason. The Lean obtains both equalities from `Definition15`, Euclid's definition of a circle, which we assume as a rule."

[[passage]]
at = "AD is equal to ME, EN"
kind = "helper"
helper = "Tacit.len_add_of_between"
note = "Euclid makes the diameter AD from the radii AE and ED. The Lean adds them by `Tacit.len_add_of_between`, the rule we assume as System E, Diagram-segment 1, and replaces them by the equal radii ME and EN."

[[passage]]
at = "And, since the two sides ME, EN are equal"
kind = "helper"
helper = "Definition15"
note = "Euclid uses the equality of the radii ME and FE, and EN and EG, without giving a reason. The Lean obtains both equalities from `Definition15`, Euclid's definition of a circle, which we assume as a rule."

[[passage]]
at = "and the angle MEN greater than the angle FEG"
kind = "helper"
helper = "Prop15.half"
note = "Euclid reads the larger angle from the figure; Heath prints no reference here. The Lean uses I.13 and I.17 to prove MN and FG cannot meet, then `Prop15.half` twice, using the placements made during construction and III.2 to put the crossings of EF and EG between M and L and between N and L, and adds the two angle inequalities."

[figure]
case = "AD a diameter, neither BC nor FG through E, and EH less than EK"

