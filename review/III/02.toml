# review/III/02.toml
[statement]
scope = "full"
note = "Every point strictly between two points of the circle is within it, AB through the centre included, which Euclid's figure leaves aside."
fingerprint = "sha256:58a8fb1c86c1c4a0"

[route]
kind = "euclid"

[representation]
tags = ["centre-given"]
note = "The circle comes with a centre (`∃ D, Centre D ABC`), which the proof takes by III.1, as Euclid does."

[overlap]
rule = "Tacit.inside_of_between"
note = "System E's Circle 2 contains III.2. The Lean of III.2 never calls the rule, but rests on it through III.1, so it reconstructs Euclid's reasoning within our foundations and does not establish the rule."

[[passage]]
at = "For suppose it does not, but, if possible, let it fall outside"
kind = "grouped"
note = "That DE is less than DB does not need the supposition, so the Lean proves it first, and then refutes \"outside\" and \"on the circumference\" each by that one comparison."

[[passage]]
at = "Then, since DA is equal to DB"
kind = "case"
helper = "Prop2.through_centre"
note = "Euclid's figure keeps the centre D off AB. When AB passes through D there are no triangles DAE and DEB, and `Prop2.through_centre` shows DE less than DB directly: DE is part of DA or of DB, which are equal."

[review]
stage = "exceptions"
commit = "8ff656b"
reviewer = "Claude Opus 5.5"
lean = "sha256:6b6b3ba8e21df612"
