# review/III/02.toml
[statement]
scope = "full"
note = "Every point strictly between two points of the circle is within it, AB through the centre included, which Euclid's figure leaves aside."
fingerprint = "sha256:a05b6db601f15015"

[route]
kind = "euclid"

[overlap]
rule = "Tacit.outside_of_between"
kind = "gives"
note = "System E's Circle 3 (`Tacit.outside_of_between`) gives III.2 at once: if a point between A and B were not within the circle, B would be outside it, contrary to B being on it. Circle 2 (`Tacit.inside_of_between`) is now proved from Circle 3 in `Elements/Figure/Circles.lean`. Our III.2 uses neither that theorem nor Circle 3: it follows Euclid through I.5, I.16 and I.19, and III.1, from which it takes its centre, puts its own middle point within the circle by the same argument."

[[passage]]
at = "For suppose it does not, but, if possible, let it fall outside"
kind = "grouped"
note = "That DE is less than DB does not need the supposition, so the Lean proves it first, and then refutes \"outside\" and \"on the circumference\" each by that one comparison."

[[passage]]
at = "and let DFE be drawn through"
kind = "helper"
helper = "Tacit.line_circle_between"
note = "Euclid draws DFE through the circle, taking F between D and the supposed outside point E. The Lean obtains F after proving DE less than DB, using `Tacit.centre_inside` (System E, Generalities 3) and `Tacit.line_circle_between` (System E, Intersections 4), both rules we assume."

[[passage]]
at = "Then, since DA is equal to DB"
kind = "case"
helper = "Prop2.through_centre"
note = "Euclid's figure keeps the centre D off AB. When AB passes through D there are no triangles DAE and DEB, and `Prop2.through_centre` shows DE less than DB directly: if E is D, DE has length zero and DB a positive length; otherwise DE is part of DA or of DB, which are equal."

[[passage]]
at = "But DB is equal to DF"
kind = "helper"
helper = "Definition15"
note = "Euclid uses equal radii here and in DA = DB without a reference from Heath. The Lean obtains both equalities from `Definition15`, Euclid's definition of a circle, which we assume as a rule."

[[passage]]
at = "the less than the greater"
kind = "helper"
helper = "len_lt_of_between"
note = "Euclid treats DF as less than DE because F lies between D and E. The Lean proves this by `len_lt_of_between`, adding DF and FE to make DE and applying Common Notion 5, so DF cannot also be greater than DE."

[[passage]]
at = "Similarly we can prove that neither will it fall on the circumference itself"
kind = "grouped"
note = "Euclid repeats the contradiction for a point on the circumference. The Lean reuses the comparison DE less than DB already proved, while `Definition15`, the assumed rule for equal radii, would make DE equal to DB."

[figure]
case = "the centre D off AB, as in Heath's figure"
note = "Like Heath's, this figure draws the impossible supposition: the straight line AEB falling outside the circle, and so drawn bent, since no straight line can."

