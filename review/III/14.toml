# review/III/14.toml
[statement]
scope = "full"
note = "E and feet F, G are given. `Prop14.general` takes any two straight lines, a diameter at no distance; `Prop14` keeps two not through E."
companions = ["III.14 general"]
fingerprint = "sha256:ce986697315c50ff"

[route]
kind = "euclid"
note = "`Prop14.general` uses `Prop14` for two straight lines not through the centre. A diameter is two radii together (`Prop14.diameter_sum`), with its foot at the centre: two diameters are equal and both at no distance. When only one straight line is a diameter, I.20 makes it greater than the other, whose foot is at some distance from the centre."

[[passage]]
at = "For let the centre of the circle ABDC be taken"
kind = "given"
note = "The centre E and the feet F, G of the perpendiculars are given, since Definition III.4 measures from them; Heath's reference here is III.1, but with E given a call of III.1 would do no work, and the proof takes no centre. The companion is given the feet as `Foot`, the foot of the perpendicular, which is E itself for a straight line through E, so that a diameter is at no distance from the centre (Definition III.4, extended to that case). Neither `Prop14` nor `Prop14.general` takes a centre itself; both rest on `Tacit.exists_centre`, `Prop14` through `foot_between`, whose Circle 1 is now proved from III.2 and `Tacit.inside_not_on` (Generalities 4): the latter takes its centre from that rule, and III.2 takes its centre by III.1's construction (`Prop1.of_circle`), which rests on the rule too; and `Prop14.general` through `Prop14`, which it cites."

[[passage]]
at = "from E let EF, EG be drawn"
kind = "helper"
helper = "foot_between"
note = "Euclid takes the perpendiculars to meet AB and CD between their ends. The statement supplies the perpendiculars, and `foot_between` proves their feet lie between the ends by I.17 and I.19, for which Heath prints no reference here, followed by `Tacit.between_of_inside_chord`, System E's Circle 1, which is proved from III.2, so that the proof cites III.2 through it."

[[passage]]
at = "therefore AB is double of AF"
kind = "helper"
helper = "Tacit.len_add_of_between"
note = "Euclid makes AB from its two equal halves. The Lean adds AF and FB by `Tacit.len_add_of_between`, the rule we assume as System E, Diagram-segment 1, and substitutes AF for FB."

[[passage]]
at = "CD is also double of CG"
kind = "helper"
helper = "Tacit.len_add_of_between"
note = "Euclid makes CD from its two equal halves. The Lean adds CG and GD by `Tacit.len_add_of_between`, the rule we assume as System E, Diagram-segment 1, and substitutes CG for GD."

[[passage]]
at = "and AB is equal to CD"
kind = "given"
note = "AB equal to CD is the assumption of the statement's forward implication; its converse assumes EF equal to EG."

[[passage]]
at = "therefore AF is also equal to CG"
kind = "helper"
helper = "Magnitude.eq_of_add_self_eq"
note = "Euclid infers that the halves of equal straight lines are equal. The Lean uses `Magnitude.eq_of_add_self_eq`, which proves that equal doubles have equal halves by comparing the two possible strict inequalities."

[[passage]]
at = "And, since AE is equal to EC"
kind = "helper"
helper = "Definition15"
note = "Euclid uses the equality of the radii AE and EC without giving a reason. The Lean obtains it from `Definition15`, Euclid's definition of a circle, which we assume as a rule."

[[passage]]
at = "therefore EF is equal to EG"
kind = "helper"
helper = "BookI.Prop46.sq"
note = "Euclid passes from equal squares to equal straight lines without a reference in Heath. The Lean uses `BookI.Prop46.sq`, which describes the squares by I.46 and applies `BookI.Prop46.side_eq` to their equal areas."

[[passage]]
at = "But in a circle straight lines are said to be equally distant from the centre"
kind = "carried"
note = "Definition III.4 is how the statement says \"equally distant\": its conclusion is that EF is equal to EG, which the Lean above has proved."

[[passage]]
at = "Next, let the straight lines AB, CD be equally distant from the centre"
kind = "grouped"
note = "The converse needs no Lean of its own until \"And, since AE is equal to CE\": the halves, AB double of AF and CD of CG, were found once, before the two directions part."

[[passage]]
at = "And, since AE is equal to CE"
kind = "helper"
helper = "Definition15"
note = "Euclid again uses the equality of two radii without giving a reason. The Lean obtains AE equal to CE from `Definition15`, Euclid's definition of a circle, which we assume as a rule."

[[passage]]
at = "therefore AF is equal to CG"
kind = "helper"
helper = "BookI.Prop46.sq"
note = "Euclid again passes from equal squares to equal straight lines without a reference in Heath. The Lean applies `BookI.Prop46.sq`, using I.46 and `BookI.Prop46.side_eq` to obtain AF equal to CG."

[[passage]]
at = "And AB is double of AF, and CD double of CG"
kind = "grouped"
note = "Euclid recalls the two doublings and concludes that AB equals CD. The Lean proved both doublings before the two directions parted; here it adds AF equal to CG to itself by Common Notion 2 and then replaces the doubles by AB and CD."

[figure]
case = "two equal straight lines AB and CD, neither through E"

