[representation]
tags = ["centre-given", "hypothesis-dropped"]
note = "Both circles come with centres, so the porism to III.1 puts each centre on both perpendiculars. That the circles cut is not asked, only three common points, of the four Euclid names."

[[passage]]
at = "therefore the point P is the centre of the circle ABC"
kind = "grouped"
note = "The statement gives ABC its centre, which the Lean names P at once; that AC and NO meet only there is the step above, so this sentence needs no Lean of its own."

[figure]
note = "Like Heath's, this figure draws the impossible supposition: DEF meeting ABC at four points, B, G, F, H, and so drawn as an oval, since no second circle can."

