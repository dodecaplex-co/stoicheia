[[passage]]
at = "let the centre of the circle ABCD be taken"
kind = "helper"
helper = "Prop1.of_circle"
note = "Euclid takes the centre F by III.1 (Heath's reference), and so does the Lean: `Prop1.of_circle` takes two points of the circle, the ends of a straight line drawn through it at random, and runs III.1 on them, its construction and its proof that the point found is the centre; the proof keeps the centre alone, as Euclid does. \"Not through the centre\", said of every centre, puts F off AC and BD, so that FE can be joined."

[[passage]]
at = "therefore the angle FEA is equal to the angle FEB"
kind = "case"
note = "If B is on A's side of FE, the equal right angles put B on EA; otherwise D is on that side and the angle FED is right, so the same argument puts D on EA. Either would make BD and AC one straight line."

[[passage]]
at = "which is impossible."
kind = "helper"
helper = "onRay_of_angle_eq"
note = "Euclid rejects equal angles when one is part of the other; `onRay_of_angle_eq` proves, by angle addition and Common Notion 5, that equal angles on the same side of FE put their other arms on one ray. The Lean places B or D on A's side using `Tacit.pasch3` (System E, Pasch 3), proved in `Elements/Figure/RuleBase.lean`, and `same_side_of_opposite_sides`, then the assumed rule `Tacit.line_unique` (System E, Generalities 1) would make AC and BD one straight line."

[[passage]]
at = "Therefore AC, BD do not bisect one another."
kind = "grouped"
note = "The reductio's conclusion. The Lean supposed the bisection at the start and has reached the contradiction above, which proves it."

[figure]
case = "B on A's side of FE, as in Heath's figure"
note = "Like Heath's, Euclid's figure accompanies the impossible supposition that AC and BD bisect one another; the drawn halves are unequal. At a glance, AC is bisected and D lies on A's side of FE, the other case of the proof."

