[[passage]]
at = "For, if the triangle ABC be applied to the triangle DEF"
kind = "helper"
helper = "Tacit.superposition"
note = "Postulate 1 names DE and DF before the hypothetical placement, with F off DE. `Tacit.superposition` admits a derivation over symbols for ABC laid along DE on F's side, keeping its sides, angles and laid-down side AC; only four equalities about ABC and DEF leave it."

[[passage]]
at = "then the point B will also coincide with E"
kind = "helper"
helper = "Superposition.Derives.ray_unique"
note = "Inside the hypothetical placement, `Superposition.Derives.ray_unique` makes B' coincide with E because DB' equals DE on the ray from D through E. Its cited law is proved by `OnRay.eq_of_len_eq`, which rules out a point short of E or beyond it."

[[passage]]
at = "the straight line AC will also coincide with DF"
kind = "helper"
helper = "Superposition.Derives.ray_of_angle"
note = "The equal angles put C' on DF by `Superposition.Derives.ray_of_angle`, whose law names all three straight lines; the placement supplies the third, the side through D and C', so the step draws no line. `Superposition.Derives.ray_of_angle_side` puts C' on F's side of D without that third straight line, the side laid down: its law is Pasch 3, which Book Zero proves with a construction, joining C' to a point of DE. Neither step draws a line inside the placement: citing a proved law draws nothing there, whatever its proof draws."

[[passage]]
at = "hence the point C will also coincide with the point F"
kind = "helper"
helper = "Superposition.Derives.ray_unique"
note = "The kept length DC' equals AC and hence DF. `Superposition.Derives.ray_unique` therefore makes C' coincide with F on the ray from D through F."

[[passage]]
at = "But B also coincided with E"
kind = "grouped"
note = "The two coincidences are already proved inside the placement. The base equality is derived beneath the sentence following the bracketed scholium, by substituting E and F for B' and C' in the kept base length."

[[passage]]
at = "For if, when B coincides with E and C with F"
kind = "given"
note = "Heiberg brackets this as an early scholium. A finite straight line enters our Lean only through its two ends, so once B is on E and C on F the base is EF, with no second one for the scholium to rule out."

[[passage]]
at = "Thus the whole triangle ABC will coincide with the whole triangle DEF"
kind = "helper"
helper = "Superposition.Derives.area_of_congruent"
note = "Inside the placement, `Superposition.Derives.area_congr` identifies the area of DB'C' with that of DEF from the corner coincidences. Euclid's coincidence takes the triangle laid down to be ABC itself; beneath the next sentence the Lean makes it ABC's equal by Metric 9 (`Tacit.area_congruent`), which `Superposition.Derives.area_of_congruent` cites with the kept sides and angles: triangles equal in all their sides and angles are equal in area. So Euclid's step from coincidence to equality rests here in part on a rule that would give I.4's area clause at once, applied to ABC and DEF once their remaining sides and angles were proved; [the overlap catalogue](../../docs/reports/overlaps.md#near-misses) records it among its near misses."

[[passage]]
at = "And the remaining angles will also coincide with the remaining angles"
kind = "grouped"
note = "The two remaining angle equalities follow inside the placement from the kept angles and the corner coincidences, with Metric 4 reversing the arms where needed. The restricted rule then exports these two equalities together with the base and area equalities, one application for each."

[figure]
note = "Heath's figure also draws the base bent below EF, the impossible case of two straight lines enclosing a space; ours leaves it out."

