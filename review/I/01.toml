kind = "helper"
helper = "Prop1.figure"
note = "Euclid takes ABC to be a triangle once its sides are equal. `Prop1.figure` proves that C is off AB, since three distinct points on one straight line with all three distances equal would make a nonzero length equal to itself taken twice."

