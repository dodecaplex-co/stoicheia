[[passage]]
at = "I say that the base BC is also greater than the base EF"
kind = "case"
note = "Robert Simson's added words make Euclid's figure the only one: \"Of the two sides DE, DF let DE be the side which is not greater than the other\" (Heath, vol. 1, p. 297). The Lean proves Euclid's argument under those words, for any two triangles so named, and when DE is greater than DF applies it with B and C, E and F exchanged, under which the statement reads the same (`angle_symm`, `len_symm`)."

[[passage]]
at = "let DG be made equal to either of the two straight lines AC, DF"
kind = "helper"
helper = "Prop24.within"
note = "Euclid places G on the new arm with DG equal to DF; the Lean sets this length with `OnRay.exists_len_eq` and keeps G on F's side of DE with `SameSideOf.of_onRay`. The Lean uses `Prop24.within` to justify Euclid's placing of F within the angle EDG: the joins have distinct ends, DFG is a triangle for I.5, and `Prop24.below` can use `crossbar` to find H, where DF, produced if need be, meets EG."

[[passage]]
at = "the angle DGF is also equal to the angle DFG"
kind = "helper"
helper = "Prop24.below"
note = "Euclid's figure has F below EG, and his next two comparisons need it there. With DE not greater than DF, which is DG, `Prop24.below` proves it by the lemma Heath gives, by the method of Christoph Friedrich Pfleiderer, Dionysius Lardner and Isaac Todhunter (vol. 1, p. 298): DF meets EG at H, and I.16, I.18 (I.5 when DE equals DG) and I.19 make DH less than DG, which is DF, so H lies between D and F."

[[passage]]
at = "therefore the angle DFG is greater than the angle EGF"
kind = "helper"
helper = "angle_lt_of_between"
note = "Euclid reads EGF as part of DGF, which equals DFG. `Prop24.below` puts H, where DF crosses EG, between D and F; `angle_lt_of_between` makes HGF less than DGF, and the shared ray GE identifies HGF with EGF."

[[passage]]
at = "Therefore the angle EFG is much greater than the angle EGF"
kind = "helper"
helper = "angle_lt_of_between"
note = "Euclid reads DFG as part of EFG. Since H lies between E and G, `angle_lt_of_between` makes HFG less than EFG; the shared ray FD identifies HFG with DFG, and the preceding comparison gives EGF less than EFG."

[figure]
