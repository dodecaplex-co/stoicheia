kind = "helper"
helper = "Tacit.line_meets_circle_of_inside"
note = "Euclid takes the circle's crossings E and G with AB for granted. After choosing D by `exists_oppositeSidesOf` and drawing the circle by Postulate 3, `OppositeSides.exists_between` finds X on AB between C and D; `InsideCircle.of_between_centre` puts X inside by the radius comparison, and the assumed `Tacit.line_meets_circle_of_inside` (System E, Intersection 3) supplies E and G."

[[passage]]
at = "and let the straight lines CG, CH, CE be joined"
kind = "given"
note = "Euclid joins CG, CH and CE; our triangles are named by their corners, so no separate straight lines are needed. The Lean checks that HGC and HEC are triangles by `Triangle.of_line`, since H, G and E lie on AB and C is off it."

[[passage]]
at = "and the base CG is equal to the base CE"
kind = "helper"
helper = "Definition15"
note = "Euclid uses the equal radii CG and CE without naming a reason. The Lean applies `Definition15`, Euclid's definition of a circle, as a rule we assume."

[[passage]]
at = "Therefore CH has been drawn perpendicular to the given infinite straight line AB"
kind = "helper"
helper = "OnRay.cases_of_between"
note = "Euclid concludes that CH is perpendicular to AB from the two right angles at H. For every other point P of AB, `OnRay.cases_of_between` puts P on the ray from H through G or E, and `angle_onRay_right` carries the corresponding right angle to CHP."

