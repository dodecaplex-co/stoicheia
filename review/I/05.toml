# review/I/05.toml
[statement]
scope = "full"
note = "Both clauses are stated with the equal sides already produced to D and E, as Euclid produces them by Postulate 2; every isosceles triangle has such points."
fingerprint = "sha256:f7865a393037e43d"

[route]
kind = "euclid"

[representation]
tags = ["hypothesis-dropped"]
note = "Definition I.20 distinguishes isosceles from equilateral triangles. The Lean assumes only AB = AC, so it proves both conclusions for equilateral triangles as well."

[[passage]]
at = "and let the straight lines BD, CE be produced further"
kind = "given"
note = "D and E come with the statement, already produced, so the Lean draws only AB and AC here and does not use Postulate 2; `Prop5.base` produces them for the propositions that cite only the angles at the base."

[[passage]]
at = "Let a point F be taken at random on BD"
kind = "helper"
helper = "exists_between_nearer"
note = "Euclid assumes he can find F on BD near enough to B that AF remains less than AE. The Lean applies `exists_between_nearer` to AB = AC < AE, using `len_lt_of_between` for C between A and E, and obtains F between B and D with AF < AE; it then derives the order A, B, F by `between_cut` and puts F on AB by `Tacit.on_line_of_between`, a rule we assume (System E, Between 2)."

[[passage]]
at = "and let the straight lines FC, GB be joined"
kind = "given"
note = "FC and GB are represented by their endpoints in the lengths and angles; no separate straight lines are constructed. The Lean beneath proves F ≠ C and G ≠ B for the later angle identities."

[[passage]]
at = "and they contain a common angle"
kind = "helper"
helper = "OnRay.between_of_len_lt"
note = "Euclid reads B between A and F and C between A and G from the figure, giving the triangles the same angle at A. The Lean uses `Tacit.ne_of_between` (System E, Between 1) and `Tacit.len_add_of_between` (System E, Diagram-segment 1), rules we assume, with `len_pos` and `CommonNotion5` to show AB is less than AF; after substituting AC for AB and AG for AF, `OnRay.of_between` and `OnRay.between_of_len_lt` put C between A and G, and `OnRay.of_beyond` with `angle_onRay_left` identifies the angles."

[[passage]]
at = "And, since the whole AF is equal to the whole AG"
kind = "helper"
helper = "Tacit.len_add_of_between"
note = "Euclid subtracts equal AB and AC from equal AF and AG. `Tacit.len_add_of_between`, a rule we assume (System E, Diagram-segment 1), writes AF as AB + BF and AG as AC + CG, using the point order established before the first application of I.4."

[[passage]]
at = "while the base BC is common to them"
kind = "given"
note = "BC is one straight line, the base of both triangles, so nothing is proved here; I.4, applied next, takes only the two sides and the angle between them."

[[passage]]
at = "Accordingly, since the whole angle ABG was proved equal to the angle ACF"
kind = "helper"
helper = "angle_add_of_between"
note = "Euclid reads ABG as ABC and CBG together, and ACF as ACB and BCF together. The Lean proves both sums by `angle_add_of_between`, using C between A and G and B between A and F, established before the first application of I.4."

[[passage]]
at = "and they are under the base"
kind = "helper"
helper = "between_inner"
note = "Euclid identifies FBC and GCB with the angles under the base. The Lean uses `between_inner` to put G between C and E, then `angle_onRay_left` and angle symmetry identify those angles with CBD and BCE."

