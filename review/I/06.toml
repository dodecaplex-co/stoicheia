[[passage]]
at = "For, if AB is unequal to AC"
kind = "helper"
helper = "Tacit.lt_trichotomy"
note = "Euclid takes for granted that one of two unequal lengths is greater; the Lean uses `Tacit.lt_trichotomy`, a tacit rule of magnitude, which we assume (System E §3.5)."

[[passage]]
at = "Let AB be greater"
kind = "case"
note = "Euclid supposes AB greater; the Lean also rules out AC greater by applying the same argument with B and C exchanged."

[[passage]]
at = "and from AB the greater let DB be cut off"
kind = "helper"
helper = "Prop3"
note = "Euclid cuts DB from the end B of AB; the Lean uses I.3 (`Prop3`), for which Heath gives no reference here."

[[passage]]
at = "let DC be joined"
kind = "given"
note = "Our triangle DBC is named by its corners, so no straight line DC is drawn: the proof uses only the points D and C."

[[passage]]
at = "therefore the base DC is equal to the base AB"
kind = "grouped"
helper = "Prop4"
note = "Euclid obtains the equal base and the equal triangle from the two sides and their included angle. The Lean first shows that DBC is a triangle by `Prop6.figure`, then applies I.4 (`Prop4`), for which Heath gives no reference here, once for both conclusions. Neither his proof nor ours uses the equal base DC and AB again: the absurdity comes from the equal triangles alone."
unused = ["hDC_AB"]

[[passage]]
at = "the less to the greater"
kind = "helper"
helper = "Prop6.less"
note = "Euclid takes for granted that DBC is less than ACB; the Lean proves it with areas, the whole triangle being greater than its part."

[figure]
case = "DB cut off from AB, for the supposition that AB is greater than AC, as in Heath's figure"
note = "Like Heath's, this figure is drawn for Euclid's impossible supposition, but keeps the angles at B and C equal, so AB and AC are drawn equal: D stands on AB, and DB, supposed equal to AC, is drawn shorter."

