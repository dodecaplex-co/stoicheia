# review/I/30.toml
# `hC : ¬ Collinear A B C` says only that AB and CD are two straight lines, which
# Euclid's words presuppose.
[statement]
scope = "full"
fingerprint = "sha256:ac0ec095401a8c5e"

[route]
kind = "euclid"

[[passage]]
at = "I say that AB is also parallel to CD"
kind = "case"
note = "Euclid's GK crosses EF, as in his figure. When EF lies outside AB and CD it need not, and that case rests on `Prop30.unique`: two straight lines through one point, each parallel to EF, are one (from I.29)."

[[passage]]
at = "For let the straight line GK fall upon them"
kind = "helper"
helper = "OppositeSides.exists_between"
note = "Euclid draws GK through H on EF; `OppositeSides.exists_between` supplies that meeting point between G and K when EF separates them. The Lean takes F on EF off GK and produces FH to E, so E and F lie on opposite sides of GK; `Prop30.point_on_side` then puts A on E's side and D on F's side of GK, before the Lean produces AG to B and DK to C."

[[passage]]
at = "and they are alternate"
kind = "helper"
helper = "SameSideOf.trans_opposite"
note = "Euclid reads the angles AGK and GKD as alternate. `SameSideOf.trans_opposite` puts A and D on opposite sides of GK from the constructed facts that A and F lie on opposite sides of GK and D is on F's side of GK."

[[passage]]
at = "Therefore AB is parallel to CD"
kind = "helper"
helper = "Prop27"
note = "Euclid concludes parallelism from the equal alternate angles; the Lean applies I.27 (`Prop27`), for which Heath prints no reference here."

[figure]
case = "EF between AB and CD, so that GK crosses it, as in Heath's figure"

