# review/I/30.toml
# `hC : ¬ Collinear A B C` says only that AB and CD are two straight lines, which
# Euclid's words presuppose.
[statement]
scope = "full"
fingerprint = "sha256:ac0ec095401a8c5e"

[route]
kind = "euclid"

[[passage]]
at = "I say that AB is also parallel to CD"
kind = "case"
note = "Euclid's GK crosses EF, as in his figure. When EF lies outside AB and CD, a straight line GH from AB to EF meets CD at K, by `Prop30.unique` (from I.29), and the Lean runs Euclid's chase on it, by I.29, Common Notion 1 and I.27, with CD or AB in the middle."

[[passage]]
at = "For let the straight line GK fall upon them"
kind = "helper"
helper = "OppositeSides.exists_between"
note = "Euclid reads from his figure that GK meets EF at H, between G and K; `OppositeSides.exists_between` supplies this point when EF separates G and K. The Lean chooses A, B, C, D, E and F afresh on the given straight lines, since the conclusion concerns whole lines: it takes F on EF off GK and produces FH to E, putting E and F on opposite sides of GK, uses `Prop30.point_on_side` to put A on AB on E's side and D on CD on F's side of GK, then produces AG to B and DK to C."

[[passage]]
at = "and they are alternate"
kind = "helper"
helper = "SameSideOf.trans_opposite"
note = "Euclid reads the angles AGK and GKD as alternate. `SameSideOf.trans_opposite` puts A and D on opposite sides of GK from the constructed facts that A and F lie on opposite sides of GK and D is on F's side of GK."

[[passage]]
at = "Therefore AB is parallel to CD"
kind = "helper"
helper = "Prop27"
note = "Euclid concludes parallelism from the equal alternate angles; the Lean applies I.27 (`Prop27`), for which Heath gives no reference here."

[figure]
case = "EF between AB and CD, so that GK crosses it, as in Heath's figure"

