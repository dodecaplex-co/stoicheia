# review/I/23.toml
[statement]
scope = "full"
note = "The angle FAG is built with G on the ray from A through B and F on the side of AB where a given point P lies, as I.24, I.31 and I.42 need."
fingerprint = "sha256:a0045621afc2f9d1"

[route]
kind = "euclid"

[overlap]
rule = "Tacit.superposition"
note = "Superposition lays the triangle DCE down at A, along AB and on P's side, and so supplies I.23's step; a proof from the rules alone takes eight. Our proof is Euclid's, by I.22 and I.8; it rests on the rule through I.8, and does not establish it."

[[passage]]
at = "thus it is required to construct on the given straight line AB"
kind = "given"
note = "The statement gives the task: an angle FAG equal to the angle DCE, with G on the ray from A through B and F on P's side of AB."

[[passage]]
at = "On the straight lines CD, CE respectively let the points D, E be taken at random"
kind = "given"
note = "The statement names a point on each arm, D on CD and E on CE, and we take those; any others would serve, for an angle depends only on its two rays."

[[passage]]
at = "let DE be joined"
kind = "given"
note = "Our triangle DCE is named by its corners, so no straight line DE is drawn; its three sides are the three straight lines that I.22 takes."

