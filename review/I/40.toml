# review/I/40.toml
[statement]
scope = "full"
note = "`Prop40.general` takes equal bases anywhere on one straight line, `Prop40.join` gives AD parallel to the bases' line; `Prop40` keeps BC, CE end to end."
companions = ["I.40 general", "I.40 join", "I.40 special"]
fingerprint = "sha256:52e7cf8ad9eff8f3"

[route]
kind = "euclid"
note = "Heath prints the whole proposition in brackets, as an interpolation (vol. 1, p. 338). The proof follows I.39's reductio with I.38 for I.37: assuming AD is not parallel to BE makes F distinct from D, and either order on CD contradicts equal areas. `Prop40.general` follows the same reductio for equal bases anywhere on one straight line, including coincident vertices."

[[passage]]
at = "I say that they are also in the same parallels"
kind = "given"
note = "The statement gives the goal, AD parallel to BE. The distinct vertices A and D name AD; its parallelism remains to be proved, so nothing is drawn here."

[[passage]]
at = "For, if not, let AF be drawn through A parallel to BE"
kind = "helper"
helper = "Prop30.meet"
note = "Euclid draws AF parallel to BE and takes its meeting with CD at F from the figure. The Lean draws the parallel by I.31 (`Prop31.line`) and proves the meeting by I.30 (`Prop30.meet`). The formal proof does not need Euclid's join of FE: FE is named by its ends, as a side of the triangle FCE, so the Lean draws nothing for it and does not call Postulate 1."

[[passage]]
at = "But the triangle ABC is equal to the triangle DCE"
kind = "case"
note = "If F lies between C and D, FCE is less than DCE; if F lies beyond D, DCE is less than FCE. Both contradict the equal areas, and the same-side condition excludes the opposite ray."

[[passage]]
at = "Therefore AF is not parallel to BE"
kind = "grouped"
note = "The preceding contradiction rules out the supposed parallel through A meeting CD away from D."

[[passage]]
at = "Similarly we can prove that neither is any other straight line except AD"
kind = "grouped"
note = "The same reductio excludes any proposed parallel through A meeting CD away from D, in either order, so AD is parallel to BE; the closing sentences need no Lean of their own."

[figure]
case = "the bases BC and CE meeting at C, with F on CD between C and D, as in Heath's figure"
note = "Heath draws AD level and AF sloping; our drawing puts AF level, as the proof supposes. Like Heath's, this figure draws Euclid's impossible supposition: AF parallel to BE with F strictly between C and D, while the triangles ABC and DCE on equal bases BC and CE are assumed equal in area. Their drawn areas are unequal."

