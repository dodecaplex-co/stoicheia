# review/I/40.toml
[statement]
scope = "restricted"
hypotheses = [
  "the bases BC and CE meet at C (`hBCE : Between B C E`)",
  "the vertices A and D are different points (`hAD : A ≠ D`), so that AD is a straight line; Euclid's words also admit two triangles sharing their vertex, as ABC and ACE",
]
note = "Proved for equal bases that meet end to end, as BC and CE, with A and D different points; Euclid's bases may lie anywhere on one straight line."
short = "bases that meet end to end, and A and D apart"
fingerprint = "sha256:5ea666d96871b7f8"

[route]
kind = "modified"
note = "Heath prints the whole proposition in brackets, as an interpolation (vol. 1, p. 338). It is I.39's argument with I.38 for I.37, and the Lean makes its end direct, as in I.39."

[representation]
tags = ["adjacent-bases"]

[[passage]]
at = "I say that they are also in the same parallels"
kind = "given"
note = "The statement gives the goal, AD parallel to BE, and nothing is drawn here: the parallel through A, drawn next, will pass through D and so be AD."

[[passage]]
at = "Similarly we can prove that neither is any other straight line except AD"
kind = "different"
note = "As in I.39, the Lean argues directly: the areas put F at D (`OnRay.eq_of_area_eq`), so the parallel through A is AD itself, and no other straight line needs trying."

[figure]
case = "the bases BC and CE meeting at C, as in Heath's figure"
note = "F is drawn between C and D, with AF level, as the proof supposes; Heath draws AD level and AF sloping."

