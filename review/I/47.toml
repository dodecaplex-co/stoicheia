# review/I/47.toml
# Full: Euclid describes the squares outward (I.46), and squares on one straight line
# are equal whichever side they stand on (Prop46.square_eq, after Proclus), so the
# outward squares are 'the squares on' the sides of every right-angled triangle.
[statement]
scope = "full"
note = "Proved for squares standing outward, as Euclid describes them; inward squares on the same sides are equal to these, as proved after I.46."
fingerprint = "sha256:d6269e6f56742e6b"

[route]
kind = "euclid"

[[passage]]
at = "For let there be described on BC the square BDEC"
kind = "given"
note = "The three squares are given in the statement, standing outward from the triangle, so I.46 is not called here; `Prop28.square` shows that each is a parallelogram."

[[passage]]
at = "through A let AL be drawn parallel"
kind = "helper"
helper = "Prop30.meet"
note = "Euclid draws AL through A and takes its meetings with DE and BC from the figure. The Lean draws the parallel by I.31, uses `Prop30.meet` for L and the unnamed foot, and names the two parallelograms."

[[passage]]
at = "and let AD, FC be joined"
kind = "given"
note = "The triangles ABD and FBC, which I.4 takes below, are named by their corners, so the join needs no Lean here; `Prop47.within` draws AD and FC later, to place C and A within the angles at B."

[[passage]]
at = "let the angle ABC be added to each"
kind = "helper"
helper = "Prop47.within"
note = "Euclid reads off his figure that C lies within the angle DBA and A within FBC; the Lean finds the reason in I.17 and I.13, with the squares standing outward."

[[passage]]
at = "Similarly, if AE, BK be joined"
kind = "grouped"
note = "Euclid says CL can similarly be proved equal to HC, then adds the two parts. The Lean proves the half at B once over any letters and applies it again at C; `Between.of_inside` places the cuts between the square's corners, and `quadArea_add_of_parallelograms` joins BL and CL."

[[passage]]
at = "And the square BDEC is described on BC"
kind = "given"
note = "The statement takes BDEC, GB and HC as the squares on BC, BA and AC; squares on one straight line are equal whichever side they stand on, as proved after I.46; Book II restates I.47 for the squares on straight lines, as Books II and III cite it."

[review]
stage = "full"
commit = "3b6a3bc"
reviewer = "Claude Opus 5.5, records review"
lean = "sha256:a0fc7319bcdf680a"
run = "brief 0005 stage 5, workflow stoicheia-records-full-I-II"
