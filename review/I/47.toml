# review/I/47.toml
# Full: Prop47 keeps Euclid's outward squares; Prop47.general transfers its result
# to either side of each base by equality of squares on the same base.
[statement]
scope = "full"
companions = ["I.47 general"]
note = "`Prop47` keeps Euclid's outward squares; `Prop47.general` proves the same area identity for squares on either side of each base."
fingerprint = "sha256:0443415760ef83f5"

[route]
kind = "euclid"
note = "The main theorem follows Euclid's outward-square argument; `Prop47.general` transfers its result using equal squares on the same base."

[[passage]]
at = "For let there be described on BC the square BDEC"
kind = "given"
note = "The main theorem takes the three outward squares as given, so it does not call I.46; `Prop28.square` shows that each is a parallelogram. The companion constructs outward squares with I.46."

[[passage]]
at = "through A let AL be drawn parallel"
kind = "helper"
helper = "Prop30.meet"
note = "Euclid draws AL through A, taking for granted that a parallel to BD is also parallel to CE, and reads its meetings with DE and BC from the figure. The Lean draws AL by I.31, proves it parallel to CE with `Prop30.parallel` (I.30, for which Heath gives no reference here), uses `Prop30.meet` for L and the unnamed foot, and names the two parallelograms."

[[passage]]
at = "and let AD, FC be joined"
kind = "given"
note = "The triangles ABD and FBC, which I.4 takes below, are named by their corners, so the join needs no Lean here; `Prop47.within` draws AD and FC later, to place C and A within the angles at B."

[[passage]]
at = "let the angle ABC be added to each"
kind = "helper"
helper = "Prop47.within"
note = "Euclid reads off his figure that C lies within the angle DBA and A within FBC; the Lean finds the reason in I.17 and I.13, with the squares standing outward. One case also rests on Metric 5 (`Tacit.angle_le_two_right`), that no angle exceeds two right angles: it rules out AD crossing BC beyond B, which would make the angle ABD greater than two right angles. The rule is a consequence of I.13, which Euclid could have used for the step, and the overlap catalogue lists it as supplying this step of I.47's proof."

[[passage]]
at = "therefore the base AD is equal to the base FC"
kind = "carried"
note = "The Lean proves that the base AD equals FC here, as Euclid states it. Neither his proof nor ours uses it again: both go on by the equal triangles ABD and FBC."
unused = ["hAD_FC"]

[[passage]]
at = "Similarly, if AE, BK be joined"
kind = "grouped"
note = "Euclid invokes the same argument for CL and the square HC. The Lean proves the half once over any letters and applies it at B and again at C."

[[passage]]
at = "therefore the whole square BDEC"
kind = "helper"
helper = "quadArea_add_of_parallelograms"
note = "Euclid reads from the figure that BL and CL make up the square BDEC. The Lean uses I.17 and `Prop47.within` beneath the squares sentence to put A on C's side of BD and B's side of CE; with AL parallel to both, `Between.of_inside` places its foot between B and C and L between D and E, so `quadArea_add_of_parallelograms` joins the two parts."

[[passage]]
at = "And the square BDEC is described on BC"
kind = "given"
note = "The main theorem takes BDEC, GB and HC as the squares on BC, BA and AC; `Prop47.general` transfers the outward result to squares on either side of each base by `Prop46.square_eq`. Book II separately restates I.47 using its areas of squares on straight lines for later citations."

[figure]
case = "the three squares standing outward from the right-angled triangle, as in the main theorem; its companion also covers squares on either side of each base"

