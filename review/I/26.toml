# review/I/26.toml
# Euclid's second case, a side subtending one of the equal angles, is stated as AB
# to DE; AC to DF is the same theorem with B and C exchanged.
[statement]
scope = "full"
fingerprint = "sha256:1cb4527204d38cee"

[route]
kind = "euclid"

[[passage]]
at = "Let AB be greater, and let BG be made equal to DE"
kind = "helper"
helper = "Prop3"
note = "Euclid cuts BG equal to DE; Heath gives no reference for the cut. The Lean uses I.3, which also puts G between B and A. The formal proof does not need Euclid's join of GC: GC is named by its ends, as a side of the triangle GBC, so nothing is drawn for it and Postulate 1 is not called."

[[passage]]
at = "therefore the base GC is equal to the base DF"
kind = "carried"
note = "The Lean proves that the base GC equals DF here, as Euclid states it. Neither his proof nor ours uses it again: both go on by the angles at C."
unused = ["hGC"]

[[passage]]
at = "and the triangle GBC is equal to the triangle DEF"
kind = "carried"
note = "The Lean proves that the triangle GBC equals DEF here, as Euclid states it; like the base GC, it is not used again."
unused = ["this"]

[[passage]]
at = "and the remaining angles will be equal to the remaining angles, namely those which the equal sides subtend; [I. 4] therefore the angle GCB"
kind = "grouped"
note = "I.4, applied under \"therefore the base GC is equal to the base DF\", gives the remaining angles. One step carries both sentences: it takes the pair at C and F, read as GCB and DFE, the only pair Euclid goes on with."

[[passage]]
at = "the less to the greater"
kind = "helper"
helper = "angle_lt_of_between"
note = "Euclid reads BCG as a part of BCA. Since G lies between B and A, `angle_lt_of_between` proves that BCG is less than BCA by adding the two parts and applying Common Notion 5."

[[passage]]
at = "Therefore AB is not unequal to DE"
kind = "case"
note = "Euclid supposes AB greater than DE; the Lean proves his argument once over any letters and applies it again with the triangles exchanged to rule out DE greater than AB. The Lean concludes that AB equals DE by `Tacit.lt_trichotomy`, a tacit rule of magnitude, which we assume (System E §3.5): of two unequal lengths, one is greater."

[[passage]]
at = "Let BC be greater, if possible, and let BH be made equal to EF"
kind = "helper"
helper = "Prop3"
note = "Euclid cuts BH equal to EF, as he cut BG, and the Lean again uses I.3, which also puts H between B and C. Like GC above, AH is named by its ends, as a side of the triangle ABH, and its join is not needed by the formal proof."

[[passage]]
at = "therefore the base AH is equal to the base DF"
kind = "carried"
note = "The Lean proves that the base AH equals DF here, as Euclid states it; as with GC above, neither proof uses it again, and both go on by the angles at H."
unused = ["hAH"]

[[passage]]
at = "and the triangle ABH is equal to the triangle DEF"
kind = "carried"
note = "The Lean proves that the triangle ABH equals DEF here, as Euclid states it; like the triangle GBC, it is not used again."
unused = ["this"]

[[passage]]
at = "and the remaining angles will be equal to the remaining angles, namely those which the equal sides subtend; [I. 4] therefore the angle BHA"
kind = "grouped"
note = "I.4, applied under \"therefore the base AH is equal to the base DF\", gives the remaining angles. One step carries both sentences: it takes the pair at H and F, BHA and EFD, the only pair Euclid goes on with."

[[passage]]
at = "Therefore BC is not unequal to EF"
kind = "case"
note = "Euclid supposes BC greater than EF; the Lean proves his argument once over any letters and applies it again with the triangles exchanged to rule out EF greater than BC. The Lean concludes that BC equals EF by the same rule, `Tacit.lt_trichotomy`."

[[passage]]
at = "the triangle ABC equal to the triangle DEF"
kind = "carried"
note = "The Lean proves that the triangle ABC equals DEF here, as Euclid states it, and it too is not used again: the enunciation asks only for the remaining sides and angle."
unused = ["this"]

[figure]
some_cases = true
case = "AB supposed greater than DE, with G between B and A, and separately BC supposed greater than EF, with H between B and C; both suppositions appear on one triangle, as in Heath's figure"
note = "Like Heath's, this figure draws Euclid's impossible suppositions. BG is drawn shorter than DE and BH shorter than EF, although Euclid cuts off BG equal to DE and BH equal to EF. It does not draw DE greater than AB or EF greater than BC, which the Lean rules out by exchanging the triangles."

