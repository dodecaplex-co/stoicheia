# review/I/26.toml
# Euclid's second case, a side subtending one of the equal angles, is stated as AB
# to DE; AC to DF is the same theorem with B and C exchanged.
[statement]
scope = "full"
fingerprint = "sha256:1cb4527204d38cee"

[route]
kind = "euclid"

[[passage]]
at = "Let AB be greater, and let BG be made equal to DE"
kind = "helper"
helper = "Prop3"
note = "Euclid cuts BG equal to DE; Heath gives no reference for the cut. The Lean uses I.3, which also puts G between B and A, and joins GC by Postulate 1."
unused = ["GC"]

[[passage]]
at = "therefore the base GC is equal to the base DF"
kind = "carried"
note = "The Lean proves that the base GC equals DF here, as Euclid states it; the argument goes on by the angles at C, and does not use it again."
unused = ["hGC"]

[[passage]]
at = "and the triangle GBC is equal to the triangle DEF"
kind = "carried"
note = "The Lean proves that the triangle GBC equals DEF here, as Euclid states it; the argument goes on by the angles at C, and does not use it again."
unused = ["this"]

[[passage]]
at = "and the remaining angles will be equal to the remaining angles, namely those which the equal sides subtend; [I. 4] therefore the angle GCB"
kind = "carried"
note = "The Lean states both pairs of remaining angles here, as Euclid does; the next step takes the angles GCB and DFE from I.4 directly, and the pairs are not used again."
unused = ["this"]

[[passage]]
at = "the less to the greater"
kind = "helper"
helper = "angle_lt_of_between"
note = "Euclid reads BCG as a part of BCA. Since G lies between B and A, `angle_lt_of_between` proves that BCG is less than BCA by adding the two parts and applying Common Notion 5."

[[passage]]
at = "Therefore AB is not unequal to DE"
kind = "case"
note = "Euclid supposes AB greater than DE; the Lean proves his argument once over any letters and applies it again with the triangles exchanged to rule out DE greater than AB. The Lean concludes that AB equals DE by `Tacit.lt_trichotomy`, a rule we assume about magnitudes (System E §3.5), not a proof: of two unequal lengths, one is greater."

[[passage]]
at = "Let BC be greater, if possible, and let BH be made equal to EF"
kind = "helper"
helper = "Prop3"
note = "Euclid cuts BH equal to EF; Heath gives no reference for the cut. The Lean uses I.3, which also puts H between B and C, and joins AH by Postulate 1."
unused = ["AH"]

[[passage]]
at = "therefore the base AH is equal to the base DF"
kind = "carried"
note = "The Lean proves that the base AH equals DF here, as Euclid states it; the argument goes on by the angles at H, and does not use it again."
unused = ["hAH"]

[[passage]]
at = "and the triangle ABH is equal to the triangle DEF"
kind = "carried"
note = "The Lean proves that the triangle ABH equals DEF here, as Euclid states it; the argument goes on by the angles at H, and does not use it again."
unused = ["this"]

[[passage]]
at = "and the remaining angles will be equal to the remaining angles, namely those which the equal sides subtend; [I. 4] therefore the angle BHA"
kind = "carried"
note = "The Lean states both pairs of remaining angles here, as Euclid does; the next step takes the angles BHA and EFD from I.4 directly, and the pairs are not used again."
unused = ["this"]

[[passage]]
at = "Therefore BC is not unequal to EF"
kind = "case"
note = "Euclid supposes BC greater than EF; the Lean proves his argument once over any letters and applies it again with the triangles exchanged to rule out EF greater than BC. The Lean concludes that BC equals EF by `Tacit.lt_trichotomy`, a rule we assume about magnitudes (System E §3.5), not a proof: of two unequal lengths, one is greater."

[[passage]]
at = "the triangle ABC equal to the triangle DEF"
kind = "carried"
note = "The Lean proves that the triangle ABC equals DEF here, as Euclid states it; the statement asks only for the remaining sides and angle, so this is not used again."
unused = ["this"]

[figure]
case = "AB supposed greater than DE, with G between B and A, and separately BC supposed greater than EF, with H between B and C; both suppositions appear on one triangle, as in Heath's figure"
note = "Like Heath's, this figure draws Euclid's impossible suppositions. BG is drawn shorter than DE and BH shorter than EF, although Euclid cuts off BG equal to DE and BH equal to EF."

