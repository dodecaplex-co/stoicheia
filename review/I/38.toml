[[passage]]
at = "For let AD be produced in both directions to G, H"
kind = "given"
note = "Euclid produces AD in both directions. The statement already gives the whole straight line through A and D, so the Lean needs no extension here."

[[passage]]
at = "through B let BG be drawn parallel to CA"
kind = "helper"
helper = "Prop31.parallelogram"
note = "Euclid draws BG and FH and takes their meetings with AD at G and H from the figure, then calls GBCA and DEFH parallelograms without giving a reason. The Lean uses `Prop31.parallelogram` to draw the parallels by I.31, prove their meetings by I.30, which Heath does not cite here, and establish both parallelograms for the next sentence."

[[passage]]
at = "But the halves of equal things are equal to one another"
kind = "helper"
helper = "Magnitude.eq_of_add_self_eq"
note = "Euclid passes from equal parallelograms to equal triangles without stating or proving that halves of equal things are equal; J. L. Heiberg brackets the sentence that states this as an interpolation. The Lean applies `Magnitude.eq_of_add_self_eq`, which rules out unequal halves by comparing their doubles using the order and addition laws for magnitudes."

