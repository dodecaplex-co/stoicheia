# review/I/13.toml
[statement]
scope = "full"
note = "Concludes that the two angles together are ∟ + ∟, Euclid's second form; his first, each angle right, is the case of equal angles, by Postulate 4."
fingerprint = "sha256:75b80d518e57f424"

[route]
kind = "euclid"
note = "After I.13, the Lean proves two rules of System E from it: `Tacit.adjacent_eq_of_right`, that a right angle is equal to the angle adjacent to it, from I.13 and Common Notion 3; and `Tacit.inside_of_angle_add`, that if the angles BAD and DAC make up the angle BAC then D lies within it, from I.13, the adding of angles, the fact that an angle of a triangle is greater than nothing (`Triangle.angle_pos`), and the rules for the sides of a straight line."

[[passage]]
at = "I say that the angles CBA, ABD are either two right angles"
kind = "given"
note = "The statement gives the goal, in Euclid's second form, as the table above says."

[[passage]]
at = "Then, since the angle CBE is equal to the two angles CBA, ABE"
kind = "helper"
helper = "angle_add_of_within"
note = "Euclid reads off his figure that BA falls within the right angle CBE. In the Lean, A lies on E's side of BC because I.11 puts E on A's side of CD, of which BC is a part. `Prop13.cases` proves that A lies on C's side of BE in the case Euclid draws; with both facts, `angle_add_of_within` gives the sum."

[[passage]]
at = "Again, since the angle DBA is equal to the two angles DBE, EBA"
kind = "helper"
helper = "Prop13.within"
note = "Euclid reads off his figure that BE falls within the angle DBA. `Prop13.within` proves this from BA's place within CBE, and `angle_add_of_within` gives the sum."

[[passage]]
at = "Therefore etc."
kind = "case"
note = "Euclid's figure has AB leaning towards C; leaning towards D is his figure with C and D exchanged (`Prop13.cases`), so one argument serves for both. The Lean also proves in `Prop13.cases` that A cannot lie on BE itself: since A and E lie on the same side of CD, A would lie on the ray from B through E and make CBA and ABD the equal right angles CBE and EBD, contrary to the unequal case, so AB leans towards C or towards D."

[figure]
