# review/I/45.toml
[statement]
scope = "restricted"
short = "figures given with a checked division into triangles"
hypotheses = [
  "The figure is given with a checked division into triangles that do not overlap, no point inside two of them (`Apart` or `Rectilineal`, or the division from one corner that `Prop45.fan` checks); the main theorem takes Euclid's two triangles, ABD and DBC, unchecked. A figure given only by its boundary is not yet covered. Proved in the staging files ([#289](https://github.com/jackChallis/stoicheia/pull/289)), but not yet part of the edition's statements ([#116](https://github.com/jackChallis/stoicheia/issues/116)): that every rectilineal figure, given only by its boundary, has such a division, and that another division gives the same area."
]
note = "`Prop45.apart` takes a figure given with a checked division. Proved in staging only (#289): that every figure has one, and that another gives the same area."
companions = ["I.45 append", "I.45 sum", "I.45 apart", "I.45 figure", "I.45 fan"]
fingerprint = "sha256:82f17d662afe1ed5"

[route]
kind = "euclid"
note = "Euclid shows two triangles. The companions repeat his second step for each triangle after the first, as Oliver Byrne draws it for three: `Prop45.append` is the second half of his proof, with the parallelogram so far given in place of the one I.42 makes, and `Prop45.sum` applies it to one triangle after another."

[representation]
tags = ["figure-with-dissection"]
note = "The main theorem takes Euclid's two triangles, ABD and DBC, unchecked, and they may overlap; they make Euclid's figure when A and C lie on opposite sides of DB, and that checked case is `Prop45.fan` for the corners D, A, B, C. Three companions take a rectilineal figure given with a checked division into triangles: triangles that lie apart, so the figure may have a hole (`Prop45.apart`); triangles glued edge to edge in a suitable order, for a figure with one boundary (`Prop45.figure`); or, as Euclid and Byrne divide it, triangles from one corner, each two neighbours on opposite sides of the straight line they share and their angles at that corner together less than four right angles, which `Fitted.fan` proves fit together (`Prop45.fan`). Equal to the figure means equal to those triangles together. The construction itself works for any triangles (`Prop45.sum`); the check is what makes their sum the figure's. `Prop45.fan` does not state that the figure it makes is the one bounded by the closed line through its corners in order; that is proved in the staging files ([#289](https://github.com/jackChallis/stoicheia/pull/289)), but not yet part of the edition's statements ([#116](https://github.com/jackChallis/stoicheia/issues/116)). Proved in the staging files ([#289](https://github.com/jackChallis/stoicheia/pull/289)), but not yet part of the edition's statements ([#116](https://github.com/jackChallis/stoicheia/issues/116)): that every rectilineal figure, given only by its boundary, has such a division, and that another division gives the same area. David Hilbert proved the second, for his measure of area."

[[passage]]
at = "Let DB be joined, and let the parallelogram FH be constructed equal to the triangle ABD"
kind = "carried"
note = "I.42 builds FH on half of BD itself, so H falls on D: the Lean writes D wherever Euclid writes H, and its parallelogram KFLM overlaps ABCD."

[[passage]]
at = "Thus, with a straight line GH"
kind = "helper"
helper = "SameSideOf.trans_opposite"
note = "Euclid applies I.14 because KH and HM do not lie on the same side of GH. The Lean makes it so: it applies I.44's parallelogram to GH on the side away from K, and `SameSideOf.trans_opposite` puts M on the other side of GH from K. I.14 then puts H between K and M (D for H in the Lean)."

[[passage]]
at = "And, since the triangle ABD is equal to the parallelogram FH"
kind = "helper"
helper = "quadArea_add_of_parallelograms"
note = "Euclid takes FH and GM together as KFLM, equal to the two triangles of ABCD. With H between K and M and G between F and L from the two applications of I.14, `quadArea_add_of_parallelograms` joins the areas; the Lean writes D for H and takes ABCD as the given sum of ABD and DBC, as the Representation row explains."

[figure]
case = "Euclid's figure ABCD, divided by DB into the two triangles ABD and DBC"
note = "H is drawn on D, as the Lean has it; Heath draws the parallelogram apart, as the figure at a glance does."

