[route]
kind = "euclid"

[[passage]]
at = "For let AD be drawn from the point A at right angles"
kind = "carried"
note = "Euclid draws AD perpendicular to AC, and Heath gives no reference here. The Lean draws AD by I.11 on the other side of AC from B, as in Heath's figure."

[[passage]]
at = "let AD be made equal to BA"
kind = "helper"
helper = "OnRay.exists_len_eq"
note = "Euclid takes AD equal to BA on the perpendicular, taking enough room to cut it off by I.3 for granted; Heath gives no reference here. `OnRay.exists_len_eq` finds D on that ray by a circle about A with distance AB, using Postulate 3."

[[passage]]
at = "Since DA is equal to AB, the square on DA"
kind = "helper"
helper = "Prop46.square_eq"
note = "Euclid assumes that squares on equal straight lines are equal; Heath reports that Proclus proves it under I.46, and the Lean proves it so, by I.4 on the halves."

[[passage]]
at = "Let the square on AC be added to each"
kind = "helper"
helper = "Prop46.square_eq"
note = "Euclid adds the square on AC to the equal squares on DA and AB. The Lean describes the squares on DA and AC by I.46, beneath the preceding sentence and this one, on the sides away from the triangle DAC; `Prop46.square_eq` identifies the new square on AC with the given one before Common Notion 2 adds the areas."

[[passage]]
at = "But the square on DC is equal to the squares on DA, AC"
kind = "helper"
helper = "Prop46"
note = "Euclid applies I.47 to the square on DC without describing it. The Lean describes it by I.46 on the side away from A, so that all three squares stand outward from DAC as I.47 asks, and then applies I.47."

[[passage]]
at = "therefore the square on DC is equal to the square on BC"
kind = "helper"
helper = "Prop46.side_eq"
note = "Euclid assumes the converse too, that equal squares stand on equal straight lines; Heath reports Proclus's proof, while the Lean's `Prop46.side_eq` takes another road, the square on the less being the less. Before applying that lemma in I.48, the Lean uses `Prop28.square` (I.28) to make both squares parallelograms and `Parallelogram.quadArea_rotate` to read their unchanged areas from C, as squares on CD and CB."

