# review/I/31.toml
# `hA : ¬ Collinear B C A` says that the given point is off the given straight line,
# which a parallel through it presupposes.
[statement]
scope = "full"
note = "Draws a parallel through A, as asked; that there is no other, which Proclus remarks, is proved from I.29 as `Prop30.unique`."
fingerprint = "sha256:07d1a4437d0abafd"

[route]
kind = "euclid"

[[passage]]
at = "Let a point D be taken at random on BC"
kind = "helper"
helper = "Tacit.exists_point_between"
note = "Euclid takes D on BC; the Lean chooses it between B and C, as in his figure. `Tacit.exists_point_between` (System E, Points 3) supplies this point, now proved in `Elements/Figure/Incidence.lean` by drawing a smaller concentric circle and using Circle 1, Definition I.15 and circle crossings."

[[passage]]
at = "Then, since the straight line AD falling on the two straight lines BC, EF"
kind = "helper"
helper = "SameSideOf.trans_opposite"
note = "Euclid treats EAD and ADC as alternate; `SameSideOf.trans_opposite` puts E and C on opposite sides of AD. I.23 put E on B's side, and `OppositeSidesOf.of_between`, used beneath the joining of AD, put B and C on opposite sides because D is between them."

