[[passage]]
at = "and let DF be made equal to A"
kind = "helper"
helper = "Prop22.room"
note = "Euclid's DE has an end D and extends endlessly towards E; the Lean starts with F and the ray from F through E given by the statement, takes DE through F and E, and finds its end D by cutting off FD equal to A from EF produced beyond F. For each cut, `Prop22.room` uses I.2 and `produce_longer` to find a point far enough along the produced line for I.3 to cut from a longer finite straight line. To reach so far, `produce_longer` describes a circle by Postulate 3, about F for the first two cuts and about G for the third, which Heath's bracket at this step does not name: it names only I.3. Postulate 3 is in the proof's own Lean in any case, which describes Euclid's two circles with it. `between_cut` puts D, F, G and H in order, and the Lean applies `Tacit.not_between_of_between_between` (System E, Between 7), which Book Zero proves, to the orders D, F, G and D, F, E to show that F is not between G and E, placing G on the ray from F through E as the statement asks."

[[passage]]
at = "again, with centre G and distance GH let the circle KLH be described"
kind = "helper"
helper = "Prop22.meet"
note = "Euclid takes K where the circles meet without proving they meet; `Prop22.meet` finds a point of the circle about G inside the circle about F, including when that point is F itself, and H outside it. The lemma concludes that the circles cut one another by `circles_meet_of_centre`, System E's Intersection 4 in LeanEuclid's corrected form for a circle whose centre is given, here G. Book Zero proves it from Intersection 5 and `line_circle_between`, finding the crossing from that centre, and it uses neither Circle 1 nor `Tacit.exists_centre`, our rule that every circle has a centre, from which the rule itself, `Tacit.circles_meet_of_on_inside_outside`, takes its centre. So I.22 rests on neither. Until 26 October 2026 the lemma called the rule, whose proof then used Circle 1. The main proof then chooses K on P's side of DE, as the statement asks, by `Tacit.circles_meet_same_side` (System E, Intersections 8), a rule we assume."

[[passage]]
at = "and let KF, KG be joined"
kind = "given"
note = "In the Lean a straight line between two points is named by its ends: KF and KG are sides of the triangle KFG, so nothing is drawn for the joins, and Postulate 1 is not called for them."

[[passage]]
at = "I say that the triangle KFG has been constructed"
kind = "grouped"
note = "Euclid announces here what the steps below establish, and the Lean carries it with them. Its conclusion gives G on the ray from F through E, K on P's side of FE and the three lengths; since K is then off FE, K, F and G make a triangle."

