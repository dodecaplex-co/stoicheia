# review/I/39.toml
# `hAD : A ≠ D` says that the two triangles are two: on one base, ABC and DBC are one
# triangle when A is D. In I.40 the same hypothesis does exclude a case, since ABC and
# ACE are two triangles.
[statement]
scope = "full"
note = "\"In the same parallels\" is AD parallel to BC, so A and D are apart: on one base, ABC and DBC are two triangles only then."
fingerprint = "sha256:e27bd8d22cd1f209"

[route]
kind = "euclid"
note = "Euclid's reductio: supposing AD not parallel to BC makes the parallel through A meet BD away from D. I.37 and Common Notion 1 give equal areas, contradicted by a strict area comparison in either order on the ray from B through D."

[[passage]]
at = "I say that they are also in the same parallels"
kind = "given"
note = "The statement gives the goal, AD parallel to BC. The distinct vertices A and D name AD; its parallelism remains to be proved, so nothing is drawn here."

[[passage]]
at = "But ABC is equal to DBC"
kind = "case"
note = "The same-side hypothesis puts E on the ray from B through D, and the contrary supposition excludes E = D. If E is between B and D, EBC is less than DBC; if E is beyond D, DBC is less than EBC, so either order contradicts their equal areas."

[[passage]]
at = "Therefore AE is not parallel to BC"
kind = "grouped"
note = "The preceding strict-area contradiction rules out the proposed parallel meeting BD away from D."

[[passage]]
at = "Similarly we can prove that neither is any other straight line except AD"
kind = "grouped"
note = "The same contradiction excludes any proposed parallel through A meeting BD away from D, discharging the supposition that AD is not parallel to BC. The final step returns this conclusion."

[figure]
note = "AE is drawn level, as the proof supposes; Heath draws AD level."

[review]
stage = "exceptions"
