[[passage]]
at = "But the halves of equal things are equal to one another"
kind = "helper"
helper = "Magnitude.eq_of_add_self_eq"
note = "Euclid takes equal halves from equal wholes, in the sentence Heiberg brackets. `Magnitude.eq_of_add_self_eq` proves the step from the order of magnitudes: if one half were less, its double would be less too."

