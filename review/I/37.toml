[[passage]]
at = "But the halves of equal things are equal to one another"
kind = "helper"
helper = "Magnitude.eq_of_add_self_eq"
note = "Euclid infers that the triangles are equal because they are halves of equal parallelograms; the bracketed sentence states the principle this inference needs, but Heath reports that J. L. Heiberg judges its words interpolated. `Magnitude.eq_of_add_self_eq` proves the step from the order of magnitudes: if one half were less, its double would be less too."

