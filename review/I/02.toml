[statement]
scope = "full"
note = "Proved wherever the point A lies; when A is B itself, BC already serves."
fingerprint = "sha256:0a510131298d7313"

[route]
kind = "euclid"

[[passage]]
at = "Let A be the given point"
kind = "case"
note = "Euclid's construction takes A apart from B. Before the setting-out, the Lean also settles A at B itself, taking C as the other end of the required straight line."

[[passage]]
at = "From the point A to the point B let the straight line AB be joined"
kind = "given"
note = "The finite straight line AB is named by its two ends. The Lean passes A and B directly to `Prop1`, so no separate straight line is drawn here."

[[passage]]
at = "Let the straight lines AE, BF be produced in a straight line with DA, DB"
kind = "given"
note = "Our straight lines DA and DB are whole lines already, so nothing is produced and Postulate 2 is not used: G and L are where they meet the circles beyond B and A (System E, Intersections 5)."

[[passage]]
at = "with centre B and distance BC let the circle CGH be described"
kind = "helper"
helper = "Tacit.line_circle_beyond"
note = "Euclid leaves the meeting point G to the figure. After Postulate 3 draws CGH, the Lean takes G beyond B by `Tacit.line_circle_beyond`, a rule we assume (System E, Intersections 5), since B, the centre, lies inside the circle."

[[passage]]
at = "and again, with centre D and distance DG let the circle GKL be described"
kind = "helper"
helper = "Tacit.line_circle_beyond"
note = "Euclid takes L where DA produced meets GKL; the Lean first draws GKL by Postulate 3 and proves DA = DB < DG by Common Notion 5. It puts A inside by `Tacit.inside_of_len_lt` (System E, Diagram-segment 4), now proved in `Elements/Figure/Incidence.lean` from Definition I.15, circle crossings and length addition, then takes L beyond A by `Tacit.line_circle_beyond` (Intersections 5), which remains an axiom."

[[passage]]
at = "And in these DA is equal to DB"
kind = "helper"
helper = "Tacit.len_add_of_between"
note = "Euclid subtracts DA and DB from DL and DG. The Lean already has DA = DB from I.1 and DB + BG = DG at the second circle; here `Tacit.len_add_of_between`, a rule we assume (System E, Diagram-segment 1), supplies DA + AL = DL from the order of D, A and L."

