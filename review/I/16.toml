[[passage]]
at = "Let AC be bisected at E"
kind = "helper"
helper = "produce_longer"
note = "Euclid bisects AC and produces BE; the Lean uses I.10 for E and `produce_longer` to extend BE beyond E far enough for I.3 to cut off EF. To reach so far, `produce_longer` describes the circle with centre E and distance EB by Postulate 3, which Heath's bracket at this step does not name: it names only I.10. The proof's own Lean draws no circle: Postulate 3 reaches it through this lemma, among others, and every proposition it cites rests on it too."

[[passage]]
at = "let EF be made equal to BE"
kind = "helper"
helper = "between_cut"
note = "Euclid cuts off EF equal to BE and joins FC, then produces AC to G. After I.3 chooses F, `between_cut` proves that E lies between B and F, and Postulate 2 draws AC through to G. FC is named by its ends, as a side of the triangle ECF, so nothing is drawn for the join, and Postulate 1 is not called for it."

[[passage]]
at = "Therefore the base AB is equal to the base FC"
kind = "carried"
note = "The Lean proves that the base AB equals FC here, as Euclid states it. Neither his proof nor ours uses it again: both go on by the angles."
unused = ["hAB_FC"]

[[passage]]
at = "and the triangle ABE is equal to the triangle CFE"
kind = "carried"
note = "The equal triangles ABE and CFE are proved here too, as Euclid states them. Neither his proof nor ours uses them again."
unused = ["this"]

[[passage]]
at = "and the remaining angles are equal to the remaining angles respectively"
kind = "carried"
note = "The Lean states one pair here, the angles EBA and EFC; the next step takes the other pair, BAE and ECF, from I.4 directly. Neither Euclid's proof nor ours uses EBA and EFC again: both go on with BAE and ECF alone."
unused = ["this"]

[[passage]]
at = "But the angle ECD is greater than the angle ECF"
kind = "helper"
helper = "Prop16.within"
note = "Euclid treats ECF as part of ECD; `Prop16.within` puts F on D's side of AC and E's side of BC. The Lean then uses `angle_add_of_within` and `Triangle.angle_pos` to apply Common Notion 5."

[[passage]]
at = "Similarly also, if BC be bisected"
kind = "grouped"
note = "Euclid leaves the argument for the other interior angle to the reader, with BC bisected. The Lean proves his argument once over any letters and applies it again to the triangle BAC with AC produced to G, then uses I.15 to identify BCG with ACD."

