[statement]
scope = "full"
note = "For any C on AB, PCF is ∟ for each other P on AB; F stands on the side of AB where a given point Q lies: a little more than Euclid asks, used in I.13 and I.46."
fingerprint = "sha256:5d52ae3586be5880"

[route]
kind = "euclid"

[[passage]]
at = "Let a point D be taken at random on AC"
kind = "case"
note = "Euclid takes D on AC, with C between A and B in his figure. The Lean also admits C at A, when there is no AC to take D on, so it takes D to be B; otherwise `Tacit.exists_point_between` (System E, Points 3) supplies D between A and C, which Book Zero proves in `Elements/Figure/Incidence.lean` by drawing a smaller concentric circle and using Definition I.15 and circle crossings."

[[passage]]
at = "let CE be made equal to CD"
kind = "helper"
helper = "produce_longer"
note = "Euclid cuts off CE equal to CD, taking for granted a straight line beyond C greater than CD, although CB may be shorter than CD or C may be B. The Lean uses `produce_longer` to extend DC beyond C far enough for I.3 and, after the cut, `between_cut` to put C between D and E; with F off DE, this makes DCF and FCE adjacent, as Euclid later says in \"and they are adjacent angles\". To reach so far, `produce_longer` describes the circle with centre C and distance CD by Postulate 3; Heath's reference at this step is I.3 alone. The proof's own Lean draws no circle: Postulate 3 reaches it through this lemma, among others, and every proposition it cites rests on it too."

[[passage]]
at = "and let FC be joined;"
kind = "given"
note = "Euclid joins FC, and the formal proof does not need the join: in the Lean a straight line between two points is named by its ends, and FC is a side of the triangles CDF and CEF, so nothing is drawn for it and Postulate 1 is not called."

[[passage]]
at = "Therefore the straight line CF has been drawn at right angles"
kind = "helper"
helper = "OnRay.cases_of_between"
note = "Euclid concludes that CF is at right angles to AB from the two right angles at C. For every other point P of AB, `OnRay.cases_of_between` puts P on the ray from C through D or E, and `angle_onRay_left` carries the corresponding right angle to PCF."

[figure]
case = "C between A and B, as in Heath's figure"

