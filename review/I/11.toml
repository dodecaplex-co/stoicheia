[route]
kind = "euclid"

[[passage]]
at = "Let a point D be taken at random on AC"
kind = "case"
note = "Euclid takes D on AC, with C between A and B in his figure. The Lean also admits C at A, when there is no AC to take D on, so it takes D to be B; otherwise `Tacit.exists_point_between` (System E, Points 3) supplies D between A and C, now proved in `Elements/Figure/Incidence.lean` by drawing a smaller concentric circle and using Circle 1, Definition I.15 and circle crossings."

[[passage]]
at = "let CE be made equal to CD"
kind = "helper"
helper = "produce_longer"
note = "Euclid cuts off CE equal to CD, taking for granted a straight line beyond C greater than CD, although CB may be shorter than CD or C may be B. The Lean uses `produce_longer` to extend DC beyond C far enough for I.3 and, after the cut, `between_cut` to put C between D and E; with F off DE, this makes DCF and FCE adjacent, as Euclid later says in \"and they are adjacent angles\"."

[[passage]]
at = "Therefore the straight line CF has been drawn at right angles"
kind = "helper"
helper = "OnRay.cases_of_between"
note = "Euclid concludes that CF is at right angles to AB from the two right angles at C. For every other point P of AB, `OnRay.cases_of_between` puts P on the ray from C through D or E, and `angle_onRay_left` carries the corresponding right angle to PCF."

[figure]
case = "C between A and B, as in Heath's figure"

