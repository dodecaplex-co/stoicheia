# The tags a review record's [representation] may carry (review/SCHEMA.md).
#
# Each tag names one way our Lean differs from Euclid's words, so that pages and
# summaries can show the reader every proposition that shares it.
#
#   kind = "scope"           the statement covers less than Euclid's enunciation; a record
#                            with this tag has scope "restricted" or "partial", and says
#                            exactly what is left out in [statement].
#   kind = "representation"  a choice in how Euclid's objects are put into Lean, which
#                            the reader needs in order to read the statement rightly.
#
# `meaning` is one plain line. A tag that changes how a whole statement is read may
# also have `badge`, a few words eligible to stand beside the green check on the page
# ("as Euclid states it, in our measure of circumferences"). The renderer may keep that
# badge to statements that use the representation; when shown, it also marks the row of
# the certificate with a †. A new tag is added here, with its meaning, before any record
# uses it. Python reads this file with tomllib; heath.load_terms() checks it.

[tag.adjacent-bases]
kind = "scope"
meaning = "Equal bases on one straight line are taken end to end, BC and CE meeting at C, where Euclid's may lie apart or overlap (I.40)."

[tag.two-triangles]
kind = "scope"
meaning = "A given rectilineal figure is taken as two triangles, where Euclid's may have any number of sides (I.45, II.14)."

[tag.three-pieces]
kind = "scope"
meaning = "A straight line cut into any number of segments is cut into exactly three (II.1)."

[tag.diameters-excluded]
kind = "scope"
meaning = "Straight lines through the centre are excluded by hypothesis, so the case at distance zero from the centre is not covered (III.14)."

[tag.mixed-angles-omitted]
kind = "scope"
meaning = "A clause about an angle contained by a straight line and a circumference is left out, and the rectilineal facts Euclid proves it by are stated. No record carries it now that III.16 and III.31 state their mixed angles; the worked example in review/SCHEMA.md shows it, as III.16 stood at commit d040117."

[tag.mixed-angles-local]
kind = "representation"
meaning = "An angle contained by a straight line and a circumference (Definition III.7) is read as the region it opens near its vertex, and compared with a rectilineal angle placed at that vertex, along its straight arm and on its side, by containment near the vertex with whole small circles to spare: the comparisons use local containment of curved angular regions, and no general arithmetic or ratio theory of mixed angles is claimed, nor any motion of one (III.16, III.31)."

[tag.centre-given]
kind = "representation"
meaning = "The statement gives the circle its centre, named or as `∃ G, Centre G α`, as a hypothesis, where Euclid's setting-out takes the centre or a proof needs one. Brief 0008's centre rule, once it is in the axiom lock, gives every circle a centre, so the hypothesis then asks only for a centre the circle already has and excludes no circle (briefs 0004 and 0008)."

[tag.touching-whole-circles]
kind = "representation"
meaning = "Circles touching one another are read of the whole circles: touching within, a point of the inner is within the outer, and no point of the inner is outside the outer; touching without, no point is within both; so touching circles cross nowhere, the reading Heath reports as Todhunter's (III.6, III.11–III.13)."

[tag.segment-with-circle]
kind = "representation"
meaning = "A segment is given as its whole circle, a straight line in it and one side of that line, so a statement given a segment is also given its circle (III.24, III.25)."

[tag.angle-measure]
kind = "representation"
meaning = "A circumference is measured by the angle standing on it, taken twice; the measure carries no radius, so equal measures are equal circumferences only in one circle or in equal circles (III.26–III.30, both companions of III.24, and III.25 kind)."
badge = "in our measure of circumferences"

[tag.redundant-hypothesis]
kind = "representation"
meaning = "A hypothesis kept from Euclid's enunciation is not needed for the Lean conclusion, which holds without it; the proof may still use it, along Euclid's route (III.24, III.26, III.27)."

[tag.hypothesis-dropped]
kind = "representation"
meaning = "A hypothesis of Euclid's enunciation is left out of the statement, which so claims more than he does (III.9's point need not be within the circle)."

[tag.side-not-square]
kind = "representation"
meaning = "A construction of a square returns its side, a straight line EH whose square `sq E H` is the figure, not the four corners of a drawn square (II.14)."

[tag.figure-with-dissection]
kind = "representation"
meaning = "A rectilineal figure given with a checked division into triangles, as the older companions of I.45 and II.14 take it: any division, as triangles that do not overlap, no point inside two of them, so that the figure may have a hole; or, for a figure with one boundary, triangles glued edge to edge in a suitable order, each across a side of an earlier one and meeting the earlier ones only along it; or, as Euclid and Oliver Byrne divide it, the triangles from one corner, neighbours on opposite sides of the straight line they share and the angles at that corner together less than four right angles. Equal to the figure means equal to those triangles together, and that is the figure's area. Book Zero proves separately that every figure given by its boundary, represented by an outline, has such a division. Following David Hilbert's theory of content, it proves that every division of that figure gives the same sum. The records of I.45 and II.14 carry it for those older companions alone; their outline companions take a figure by its boundary alone, represented by an outline."
