[statement]
scope = "full"
note = "Asks for acute angles at B and C and nothing at A, so it says more than Euclid's acute-angled triangles; that D falls within CB is proved."
fingerprint = "sha256:8ebcab93a8dd3097"

[route]
kind = "euclid"

[representation]
tags = ["hypothesis-dropped"]
note = "Euclid's enunciation speaks of acute-angled triangles, all three angles acute. The statement leaves out the angle at A, which plays no part; the acute angle at C keeps the foot D within CB, as \"cut off within\" and II.7 need. The perpendicular from A and its foot D on BC are given. The scholiast's wider reading, any triangle acute-angled at B, is not stated: with a right angle at C the foot D is C itself, and with an obtuse angle at C it falls beyond C."

[[passage]]
at = "Let ABC be an acute-angled triangle"
kind = "given"
note = "The statement gives the triangle, the acute angles at B and C, and the perpendicular AD with its foot D on BC."

[[passage]]
at = "For, since the straight line CB has been cut at random at D"
kind = "helper"
helper = "Prop13.not_beyond"
note = "Euclid reads off his figure that D falls within CB; the Lean proves it: a foot beyond B or C would give triangle ABD or ACD, respectively, a right angle at D and an obtuse angle at the end passed (I.13, I.17). The Lean also rules out D = B and D = C because the corresponding angle would be both acute and right, leaving `Tacit.between_cases`, the rule we assume as System E, Between 6, to put D between B and C."

[figure]
case = "an acute angle at A, as in Heath's figure"

