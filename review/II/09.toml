[statement]
scope = "full"
note = "For D on either side of C: Euclid's figure puts D between C and B, and the other side follows by exchanging A and B."
fingerprint = "sha256:d7458f8b6387229f"

[route]
kind = "euclid"

[[passage]]
at = "For let a straight line AB be cut into equal segments at C"
kind = "case"
note = "Euclid's figure puts D between C and B; his hypothesis of unequal segments excludes D equal to C. The Lean uses that hypothesis to rule out AD equal to AC when comparing their lengths, proves Euclid's case once over any letters, and covers D between A and C by exchanging A and B."

[[passage]]
at = "For let CE be drawn from C at right angles to AB"
kind = "helper"
helper = "BookI.Prop11"
note = "Euclid draws CE perpendicular to AB and equal to AC; Heath gives no reference here. The Lean draws the perpendicular by I.11 and sets off the length with `OnRay.exists_len_eq`, which draws a circle about C and takes its meeting with the ray."

[[passage]]
at = "let DF be drawn through D parallel to EC"
kind = "helper"
helper = "BookI.Prop30.meet"
note = "Euclid draws the parallel through D and reads F between E and B from the figure. The Lean draws it by I.31, finds F by `BookI.Prop30.meet` and proves its position with `Between.of_sameSide`."

[[passage]]
at = "and FG through F parallel to AB"
kind = "helper"
helper = "BookI.Prop31.parallelogram"
note = "Euclid draws FG parallel to AB and takes G on EC. `BookI.Prop31.parallelogram` finds G and proves that CDFG is a parallelogram, and `Between.of_sameSide` places G between E and C."

[[passage]]
at = "the angle EAC is also equal to the angle AEC"
kind = "helper"
helper = "BookI.Prop5.base"
note = "Euclid infers equal angles at A and E from AC equal to CE. The Lean uses I.5 in its base-angle form, `BookI.Prop5.base`; Heath gives no reference here."

[[passage]]
at = "therefore each of the angles CEA, CAE is half a right angle"
kind = "carried"
note = "The Lean proves that each of the angles CEA and CAE is half a right angle, as Euclid states. Neither his proof nor ours uses the half at A again: only the half at E goes on, into the right angle AEB."
unused = ["hhalf_CAE"]

[[passage]]
at = "therefore the whole angle AEB is right"
kind = "helper"
helper = "angle_add_of_between"
note = "Euclid adds the two half-right angles at E to obtain AEB. `angle_add_of_between` shows that EC divides AEB because C lies between A and B; the Lean proves CEA and CEB equal with `Magnitude.eq_of_add_self_eq`, then adds the equal halves."

[[passage]]
at = "therefore the angle GEF is equal to the angle EFG"
kind = "helper"
helper = "Magnitude.eq_of_add_self_eq"
note = "Euclid takes the angles GEF and EFG to be equal because each is half a right angle. The Lean applies `Magnitude.eq_of_add_self_eq` to their equal doubles."

[[passage]]
at = "therefore the angle at B is equal to the angle DFB"
kind = "helper"
helper = "Magnitude.eq_of_add_self_eq"
note = "Euclid takes the angles FBD and DFB to be equal because each is half a right angle. The Lean applies `Magnitude.eq_of_add_self_eq` to their equal doubles."

[[passage]]
at = "But the square on EF is equal to the squares on EG, GF"
kind = "helper"
helper = "BookI.Prop47.sq"
note = "Euclid gives the square on EF as the squares on EG and GF together; Heath gives no reference here. The Lean applies I.47 to the triangle EGF, whose angle at G has been proved right."

[[passage]]
at = "But the squares on AD, DF are equal to the square on AF"
kind = "helper"
helper = "Tacit.adjacent_eq_of_right"
note = "Euclid uses the right angle ADF, while the earlier parallel argument made FDB right. The Lean obtains ADF from `Tacit.adjacent_eq_of_right` (I.13) and then applies I.47."

[figure]
case = "D between C and B, as in Heath's figure"

