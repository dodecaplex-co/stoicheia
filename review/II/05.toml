[statement]
scope = "full"
note = "For D on either side of C: Euclid's figure puts D between C and B, and the other side follows by exchanging A and B."
fingerprint = "sha256:95bb25efb9f5aa7d"

[route]
kind = "euclid"

[[passage]]
at = "For let a straight line AB be cut into equal segments at C"
kind = "case"
note = "Euclid's argument is given once over any letters, for D between C and B; D between A and C is the same with A and B exchanged."

[[passage]]
at = "and let BE be joined"
kind = "grouped"
note = "Euclid joins BE and draws the parallels through D and H. `Parallelogram.figure` carries these three constructions together, finding the intersections and their order on the sides of the square."

[[passage]]
at = "and again through A let AK be drawn parallel"
kind = "helper"
helper = "Prop31.parallelogram"
note = "Euclid draws AK parallel to CL and takes K on KM from the figure. `Prop31.parallelogram` draws the parallel, finds K and proves that LCAK is a parallelogram."

[[passage]]
at = "Then, since the complement CH is equal to the complement HF"
kind = "helper"
helper = "Parallelogram.complements"
note = "Euclid treats CH and HF as parallelograms. I.43 gives their equal areas, and `Parallelogram.complements` supplies the shapes needed to add them to DM."

[[passage]]
at = "therefore the whole CM is equal to the whole DF"
kind = "helper"
helper = "quadArea_add_of_parallelograms"
note = "Euclid identifies CM as CH and DM together, and DF as HF and DM together. `quadArea_add_of_parallelograms` proves both divisions, so adding DM to the equal complements gives equal wholes."

[[passage]]
at = "therefore the whole AH is equal to the gnomon NOP"
kind = "helper"
helper = "quadArea_add_of_parallelograms"
note = "Euclid takes AH as AL and CH together. `Parallel.between` places L between K and H, and `quadArea_add_of_parallelograms` identifies their sum with AH, giving the gnomon CH, DM and HF."

[[passage]]
at = "But AH is the rectangle AD, DB"
kind = "helper"
helper = "Square.about_diameter"
note = "Euclid takes DH equal to DB from the square DM. `Square.about_diameter` proves that DM is a square; the Lean then proves that AH is a rectangle and identifies its area by `Rectangle.eq_rect`."

[[passage]]
at = "Let LG, which is equal to the square on CD"
kind = "helper"
helper = "Square.about_diameter"
note = "Euclid takes LG to be the square on CD. `Square.about_diameter` makes LG a square, and I.34 with `Square.eq_sq` identifies its area as the square on CD; the next sentence adds it to both sides."

[[passage]]
at = "But the gnomon NOP and LG are the whole square CEFB"
kind = "helper"
helper = "Parallelogram.about_diameter"
note = "Euclid takes the gnomon NOP and LG together as the whole square CEFB. `Parallelogram.about_diameter` proves that the four parallelograms make up the square."

[figure]
case = "D between C and B, as in Heath's figure"

