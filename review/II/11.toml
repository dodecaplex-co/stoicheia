[[passage]]
at = "let AC be bisected at the point E"
kind = "helper"
helper = "BookI.Prop10"
note = "Euclid bisects AC at E without a reference here. The Lean uses I.10, then names the triangle AEB by its corners."

[[passage]]
at = "let CA be drawn through to F"
kind = "helper"
helper = "OnRay.exists_len_eq"
note = "Euclid puts F beyond A with EF equal to EB. The Lean proves EB greater than EA by I.17 and I.19, sets off EB on the ray EA with `OnRay.exists_len_eq`, and uses `OnRay.between_of_len_lt` to place F beyond A."

[[passage]]
at = "let the square FH be described on AF"
kind = "helper"
helper = "BookI.Prop20"
note = "Euclid draws the square FH and produces GH to K, taking H within AB and K on CD from the figure. The Lean draws the square by I.46, places H on the ray AB with `onRay_of_angle_eq` after using `Tacit.adjacent_eq_of_right` (now proved from I.13 and Common Notion 3 in `Elements/BookI/Prop13.lean`), uses I.20 and `OnRay.between_of_len_lt` to put H within AB, finds K with `BookI.Prop30.meet`, and uses `BookI.Prop30.parallel` (I.30, for which Heath gives no reference here) and `Parallel.between` to establish the parallels and point order that bound the rectangles."

[[passage]]
at = "Now the rectangle CF, FA is FK"
kind = "helper"
helper = "Rectangle.of_right"
note = "Euclid treats FK as a rectangle and identifies it by AF equal to FG. The Lean uses FGKC, built beneath the construction of FH using I.30 (`BookI.Prop30.parallel`), for which Heath gives no reference, carries FH's right angle at F along FC, proves the other angles right by `Rectangle.of_right`, and identifies its area by `Rectangle.eq_rect` with that equality of sides."

[[passage]]
at = "Let AK be subtracted from each"
kind = "helper"
helper = "quadArea_add_of_parallelograms"
note = "Euclid takes AK as the common part of FK and AD, leaving FH and HD. `quadArea_add_of_parallelograms` proves both divisions using the point order established beneath the construction of FH; the next sentence cancels AK by Common Notion 3."

[[passage]]
at = "And HD is the rectangle AB, BH"
kind = "helper"
helper = "Rectangle.of_right"
note = "Euclid treats HD as a rectangle and identifies it by AB equal to BD. The Lean uses HKDB, built beneath the construction of FH using I.30 (`BookI.Prop30.parallel`), for which Heath gives no reference, carries ABDC's right angle at B along BH, proves the other angles right by `Rectangle.of_right`, and identifies its area by `Rectangle.eq_rect` with that equality of sides."

