[[passage]]
at = "For let the square ADEB be described on AB"
kind = "helper"
helper = "BookI.Prop31.parallelogram"
note = "Euclid draws the square and CF, taking its meeting with DE at F from the figure and taking for granted that a parallel to AD is also parallel to BE; Heath gives no reference for the latter step. The Lean uses I.46 with `Square.described` for the square, `BookI.Prop31.parallelogram` for F and AF, and `BookI.Prop30.parallel` (I.30) to make CF parallel to BE too."

[[passage]]
at = "Then AE is equal to AF, CE"
kind = "helper"
helper = "quadArea_add_of_parallelograms"
note = "Euclid reads AF and CE together as the square AE. `Parallel.between` places F between D and E, and `quadArea_add_of_parallelograms` proves that the two parallelograms make up the whole."

[[passage]]
at = "AF is the rectangle contained by BA, AC"
kind = "helper"
helper = "Rectangle.of_right"
note = "Euclid treats AF as a rectangle because it has the square's right angle at A. `Rectangle.of_right` proves the other angles right by I.29, and `Rectangle.eq_rect` identifies its area from AD equal to AB."

[[passage]]
at = "and CE is the rectangle AB, BC"
kind = "helper"
helper = "Rectangle.of_right"
note = "Euclid treats CE as a rectangle with BE equal to AB. The Lean reads its corners from B, uses the square's right angle there with `Rectangle.of_right`, and identifies the same area by `Rectangle.eq_rect` and `rect_comm`."

