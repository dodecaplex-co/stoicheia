[statement]
scope = "full"
note = "`Prop14.outline` squares any figure given by its outline; `Prop14` keeps I.45's two triangles, as an area sum; the others take a figure with its triangles."
companions = ["II.14 outline", "II.14 outline_side", "II.14 rectangle", "II.14 sum", "II.14 apart", "II.14 figure", "II.14 square", "II.14 fan"]
fingerprint = "sha256:9e83215b978b4220"

[route]
kind = "euclid"
note = "`Prop14.rectangle` is the second part of Euclid's proof, the main theorem's argument after the rectangle is made, written out again so as not to cite II.14; `Prop14.sum` makes the rectangle for any number of triangles by I.45's `BookI.Prop45.sum`, in a right angle from I.11; and `Prop14.square` describes the square on the side found, by I.46, as Euclid's last words name it. `Prop14.outline` and `Prop14.outline_side` take the figure by its outline alone, as I.45's `BookI.Prop45.outline` does: Book Zero divides it into triangles that lie apart (`Figures.division_exists`), `Prop14.square` and `Prop14.apart` make the square and its side for those triangles, and their sum is the figure's area, the same for every division (`Figures.area_eq`)."

[[passage]]
at = "For let there be constructed the rectangular parallelogram BD"
kind = "helper"
helper = "Rectangle.of_right"
note = "Euclid asks I.45 for a rectangular parallelogram. The Lean first constructs a right angle by I.11, for which Heath gives no reference here, applies I.45 in it, and uses `Rectangle.of_right` (I.29) to prove the other three angles right. For a figure given by its outline, the triangles I.45 is applied to are proved to exist, a division into triangles that lie apart (`Figures.division_exists`), and every such division gives one sum, the figure's area (`Figures.Apart.area_eq_of_same_region`, `Figures.area_eq`), so the rectangle BD of `Prop14.outline` is equal to the figure A itself."

[[passage]]
at = "But, if not, one of the straight lines BE, ED is greater."
kind = "helper"
helper = "Tacit.lt_trichotomy"
note = "Euclid takes for granted that one of the unequal straight lines BE and ED is greater. The Lean obtains the two alternatives from `Tacit.lt_trichotomy`, a rule we assume about magnitudes (System E §3.5), not a proved lemma."

[[passage]]
at = "Let BE be greater"
kind = "case"
note = "Euclid takes BE the greater; when ED is, the Lean reads the rectangle the other way round, so one argument serves for both."

[[passage]]
at = "let EF be made equal to ED"
kind = "helper"
helper = "OnRay.exists_len_eq"
note = "Euclid makes EF equal to ED on BE produced, then bisects BF; Heath gives no reference for either step here. The Lean chooses F by `OnRay.exists_len_eq`, using Postulate 3 and `Tacit.line_circle_beyond` (the rule we assume as System E, Intersections 5), places E between B and F by `OnRay.between`, and bisects BF by I.10."

[[passage]]
at = "With centre G and distance one of the straight lines GB, GF"
kind = "helper"
helper = "Tacit.on_circle_of_len_eq"
note = "Euclid's semicircle passes through both B and F. Postulate 3 draws the whole circle with centre G through B, and `Tacit.on_circle_of_len_eq`, the rule we assume as System E, Diagram-segment 3, puts F on it because GF equals GB."

[[passage]]
at = "let DE be produced to H"
kind = "helper"
helper = "Tacit.line_circle_beyond"
note = "Euclid takes DE produced to meet the semicircle at H; since BE is greater than ED = EF and G bisects BF, the Lean puts G between B and E by `OnRay.between_of_len_lt`, also giving E different from G for the unequal cut in II.5. The Lean then puts E inside the circle by `between_inner` and `InsideCircle.of_between_centre`; `Tacit.line_circle_beyond`, the rule we assume as System E, Intersections 5, finds H beyond E from D, and GH is named by its ends."

[[passage]]
at = "But GF is equal to GH"
kind = "helper"
helper = "Definition15"
note = "Euclid uses the equality of the radii GF and GH without giving a reason. The Lean obtains their equality from `Definition15`, Euclid's definition of a circle, which we assume as a rule."

[[passage]]
at = "But the squares on HE, EG are equal to the square on GH"
kind = "helper"
helper = "BookI.Prop13"
note = "Euclid takes the right angle HEG for granted when he applies I.47. The Lean proves it in place: the angles DEB, BEH on the straight line DH make two right angles by I.13, taking away the rectangle's right angle DEB leaves BEH right by Common Notion 3, and the proved order B, G, E puts G on the ray EB, so that HEG is the angle HEB; then `BookI.Prop47.sq` applies I.47."

[representation]
tags = ["figure-with-dissection", "side-not-square"]
note = "The main theorem returns the straight line EH, and `sq E H` is the square on it, as Euclid ends with \"the square which can be described on EH\"; no four corners of a square are drawn there. The other side forms return a side in the same way: `Prop14.outline_side`, `Prop14.apart`, `Prop14.figure`, `Prop14.fan`, and the constructions `Prop14.rectangle` and `Prop14.sum`. `Prop14.outline` and `Prop14.square` draw the square, a parallelogram with its four corners. The main theorem is an area-sum theorem: it takes A₁A₂A₄ and A₄A₂A₃ unchecked, and they may overlap. It represents Euclid's pictured division when A₁ and A₃ lie on opposite sides of A₂A₄; that checked case is `Prop14.fan` for the corners A₄, A₁, A₂, A₃. `Prop14.outline` and `Prop14.outline_side` take the figure by its outline alone (`Figures.Outline`), as in I.45, with no division supplied; the older companions take a figure given with its division into triangles, checked, and square those triangles together: triangles that lie apart, allowing a figure with a hole (`Prop14.apart`, `Prop14.square`); triangles glued edge to edge in a suitable order, for a figure with one boundary (`Prop14.figure`); or Euclid's and Oliver Byrne's division from one corner, checked and shown to fit together (`Prop14.fan`). Their sum is the figure's area too, the same for every division."

[figure]
case = "BE greater than ED, as in Heath's figure, with the figure A of two triangles"

