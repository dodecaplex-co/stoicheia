[statement]
scope = "full"
note = "With its companions: `Prop14.apart` and `Prop14.square` take any figure given with triangles that lie apart, the square drawn; `Prop14` keeps two triangles."
companions = ["II.14 rectangle", "II.14 sum", "II.14 apart", "II.14 figure", "II.14 square", "II.14 fan"]
fingerprint = "sha256:164903fd832eae07"

[route]
kind = "euclid"
note = "`Prop14.rectangle` is the second part of Euclid's proof, the main theorem's argument after the rectangle is made, written out again so as not to cite II.14; `Prop14.sum` makes the rectangle for any number of triangles by I.45's `Prop45.sum`, in a right angle from I.11; and `Prop14.square` describes the square on the side found, by I.46, as Euclid's last words name it."

[[passage]]
at = "Let BE be greater"
kind = "case"
note = "Euclid takes BE the greater; when ED is, the Lean reads the rectangle the other way round, so one argument serves for both."

[representation]
tags = ["figure-with-dissection", "side-not-square"]
note = "A rectilineal figure is given with its division into triangles, checked, as in I.45: triangles that lie apart, for any figure, a figure with a hole among them (`Prop14.apart`, `Prop14.square`); triangles glued edge to edge in a suitable order, for a figure with one boundary (`Prop14.figure`); or Euclid's and Oliver Byrne's division from one corner, checked and shown to fit together (`Prop14.fan`). Equal to the figure means equal to those triangles together. That every figure can be so divided, and that another division gives the same sum, are not proved here; David Hilbert proved the second, for his measure of area. The main theorem is an area-sum theorem: it takes A₁A₂A₄ and A₄A₂A₃ unchecked, and they may overlap. It represents Euclid's pictured division when A₁ and A₃ lie on opposite sides of A₂A₄; that checked case is `Prop14.fan` for the corners A₄, A₁, A₂, A₃. The main theorem returns the straight line EH, and `sq E H` is the square on it, as Euclid ends with \"the square which can be described on EH\"; no four corners of a square are drawn there. `Prop14.square` draws them, on the side `Prop14.apart` finds, and with it carries full coverage."

[figure]
case = "BE greater than ED, as in Heath's figure, with the figure A of two triangles"

