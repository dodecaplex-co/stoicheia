[statement]
scope = "restricted"
short = "figures given with a checked division into triangles"
hypotheses = [
  "The figure is given with a checked division into triangles that do not overlap, no point inside two of them (`Apart` or `Rectilineal`, or the division from one corner that `Prop14.fan` checks); the main theorem takes I.45's two triangles unchecked. A figure given only by its boundary is not yet covered."
]
note = "`Prop14.square` squares a figure given with a checked division into triangles. Not yet proved: that every figure has one, and that another gives the same area."
companions = ["II.14 rectangle", "II.14 sum", "II.14 apart", "II.14 figure", "II.14 square", "II.14 fan"]
fingerprint = "sha256:9e83215b978b4220"

[route]
kind = "euclid"
note = "`Prop14.rectangle` is the second part of Euclid's proof, the main theorem's argument after the rectangle is made, written out again so as not to cite II.14; `Prop14.sum` makes the rectangle for any number of triangles by I.45's `BookI.Prop45.sum`, in a right angle from I.11; and `Prop14.square` describes the square on the side found, by I.46, as Euclid's last words name it."

[[passage]]
at = "For let there be constructed the rectangular parallelogram BD"
kind = "helper"
helper = "Rectangle.of_right"
note = "Euclid asks I.45 for a rectangular parallelogram. The Lean first constructs a right angle by I.11, for which Heath gives no reference here, applies I.45 in it, and uses `Rectangle.of_right` (I.29) to prove the other three angles right."

[[passage]]
at = "But, if not, one of the straight lines BE, ED is greater."
kind = "helper"
helper = "Tacit.lt_trichotomy"
note = "Euclid takes for granted that one of the unequal straight lines BE and ED is greater. The Lean obtains the two alternatives from `Tacit.lt_trichotomy`, a tacit rule of magnitude, which we assume (System E §3.5)."

[[passage]]
at = "Let BE be greater"
kind = "case"
note = "Euclid takes BE the greater; when ED is, the Lean reads the rectangle the other way round, so one argument serves for both."

[[passage]]
at = "let EF be made equal to ED"
kind = "helper"
helper = "OnRay.exists_len_eq"
note = "Euclid makes EF equal to ED on BE produced, then bisects BF; Heath gives no reference for either step here. The Lean chooses F by `OnRay.exists_len_eq`, using Postulate 3 and `Tacit.line_circle_beyond` (System E, Intersections 5), places E between B and F by `OnRay.between`, and bisects BF by I.10."

[[passage]]
at = "With centre G and distance one of the straight lines GB, GF"
kind = "helper"
helper = "Tacit.on_circle_of_len_eq"
note = "Euclid's semicircle passes through both B and F. Postulate 3 draws the whole circle with centre G through B, and `Tacit.on_circle_of_len_eq` (System E, Diagram-segment 3) puts F on it because GF equals GB."

[[passage]]
at = "let DE be produced to H"
kind = "helper"
helper = "Tacit.line_circle_beyond"
note = "Euclid takes DE produced to meet the semicircle at H; since BE is greater than ED = EF and G bisects BF, the Lean puts G between B and E by `OnRay.between_of_len_lt`, also giving E different from G for the unequal cut in II.5. The Lean then puts E inside the circle by `between_inner` and `InsideCircle.of_between_centre`; `Tacit.line_circle_beyond` finds H beyond E from D, and GH is named by its ends."

[[passage]]
at = "But GF is equal to GH"
kind = "helper"
helper = "Definition15"
note = "Euclid uses the equality of the radii GF and GH without giving a reason. The Lean obtains their equality from `Definition15`, Euclid's definition of a circle, which we assume as a rule."

[[passage]]
at = "But the squares on HE, EG are equal to the square on GH"
kind = "helper"
helper = "Tacit.adjacent_eq_of_right"
note = "Euclid takes the right angle HEG for granted when he applies I.47. The Lean gets the adjacent right angle BEH from the rectangle's right angle DEB by `Tacit.adjacent_eq_of_right` (I.13), identifies it with HEG because the proved order B, G, E puts G on the ray EB, and applies `BookI.Prop47.sq`."

[representation]
tags = ["figure-with-dissection", "side-not-square"]
note = "The main theorem takes A₁A₂A₄ and A₄A₂A₃, I.45's ABD and DBC, unchecked, and they may overlap. They make Euclid's four-sided figure A, divided as in I.45, when A₁ and A₃ lie on opposite sides of A₂A₄; that checked case is `Prop14.fan` for the corners A₄, A₁, A₂, A₃. The main theorem returns the straight line EH, and `sq E H`, the square on it, is equal to the sum of the two triangles, as Euclid ends with \"the square which can be described on EH\"; no four corners of a square are drawn there. Four companions take a rectilineal figure given with a checked division into triangles, as in I.45: triangles that lie apart, so the figure may have a hole (`Prop14.apart`, and `Prop14.square`, which draws the square's four corners on the side `Prop14.apart` finds, by I.46); triangles glued edge to edge in a suitable order, for a figure with one boundary (`Prop14.figure`); or Euclid's and Oliver Byrne's division from one corner, checked and shown to fit together (`Prop14.fan`). Equal to the figure means equal to those triangles together. Not yet proved ([#116](https://github.com/jackChallis/stoicheia/issues/116)): that every rectilineal figure, given only by its boundary, has such a division, and that another division gives the same area. David Hilbert proved the second, for his measure of area."

[figure]
case = "BE greater than ED, and A four-sided, as in Heath's figure; the main theorem takes A as the two triangles a diameter divides it into, though no diameter is drawn"

