[statement]
scope = "restricted"
hypotheses = [
  "the rectilineal figure A is two triangles on a common side A₂A₄, as our I.45 takes it (`h₁ : Triangle A₁ A₂ A₄`, `h₂ : Triangle A₄ A₂ A₃`)",
]
note = "Proved for a figure of two triangles on a common side, as our I.45 takes it; Euclid's figure may have any number of sides."
short = "a figure of two triangles"
fingerprint = "sha256:164903fd832eae07"

[route]
kind = "euclid"

[[passage]]
at = "Let BE be greater"
kind = "case"
note = "Euclid takes BE the greater; when ED is, the Lean reads the rectangle the other way round, so one argument serves for both."

[representation]
tags = ["two-triangles", "side-not-square"]
note = "The figure enters as the sum of the two triangles' areas, △ A₁ A₂ A₄ + △ A₄ A₂ A₃. Nothing asks A₁ and A₃ to lie on opposite sides of A₂A₄, so the two triangles may overlap, and the square is then equal to the sum of their areas. The construction returns the straight line EH, and `sq E H` is the square on it, as Euclid ends with \"the square which can be described on EH\"; no four corners of a square are drawn."

[figure]
case = "BE greater than ED, as in Heath's figure"

