[statement]
scope = "full"
note = "`Prop14.outline` and `Prop14.outline_side` take a figure by its boundary; `Prop14` takes two triangles unchecked; the rest, lists of triangles or a rectangle."
companions = ["II.14 outline", "II.14 outline_side", "II.14 rectangle", "II.14 sum", "II.14 apart", "II.14 figure", "II.14 square", "II.14 fan"]
fingerprint = "sha256:31d611e6d2d47392"

[route]
kind = "euclid"
note = "`Prop14.rectangle` is the second part of Euclid's proof, the main theorem's argument after the rectangle is made, written out again so as not to cite II.14; `Prop14.sum` makes the rectangle for any number of triangles by I.45's `BookI.Prop45.sum`, in a right angle from I.11; and `Prop14.square` describes the square on the side found, by I.46, as Euclid's last words name it. `Prop14.apart`, and through it `Prop14.figure` and `Prop14.fan`, is `Prop14.sum` for the triangles a figure is given with. For `Prop14.outline` and `Prop14.outline_side`, as for I.45's `BookI.Prop45.outline`, Book Zero divides the figure into triangles that do not overlap, no point inside two of them (`Figures.division_exists`), and `Prop14.square` makes the square for those triangles, equal to the figure's area (see Representation), and `Prop14.apart` its side."

[[passage]]
at = "For let there be constructed the rectangular parallelogram BD"
kind = "helper"
helper = "Rectangle.of_right"
note = "Euclid asks I.45 for a rectangular parallelogram. The Lean first constructs a right angle by I.11, for which Heath gives no reference here, applies I.45 in it, and uses `Rectangle.of_right` (I.29) to prove the other three angles right. For a figure given by its outline, the triangles I.45 is applied to are proved to exist, a division into triangles that lie apart (`Figures.division_exists`), and every such division gives one sum, the figure's area (`Figures.Apart.area_eq_of_same_region`, `Figures.area_eq`), so the rectangle BD of `Prop14.outline` is equal to the figure A itself."

[[passage]]
at = "But, if not, one of the straight lines BE, ED is greater."
kind = "helper"
helper = "Tacit.lt_trichotomy"
note = "Euclid takes for granted that one of the unequal straight lines BE and ED is greater. The Lean obtains the two alternatives from `Tacit.lt_trichotomy`, a tacit rule of magnitude, which we assume (System E §3.5)."

[[passage]]
at = "Let BE be greater"
kind = "case"
note = "Euclid takes BE the greater; when ED is, the Lean reads the rectangle the other way round, so one argument serves for both."

[[passage]]
at = "let EF be made equal to ED"
kind = "helper"
helper = "OnRay.exists_len_eq"
note = "Euclid makes EF equal to ED on BE produced, then bisects BF; Heath gives no reference for either step here. The Lean chooses F by `OnRay.exists_len_eq`, using Postulate 3 and `Tacit.line_circle_beyond` (System E, Intersections 5), places E between B and F by `OnRay.between`, and bisects BF by I.10."

[[passage]]
at = "With centre G and distance one of the straight lines GB, GF"
kind = "helper"
helper = "Tacit.on_circle_of_len_eq"
note = "Euclid's semicircle passes through both B and F. Postulate 3 draws the whole circle with centre G through B, and `Tacit.on_circle_of_len_eq` (System E, Diagram-segment 3), now proved in `Elements/Figure/RuleBase.lean` by comparing lengths on the straight line from the centre through the point, with our radius rule (`Tacit.radius_ne_zero`) and Postulate 3, puts F on it because GF equals GB; until 26 October 2026 that rule was proved from Postulate 3 and `circle_eq`."

[[passage]]
at = "let DE be produced to H"
kind = "helper"
helper = "Tacit.line_circle_beyond"
note = "Euclid takes DE produced to meet the semicircle at H; since BE is greater than ED = EF and G bisects BF, the Lean puts G between B and E by `OnRay.between_of_len_lt`, also giving E different from G for the unequal cut in II.5. The Lean then puts E inside the circle by `between_inner` and `InsideCircle.of_between_centre`; `Tacit.line_circle_beyond` finds H beyond E from D, and GH is named by its ends."

[[passage]]
at = "But GF is equal to GH"
kind = "helper"
helper = "Definition15"
note = "Euclid uses the equality of the radii GF and GH without giving a reason. The Lean obtains their equality from `Definition15`, Euclid's definition of a circle, which we assume as a rule."

[[passage]]
at = "But the squares on HE, EG are equal to the square on GH"
kind = "helper"
helper = "BookI.Prop13"
note = "Euclid takes the right angle HEG for granted when he applies I.47. The Lean proves it in place: the angles DEB, BEH on the straight line DH make two right angles by I.13, taking away the rectangle's right angle DEB leaves BEH right by Common Notion 3, and the proved order B, G, E puts G on the ray EB, so that HEG is the angle HEB; then `BookI.Prop47.sq` applies I.47."

[representation]
tags = ["figure-with-dissection", "side-not-square"]
note = "The main theorem is an area-sum theorem: it takes its two triangles, A₁A₂A₄ and A₄A₂A₃, unchecked, so that they may overlap, and returns the straight line EH, and `sq E H` is the square on it, as Euclid ends with \"the square which can be described on EH\"; no four corners of a square are drawn there. The main theorem's two triangles represent the division Euclid pictures in I.45 when A₁ and A₃ lie on opposite sides of A₂A₄; that checked case is `Prop14.fan` for the corners A₄, A₁, A₂, A₃. `Prop14.outline` and `Prop14.square` draw the square, a parallelogram with its four corners; every other companion returns a side, as the main theorem does. The figure is given as in I.45. `Prop14.outline` and `Prop14.outline_side` take it by its boundary alone, an outline with no division (`Figures.Outline`), and their square is equal to its area, the one sum that every division of it gives (`Figures.area_eq`). The older companions take a figure given with a checked division into triangles, and square those triangles together: triangles that lie apart, allowing a figure with a hole (`Prop14.apart`, `Prop14.square`); triangles glued edge to edge in a suitable order, for a figure with one boundary (`Prop14.figure`); or Euclid's and Oliver Byrne's division from one corner, checked and shown to fit together (`Prop14.fan`)."

[figure]
case = "BE greater than ED, and A four-sided with no diagonal drawn, as in Heath's figure"

