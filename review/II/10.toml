[[passage]]
at = "and through D let FD be drawn parallel to CE"
kind = "helper"
helper = "Prop31.parallelogram"
note = "Euclid draws the parallel through D and takes its meeting F with EF from the figure. `Prop31.parallelogram` carries I.31's construction together with that meeting, using I.30, and proves that ECDF is a parallelogram."

[[passage]]
at = "therefore the angles FEB, EFD are less than two right angles"
kind = "helper"
helper = "angle_add_of_within"
note = "Euclid takes EB to fall within CEF, so FEB is less than CEF. The Lean proves that B lies on the required sides of EC and EF, splits CEF with `angle_add_of_within`, and uses the positive angle CEB and Common Notion 5 to make the sum less than two right angles."

[[passage]]
at = "therefore EB, FD, if produced in the direction B, D, will meet"
kind = "grouped"
helper = "Postulate5"
note = "One application of Postulate 5, under the sentence before, carries both that sentence and this conclusion; the Lean then takes the meeting point G. `Postulate5` is a rule we assume, stated as System E's Diagram-angle 5."

[[passage]]
at = "Let them be produced and meet at G"
kind = "helper"
helper = "Between.of_inside"
note = "Euclid puts G beyond B on EB and beyond D on FD. After taking the meeting supplied by Postulate 5, the Lean proves that B lies between E and G with `Between.of_inside`, and that D lies between F and G with `Between.of_sameSide`."

[[passage]]
at = "and let AG be joined"
kind = "given"
note = "Our triangles AEG and ADG are named by their corners, so no straight line AG is drawn; it is their common side."

[[passage]]
at = "therefore the angle AEB is right"
kind = "helper"
helper = "angle_add_of_between"
note = "Euclid adds the two half-right angles at E to obtain AEB. `angle_add_of_between` shows that EC divides AEB because C lies between A and B; the Lean then adds the equal halves."

[[passage]]
at = "But the square on EA was also proved double of the square on AC"
kind = "grouped"
note = "Euclid recalls the square on EA and adds it to the square on EG. One step in the Lean uses both earlier equalities and regroups their sum as twice the squares on AC and CD together."

