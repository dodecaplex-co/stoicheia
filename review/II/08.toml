[[passage]]
at = "For let [the straight line] BD be produced"
kind = "given"
note = "Euclid produces AB to D with BD equal to CB. The statement takes every D with these properties, so the Lean introduces D and its two hypotheses here."

[[passage]]
at = "let the square AEFD be described on AD"
kind = "helper"
helper = "Prop8.cell"
note = "Euclid reads each cell of the figure drawn double as a parallelogram; the Lean proves it once, for the corners where two pairs of parallels meet. The Lean draws the square by I.46 and the two figures by `Parallelogram.figure`, each about the diameter DE: through B, BL parallel to AE, cutting DE at K, and MN through K parallel to AD; through C, CH parallel to AE, cutting DE at Q, and OP through Q parallel to AD. It obtains their complements by `Parallelogram.complements`, proves CH parallel to BL and MN parallel to OP with `BookI.Prop30.parallel` (I.30, for which Heath gives no reference here) to form the cells and order points across three parallels, finds G and R with `BookI.Prop30.meet`, and establishes the order of their points with `Parallel.between`."

[[passage]]
at = "while CB is equal to GK, and BD to KN"
kind = "helper"
helper = "BookI.Prop34"
note = "Euclid takes CB equal to GK and BD to KN from the opposite sides of the two parallelograms. The Lean applies I.34 to each, although Heath gives no reference here."

[[passage]]
at = "Again, since CB is equal to BD"
kind = "helper"
helper = "Square.about_diameter"
note = "Euclid takes BD equal to BK from the square DK. `Square.about_diameter` proves that DK is a square, and I.34 gives BK equal to CG in the parallelogram CK."

[[passage]]
at = "and CB is equal to GK, that is GQ"
kind = "helper"
helper = "Square.about_diameter"
note = "Euclid takes GK equal to GQ from the square GR. The Lean applies `Square.about_diameter` first to CP and then to GR within it, and combines this equality with CB equal to GK."

[[passage]]
at = "therefore the eight areas, which contain the gnomon STU"
kind = "helper"
helper = "quadArea_add_of_parallelograms"
note = "Euclid reads the gnomon STU as eight cells and AK as AG and CK together. `Parallelogram.about_diameter` divides CP into four cells, and `quadArea_add_of_parallelograms` divides AQ, QF and AK into two each, so the two groups of four equal areas give four times AK. Definition II.2's gnomon has no Lean word of its own: here and in the four later sentences that name it, the Lean carries the gnomon STU as the sum of the areas of its three parallelograms, CP, about the diameter DE, and the complements AQ and QF beside it."

[[passage]]
at = "Now, since AK is the rectangle AB, BD"
kind = "helper"
helper = "Rectangle.of_right"
note = "Euclid treats AK as a rectangle and identifies it by BK equal to BD. The Lean takes AMKB from `Parallelogram.complements` beneath the double figure and the side equality from the square DK beneath \"Again, since CB is equal to BD\", transfers AEFD's right angle at A to BAM, proves the other angles right by `Rectangle.of_right`, and identifies its area by `Rectangle.eq_rect`."

[[passage]]
at = "Let OH, which is equal to the square on AC"
kind = "helper"
helper = "Square.about_diameter"
note = "Euclid takes OH to be the square on AC. `Square.about_diameter` makes OH a square, and I.34 with `Square.eq_sq` identifies its area as the square on AC; the next sentence adds it to both sides."

[[passage]]
at = "But the gnomon STU and OH are the whole square AEFD"
kind = "helper"
helper = "Parallelogram.about_diameter"
note = "Euclid takes the gnomon STU and OH together as the whole square AEFD. `Parallelogram.about_diameter` proves that CP, its two complements and OH make up the square."

