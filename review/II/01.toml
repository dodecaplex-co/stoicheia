[statement]
scope = "full"
note = "With its companions: `Prop1.general` cuts the straight line at any number of points in order, `Prop1.two` at one; `Prop1` keeps Euclid's two, D and E."
companions = ["II.1 two", "II.1 general"]
fingerprint = "sha256:cce87676f32541bb"

[route]
kind = "euclid"
note = "Euclid draws every parallel in one figure. The companions draw one at a time: `Prop1.two` is his construction for one point of section, and `Prop1.general` repeats it, cutting off one segment after another (`InOrder.between_end`)."

[representation]
tags = ["hypothesis-dropped"]
note = "The straight line A is named by its two ends, A₁ and A₂, and the main theorem asks them to differ. The companions do not: A₁A₂ may be nothing, and then every rectangle is nothing, so they claim a little more than Euclid's two straight lines. `Prop1.general` takes the straight line from B cut at points given in order along it (`InOrder`), and adds the rectangles on its segments as a sum over the list; with no point of section the one segment is the whole, and with no point at all the straight line and each rectangle are nothing."

[figure]
case = "BC cut at two points, D and E, as in Heath's figure"

