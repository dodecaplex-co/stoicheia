name = "stoicheia"
version = "0.1.0"
defaultTargets = ["Elements"]

[[lean_lib]]
name = "Elements"

# Audit lemmas for docs/reports/overlaps.md. Nothing imports them and they are not in the
# default build; `lake build Audit` checks them.
[[lean_lib]]
name = "Audit"

# Statements before their proofs, written with `sorry` where each proof is due, and approved
# before any proof is assigned (docs/WORKFLOW.md, section 2). They import Elements, and
# nothing imports them; they are not in the default build. `lake build Staging` checks
# them, `sorry` warnings and all. A statement leaves Staging when it is proved.
[[lean_lib]]
name = "Staging"
