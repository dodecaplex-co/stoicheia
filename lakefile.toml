name = "stoicheia"
version = "0.1.0"
defaultTargets = ["Elements"]

[[lean_lib]]
name = "Elements"

# Audit lemmas for docs/reports/overlaps.md. Nothing imports them and they are not in the
# default build; `lake build Audit` checks them.
[[lean_lib]]
name = "Audit"

# Statements that a stage of brief 0005, or of a later brief, adds or changes, until they
# move to Elements/, with the few proofs docs/WORKFLOW.md, section 2, allows here. Nothing
# imports them and they are not in the default build; `lake build Staging` builds the root
# and every file under Staging/, whether or not the root imports it. The glob reads
# Staging/, which Staging/.gitkeep keeps when nothing is staged.
[[lean_lib]]
name = "Staging"
globs = ["Staging.*"]
