name = "model"
version = "0.1.0"
defaultTargets = ["Model", "Check"]

# Mathlib, pinned to the release made for Lean v4.35.0 (the toolchain in lean-toolchain,
# the same as the main package's). lake-manifest.json pins the exact commit.
[[require]]
name = "mathlib"
scope = "leanprover-community"
rev = "v4.35.0"

# Check reads the edition to compare translations with the original declarations.
# Model shares only Elements.Foundations.Superposition.{Syntax,Semantics,Soundness,Restriction},
# whose transitive declarations are checked to use no geometric words or project axioms.
# The main package depends on nothing here.
[[require]]
name = "stoicheia"
path = ".."

# The signature, the translated laws and the Euclidean interpretation. Imports Mathlib
# and only the four pure Elements modules named above. Model.Audit checks that boundary.
[[lean_lib]]
name = "Model"

# Translation checks and the generator: imports Elements.Foundations and the plain-Lean part
# of Model (Model.Signature, Model.Laws, Model.Hand), never Mathlib. Its modules read files
# that are not Lean imports: the lock and its hash, the files the generator writes, and the
# proofs in the plane, whose theorems the assembly gathers. Lake reruns a module only when
# its inputs change, so the library `needs` each of those files, and any change to one of
# them reruns the checks, as a fresh build in CI does.
[[lean_lib]]
name = "Check"
needs = ["axiomsLock", "lockHash", "generatedLaws", "generatedChecks", "generatedAssembly",
  "planeProofs"]

[[input_file]]
name = "axiomsLock"
path = "../Certificate/axioms.lock"
text = true

[[input_file]]
name = "lockHash"
path = "lock.sha256"
text = true

[[input_file]]
name = "generatedLaws"
path = "Model/Laws.lean"
text = true

[[input_file]]
name = "generatedChecks"
path = "Check/Laws.lean"
text = true

[[input_file]]
name = "generatedAssembly"
path = "Model/Assembly.lean"
text = true

[[input_dir]]
name = "planeProofs"
path = "Model/Euclidean"
text = true
