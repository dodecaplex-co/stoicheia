name = "model"
version = "0.1.0"
defaultTargets = ["Model", "Check"]

# Mathlib, pinned to the release made for Lean v4.35.0 (the toolchain in lean-toolchain,
# the same as the main package's). lake-manifest.json pins the exact commit.
[[require]]
name = "mathlib"
scope = "leanprover-community"
rev = "v4.35.0"

# Check reads the edition to compare translations with the original declarations.
# Model shares only Elements.Foundations.Superposition.{Syntax,Semantics,Soundness,Restriction},
# whose transitive declarations are checked to use no geometric words or project axioms.
# The main package depends on nothing here.
[[require]]
name = "stoicheia"
path = ".."

# The signature, the translated laws and the Euclidean interpretation. Imports Mathlib
# and exactly the four pure Elements modules named above. Check.Generator audits that
# import boundary and the shared declarations' purity.
[[lean_lib]]
name = "Model"

# Translation checks and the generator: imports Elements.Foundations and the plain-Lean part
# of Model (Model.Signature, Model.Laws, Model.Hand), never Mathlib. Its modules read files
# that are not Lean imports: the lock and its hash, the files the generator writes, and the
# proofs in the plane, whose theorems the assembly gathers, and the import audit's sources.
# Lake reruns a module only when its inputs change, so the library `needs` each of those
# files, and any change to one of them reruns the checks, as a fresh build in CI does.
[[lean_lib]]
name = "Check"
needs = ["axiomsLock", "lockHash", "generatedLaws", "generatedChecks", "generatedAssembly",
  "planeProofs", "modelRoot", "modelSources", "pureSources"]

[[input_file]]
name = "axiomsLock"
path = "../Certificate/axioms.lock"
text = true

[[input_file]]
name = "lockHash"
path = "lock.sha256"
text = true

[[input_file]]
name = "generatedLaws"
path = "Model/Laws.lean"
text = true

[[input_file]]
name = "generatedChecks"
path = "Check/Laws.lean"
text = true

[[input_file]]
name = "generatedAssembly"
path = "Model/Assembly.lean"
text = true

[[input_dir]]
name = "planeProofs"
path = "Model/Euclidean"
text = true

# The import audit reads the library root as well as every Model source, including files
# not imported by the root. A directory input also tracks additions and removals.
[[input_file]]
name = "modelRoot"
path = "Model.lean"
text = true

[[input_dir]]
name = "modelSources"
path = "Model"
text = true

# Track the foundations parent, which existed before the pure modules arrived. This
# covers additions, removals and edits throughout the shared Superposition directory.
[[input_dir]]
name = "pureSources"
path = "../Elements/Foundations"
text = true
