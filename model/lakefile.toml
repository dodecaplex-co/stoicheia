name = "model"
version = "0.1.0"
defaultTargets = ["Model", "Check"]

# Mathlib, pinned to the release made for Lean v4.35.0 (the toolchain in lean-toolchain,
# the same as the main package's). lake-manifest.json pins the exact commit.
[[require]]
name = "mathlib"
scope = "leanprover-community"
rev = "v4.35.0"

# The edition itself, read only by the Check library to compare translations with the
# original declarations. The Model library never imports it, and the main package
# depends on nothing here.
[[require]]
name = "stoicheia"
path = ".."

# The signature, the translated laws and the Euclidean interpretation. Imports Mathlib,
# never Elements.
[[lean_lib]]
name = "Model"

# Translation checks: imports Elements.Foundations and the plain-Lean part of Model
# (Model.Signature, Model.Hand), never Mathlib.
[[lean_lib]]
name = "Check"
