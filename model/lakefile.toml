name = "model"
version = "0.1.0"
defaultTargets = ["Model", "Check"]

# Mathlib, pinned to the release made for Lean v4.35.0 (the toolchain in lean-toolchain,
# the same as the main package's). lake-manifest.json pins the exact commit.
[[require]]
name = "mathlib"
scope = "leanprover-community"
rev = "v4.35.0"

# The edition itself, read only by the Check library to compare translations with the
# original declarations. Model may import only its four audited pure superposition
# modules when they arrive; the main package depends on nothing here.
[[require]]
name = "stoicheia"
path = ".."

# The signature, the translated laws and the Euclidean interpretation. Imports Mathlib;
# Check.Generator audits the boundary with the edition.
[[lean_lib]]
name = "Model"

# Translation checks and the generator: imports Elements.Foundations and the plain-Lean part
# of Model (Model.Signature, Model.Laws, Model.Hand), never Mathlib. Its modules read files
# that are not Lean imports: the lock and its hash, the files the generator writes, and the
# proofs in the plane, whose theorems the assembly gathers, and the import audit's sources.
# The library `needs` these inputs. Lake hashes text with line endings normalised;
# content changes or a file entering or leaving a filtered directory input rerun the
# checks. Timestamps and filenames alone are not hashed. CI's fresh build runs every
# check regardless of these local cache traces.
[[lean_lib]]
name = "Check"
needs = ["axiomsLock", "lockHash", "generatedLaws", "generatedChecks", "generatedAssembly",
  "planeProofs", "modelRoot", "modelSources", "pureSources"]

[[input_file]]
name = "axiomsLock"
path = "../Certificate/axioms.lock"
text = true

[[input_file]]
name = "lockHash"
path = "lock.sha256"
text = true

[[input_file]]
name = "generatedLaws"
path = "Model/Laws.lean"
text = true

[[input_file]]
name = "generatedChecks"
path = "Check/Laws.lean"
text = true

[[input_file]]
name = "generatedAssembly"
path = "Model/Assembly.lean"
text = true

[[input_dir]]
name = "planeProofs"
path = "Model/Euclidean"
text = true
filter = { extension = ["lean"] }

# The import audit reads the library root as well as every Model source, including files
# not imported by the root. Filter before hashing: a same-content .txt to .lean rename
# must add a hashed input, since it adds a source to the audit.
[[input_file]]
name = "modelRoot"
path = "Model.lean"
text = true

[[input_dir]]
name = "modelSources"
path = "Model"
text = true
filter = { extension = ["lean"] }

# Superposition does not exist on main yet. Lake rejects a missing input directory, so
# track Lean files under its existing parent, a superset of the four pure sources.
# The extension filter also catches the first source arriving by a .txt to .lean rename.
[[input_dir]]
name = "pureSources"
path = "../Elements/Foundations"
text = true
filter = { extension = ["lean"] }
