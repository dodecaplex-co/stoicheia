name: Safe-push tests

# scripts/test_safe_push.py, the tests of the gate every pull request lands through
# (docs/WORKFLOW.md, sections 8 and 10), run on a cadence rather than on each pull request
# (the owner, 22 October 2026: "I'm fine that this needs to run on a cadence and blocks
# release but every run no. And it has to be fast"; the decision entry
# docs/decisions/2026-10-22-suite-on-cadence.md): every six hours on main, and on demand.
# The suite runs in shards side by side, and the job named safe-push-tests gives the
# verdict on them all (#233). Beside them, on the same triggers, run the full negative
# tests and the formal model's build and kernel re-check, which CI skips on pull requests
# of the lower risk classes, the formal model only when the change touches none of its
# inputs (docs/decisions/2026-10-22-risk-lanes.md). A red run of safe-push-tests or of
# either of the other two opens one issue labelled blocks-release, or adds the run to the
# one already open, so the release waits for it.
on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions: {}

jobs:
  safe-push-shards:
    # The whole of scripts/test_safe_push.py, in eight shards side by side. In one job, on
    # the cadence, it took 72 to 78 minutes, 137 on a slow runner (run 39901919693), and on
    # as slow a runner it reached 150 and was cancelled there (run 39946930069).
    # `--shard K/N` lists the tests with unittest's own loader and deals them out by the
    # seconds each took on a GitHub runner (scripts/test_safe_push_times.json), so that
    # each test runs in exactly one shard; a test missing from that file weighs their
    # median, and still runs. The tests need Git with the whole history and the pinned YAML
    # parser, but no Lean and no network: FullChecks, which needs Lean, is skipped without
    # STOICHEIA_SLOW_TESTS=1, as it is anywhere.
    runs-on: ubuntu-latest
    permissions:
      contents: read
    # The slowest run in one job was still going at 150 minutes; shared among eight, with
    # each shard's own setup, that leaves room to spare.
    timeout-minutes: 60
    strategy:
      # Every shard runs to its end, so that one failing hides none of the others'.
      fail-fast: false
      matrix:
        # 1 to N, each once, and N written here alone: strategy.job-total, which each
        # shard is given as N, is N too, and the proof reads N from this list.
        shard: [1, 2, 3, 4, 5, 6, 7, 8]
    steps:
      - uses: actions/checkout@v5
        with:
          # The tests clone this repository.
          fetch-depth: 0
          # No token stays in .git/config while the tests run.
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install the pinned YAML parser the tests read the workflow with
        run: python3 -m pip install -r scripts/requirements-test_safe_push.txt

      - name: Check the gate every pull request lands through, guard by guard, one shard of the tests
        # --ran: after its run the shard writes the tests it ran, each with its outcome.
        run: |
          set -o pipefail
          python3 scripts/test_safe_push.py --shard ${{ matrix.shard }}/${{ strategy.job-total }} --ran "$RUNNER_TEMP/ran-${{ matrix.shard }}.json" 2>&1 | tee "$RUNNER_TEMP/test_safe_push-${{ matrix.shard }}.log"

      - name: Keep the list of the tests this shard ran, for the proof
        # Kept when a test failed too, so that the proof names it. A shard that stops
        # before its end writes no list and keeps none, and the proof then fails. A shard
        # run again replaces its list. Kept for 35 days. Either kind of rerun is judged on
        # every shard's list (#411): a rerun of all the jobs afresh, and a rerun of some of
        # them, as of the failed jobs, on the lists of the shards it runs again and on those
        # the others kept in an earlier attempt, which the verdict's fetch finds. #411 saw it
        # on GitHub: one shard of run 40122901299, a green run no job of which had failed,
        # was run again alone, and the verdict's fetch, which names no run-id, found all 16
        # artifacts, every shard's list and log, the first attempt's among them, and
        # fetched the eight lists by its pattern; the proof passed on all 466 tests. A
        # rerun of the failed jobs makes a later attempt of the same kind and fetches the
        # same way. The proof never passes on lists it cannot see, should GitHub ever
        # withhold one.
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: safe-push-ran-${{ matrix.shard }}
          path: ${{ runner.temp }}/ran-${{ matrix.shard }}.json
          if-no-files-found: error
          retention-days: 35
          overwrite: true

      - name: Keep the shard's log, for the issue a red run opens
        # A shard run again replaces its log too.
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: test_safe_push-log-${{ matrix.shard }}
          path: ${{ runner.temp }}/test_safe_push-${{ matrix.shard }}.log
          retention-days: 35
          if-no-files-found: ignore
          overwrite: true

  safe-push-tests:
    # The verdict on the shards, under the job's old name, which the release's gate and
    # the report read. It runs whatever the shards' result (always()), so that it is never
    # skipped, and it is green only when two things hold, each judged on its own:
    # - GitHub's result for the matrix, one value for all its shards, is success, which it
    #   is only when every shard succeeded. Anything else is red: failure, cancelled,
    #   skipped, or any other value. A shard stopped at its time limit gives failure or
    #   cancelled, red either way.
    # - The proof passed: every shard's list is there, and they show each test the loader
    #   lists run once and passed. Each list carries its shard's K and N and each test's
    #   outcome, and the proof fails on a K from 1 to N with no list, so a shard that did
    #   not run, or stopped before its end, fails it; and on any test that did not pass, so
    #   a shard one of whose tests failed fails it too.
    # Neither can pass with a shard missing. Both are needed: a later attempt can see a list
    # an earlier one kept (#411), and that list stays when, in a rerun of all the jobs, its
    # shard is cancelled before it keeps a new one, so the proof alone could pass; and the
    # matrix's result says nothing of which tests ran.
    needs: safe-push-shards
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 10
    steps:
      # The proof checks out the commit the shards ran, as they did, and reads the tests
      # unittest's loader lists there and the N of the matrix there.
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          # No token stays in .git/config.
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install the pinned YAML parser the proof reads the workflow with
        id: install
        run: python3 -m pip install -r scripts/requirements-test_safe_push.txt

      - name: Fetch every shard's list of the tests it ran
        # A fetch that fails fails the job, and the proof still runs, naming each list it
        # lacks.
        id: fetch
        uses: actions/download-artifact@v5
        with:
          # Each list in a folder of its own, so that none can hide another.
          pattern: safe-push-ran-*
          path: ${{ runner.temp }}/safe-push-ran

      - name: Prove that every test ran once, in one shard, and passed
        # Against the tests unittest's loader lists at this commit and the matrix's N, it
        # fails, naming each, on a test no shard ran, a test run twice, a shard that left
        # no list, a test the loader does not list, and a test that did not pass. It runs
        # once the checkout, Python and the parser are ready, whatever the shards' result
        # and whether or not the fetch failed.
        id: cover
        if: always() && steps.install.outcome == 'success'
        run: python3 scripts/test_safe_push.py --cover "$RUNNER_TEMP/safe-push-ran"

      - name: Pass only when every shard succeeded and the proof passed
        # Whatever failed before it; a failed fetch fails the job by itself.
        id: verdict
        if: always()
        env:
          SHARDS: ${{ needs.safe-push-shards.result }}
          COVER: ${{ steps.cover.outcome }}
        run: |
          red=0
          case "$SHARDS" in
            success) echo "Every shard of scripts/test_safe_push.py succeeded." ;;
            failure) echo "The shards ended in failure: a shard failed, and the proof above and the shard's log name the test."; red=1 ;;
            cancelled) echo "The shards ended cancelled: a shard was cancelled, so not every test is known to have passed."; red=1 ;;
            skipped) echo "The shards were skipped, so no test ran."; red=1 ;;
            *) echo "The shards ended '$SHARDS', which is not success."; red=1 ;;
          esac
          if [ "$COVER" = success ]; then
            echo "The shards' lists prove that every test ran once, in one shard, and passed."
          else
            echo "The proof that every test ran once, in one shard, and passed ended '$COVER', not success."
            red=1
          fi
          exit "$red"

  negative-tests:
    # The negative tests in full, as CI's `negative` job runs them: break the project on
    # purpose, and check that every break is caught. CI runs them on every push to main,
    # and on a pull request of class R3 and above; here they run on main
    # for what the pull requests of R0 to R2 landed without them. Not named `negative`, so
    # that a run of this workflow on a pull request's branch posts no check of a required
    # check's name.
    runs-on: ubuntu-latest
    permissions:
      contents: read
    # Room to spare for the build and the tests, some of whose plants rebuild.
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Restore the Lean toolchains from an earlier run
        # As CI's jobs restore them: ~/.elan/toolchains, keyed on the files that name the
        # toolchains, and saved after a job that passes (#594).
        uses: actions/cache@v5
        with:
          path: ~/.elan/toolchains
          key: lean-toolchains-${{ runner.os }}-${{ hashFiles('lean-toolchain', 'model/lean-toolchain') }}

      - name: Install Lean (elan)
        # As CI's jobs install it (scripts/install_lean.sh).
        run: bash scripts/install_lean.sh

      - name: Build and compute the certificate
        run: |
          lake build
          lake env lean Certificate/Facts.lean

      - name: Break the project on purpose, and check that every break is caught
        run: python3 scripts/negative_tests.py

  formal-model-kernel:
    # The formal model in model/, as CI's `formal-model` job checks it: its build, with the
    # pinned Mathlib's prebuilt files, then its compiled proofs replayed by Lean's kernel
    # (model/README.md, "The CI job"). CI runs it on every push to main, and on a pull
    # request of class R4 and above or that changes a file the model
    # imports; here it runs on main for what the other pull requests landed without it.
    runs-on: ubuntu-latest
    permissions:
      contents: read
    # CI's job stops at 30 minutes; a run takes a few.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Restore the Lean toolchains from an earlier run
        # As CI's jobs restore them: ~/.elan/toolchains, keyed on the files that name the
        # toolchains, and saved after a job that passes (#594).
        uses: actions/cache@v5
        with:
          path: ~/.elan/toolchains
          key: lean-toolchains-${{ runner.os }}-${{ hashFiles('lean-toolchain', 'model/lean-toolchain') }}

      - name: Install Lean (elan)
        # As CI's jobs install it (scripts/install_lean.sh).
        run: bash scripts/install_lean.sh

      - name: Check the model was last brought up to date against the present lock of the axioms
        run: grep -v '^#' model/lock.sha256 | shasum -a 256 -c -

      - name: Restore Mathlib, its prebuilt files and their downloads from an earlier run
        # The same cache as CI's formal-model job, keyed on model/lake-manifest.json.
        uses: actions/cache@v5
        with:
          path: |
            model/.lake/packages
            ~/.cache/mathlib
          key: formal-model-packages-${{ runner.os }}-${{ hashFiles('model/lake-manifest.json') }}

      - name: Fetch Mathlib's prebuilt files
        working-directory: model
        run: lake exe cache get

      - name: Build the formal model, whose build runs its checks
        working-directory: model
        run: lake build

      - name: Check the model's compiled proofs again, by Lean's kernel, apart from the build
        run: |
          python3 scripts/check_model_kernel.py --self-test
          python3 scripts/check_model_kernel.py

  report:
    # A red run of main (any of the three jobs it needs failed, cancelled or timed out:
    # safe-push-tests, which is red whenever a shard is, negative-tests or
    # formal-model-kernel) opens one issue labelled blocks-release, or comments on the one
    # already open, with the run's link, the jobs that were red, the shards whose kept logs
    # show them red, and the tests that failed. This job alone may write issues, and it
    # runs no code of the repository: it reads the logs the shards left and calls gh. The
    # issue's title is the one it had before negative-tests and formal-model-kernel
    # joined, so an issue already open is found.
    needs: [safe-push-tests, negative-tests, formal-model-kernel]
    if: >-
      always() && github.ref == 'refs/heads/main' &&
      (needs.safe-push-tests.result != 'success' || needs.negative-tests.result != 'success' ||
      needs.formal-model-kernel.result != 'success')
    concurrency:
      group: safe-push-tests-report
      cancel-in-progress: false
    runs-on: ubuntu-latest
    permissions:
      issues: write
    timeout-minutes: 10
    steps:
      - name: Fetch every shard's log
        continue-on-error: true
        uses: actions/download-artifact@v5
        with:
          # Each log in a folder of its own.
          pattern: test_safe_push-log-*
          path: ${{ runner.temp }}/log

      - name: Open or update the blocks-release issue
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TESTS: ${{ needs.safe-push-tests.result }}
          NEGATIVE: ${{ needs.negative-tests.result }}
          KERNEL: ${{ needs.formal-model-kernel.result }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          SHA: ${{ github.sha }}
        run: |
          title="safe-push-tests: the cadence run on main is red"
          logs=$(find "$RUNNER_TEMP/log" -type f -name 'test_safe_push-*.log' 2>/dev/null || true)
          body="$RUNNER_TEMP/body.md"
          {
            echo "The cadence run on main at \`$SHA\` was red in these jobs:"
            echo
            [ "$TESTS" = success ] || echo "- \`safe-push-tests\` (\`scripts/test_safe_push.py\`, its shards and the proof that every test ran once and passed): $TESTS"
            [ "$NEGATIVE" = success ] || echo "- \`negative-tests\` (\`scripts/negative_tests.py\`, after the build): $NEGATIVE"
            [ "$KERNEL" = success ] || echo "- \`formal-model-kernel\` (the formal model's build and kernel re-check): $KERNEL"
            echo
            echo "Run: $RUN_URL"
            echo
            if [ "$TESTS" = success ]; then
              echo "The tests of \`scripts/test_safe_push.py\` passed; the run's page has the red jobs' logs."
            elif [ -n "$logs" ]; then
              # Which shards were red, by the logs they kept (#425): GitHub gives the matrix
              # one result, and this job reads no API but the issues'. A shard is named by
              # the K of its log's name, up to the N of the first "Shard K of N:" line of
              # each log, which the shard prints before its tests: red when its log has no
              # unittest summary after its "Ran" line (cut off or cancelled), or one that is
              # not OK, or when it kept no log. A shard can be red for a step its log does
              # not show, and a shard of a rerun that kept no log may leave an earlier
              # attempt's, so the issue sends the reader to the run's page for each result.
              shards=$({
                find "$RUNNER_TEMP/log" -type f -name 'test_safe_push-*.log' |
                  sed -n 's|.*/test_safe_push-\([0-9][0-9]*\)\.log$|\1|p'
                find "$RUNNER_TEMP/log" -type f -name 'test_safe_push-*.log' -exec sed -n \
                  '/^Shard [0-9][0-9]* of [0-9][0-9]*: /{s/^Shard [0-9][0-9]* of \([0-9][0-9]*\): .*/\1/p;q;}' {} \;
              } | sort -n | sed -n '$p')
              red="$RUNNER_TEMP/red-shards.md"
              : > "$red"
              k=1
              while [ "$k" -le "${shards:-0}" ]; do
                log=$(find "$RUNNER_TEMP/log" -type f -name "test_safe_push-$k.log" | sed -n 1p)
                if [ -z "$log" ]; then
                  echo "- shard $k: it kept no log" >> "$red"
                else
                  end=$(awk '/^Ran [0-9]+ tests? in /{ran=1; last=""; next} ran && /^(OK|FAILED)/{last=$0} END{print last}' "$log" | cut -c1-200)
                  case "$end" in
                    OK*) ;;
                    "") echo "- shard $k: its log stops before unittest's summary (cut off or cancelled)" >> "$red" ;;
                    *) printf -- '- shard %s: %s\n' "$k" "$end" >> "$red" ;;
                  esac
                fi
                k=$((k + 1))
              done
              if [ -s "$red" ]; then
                echo "Shards whose kept logs show them red (the run's page gives each shard's result):"
                echo
                cat "$red"
              else
                echo "No shard's kept log shows it red (the run's page gives each shard's result)."
              fi
              echo
              # Every shard's log that was kept, each read whole.
              all=$(find "$RUNNER_TEMP/log" -type f -name 'test_safe_push-*.log' -exec cat {} + |
                grep -E '^(FAIL|ERROR): ' | sort -u | cut -c1-300 || true)
              # sed reads all its input, so printf never meets a closed pipe: head would
              # stop early, printf would take SIGPIPE, and under bash's pipefail the step
              # would end before the issue opens (#300).
              failed=$(printf '%s\n' "$all" | sed -n '1,100p')
              if [ -n "$all" ]; then
                if [ "$(printf '%s\n' "$all" | wc -l)" -gt 100 ]; then
                  echo "Tests of \`scripts/test_safe_push.py\` that failed (the first 100):"
                else
                  echo "Tests of \`scripts/test_safe_push.py\` that failed:"
                fi
                echo
                echo '```'
                echo "$failed"
                echo '```'
              else
                echo "No failing test is named in the shards' logs (a shard cut off or cancelled, say, or only the proof failed); the run's page says why."
              fi
            else
              echo "The run left no shard's log; the run's page says why."
            fi
            echo
            echo "This issue holds the release until it is closed, with a link to a later run of this workflow on main in which every job is green, each shard among them, the report alone skipped (docs/WORKFLOW.md, section 8)."
          } > "$body"
          number=$(
            gh api --method GET --paginate --slurp "repos/$GH_REPO/issues" \
              -f state=open -f labels=blocks-release -f per_page=100 |
              jq -r --arg title "$title" \
                '[.[][] | select(has("pull_request") | not) | select(.title == $title) | .number] | first // ""'
          )
          if [ -n "$number" ]; then
            gh issue comment "$number" --body-file "$body"
          else
            gh issue create --title "$title" --label blocks-release --body-file "$body"
          fi
