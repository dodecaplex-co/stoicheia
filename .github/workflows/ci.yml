name: CI

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install Lean (elan)
        run: |
          curl -sSfL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Check every proof
        run: lake build

      - name: Compute the certificate
        run: lake env lean Certificate/Facts.lean

      - name: Check the Lean still quotes Heath, and the house rules
        run: python3 scripts/check_fidelity.py

      - name: Check the generated pages are up to date
        # `git status` sees new and deleted pages as well as changed ones.
        run: |
          python3 scripts/render.py
          git status --porcelain -- facts.json book CERTIFICATE.md GRAPH.md
          test -z "$(git status --porcelain -- facts.json book CERTIFICATE.md GRAPH.md)"

  negative:
    # Break the project on purpose, and check that every break is caught.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install Lean (elan)
        run: |
          curl -sSfL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Build and compute the certificate
        run: |
          lake build
          lake env lean Certificate/Facts.lean

      - name: An edited Heath word, wrong radii in I.1, and planted assumptions in I.16
        run: python3 scripts/negative_tests.py
