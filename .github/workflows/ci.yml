name: CI

on:
  # Each commit of a pull request runs once, on the pull request's events; git safe-push
  # opens or updates the pull request with each push of its branch, and a push of
  # another branch or of a tag runs nothing here (docs/decisions/2026-10-22-checks-by-risk.md).
  # Main's run after each merge comes from post-merge.yml, which calls this workflow under
  # its push to main, so a push trigger here would run main's commit twice. That call is
  # the risk job's case of a push to main, R5; a merge group, as any other event, falls
  # to the job's last case, R5 too.
  pull_request:
  merge_group:
  workflow_call:

permissions:
  contents: read

jobs:
  risk:
    # The change's risk class, R0 to R5 (docs/WORKFLOW.md, section 8), and whether the
    # formal model must be checked, which the `negative` and `formal-model` jobs read; they
    # read no label. This job reads one, `release`, and it can only raise the class. Main's
    # copy of scripts/risk.py, never the change's own, classifies the files the change
    # brings to main, so a change cannot lower its own class by editing the classifier. A
    # pull request into main is classified so, exactly, from GitHub's merge commit; one
    # whose run starts with the `release` label, one into any other branch, a push to main
    # and every other event are R5, and `negative` and `formal-model` run in full. The label
    # is read from the event that started the run, and git safe-push adds a pull request's
    # labels after it pushes, so a label given with that push counts from the next push.
    # Main's run after the merge, post-merge.yml's call, runs every job in full, `negative`
    # and `formal-model` among them (`acceptance` runs on every event CI runs on). A
    # release pull request's run need not be R5: the merge
    # gate holds a release until the full pre-flight has run on its head and a run there
    # of the safe-push-tests workflow, the head's copy being main's, has passed each of its
    # jobs but the report, which a green run skips: the safe_push tests' eight shards and
    # the verdict on them, the negative tests in full, and the formal model's build and
    # kernel re-check (docs/decisions/2026-10-22-checks-by-risk.md).
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 10
    outputs:
      class: ${{ steps.classify.outputs.class }}
      formal_model: ${{ steps.classify.outputs.formal_model }}
    steps:
      - uses: actions/checkout@v5
        with:
          # Main's commit and the change's, with what lies between them.
          fetch-depth: 0
          persist-credentials: false

      - name: Classify the change by main's scripts/risk.py; a push to main, a pull request whose run starts with the release label and any other event are R5
        id: classify
        env:
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
          BASE_REF: ${{ github.base_ref }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          RELEASE: ${{ contains(github.event.pull_request.labels.*.name, 'release') }}
        run: |
          set -euo pipefail
          r5() {
            echo "$1: R5, negative and formal-model run in full"
            { echo "class=R5"; echo "formal_model=true"; } >> "$GITHUB_OUTPUT"
            exit 0
          }
          case "$EVENT:$REF" in
            push:refs/heads/main)
              r5 "a push to main" ;;
            pull_request:*)
              if [ "$RELEASE" = true ]; then r5 "a pull request labelled release"; fi
              if [ "$BASE_REF" != main ]; then r5 "a pull request into $BASE_REF, not main"; fi
              # The checkout is the merge commit GitHub made of the pull request into main,
              # as the acceptance job reads it: its first parent is main, whose workflow
              # this run follows unless the pull request changes it, and its changes over
              # that parent are what the pull request brings to main. The first parent is
              # taken for main only when the commit has two parents and the second is the
              # pull request's head; anything else is R5.
              if [ "$(git rev-list --parents -n 1 HEAD | wc -w)" -ne 3 ] ||
                 [ "$(git rev-parse HEAD^2)" != "$HEAD_SHA" ]; then
                r5 "a pull request whose checkout is not GitHub's merge of its head, $HEAD_SHA, into main"
              fi
              base=$(git rev-parse HEAD^1)
              head=$(git rev-parse HEAD)
              what="the pull request" ;;
            *)
              r5 "a $EVENT event of $REF" ;;
          esac
          git cat-file -e "$base^{commit}"
          listed=$(git ls-tree --name-only "$base" -- scripts/risk.py)
          if [ "$listed" != scripts/risk.py ]; then
            r5 "main, at $base, has no scripts/risk.py to classify $what"
          fi
          git show "$base:scripts/risk.py" > "$RUNNER_TEMP/risk.py"
          echo "main's scripts/risk.py, at $base, classifies $what"
          python3 -I "$RUNNER_TEMP/risk.py" --diff "$base" "$head" --github-output

  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      # The review records are read with tomllib, which needs Python 3.11 or later.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Restore the Lean toolchains from an earlier run
        # ~/.elan/toolchains, keyed on the files that name the toolchains, and saved after a
        # job that passes: restored, the install downloads no toolchain (#594).
        uses: actions/cache@v5
        with:
          path: ~/.elan/toolchains
          key: lean-toolchains-${{ runner.os }}-${{ hashFiles('lean-toolchain', 'model/lean-toolchain') }}

      - name: Install Lean (elan)
        # elan v4.2.4, checked against its release's SHA-256, then the toolchains that
        # lean-toolchain and model/lean-toolchain name: from the cache, else by elan in three
        # tries, else from GitHub's copy of the same file; lean --version must then say the
        # version each names (scripts/install_lean.sh).
        run: bash scripts/install_lean.sh

      - name: Install the pinned YAML parser the lane-condition check reads the workflows with
        # checks/24-lane-condition.toml runs a test of scripts/test_safe_push.py, which reads
        # the workflows with this parser (#346). Isolated, from the runner's temporary
        # directory, as queue-integrity installs it: nothing in the checkout (a pip.py or a
        # pip/ folder at its root, say) can run in place of pip, before the checks.
        working-directory: ${{ runner.temp }}
        run: python3 -I -m pip install -r "$GITHUB_WORKSPACE/scripts/requirements-test_safe_push.txt"

      - name: Run the check job's sequence, one check for each file in checks/, in its order, each a group of the log, stopping at the first that fails
        # The registry of checks (docs/WORKFLOW.md, section 8): each file of checks/ is one
        # check, with its command, its job and its line of section 8, and a comment saying
        # what it is for. This run reads the pull request's own registry, as it follows the
        # pull request's own copy of this workflow; the pre-flight runs main's registry,
        # read out of Git, never the pull request's
        # (docs/decisions/2026-10-22-check-registry.md). Among the checks, render.py and
        # then `git status --porcelain`, over the whole worktree, which must print nothing:
        # the generated pages are up to date, and no check left the worktree changed.
        run: python3 scripts/run_checks.py --job check

  negative:
    # Break the project on purpose, and check that every break is caught: in full for a
    # change of class R3, R4 or R5, which every push to main is, and every pull request
    # whose run starts with the `release` label (`risk`); for R0 to R2 the job passes at
    # once and says why, since main's run after the merge runs the tests in full, and the
    # cadence (safe-push-tests.yml) runs them on main every six hours
    # (docs/decisions/2026-10-22-risk-lanes.md). git safe-push's pre-flight runs them as
    # well for R3 to R5, and for R0 to R2 leaves them out with the rest of its step 4
    # (docs/decisions/2026-10-22-checks-by-risk.md). The job runs whatever became of
    # `risk`, and fails unless `risk` succeeded: GitHub accepts a skipped required check,
    # so a failed or cancelled classification must fail it, never skip it.
    needs: risk
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Read the class, and run in full for R3, R4 and R5
        id: lane
        env:
          RESULT: ${{ needs.risk.result }}
          CLASS: ${{ needs.risk.outputs.class }}
        run: |
          if [ "$RESULT" != success ]; then
            echo "the risk job ended: $RESULT; without its class, the negative tests cannot pass"
            exit 1
          fi
          case "$CLASS" in
            R3|R4|R5)
              echo "class $CLASS: the negative tests run in full"
              echo "full=true" >> "$GITHUB_OUTPUT" ;;
            R0|R1|R2)
              echo "class $CLASS: the negative tests run in main's run after the merge and on main on the cadence (docs/decisions/2026-10-22-risk-lanes.md, docs/decisions/2026-10-22-checks-by-risk.md)"
              echo "full=false" >> "$GITHUB_OUTPUT" ;;
            *)
              echo "the risk job gave no class from R0 to R5: '$CLASS'"
              exit 1 ;;
          esac

      - uses: actions/checkout@v5
        if: steps.lane.outputs.full == 'true'
        with:
          persist-credentials: false

      - uses: actions/setup-python@v5
        if: steps.lane.outputs.full == 'true'
        with:
          python-version: "3.12"

      - name: Restore the Lean toolchains from an earlier run
        # As the check job restores them.
        if: steps.lane.outputs.full == 'true'
        uses: actions/cache@v5
        with:
          path: ~/.elan/toolchains
          key: lean-toolchains-${{ runner.os }}-${{ hashFiles('lean-toolchain', 'model/lean-toolchain') }}

      - name: Install Lean (elan)
        # As the check job installs it.
        if: steps.lane.outputs.full == 'true'
        run: bash scripts/install_lean.sh

      - name: Build and compute the certificate
        if: steps.lane.outputs.full == 'true'
        run: |
          lake build
          lake env lean Certificate/Facts.lean

      - name: An edited Heath word, wrong radii in I.1, a weakened axiom, a statements' word changed, a primitive no longer opaque, stale and incomplete review records, a native_decide, planted assumptions in I.15's porism and I.16, and a sorry in a complete book
        if: steps.lane.outputs.full == 'true'
        run: python3 scripts/negative_tests.py

  model:
    # The axioms in the plane: needs no Lean, for it reads the committed facts.json.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: The axioms hold in the plane, every weakened axiom is caught, and only Postulate 5 fails in the hyperbolic plane
        run: python3 -I tests/model/run.py --fast

      - name: The committed results and the counts in MODEL.md are the present harness's
        # Reads what a run wrote; apart from its self-test, on a made-up harness of its
        # own, it runs no harness. So a pull request that changes the harness runs
        # `run.py --full --write` in the same pull request: generated facts are refused
        # when stale (docs/WORKFLOW.md, section 10, step 8, Tier 1).
        run: python3 -I tests/model/results_check.py

  formal-model:
    # The formal model in model/ (model/README.md, "The CI job"): a Lake package of its
    # own, with a pinned Mathlib, in which Lean checks that the ordinary plane satisfies
    # the laws translated so far. Not `model`, which is the numerical harness above. Every
    # Lean step runs in model/: the main package never sees Mathlib. In full for a change of
    # class R4 or R5, which every change to model/, to Certificate/axioms.lock or to
    # scripts/check_model_kernel.py is, as are every push to main and every pull request
    # whose run starts with the `release` label, and for a change of any class to a file of
    # the main package the model imports, directly or through others, which `risk` finds
    # from the model's import lines (scripts/risk.py, model_inputs). It reads them by a
    # narrow grammar and fails closed: while a file among them has a header it cannot read
    # cleanly or an import it cannot resolve, the job runs in full for every change, and
    # `risk`'s log names the file.
    # Otherwise the job passes at once and says why: the change touches none of the model's
    # inputs, and the cadence (safe-push-tests.yml) checks the model on main every six
    # hours (docs/decisions/2026-10-22-risk-lanes.md).
    # Like `negative`, it fails unless `risk` succeeded, never skipped.
    needs: risk
    if: always()
    runs-on: ubuntu-latest
    # A run takes a few minutes. Without Mathlib's prebuilt files, lake build would compile
    # Mathlib from source for hours, so the job stops long before that.
    timeout-minutes: 30
    steps:
      - name: Read the class, and run in full for R4 and R5, for a change to a file the model imports, and for every change while one of their headers cannot be read
        id: lane
        env:
          RESULT: ${{ needs.risk.result }}
          CLASS: ${{ needs.risk.outputs.class }}
          FORMAL_MODEL: ${{ needs.risk.outputs.formal_model }}
        run: |
          if [ "$RESULT" != success ]; then
            echo "the risk job ended: $RESULT; without its class, the formal model cannot pass"
            exit 1
          fi
          case "$CLASS:$FORMAL_MODEL" in
            R4:*|R5:*)
              echo "class $CLASS: the formal model is checked in full"
              echo "full=true" >> "$GITHUB_OUTPUT" ;;
            R0:true|R1:true|R2:true|R3:true)
              echo "class $CLASS, and the change touches a file the formal model imports, or a file among them has a header the classifier cannot read; the risk job's log names it: the formal model is checked in full"
              echo "full=true" >> "$GITHUB_OUTPUT" ;;
            R0:false|R1:false|R2:false|R3:false)
              echo "class $CLASS, and the change touches nothing under model/, nor the axiom lock, the model's kernel check or a file the formal model imports, so the formal model is checked on main on the cadence (docs/decisions/2026-10-22-risk-lanes.md)"
              echo "full=false" >> "$GITHUB_OUTPUT" ;;
            *)
              echo "the risk job gave no class from R0 to R5, with formal_model true or false: '$CLASS', '$FORMAL_MODEL'"
              exit 1 ;;
          esac

      - uses: actions/checkout@v5
        if: steps.lane.outputs.full == 'true'
        with:
          persist-credentials: false

      - name: Restore the Lean toolchains from an earlier run
        # As the check job restores them.
        if: steps.lane.outputs.full == 'true'
        uses: actions/cache@v5
        with:
          path: ~/.elan/toolchains
          key: lean-toolchains-${{ runner.os }}-${{ hashFiles('lean-toolchain', 'model/lean-toolchain') }}

      - name: Install Lean (elan)
        # As the check job installs it.
        if: steps.lane.outputs.full == 'true'
        run: bash scripts/install_lean.sh

      - name: Check the model was last brought up to date against the present lock of the axioms
        # model/lock.sha256 holds the sha256 of Certificate/axioms.lock, so any change to
        # the lock fails here until the hash is renewed, after the model is brought up to
        # date wherever an axiom or a word an axiom reaches changed (model/README.md, "How
        # the lock ties it").
        if: steps.lane.outputs.full == 'true'
        run: grep -v '^#' model/lock.sha256 | shasum -a 256 -c -

      - name: Restore Mathlib, its prebuilt files and their downloads from an earlier run
        # model/.lake/packages holds the pinned clones and the unpacked build (6.6 GB);
        # ~/.cache/mathlib holds what lake exe cache get downloaded (452 MB), which it looks
        # for before downloading again. Both are fixed by model/lake-manifest.json.
        if: steps.lane.outputs.full == 'true'
        uses: actions/cache@v5
        with:
          path: |
            model/.lake/packages
            ~/.cache/mathlib
          key: formal-model-packages-${{ runner.os }}-${{ hashFiles('model/lake-manifest.json') }}

      - name: Fetch Mathlib's prebuilt files
        # After a restore it downloads nothing and unpacks nothing.
        if: steps.lane.outputs.full == 'true'
        working-directory: model
        run: lake exe cache get

      - name: Check the proofs in the plane and what they rest on, and each hand translation against the library's declaration
        # Builds Model, with its audit, and Check, with its round trips; any failed check
        # fails the build.
        if: steps.lane.outputs.full == 'true'
        working-directory: model
        run: lake build

      - name: Check the model's compiled proofs again, by Lean's kernel, apart from the build
        # leanchecker replays every declaration of every compiled module of Model and Check
        # into the environment of the module's imports, which it loads, Mathlib's among them,
        # without replaying; then it replays Check's whole environment, which has no Mathlib,
        # from nothing (model/README.md, "The CI job"). --self-test runs first and needs
        # no Mathlib: lake build must accept a theorem of False added without the kernel's
        # check, and the replay must reject it, naming it.
        if: steps.lane.outputs.full == 'true'
        run: |
          python3 scripts/check_model_kernel.py --self-test
          python3 scripts/check_model_kernel.py

  acceptance:
    # The acceptance checklist, docs/ACCEPTANCE.md, on every pull request, as this
    # `acceptance` job and docs/briefs/0002-decisions.md describe:
    # scripts/check_acceptance.py checks the pull request and keeps its report as an
    # artifact. Until the consolidation release the job fails only when an item that
    # passes on main does not pass here: a pass may not turn into a fail (save P10 and E6,
    # which turn when a statement is staged before its proof). Main is checked
    # beside the pull request with the pull request's own checks (scripts/, tests/,
    # Certificate/, review/SCHEMA.md, review/terms.toml), keeping main's values pinned to
    # its content (WORKFLOW, section 10, step 4), so that both are judged alike and a
    # check made stricter, in a pull request of its own, holds nothing back.
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      # `ratchet`: fail only when a pass on main turns into a fail. The consolidation
      # release's pull request sets `full`, and from then on any failure fails the job.
      # Any other value fails the job at once, so that no misspelling turns the gate off.
      ACCEPTANCE_GATE: ratchet
    steps:
      - uses: actions/checkout@v5
        with:
          # The review records name their commits, which the checker finds in the history.
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Restore the Lean toolchains from an earlier run
        # As the check job restores them.
        uses: actions/cache@v5
        with:
          path: ~/.elan/toolchains
          key: lean-toolchains-${{ runner.os }}-${{ hashFiles('lean-toolchain', 'model/lean-toolchain') }}

      - name: Install Lean (elan)
        # As the check job installs it.
        run: bash scripts/install_lean.sh

      - name: Identify main for this event
        # A reusable workflow keeps its caller's event. A queue group compares with
        # its base; a main push compares with the main tip before that push.
        run: |
          python3 -I - <<'PY'
          import json
          import os
          import re
          import subprocess

          def git(*args):
              return subprocess.check_output(["git", *args], text=True).strip()

          def sha(value):
              if not isinstance(value, str) or not re.fullmatch(r"[0-9a-f]{40}", value) or not value.strip("0"):
                  raise SystemExit("Cannot identify a non-zero, full commit SHA for acceptance.")
              if git("rev-parse", "--verify", value + "^{commit}") != value:
                  raise SystemExit("Acceptance's commit is unavailable.")
              return value

          with open(os.environ["GITHUB_EVENT_PATH"], encoding="utf-8") as source:
              event = json.load(source)
          name = os.environ["GITHUB_EVENT_NAME"]
          head = git("rev-parse", "HEAD")
          if name == "pull_request":
              pull = event["pull_request"]
              parents = git("rev-list", "--parents", "-n", "1", head).split()
              if len(parents) == 3 and parents[2] == sha(pull["head"]["sha"]):
                  main = sha(parents[1])
              elif head == sha(pull["head"]["sha"]):
                  main = sha(pull["base"]["sha"])
              else:
                  raise SystemExit("Checkout does not identify the pull request's main.")
          elif name == "merge_group":
              group = event["merge_group"]
              if head != sha(group["head_sha"]) or group["base_ref"] != "refs/heads/main":
                  raise SystemExit("Checkout does not identify this main queue group.")
              main = sha(group["base_sha"])
          elif name == "push":
              if event["ref"] != "refs/heads/main" or event.get("deleted") is not False or head != sha(event["after"]):
                  raise SystemExit("Acceptance needs the main push's exact checkout.")
              main = sha(event["before"])
          else:
              raise SystemExit("No acceptance base is defined for this event.")
          subprocess.run(["git", "merge-base", "--is-ancestor", main, head], check=True)
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as output:
              output.write("MAIN_SHA=" + main + "\n")
          PY

      - name: Check the checker's comparison of two runs, case by case
        # tests/test_check_acceptance.py needs no Lean; a comparison read wrongly stops
        # the job before its verdict.
        run: python3 -I tests/test_check_acceptance.py

      - name: Build, and compute the certificate
        run: |
          lake build
          lake build Audit
          lake env lean Certificate/Facts.lean

      - name: Check the pull request against the acceptance checklist, and write its report
        # Exit 1 is a failing item, which the ratchet weighs in the last step; 2 or more is
        # a checker that could not run, which fails at once.
        run: |
          case "$ACCEPTANCE_GATE" in
            ratchet|full) ;;
            *) echo "ACCEPTANCE_GATE is '$ACCEPTANCE_GATE', neither ratchet nor full"; exit 2 ;;
          esac
          mkdir -p "$RUNNER_TEMP/acceptance"
          status=0
          python3 scripts/check_acceptance.py --output "$RUNNER_TEMP/acceptance/report.md" --json "$RUNNER_TEMP/acceptance/verdicts.json" || status=$?
          if [ "$ACCEPTANCE_GATE" = full ]; then exit "$status"; fi
          test "$status" -le 1

      - name: Check main against the checklist, with the pull request's checks
        # The merge commit CI checks out has main as its first parent. The kernel replay
        # and the model tests (E1, E4) are left out here (--quick): the `check` and
        # `model` jobs hold them on every pull request.
        if: env.ACCEPTANCE_GATE == 'ratchet'
        run: |
          main_sha="$MAIN_SHA"
          main="$RUNNER_TEMP/main"
          git worktree add --detach "$main" "$main_sha"
          # An updated pin belongs to the content it pins. Copying it from the pull
          # request could make unchanged main fail, hiding a real acceptance regression.
          # rsync excludes also protect main's pins from deletion when absent in the PR.
          scripts/copy_acceptance_checks.sh . "$main"
          cp -R .lake "$main/"
          cd "$main"
          lake build
          lake build Audit
          lake env lean Certificate/Facts.lean
          status=0
          python3 scripts/check_acceptance.py --quick --output "$RUNNER_TEMP/acceptance/main-report.md" --json "$RUNNER_TEMP/acceptance/main.json" || status=$?
          test "$status" -le 1

      - name: No item that passes on main fails on the pull request
        if: env.ACCEPTANCE_GATE == 'ratchet'
        run: python3 scripts/check_acceptance.py --compare "$RUNNER_TEMP/acceptance/main.json" "$RUNNER_TEMP/acceptance/verdicts.json"

      - name: Keep the reports
        # report.md and verdicts.json are the pull request's; main-report.md and
        # main.json, main's, judged by the same checks.
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: acceptance
          path: ${{ runner.temp }}/acceptance/

  queue-integrity:
    # The judge of each merge group. It checks out the group, takes scripts/ from the
    # group's base (main) and runs that check_queue.py, which reads what it judges from
    # Git's objects and GitHub only, never from the checkout, which it only compares with
    # the group's head; it builds nothing and renders nothing (the check job renders the
    # same group). But GitHub runs the group's own copy of this file, so the judge's
    # verdict, and any evidence check added later, count only while the group's ci.yml
    # still calls them.
    # The protection of .github/, scripts/ and tests/, and the authenticity of the
    # pre-flight's evidence, must be held by something a group cannot change: a ruleset
    # requiring code-owner review, with a CODEOWNERS file naming the owner for those
    # paths; a required workflow pinned to main, if the account offers one; or a status
    # posted by an App running main's code. The queue must not be turned on until one
    # exists.
    runs-on: ubuntu-latest
    # The judge's own reading, and its wait of up to 10 minutes for a revert's run to
    # complete (WORKFLOW, section 10): to be measured again on the queue's trial.
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: read
      # An automatic revert's failed run and the open main-red issues, which a revert
      # must name and an ordinary entry must declare it fixes.
      actions: read
      issues: read
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install the queue tests' pinned YAML parser
        # Isolated, from the runner's temporary directory: nothing in the checkout (a
        # pip/ folder, say) can run in pip's place.
        if: github.event_name != 'merge_group'
        working-directory: ${{ runner.temp }}
        run: python3 -I -m pip install -r "$GITHUB_WORKSPACE/scripts/requirements-test_safe_push.txt"

      - name: Check the queue and train checks, and automatic reverts, case by case
        # On a pull request and on main: the offline cases, which need no network.
        if: github.event_name != 'merge_group'
        run: |
          python3 -I tests/test_check_queue.py
          python3 -I tests/test_check_train.py
          python3 -I tests/test_auto_revert.py

      - name: Check the group with main's copy of check_queue.py
        if: github.event_name == 'merge_group'
        env:
          GH_TOKEN: ${{ github.token }}
          GROUP_HEAD: ${{ github.event.merge_group.head_sha }}
          GROUP_BASE: ${{ github.event.merge_group.base_sha }}
          REPOSITORY: ${{ github.repository }}
          # The revert App's bot login (a repository variable, the owner's steps): only its
          # pull requests may stand in a group as automatic reverts.
          STOICHEIA_REVERT_BOT: ${{ vars.STOICHEIA_REVERT_BOT }}
        run: |
          test -n "$GROUP_HEAD"
          test -n "$GROUP_BASE"
          test "$(git rev-parse HEAD)" = "$GROUP_HEAD"
          if ! git cat-file -e "$GROUP_BASE:scripts/check_queue.py"; then
            echo "The group base has no queue judge."
            exit 2
          fi
          mkdir "$RUNNER_TEMP/judge"
          git archive --format=tar "$GROUP_BASE:scripts" > "$RUNNER_TEMP/queue-judge.tar"
          tar -xf "$RUNNER_TEMP/queue-judge.tar" -C "$RUNNER_TEMP/judge"
          test -f "$RUNNER_TEMP/judge/check_queue.py" || exit 2
          python3 -I "$RUNNER_TEMP/judge/check_queue.py" --head "$GROUP_HEAD" --base "$GROUP_BASE" --repo "$REPOSITORY"

  queue-gaps:
    # The gaps of what is new, on each merge group: the tests of each check the group
    # changes, chosen by main's copy of check_queue.py, and the changed propositions'
    # acceptance items, from the acceptance job's verdicts. These are the group's own
    # tests: they test, they do not judge. They are its own code too, and on Linux a
    # process can read its parent's environment (/proc/<ppid>/environ), so the step that
    # holds the token, to read GitHub, chooses them and runs none; the last step, which
    # holds no token, nor does any step after the choosing, runs them, and refuses to if
    # a variable named with TOKEN is in its environment. That keeps the token out of the
    # tests' environment, files, caches and artifacts, but the runner process holds it
    # for the whole job, beneath every step: so it is read-only by design, the four
    # permissions below, all read.
    needs: acceptance
    if: always()
    runs-on: ubuntu-latest
    # The changed checks' tests, the slowest group (safe_push's, check_queue's and
    # check_train's at once) near 40 minutes here, and the judge's wait of up to 10
    # minutes for a revert's run: to be measured again on the queue's trial.
    timeout-minutes: 75
    permissions:
      contents: read
      pull-requests: read
      actions: read
      issues: read
    steps:
      - name: Require a completed acceptance check
        env:
          ACCEPTANCE_RESULT: ${{ needs.acceptance.result }}
        run: test "$ACCEPTANCE_RESULT" = success

      - uses: actions/checkout@v5
        if: github.event_name == 'merge_group'
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-python@v5
        if: github.event_name == 'merge_group'
        with:
          python-version: "3.12"

      - name: Read acceptance's verdicts
        if: github.event_name == 'merge_group'
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
        run: |
          gh run download "$RUN_ID" --repo "$REPOSITORY" --name acceptance --dir "$RUNNER_TEMP/acceptance"
          test -s "$RUNNER_TEMP/acceptance/verdicts.json"

      - name: Choose the tests of what is new
        # Main's check_queue.py reads GitHub with the token, prints the acceptance items,
        # and writes the tests it chooses to a new file; it runs none of them.
        if: github.event_name == 'merge_group'
        env:
          GH_TOKEN: ${{ github.token }}
          GROUP_HEAD: ${{ github.event.merge_group.head_sha }}
          GROUP_BASE: ${{ github.event.merge_group.base_sha }}
          REPOSITORY: ${{ github.repository }}
          ACCEPTANCE_VERDICTS: ${{ runner.temp }}/acceptance/verdicts.json
          STOICHEIA_REVERT_BOT: ${{ vars.STOICHEIA_REVERT_BOT }}
        run: |
          test "$(git rev-parse HEAD)" = "$GROUP_HEAD"
          git cat-file -e "$GROUP_BASE:scripts/check_queue.py" || exit 2
          mkdir "$RUNNER_TEMP/judge"
          git archive --format=tar "$GROUP_BASE:scripts" > "$RUNNER_TEMP/queue-judge.tar"
          tar -xf "$RUNNER_TEMP/queue-judge.tar" -C "$RUNNER_TEMP/judge"
          python3 -I "$RUNNER_TEMP/judge/check_queue.py" --gaps --head "$GROUP_HEAD" --base "$GROUP_BASE" --repo "$REPOSITORY" --plan "$RUNNER_TEMP/gaps-plan.json"

      - name: Install the tests' pinned YAML parser, main's pin
        # After the token's last step: what pip installs could run in any later Python.
        # Isolated, from the runner's temporary directory: nothing in the group's
        # checkout (a pip/ folder, say) can run in pip's place.
        if: github.event_name == 'merge_group'
        working-directory: ${{ runner.temp }}
        run: python3 -I -m pip install -r "$RUNNER_TEMP/judge/requirements-test_safe_push.txt"

      - name: Run the tests of what is new
        # No token here: the tests are the group's own code. Main's check_queue.py runs
        # the chosen tests and refuses to while a variable named with TOKEN is set.
        if: github.event_name == 'merge_group'
        env:
          GROUP_HEAD: ${{ github.event.merge_group.head_sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$GROUP_HEAD"
          python3 -I "$RUNNER_TEMP/judge/check_queue.py" --run-plan "$RUNNER_TEMP/gaps-plan.json" --head "$GROUP_HEAD"
