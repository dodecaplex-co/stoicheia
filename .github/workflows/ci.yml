name: CI

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # The review records are read with tomllib, which needs Python 3.11 or later.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Lean (elan)
        run: |
          curl -sSfL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Check every proof
        run: lake build

      - name: Check the overlap catalogue's audit lemmas
        # Audit/ is a library nothing imports, outside the default build.
        run: lake build Audit

      - name: Check the staged statements, which await their proofs, still build
        # Staging is a library nothing imports, outside the default build
        # (docs/WORKFLOW.md, section 2).
        run: lake build Staging

      - name: Compute the certificate, and check its dependency walk against Lean's
        # Facts.lean exits 1 if any entry's axioms differ from its own and its citations'.
        run: lake env lean Certificate/Facts.lean

      - name: Check coincidence steps and module boundaries, rejecting reached Staging.Hidden and Lean.Hidden helpers and allowing unused foreign imports
        run: python3 -I tests/test_certificate.py

      - name: Check every proof again, by Lean's kernel, and by nanoda admitting only the locked axioms and Lean's three
        # leanchecker --fresh replays the whole environment of Elements, Lean's own
        # included, through Lean's kernel; nanoda, written separately, checks the whole
        # export. --self-test withholds Postulate 5 and expects nanoda to fail on it.
        run: python3 scripts/check_kernel.py --self-test

      - name: Check the contracts (references, porisms, review terms and records)
        run: python3 scripts/heath.py

      - name: Check the Lean still quotes Heath; the house rules, the policies for every entry, the lock of the axioms and the statements' words, and the review records
        # The wording of the reader-facing pages is check_style.py's (S5), the next step.
        run: python3 scripts/check_fidelity.py

      - name: Check the style check's own reading, case by case, of phrases however a line wraps them and of letters on angles' wedges
        # tests/test_check_style.py needs no Lean; it runs first, so that a rule found
        # reading its cases wrongly stops the job before the style check's verdict.
        run: python3 -I tests/test_check_style.py

      - name: Check the unfinished work and release gates, case by case
        # These cases need no Lean and no network; unreadable issues must hold a release.
        run: python3 -I tests/test_release_gate.py

      - name: Check the Jev client keeps no answer without its model's identifier
        # These cases need no key and no network: run, score and a resumed run each refuse
        # an answer whose model is missing, empty or not a string.
        run: python3 -I tests/test_jev_models.py

      - name: Check Jev's client against a stand-in for the service, with a key it makes up
        # The self-test needs no network and no key: among other things, it checks that the
        # key appears in no output, that a dry run sends nothing, and that a row's expected
        # answer is never sent.
        run: python3 scripts/audit/jev.py self-test

      - name: Check the overlap screen's tries and its reading of Lean's logs, case by case
        # tests/test_screen.py needs no Lean: it puts Audit/screen.py's own functions to small
        # inputs. The screen itself needs Lean, takes minutes, and is not run here.
        run: python3 -I tests/test_screen.py

      - name: Check the limitations acceptance item P3 allows, case by case
        # tests/test_acceptance_limits.py needs no Lean: it checks check_acceptance.py's list
        # against docs/ACCEPTANCE.md's table, and P3 on review records varied in memory.
        run: python3 -I tests/test_acceptance_limits.py

      - name: Check the house style's hard rules
        # S12 asks Lean about the names in every text it reads, the audit lemmas of the
        # overlap catalogue among them, so it runs on the built tree, after Audit.
        run: python3 scripts/check_style.py

      - name: Check the generated pages are up to date
        # `git status` sees new and deleted pages as well as changed ones. README.md and
        # docs/PROGRAM.md are generated in part: render.py fills README's scope markers
        # and PROGRAM.md's status table.
        run: |
          python3 scripts/render.py
          git status --porcelain -- facts.json book CERTIFICATE.md GRAPH.md README.md docs/PROGRAM.md
          test -z "$(git status --porcelain -- facts.json book CERTIFICATE.md GRAPH.md README.md docs/PROGRAM.md)"

      - name: Check every relative link and anchor
        run: python3 scripts/check_links.py

  negative:
    # Break the project on purpose, and check that every break is caught.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Lean (elan)
        run: |
          curl -sSfL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Build and compute the certificate
        run: |
          lake build
          lake env lean Certificate/Facts.lean

      - name: An edited Heath word, wrong radii in I.1, a weakened axiom, a statements' word changed, a primitive no longer opaque, stale and incomplete review records, a native_decide, planted assumptions in I.15's porism and I.16, and a sorry in a complete book
        run: python3 scripts/negative_tests.py

  model:
    # The axioms in the plane: needs no Lean, for it reads the committed facts.json.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: The axioms hold in the plane, every weakened axiom is caught, and only Postulate 5 fails in the hyperbolic plane
        run: python3 -I tests/model/run.py --fast

  formal-model:
    # The formal model in model/ (model/README.md, "The CI job"): a Lake package of its
    # own, with a pinned Mathlib, in which Lean checks that the ordinary plane satisfies
    # the laws translated so far. Not `model`, which is the numerical harness above. Every
    # Lean step runs in model/: the main package never sees Mathlib.
    runs-on: ubuntu-latest
    # A run takes a few minutes. Without Mathlib's prebuilt files, lake build would compile
    # Mathlib from source for hours, so the job stops long before that.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - name: Install Lean (elan)
        run: |
          curl -sSfL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Check the model was last brought up to date against the present lock of the axioms
        # model/lock.sha256 holds the sha256 of Certificate/axioms.lock, so any change to
        # the lock fails here until the hash is renewed, after the model is brought up to
        # date wherever an axiom or a word an axiom reaches changed (model/README.md, "How
        # the lock ties it").
        run: grep -v '^#' model/lock.sha256 | shasum -a 256 -c -

      - name: Restore Mathlib, its prebuilt files and their downloads from an earlier run
        # model/.lake/packages holds the pinned clones and the unpacked build (6.6 GB);
        # ~/.cache/mathlib holds what lake exe cache get downloaded (452 MB), which it looks
        # for before downloading again. Both are fixed by model/lake-manifest.json.
        uses: actions/cache@v5
        with:
          path: |
            model/.lake/packages
            ~/.cache/mathlib
          key: formal-model-packages-${{ runner.os }}-${{ hashFiles('model/lake-manifest.json') }}

      - name: Fetch Mathlib's prebuilt files
        # After a restore it downloads nothing and unpacks nothing.
        working-directory: model
        run: lake exe cache get

      - name: Check the proofs in the plane and what they rest on, and each hand translation against the library's declaration
        # Builds Model, with its audit, and Check, with its round trips; any failed check
        # fails the build.
        working-directory: model
        run: lake build

      - name: Check the model's compiled proofs again, by Lean's kernel, apart from the build
        # leanchecker replays every declaration of every compiled module of Model and Check
        # into the environment of the module's imports, which it loads, Mathlib's among them,
        # without replaying; then it replays Check's whole environment, which has no Mathlib,
        # from nothing (model/README.md, "The CI job"). --self-test runs first and needs
        # no Mathlib: lake build must accept a theorem of False added without the kernel's
        # check, and the replay must reject it, naming it.
        run: |
          python3 scripts/check_model_kernel.py --self-test
          python3 scripts/check_model_kernel.py

  acceptance:
    # The acceptance checklist, docs/ACCEPTANCE.md, on every pull request, as this
    # `acceptance` job and docs/briefs/0002-decisions.md describe:
    # scripts/check_acceptance.py checks the pull request and keeps its report as an
    # artifact. Until the consolidation release the job fails only when an item that
    # passes on main does not pass here: a pass may not turn into a fail (save P10 and E6,
    # which turn when a statement is staged before its proof). Main is checked
    # beside the pull request with the pull request's own checks (scripts/, tests/,
    # Certificate/, review/SCHEMA.md, review/terms.toml), keeping main's values pinned to
    # its content (WORKFLOW, section 10, step 4), so that both are judged alike and a
    # check made stricter, in a pull request of its own, holds nothing back.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      # `ratchet`: fail only when a pass on main turns into a fail. The consolidation
      # release's pull request sets `full`, and from then on any failure fails the job.
      # Any other value fails the job at once, so that no misspelling turns the gate off.
      ACCEPTANCE_GATE: ratchet
    steps:
      - uses: actions/checkout@v5
        with:
          # The review records name their commits, which the checker finds in the history.
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Lean (elan)
        run: |
          curl -sSfL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Check the checker's comparison of two runs, case by case
        # tests/test_check_acceptance.py needs no Lean; a comparison read wrongly stops
        # the job before its verdict.
        run: python3 -I tests/test_check_acceptance.py

      - name: Build, and compute the certificate
        run: |
          lake build
          lake build Audit
          lake env lean Certificate/Facts.lean

      - name: Check the pull request against the acceptance checklist, and write its report
        # Exit 1 is a failing item, which the ratchet weighs in the last step; 2 or more is
        # a checker that could not run, which fails at once.
        run: |
          case "$ACCEPTANCE_GATE" in
            ratchet|full) ;;
            *) echo "ACCEPTANCE_GATE is '$ACCEPTANCE_GATE', neither ratchet nor full"; exit 2 ;;
          esac
          mkdir -p "$RUNNER_TEMP/acceptance"
          status=0
          python3 scripts/check_acceptance.py --output "$RUNNER_TEMP/acceptance/report.md" --json "$RUNNER_TEMP/acceptance/verdicts.json" || status=$?
          if [ "$ACCEPTANCE_GATE" = full ]; then exit "$status"; fi
          test "$status" -le 1

      - name: Check main against the checklist, with the pull request's checks
        # The merge commit CI checks out has main as its first parent. The kernel replay
        # and the model tests (E1, E4) are left out here (--quick): the `check` and
        # `model` jobs hold them on every pull request.
        if: env.ACCEPTANCE_GATE == 'ratchet'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ "$(git rev-list --parents -n 1 HEAD | wc -w)" -eq 3 ]; then main_sha=$(git rev-parse HEAD^1); else main_sha="$BASE_SHA"; fi
          main="$RUNNER_TEMP/main"
          git worktree add --detach "$main" "$main_sha"
          # An updated pin belongs to the content it pins. Copying it from the pull
          # request could make unchanged main fail, hiding a real acceptance regression.
          # rsync excludes also protect main's pins from deletion when absent in the PR.
          scripts/copy_acceptance_checks.sh . "$main"
          cp -R .lake "$main/"
          cd "$main"
          lake build
          lake build Audit
          lake env lean Certificate/Facts.lean
          status=0
          python3 scripts/check_acceptance.py --quick --output "$RUNNER_TEMP/acceptance/main-report.md" --json "$RUNNER_TEMP/acceptance/main.json" || status=$?
          test "$status" -le 1

      - name: No item that passes on main fails on the pull request
        if: env.ACCEPTANCE_GATE == 'ratchet'
        run: python3 scripts/check_acceptance.py --compare "$RUNNER_TEMP/acceptance/main.json" "$RUNNER_TEMP/acceptance/verdicts.json"

      - name: Keep the reports
        # report.md and verdicts.json are the pull request's; main-report.md and
        # main.json, main's, judged by the same checks.
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: acceptance
          path: ${{ runner.temp }}/acceptance/

  safe-push-paths:
    # The `safe-push-tests` check, in three jobs (#233). scripts/test_safe_push.py, the
    # tests of the gate every pull request lands through (docs/WORKFLOW.md, sections 8 and
    # 10), runs on each pull request that changes scripts/, tests/, Certificate/,
    # review/SCHEMA.md, review/terms.toml, .github/ (the pull request template among them)
    # or docs/WORKFLOW.md: the check inputs safe_push guards (its CHECK_INPUTS, the gate's
    # code and the tests among them), the workflows, and the page whose section 8 the tests
    # compare with safe_push's CHECKS and the `check` job. This job decides whether it
    # runs; safe-push-shards runs it, whole, in shards side by side; and safe-push-tests,
    # the check's name, passes only when every shard passed and the shards' lists of what
    # they ran prove that every test ran once, or at once, saying why, on any other pull
    # request. On a push all three are skipped.
    # Those paths are not all the tests read: they also read content (heath/I/01.md, the
    # decisions page, docs/briefs/book-I.md, docs/program.toml, docs/reading.md and
    # facts.json) and run check_fidelity.py and render.py over the whole tree, so a pull
    # request that changes only content can still break them, and the next run shows it.
    # The pre-flight leaves this check to CI, and main's ruleset does not require it; a
    # failing run, of a shard or of safe-push-tests, still holds the merge, for the merge
    # gate refuses while any check fails.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 10
    outputs:
      run: ${{ steps.paths.outputs.run }}
    steps:
      - uses: actions/checkout@v5
        with:
          # The next step needs the base commit.
          fetch-depth: 0
          # No token stays in .git/config.
          persist-credentials: false

      - name: Decide whether the pull request changes safe_push's check inputs, .github/ or docs/WORKFLOW.md
        id: paths
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        # Three dots: what the pull request changes since it left main, as GitHub's list of
        # files changed shows it. An empty base or head, or a comparison that fails, fails
        # the job, and so safe-push-tests; it never skips.
        run: |
          : "${BASE_SHA:?}" "${HEAD_SHA:?}"
          changed=$(git diff --name-only "$BASE_SHA...$HEAD_SHA" -- \
            scripts tests Certificate review/SCHEMA.md review/terms.toml .github docs/WORKFLOW.md)
          if [ -n "$changed" ]; then
            printf 'The pull request changes:\n%s\nso scripts/test_safe_push.py runs.\n' "$changed"
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "The pull request changes nothing under scripts/, tests/, Certificate/ or .github/, nor review/SCHEMA.md, review/terms.toml or docs/WORKFLOW.md, so scripts/test_safe_push.py does not run."
            echo "Its tests also read content elsewhere: if this pull request breaks them, the next run shows it."
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

  safe-push-shards:
    # The whole of scripts/test_safe_push.py, in seven shards side by side. In one job it
    # took 37.7 and 45.4 minutes on GitHub's runners, and once ran past its 60-minute limit.
    # `--shard K/N` lists the tests with unittest's own loader and deals them out by the
    # seconds each took on a GitHub runner (scripts/test_safe_push_times.json), so that
    # each test runs in exactly one shard: by those times each shard takes about five and a
    # half minutes, its clone of the repository included. A test missing from that file,
    # one a later pull request adds or renames, weighs their median, and still runs. The
    # tests need Git with the whole history and the pinned YAML parser, but no Lean and no
    # network: FullChecks, which needs Lean, is skipped without STOICHEIA_SLOW_TESTS=1, as
    # it is anywhere.
    needs: safe-push-paths
    if: needs.safe-push-paths.outputs.run == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    # About six minutes by the times measured, more on a busy runner: room to spare.
    timeout-minutes: 30
    strategy:
      # Every shard runs to its end, so that one failing hides none of the others'.
      fail-fast: false
      matrix:
        # 1 to N, each once: strategy.job-total, which each shard is given as N, is N too.
        shard: [1, 2, 3, 4, 5, 6, 7]
    steps:
      - uses: actions/checkout@v5
        with:
          # The pull request's head, the commit safe-push-paths judged, not GitHub's merge
          # of it into main.
          ref: ${{ github.event.pull_request.head.sha }}
          # The tests clone this repository.
          fetch-depth: 0
          # No token stays in .git/config while the pull request's code runs.
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install the pinned YAML parser the tests read the workflow with
        run: python3 -m pip install -r scripts/requirements-test_safe_push.txt

      - name: Check the gate every pull request lands through, guard by guard, one shard of the tests
        # --ran: after its run the shard writes the tests it ran, each with its outcome.
        run: python3 scripts/test_safe_push.py --shard ${{ matrix.shard }}/${{ strategy.job-total }} --ran "$RUNNER_TEMP/ran-${{ matrix.shard }}.json"

      - name: Keep the list of the tests this shard ran, for safe-push-tests's proof
        # Kept when a test failed too, so that the proof names it. A shard that stops
        # before its end writes no list and keeps none, and the proof then fails. A shard
        # run again replaces its list. Kept for 35 days, beyond the 30 in which GitHub lets
        # a run's failed jobs be run again: those run again only the failed shards and
        # safe-push-tests, whose proof needs the other shards' lists still kept.
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: safe-push-ran-${{ matrix.shard }}
          path: ${{ runner.temp }}/ran-${{ matrix.shard }}.json
          if-no-files-found: error
          retention-days: 35
          overwrite: true

  safe-push-tests:
    # The check, by its old name: it passes at once when safe-push-paths finds nothing the
    # tests guard changed, and otherwise only when the shards' result is success, so that a
    # shard that failed, was cancelled or was skipped fails it, and the shards' lists of
    # the tests they ran prove that every test ran once. It runs whatever happened before
    # it (always()), so that it never passes by being skipped. The proof runs first,
    # whatever the shards' result, so that it names each test that failed or did not run;
    # the verdict on the shards' result comes last, whatever the proof found.
    needs: [safe-push-paths, safe-push-shards]
    if: always() && github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 10
    steps:
      # When the tests ran, the proof that each ran once, from what the shards ran rather
      # than from the dealing. The checkout is the shards': the same commit, the same way.
      - uses: actions/checkout@v5
        if: needs.safe-push-paths.outputs.run == 'true'
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          # No token stays in .git/config while the pull request's code runs.
          persist-credentials: false

      - uses: actions/setup-python@v5
        if: needs.safe-push-paths.outputs.run == 'true'
        with:
          python-version: "3.12"

      - name: Install the pinned YAML parser the proof reads the workflow with
        id: install
        if: needs.safe-push-paths.outputs.run == 'true'
        run: python3 -m pip install -r scripts/requirements-test_safe_push.txt

      - name: Fetch every shard's list of the tests it ran
        # A fetch that fails fails the job, and the proof still runs, naming each list
        # it lacks.
        id: fetch
        if: needs.safe-push-paths.outputs.run == 'true'
        uses: actions/download-artifact@v5
        with:
          # Each list in a folder of its own, so that none can hide another.
          pattern: safe-push-ran-*
          path: ${{ runner.temp }}/safe-push-ran

      - name: Prove that every test ran once, in one shard, and passed
        # Against the tests unittest's loader lists at this commit and the matrix's N, it
        # fails, naming each, on a test no shard ran, a test run twice, a shard that left
        # no list, a test the loader does not list, and a test that did not pass. It runs
        # once the checkout, Python and the parser are ready, whatever the shards' result
        # and whether or not the fetch failed.
        id: cover
        if: always() && steps.install.outcome == 'success'
        run: python3 scripts/test_safe_push.py --cover "$RUNNER_TEMP/safe-push-ran"

      - name: Pass only when every shard passed, or when the pull request changes none of those paths
        # Whatever failed before it: a failed proof or fetch fails the job by itself.
        id: verdict
        if: always()
        env:
          PATHS: ${{ needs.safe-push-paths.result }}
          RUN: ${{ needs.safe-push-paths.outputs.run }}
          SHARDS: ${{ needs.safe-push-shards.result }}
        run: |
          if [ "$PATHS" != success ]; then
            echo "safe-push-paths, which decides whether the tests run, ended '$PATHS', not success."
            exit 1
          fi
          if [ "$RUN" = false ]; then
            echo "The pull request changes nothing under scripts/, tests/, Certificate/ or .github/, nor review/SCHEMA.md, review/terms.toml or docs/WORKFLOW.md, so scripts/test_safe_push.py does not run."
            echo "Its tests also read content elsewhere: if this pull request breaks them, the next run shows it."
            exit 0
          fi
          if [ "$RUN" != true ]; then
            echo "safe-push-paths gave no answer ('$RUN'), so whether the tests had to run is unknown."
            exit 1
          fi
          case "$SHARDS" in
            success) echo "Every shard of scripts/test_safe_push.py passed." ;;
            failure) echo "The shards ended in failure: a shard failed, and the proof above and its log name the test."; exit 1 ;;
            cancelled) echo "The shards ended cancelled: a shard was cancelled, so not every test ran."; exit 1 ;;
            skipped) echo "The shards were skipped, though the pull request changes what they test, so no test ran."; exit 1 ;;
            *) echo "The shards ended '$SHARDS', which is not success."; exit 1 ;;
          esac
