name: Release gate (PR copy)

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled, ready_for_review]

permissions: {}

jobs:
  release-gate:
    # Trial only (PR #591, never merged): the pull request's own copy, made to fail, to see
    # which copy the organization's required-workflow rule enforces.
    runs-on: ubuntu-latest
    steps:
      - run: echo "the pull request's copy ran"; exit 1
