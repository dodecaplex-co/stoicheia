<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" font-family="Georgia, 'Times New Roman', serif">
  <title>II.4 at a glance</title>
  <desc>Cut AB anywhere, at C (red, blue), and the square on AB splits into the squares on AC, CB (red, blue) and two rectangles contained by AC, CB (yellow).</desc>
  <rect x="0" y="0" width="400" height="300" rx="10" fill="#fbf7ee"/>
  <polygon points="103.5,53.5 238.5,53.5 238.5,128.5 103.5,128.5" fill="#f2b705" fill-opacity="0.95"/>
  <polygon points="238.5,53.5 313.5,53.5 313.5,128.5 238.5,128.5" fill="#1f5aa6" fill-opacity="0.9"/>
  <polygon points="103.5,128.5 238.5,128.5 238.5,263.5 103.5,263.5" fill="#d0312d" fill-opacity="0.9"/>
  <polygon points="238.5,128.5 313.5,128.5 313.5,263.5 238.5,263.5" fill="#f2b705" fill-opacity="0.95"/>
  <line x1="238.5" y1="53.5" x2="238.5" y2="263.5" stroke="#fbf7ee" stroke-width="2"/>
  <line x1="103.5" y1="128.5" x2="313.5" y2="128.5" stroke="#fbf7ee" stroke-width="2"/>
  <line x1="103.5" y1="40.0" x2="238.5" y2="40.0" stroke="#d0312d" stroke-width="7" stroke-linecap="butt"/>
  <line x1="238.5" y1="40.0" x2="313.5" y2="40.0" stroke="#1f5aa6" stroke-width="7" stroke-linecap="butt"/>
  <g data-unlettered="copies of AH and HD set beside the square, which Heath's figure does not draw">
    <line x1="90.0" y1="53.5" x2="90.0" y2="128.5" stroke="#1f5aa6" stroke-width="7" stroke-linecap="butt"/>
    <line x1="90.0" y1="128.5" x2="90.0" y2="263.5" stroke="#d0312d" stroke-width="7" stroke-linecap="butt"/>
  </g>
  <g font-style="italic" font-size="14" fill="#222222">
    <text x="103.5" y="30" text-anchor="middle">A</text>
    <text x="238.5" y="30" text-anchor="middle">C</text>
    <text x="313.5" y="30" text-anchor="middle">B</text>
    <text x="81" y="133.5" text-anchor="end">H</text>
    <text x="233" y="123" text-anchor="end">G</text>
    <text x="319" y="133.5">K</text>
    <text x="103.5" y="280" text-anchor="middle">D</text>
    <text x="238.5" y="280" text-anchor="middle">F</text>
    <text x="313.5" y="280" text-anchor="middle">E</text>
  </g>
</svg>
