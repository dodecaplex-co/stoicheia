<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" font-family="Georgia, 'Times New Roman', serif">
  <title>II.8 at a glance</title>
  <desc>Cut AB anywhere, at C, and add BD equal to CB (blue): four rectangles contained by AB, BC (red), set round the square on AC (yellow), fill the square on AD, as in Heath's second alternative proof, not Euclid's nine cells.</desc>
  <rect x="0" y="0" width="400" height="300" rx="10" fill="#fbf7ee"/>
  <polygon points="95.0,50.0 245.0,50.0 245.0,110.0 95.0,110.0" fill="#d0312d" fill-opacity="0.9" stroke="#fbf7ee" stroke-width="2" stroke-linejoin="miter"/>
  <g data-unlettered="the corners where the rectangles meet round the square, as in the last proof Heath gives; Euclid's figure has no points there">
    <polygon points="245.0,50.0 305.0,50.0 305.0,200.0 245.0,200.0" fill="#d0312d" fill-opacity="0.9" stroke="#fbf7ee" stroke-width="2" stroke-linejoin="miter"/>
    <polygon points="155.0,200.0 305.0,200.0 305.0,260.0 155.0,260.0" fill="#d0312d" fill-opacity="0.9" stroke="#fbf7ee" stroke-width="2" stroke-linejoin="miter"/>
    <polygon points="95.0,110.0 155.0,110.0 155.0,260.0 95.0,260.0" fill="#d0312d" fill-opacity="0.9" stroke="#fbf7ee" stroke-width="2" stroke-linejoin="miter"/>
    <polygon points="155.0,110.0 245.0,110.0 245.0,200.0 155.0,200.0" fill="#f2b705" fill-opacity="0.95" stroke="#fbf7ee" stroke-width="2" stroke-linejoin="miter"/>
  </g>
  <line x1="95.0" y1="38.0" x2="185.0" y2="38.0" stroke="#f2b705" stroke-width="6" stroke-linecap="butt"/>
  <line x1="185.0" y1="38.0" x2="245.0" y2="38.0" stroke="#1f5aa6" stroke-width="6" stroke-linecap="butt"/>
  <line x1="245.0" y1="38.0" x2="305.0" y2="38.0" stroke="#1f5aa6" stroke-width="6" stroke-linecap="butt"/>
  <circle cx="95.0" cy="38.0" r="4.5" fill="#222222"/>
  <circle cx="185.0" cy="38.0" r="4.5" fill="#222222"/>
  <circle cx="245.0" cy="38.0" r="4.5" fill="#222222"/>
  <circle cx="305.0" cy="38.0" r="4.5" fill="#222222"/>
  <g font-size="14" fill="#222222">
    <text x="95" y="26" text-anchor="middle">A</text>
    <text x="185" y="26" text-anchor="middle">C</text>
    <text x="245" y="26" text-anchor="middle">B</text>
    <text x="305" y="26" text-anchor="middle">D</text>
    <text x="89" y="115" text-anchor="end">M</text>
    <text x="238" y="126" text-anchor="end">K</text>
    <text x="95" y="281" text-anchor="middle">E</text>
    <text x="305" y="281" text-anchor="middle">F</text>
  </g>
</svg>
