<svg xmlns="http://www.w3.org/2000/svg" width="400" height="300" viewBox="0 0 400 300">
  <title>Euclid II.11: cutting a straight line in extreme and mean ratio</title>
  <rect width="400" height="300" rx="10" fill="#fbf7ee"/>
  <g fill="none" stroke="#3b2f2f" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
    <path d="M 135,34.656 L 215.344,34.656 L 215.344,245"/>
    <path d="M 135,34.656 L 135,245 L 265,245 L 265,115"/>
    <path d="M 135,180 L 265,115"/>
  </g>
  <path d="M 135,115 L 265,115" fill="none" stroke="#a0522d" stroke-width="2.6" stroke-linecap="round"/>
  <g fill="#3b2f2f">
    <circle cx="135" cy="115" r="2.6"/>
    <circle cx="265" cy="115" r="2.6"/>
    <circle cx="135" cy="245" r="2.6"/>
    <circle cx="265" cy="245" r="2.6"/>
    <circle cx="135" cy="180" r="2.6"/>
    <circle cx="135" cy="34.656" r="2.6"/>
    <circle cx="215.344" cy="34.656" r="2.6"/>
    <circle cx="215.344" cy="115" r="2.6"/>
    <circle cx="215.344" cy="245" r="2.6"/>
  </g>
  <g fill="#3b2f2f" font-family="Georgia, serif" font-size="17" font-style="italic">
    <text x="115" y="120">A</text>
    <text x="274" y="119">B</text>
    <text x="120" y="266">C</text>
    <text x="267" y="266">D</text>
    <text x="115" y="185">E</text>
    <text x="119" y="29">F</text>
    <text x="221" y="29">G</text>
    <text x="222" y="105">H</text>
    <text x="209" y="266">K</text>
  </g>
</svg>
