<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" font-family="Georgia, 'Times New Roman', serif" font-size="17">
  <title>Euclid II.13: the square opposite an acute angle</title>
  <rect x="0" y="0" width="400" height="300" rx="10" fill="#fbf7ee"/>
  <polygon points="260,65 60,235 360,235" fill="#e9dcc0" fill-opacity="0.55"/>
  <g fill="none" stroke="#3b2f2f" stroke-width="1.6">
    <line x1="260" y1="65" x2="60" y2="235"/>
    <line x1="60" y1="235" x2="360" y2="235"/>
    <line x1="260" y1="65" x2="260" y2="235"/>
    <polyline points="260,223 272,223 272,235"/>
  </g>
  <line x1="260" y1="65" x2="360" y2="235" stroke="#a0522d" stroke-width="2.4"/>
  <g fill="#3b2f2f">
    <circle cx="260" cy="65" r="2.6"/>
    <circle cx="60" cy="235" r="2.6"/>
    <circle cx="360" cy="235" r="2.6"/>
    <circle cx="260" cy="235" r="2.6"/>
    <text x="254" y="51">A</text>
    <text x="50" y="259">B</text>
    <text x="358" y="259">C</text>
    <text x="254" y="259">D</text>
  </g>
</svg>
