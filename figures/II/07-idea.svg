<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" font-family="Georgia, 'Times New Roman', serif">
  <title>II.7 at a glance</title>
  <desc>Cut a straight line anywhere (red, blue): the squares on the whole and on the blue piece make two rectangles contained by the whole and the blue piece (yellow with blue, across the top and down the side) and the square on the red piece.</desc>
  <rect x="0" y="0" width="400" height="300" rx="10" fill="#fbf7ee"/>
  <polygon points="121.0,43.5 241.0,43.5 241.0,98.5 121.0,98.5" fill="#f2b705" fill-opacity="0.95"/>
  <polygon points="241.0,43.5 296.0,43.5 296.0,98.5 241.0,98.5" fill="#1f5aa6" fill-opacity="0.9"/>
  <polygon points="121.0,98.5 241.0,98.5 241.0,218.5 121.0,218.5" fill="#d0312d" fill-opacity="0.9"/>
  <polygon points="241.0,98.5 296.0,98.5 296.0,218.5 241.0,218.5" fill="#f2b705" fill-opacity="0.95"/>
  <polygon points="241.0,218.5 296.0,218.5 296.0,273.5 241.0,273.5" fill="#1f5aa6" fill-opacity="0.9"/>
  <line x1="241.0" y1="43.5" x2="241.0" y2="218.5" stroke="#fbf7ee" stroke-width="2"/>
  <line x1="121.0" y1="98.5" x2="296.0" y2="98.5" stroke="#fbf7ee" stroke-width="2"/>
  <line x1="241.0" y1="218.5" x2="296.0" y2="218.5" stroke="#fbf7ee" stroke-width="2"/>
  <line x1="121.0" y1="30.0" x2="241.0" y2="30.0" stroke="#d0312d" stroke-width="7" stroke-linecap="butt"/>
  <line x1="241.0" y1="30.0" x2="296.0" y2="30.0" stroke="#1f5aa6" stroke-width="7" stroke-linecap="butt"/>
  <line x1="107.5" y1="43.5" x2="107.5" y2="98.5" stroke="#1f5aa6" stroke-width="7" stroke-linecap="butt"/>
  <line x1="107.5" y1="98.5" x2="107.5" y2="218.5" stroke="#d0312d" stroke-width="7" stroke-linecap="butt"/>
</svg>
