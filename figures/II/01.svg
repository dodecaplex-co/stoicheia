<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" font-family="Georgia, 'Times New Roman', serif" font-style="italic" font-size="17">
  <title>Euclid II.1: a rectangle cut into three rectangles</title>
  <rect x="0" y="0" width="400" height="300" rx="10" fill="#fbf7ee"/>
  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M 170 48 H 290 M 60 90 V 266" stroke="#3b2f2f" stroke-width="1.6"/>
    <path d="M 60 90 H 350 V 210 H 60 Z" stroke="#a0522d" stroke-width="2.6"/>
    <path d="M 205 90 V 210 M 290 90 V 210" stroke="#3b2f2f" stroke-width="1.6"/>
  </g>
  <g fill="#3b2f2f">
    <circle cx="60" cy="90" r="2.6"/>
    <circle cx="205" cy="90" r="2.6"/>
    <circle cx="290" cy="90" r="2.6"/>
    <circle cx="350" cy="90" r="2.6"/>
    <circle cx="60" cy="210" r="2.6"/>
    <circle cx="205" cy="210" r="2.6"/>
    <circle cx="290" cy="210" r="2.6"/>
    <circle cx="350" cy="210" r="2.6"/>
    <circle cx="60" cy="266" r="2.6"/>
    <text x="149" y="53">A</text>
    <text x="42" y="80">B</text>
    <text x="198" y="78">D</text>
    <text x="284" y="78">E</text>
    <text x="345" y="78">C</text>
    <text x="39" y="216">G</text>
    <text x="198" y="234">K</text>
    <text x="284" y="234">L</text>
    <text x="343" y="234">H</text>
    <text x="40" y="272">F</text>
  </g>
</svg>
