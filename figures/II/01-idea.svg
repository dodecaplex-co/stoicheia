<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" font-family="Georgia, 'Times New Roman', serif">
  <title>II.1 at a glance</title>
  <desc>Cut BC at D and E (red, yellow, blue), and the rectangle contained by A (black) and BC splits into the rectangles contained by A and each segment.</desc>
  <rect x="0" y="0" width="400" height="300" rx="10" fill="#fbf7ee"/>
  <polygon points="68.5,88.5 153.5,88.5 153.5,228.5 68.5,228.5" fill="#d0312d" fill-opacity="0.9"/>
  <polygon points="153.5,88.5 268.5,88.5 268.5,228.5 153.5,228.5" fill="#f2b705" fill-opacity="0.95"/>
  <polygon points="268.5,88.5 348.5,88.5 348.5,228.5 268.5,228.5" fill="#1f5aa6" fill-opacity="0.9"/>
  <line x1="153.5" y1="88.5" x2="153.5" y2="228.5" stroke="#fbf7ee" stroke-width="2"/>
  <line x1="268.5" y1="88.5" x2="268.5" y2="228.5" stroke="#fbf7ee" stroke-width="2"/>
  <line x1="68.5" y1="75.0" x2="153.5" y2="75.0" stroke="#d0312d" stroke-width="7" stroke-linecap="butt"/>
  <line x1="153.5" y1="75.0" x2="268.5" y2="75.0" stroke="#f2b705" stroke-width="7" stroke-linecap="butt"/>
  <line x1="268.5" y1="75.0" x2="348.5" y2="75.0" stroke="#1f5aa6" stroke-width="7" stroke-linecap="butt"/>
  <line data-unlettered="the straight line A, which Heath names by one letter, not by its ends" x1="55.0" y1="88.5" x2="55.0" y2="228.5" stroke="#222222" stroke-width="7" stroke-linecap="butt"/>
  <g font-size="14" fill="#222222">
    <text x="46" y="163" text-anchor="end">A</text>
    <text x="68.5" y="65" text-anchor="middle">B</text>
    <text x="153.5" y="65" text-anchor="middle">D</text>
    <text x="268.5" y="65" text-anchor="middle">E</text>
    <text x="348.5" y="65" text-anchor="middle">C</text>
    <text x="68.5" y="245" text-anchor="middle">G</text>
    <text x="153.5" y="245" text-anchor="middle">K</text>
    <text x="268.5" y="245" text-anchor="middle">L</text>
    <text x="348.5" y="245" text-anchor="middle">H</text>
  </g>
</svg>
