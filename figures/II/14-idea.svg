<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" font-family="Georgia, 'Times New Roman', serif">
  <title>II.14 at a glance</title>
  <desc>The straight-sided figure A, two triangles, is remade as the rectangle BD, then as a square (all yellow): lay its short side ED (red) beyond BE, to F, draw the semicircle on BF (blue), and EH is the square's side.</desc>
  <rect x="0" y="0" width="400" height="300" rx="10" fill="#fbf7ee"/>
  <polygon points="33.0,182.0 57.0,97.0 131.0,161.0 127.0,226.0" data-unlettered="the corners of the figure A, which Heath leaves without letters, naming the figure by one" fill="#f2b705" fill-opacity="0.95" stroke="#fbf7ee" stroke-width="2" stroke-linejoin="miter"/>
  <line x1="57.0" y1="97.0" x2="127.0" y2="226.0" stroke="#fbf7ee" stroke-width="2"/>
  <polygon points="163.1,223.5 331.1,223.5 331.1,181.5 163.1,181.5" fill="#f2b705" fill-opacity="0.95" stroke="#fbf7ee" stroke-width="2" stroke-linejoin="miter"/>
  <polygon points="247.1,181.5 331.1,181.5 331.1,97.5 247.1,97.5" data-unlettered="the square on EH, which Heath's figure does not draw" fill="#f2b705" fill-opacity="0.95" stroke="#fbf7ee" stroke-width="2" stroke-linejoin="miter"/>
  <path d="M373.1,181.5 A105.0,105.0 0 0,0 163.1,181.5" fill="none" stroke="#1f5aa6" stroke-width="3" stroke-opacity="0.75"/>
  <line x1="163.1" y1="181.5" x2="331.1" y2="181.5" stroke="#222222" stroke-width="4" stroke-linecap="round"/>
  <line x1="331.1" y1="181.5" x2="331.1" y2="97.5" stroke="#222222" stroke-width="3" stroke-linecap="round"/>
  <line x1="331.1" y1="181.5" x2="331.1" y2="223.5" stroke="#d0312d" stroke-width="6" stroke-linecap="round"/>
  <line x1="331.1" y1="181.5" x2="373.1" y2="181.5" stroke="#d0312d" stroke-width="6" stroke-linecap="round"/>
  <circle cx="331.1" cy="97.5" r="4.5" fill="#222222"/>
  <g font-size="14" fill="#222222">
    <text x="68" y="165" text-anchor="middle">A</text>
    <text x="337" y="92">H</text>
    <text x="157" y="179" text-anchor="end">B</text>
    <text x="339" y="199">E</text>
    <text x="375" y="199" text-anchor="middle">F</text>
    <text x="160" y="240" text-anchor="middle">C</text>
    <text x="336" y="240">D</text>
  </g>
</svg>
