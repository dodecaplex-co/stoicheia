<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" font-family="Georgia, 'Times New Roman', serif">
  <title>II.2 at a glance</title>
  <desc>Cut a straight line anywhere (red, blue), and the square on the whole splits into the rectangles contained by the whole (black) and each piece.</desc>
  <rect x="0" y="0" width="400" height="300" rx="10" fill="#fbf7ee"/>
  <polygon points="108.5,58.5 188.5,58.5 188.5,258.5 108.5,258.5" fill="#d0312d" fill-opacity="0.9"/>
  <polygon points="188.5,58.5 308.5,58.5 308.5,258.5 188.5,258.5" fill="#1f5aa6" fill-opacity="0.9"/>
  <line x1="188.5" y1="58.5" x2="188.5" y2="258.5" stroke="#fbf7ee" stroke-width="2"/>
  <line x1="108.5" y1="45.0" x2="188.5" y2="45.0" stroke="#d0312d" stroke-width="7" stroke-linecap="butt"/>
  <line x1="188.5" y1="45.0" x2="308.5" y2="45.0" stroke="#1f5aa6" stroke-width="7" stroke-linecap="butt"/>
  <line x1="95.0" y1="58.5" x2="95.0" y2="258.5" stroke="#222222" stroke-width="7" stroke-linecap="butt"/>
</svg>
