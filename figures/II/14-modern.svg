<svg xmlns="http://www.w3.org/2000/svg" width="400" height="300" viewBox="0 0 400 300" font-family="Georgia, 'Times New Roman', serif" font-size="17">
  <title>II.14: the modern way</title>
  <rect x="0" y="0" width="400" height="300" rx="10" fill="#fbf7ee"/>
  <polygon points="40,200 40,232 328,232 328,200" fill="#e9dcc0" fill-opacity="0.55"/>
  <path d="M 360.0 200 A 160.0 160.0 0 0 0 40 200" fill="none" stroke="#8c7b62" stroke-width="1.3"/>
  <line x1="40" y1="200" x2="40" y2="232" stroke="#3b2f2f" stroke-width="1.6"/>
  <line x1="40" y1="232" x2="328" y2="232" stroke="#3b2f2f" stroke-width="1.6"/>
  <line x1="328" y1="232" x2="328" y2="200" stroke="#3b2f2f" stroke-width="1.6"/>
  <line x1="40" y1="200" x2="360" y2="200" stroke="#3b2f2f" stroke-width="1.6"/>
  <line x1="200" y1="200" x2="328" y2="104" stroke="#3b2f2f" stroke-width="1.6"/>
  <line x1="328" y1="200" x2="328" y2="104" stroke="#a0522d" stroke-width="2.4"/>
  <polyline points="318,200 318,190 328,190" fill="none" stroke="#8c7b62" stroke-width="1.3"/>
  <circle cx="40" cy="200" r="2.6" fill="#3b2f2f"/>
  <circle cx="40" cy="232" r="2.6" fill="#3b2f2f"/>
  <circle cx="328" cy="232" r="2.6" fill="#3b2f2f"/>
  <circle cx="328" cy="200" r="2.6" fill="#3b2f2f"/>
  <circle cx="360" cy="200" r="2.6" fill="#3b2f2f"/>
  <circle cx="200" cy="200" r="2.6" fill="#3b2f2f"/>
  <circle cx="328" cy="104" r="2.6" fill="#3b2f2f"/>
  <g fill="#3b2f2f">
    <text font-size="17" x="24" y="197" text-anchor="middle">B</text>
    <text font-size="17" x="40" y="256" text-anchor="middle">C</text>
    <text font-size="17" x="328" y="256" text-anchor="middle">D</text>
    <text font-size="17" x="342" y="220" text-anchor="middle">E</text>
    <text font-size="17" x="374" y="220" text-anchor="middle">F</text>
    <text font-size="17" x="188" y="187" text-anchor="middle">G</text>
    <text font-size="17" x="344" y="96" text-anchor="middle">H</text>
    <text font-size="17" x="184" y="252" text-anchor="middle" font-style="italic">a</text>
    <text font-size="17" x="344" y="188" text-anchor="middle" font-style="italic">b</text>
    <text font-size="17" x="255" y="140" text-anchor="middle" font-style="italic" transform="rotate(-36.9 255 140)">(a + b)/2</text>
    <text font-size="17" x="264" y="220" text-anchor="middle" font-style="italic">(a − b)/2</text>
    <text font-size="17" x="312" y="160" text-anchor="middle" font-style="italic" transform="rotate(-90 312 160)">√(ab)</text>
  </g>
</svg>
