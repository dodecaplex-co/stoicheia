  <polygon points="84.0,188.0 164.0,188.0 164.0,138.0 84.0,138.0" fill="#d0312d" fill-opacity="0.9" stroke="#fbf7ee" stroke-width="2" stroke-linejoin="miter"/>
  <polygon points="34.0,138.0 84.0,138.0 84.0,58.0 34.0,58.0" fill="#d0312d" fill-opacity="0.9" stroke="#fbf7ee" stroke-width="2" stroke-linejoin="miter"/>
