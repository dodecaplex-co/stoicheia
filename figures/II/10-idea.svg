<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" font-family="Georgia, 'Times New Roman', serif">
  <title>II.10 at a glance</title>
  <desc>Halve a straight line and lengthen it: the squares on the lengthened line and on the added piece (left) are twice the squares on the half (yellow) and on the half and added piece together (blue), for the red and black pieces make a second blue and yellow.</desc>
