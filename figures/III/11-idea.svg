<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" font-family="Georgia, 'Times New Roman', serif">
  <title>III.11 at a glance</title>
  <desc>Let the red circle touch the blue from inside. Join their centres and carry the straight line on: it reaches the point of contact, where a radius of each (blue, red) lies along one straight line.</desc>
  <rect x="0" y="0" width="400" height="300" rx="10" fill="#fbf7ee"/>
  <circle cx="222.00" cy="150.00" r="118.00" fill="none" stroke="#1f5aa6" stroke-width="3" stroke-opacity="0.75"/>
  <circle cx="179.35" cy="167.23" r="72.00" fill="none" stroke="#d0312d" stroke-width="3" stroke-opacity="0.75"/>
  <line x1="222.00" y1="150.00" x2="179.35" y2="167.23" stroke="#1f5aa6" stroke-width="6" stroke-linecap="round"/>
  <line x1="180.47" y1="170.01" x2="113.72" y2="196.99" stroke="#1f5aa6" stroke-width="5" stroke-linecap="butt"/>
  <line x1="178.23" y1="164.45" x2="111.47" y2="191.42" stroke="#d0312d" stroke-width="5" stroke-linecap="butt"/>
  <circle cx="222.00" cy="150.00" r="4.5" fill="#222222"/>
  <circle cx="179.35" cy="167.23" r="4.5" fill="#222222"/>
  <circle cx="112.59" cy="194.20" r="4.5" fill="#222222"/>
  <g font-size="14" fill="#222222" text-anchor="middle">
    <text x="98.7" y="204.7">A</text>
    <text x="289.5" y="42.6">B</text>
    <text x="322.4" y="239.1">C</text>
    <text x="205" y="215">E</text>
    <text x="226" y="137">F</text>
    <text x="185" y="186.1">G</text>
  </g>
</svg>
