<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" font-family="Georgia, 'Times New Roman', serif">
  <title>III.14 at a glance</title>
  <desc>Lay two equal straight lines in a circle (red), and the perpendiculars from the centre to them come out equal (yellow). Make the perpendiculars equal, and the lines are equal.</desc>
  <rect x="0" y="0" width="400" height="300" rx="10" fill="#fbf7ee"/>
  <circle cx="200.00" cy="150.00" r="120.00" fill="none" stroke="#222222" stroke-width="3" stroke-opacity="0.6"/>
  <polyline points="164.03,115.27 172.37,106.64 163.74,98.30" fill="none" stroke="#222222" stroke-width="1.6"/>
  <polyline points="247.55,165.45 243.84,176.86 255.26,180.57" fill="none" stroke="#222222" stroke-width="1.6"/>
  <line x1="226.77" y1="33.02" x2="84.03" y2="180.84" stroke="#d0312d" stroke-width="6" stroke-linecap="round"/>
  <line x1="227.22" y1="266.87" x2="290.71" y2="71.45" stroke="#d0312d" stroke-width="6" stroke-linecap="round"/>
  <line x1="200.00" y1="150.00" x2="155.40" y2="106.93" stroke="#f2b705" stroke-width="6" stroke-linecap="round"/>
  <line x1="200.00" y1="150.00" x2="258.97" y2="169.16" stroke="#f2b705" stroke-width="6" stroke-linecap="round"/>
  <circle cx="200.00" cy="150.00" r="4.5" fill="#222222"/>
</svg>
