<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" font-family="Georgia, 'Times New Roman', serif">
  <title>III.5 at a glance</title>
  <desc>Give two circles that cut (red, blue) one centre, and the smaller (dashed) falls wholly within the larger, meeting it nowhere. Circles that cut never share a centre.</desc>
  <rect x="0" y="0" width="400" height="300" rx="10" fill="#fbf7ee"/>
  <circle cx="250.0" cy="150.0" r="78.0" fill="none" stroke="#d0312d" stroke-width="3" stroke-opacity="0.75" stroke-dasharray="9 8"/>
  <circle cx="158.0" cy="150.0" r="78.0" fill="none" stroke="#d0312d" stroke-width="3" stroke-opacity="0.75"/>
  <circle cx="250.0" cy="150.0" r="100.0" fill="none" stroke="#1f5aa6" stroke-width="3" stroke-opacity="0.75"/>
  <circle cx="158.0" cy="150.0" r="4.5" fill="#222222"/>
  <circle cx="250.0" cy="150.0" r="4.5" fill="#222222"/>
  <circle cx="182.7" cy="224.0" r="4.5" fill="#222222"/>
  <circle cx="182.7" cy="76.0" r="4.5" fill="#222222"/>
</svg>
