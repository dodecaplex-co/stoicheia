<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 210" font-family="Georgia, 'Times New Roman', serif" font-style="italic" font-size="17">
  <title>Euclid III.23: similar segments on the same straight line</title>
  <rect x="0" y="0" width="400" height="210" rx="10" fill="#fbf7ee"/>
  <g fill="none" stroke="#a0522d" stroke-width="2.4">
    <path d="M 40,150 A 260.2,260.2 0 0 1 360,150"/>
    <path d="M 40,150 A 193.1,193.1 0 0 1 360,150"/>
  </g>
  <g fill="none" stroke="#3b2f2f" stroke-width="1.6">
    <line x1="40" y1="150" x2="360" y2="150"/>
    <polyline points="40,150 293.8735,89.3628 360,150 250,99.8419"/>
  </g>
  <g fill="#3b2f2f">
    <circle cx="40" cy="150" r="2.6"/>
    <circle cx="360" cy="150" r="2.6"/>
    <circle cx="250" cy="99.8419" r="2.6"/>
    <circle cx="293.8735" cy="89.3628" r="2.6"/>
    <text x="28" y="173">A</text>
    <text x="356" y="173">B</text>
    <text x="241" y="123">C</text>
    <text x="296" y="75">D</text>
  </g>
</svg>
