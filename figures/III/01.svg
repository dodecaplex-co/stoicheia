  <g fill="none" stroke="#3b2f2f" stroke-width="1.6">
    <line x1="100.723" y1="220" x2="299.277" y2="220"/>
    <line x1="200" y1="44" x2="200" y2="276"/>
    <line x1="100.723" y1="220" x2="234" y2="154"/>
