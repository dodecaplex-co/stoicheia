<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" font-family="Georgia, 'Times New Roman', serif">
  <title>III.23 at a glance</title>
  <desc>Draw two different segments ACB, ADB on the same straight line AB (blue), on the same side: the angle ACB (red) in the inner one is always greater than ADB (yellow). So two segments there with equal angles coincide.</desc>
  <rect x="0" y="0" width="400" height="300" rx="10" fill="#fbf7ee"/>
  <path d="M138.1,172.7 L163.2,179.4 A26,26 0 0,1 117.6,188.7 Z" fill="#d0312d"/>
  <path d="M258.7,78.5 L269.6,102.1 A26,26 0 0,1 238.2,94.5 Z" fill="#f2b705"/>
  <path d="M75.0,222.0 A157.0,157.0 0 0,1 325.0,222.0" fill="none" stroke="#222222" stroke-width="3" stroke-opacity="0.6" stroke-linecap="round"/>
  <path d="M75.0,222.0 A128.4,128.4 0 1,1 325.0,222.0" fill="none" stroke="#222222" stroke-width="3" stroke-opacity="0.6" stroke-linecap="round"/>
  <line x1="75.0" y1="222.0" x2="258.7" y2="78.5" stroke="#222222" stroke-width="3" stroke-linecap="round"/>
  <line x1="138.1" y1="172.7" x2="325.0" y2="222.0" stroke="#222222" stroke-width="3" stroke-linecap="round"/>
  <line x1="258.7" y1="78.5" x2="325.0" y2="222.0" stroke="#222222" stroke-width="3" stroke-linecap="round"/>
  <line x1="75.0" y1="222.0" x2="325.0" y2="222.0" stroke="#1f5aa6" stroke-width="7" stroke-linecap="round"/>
  <g font-size="14" fill="#222222" text-anchor="middle">
    <text x="69.0" y="242.9">A</text>
    <text x="331.0" y="242.9">B</text>
    <text x="130.6" y="164.6">C</text>
    <text x="265.6" y="70.1">D</text>
  </g>
</svg>
