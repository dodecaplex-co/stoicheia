<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" font-family="Georgia, 'Times New Roman', serif">
  <title>III.23 at a glance</title>
  <desc>Two different segments of circles on the same straight line (blue) and on the same side never hold equal angles: the angle in the inner one (red) is always the greater. So similar segments there are one and the same.</desc>
