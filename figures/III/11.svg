<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 340" font-family="Georgia, 'Times New Roman', serif" font-size="17">
  <title>Euclid III.11: the straight line of the centres through internal contact</title>
  <rect x="0" y="0" width="400" height="340" rx="10" fill="#fbf7ee"/>
  <!-- Heath's false case (vol. 2, p. 24): G cannot be the centre of the circle drawn. -->
  <g fill="none" stroke="#8c7b62" stroke-width="1.3">
    <circle cx="220" cy="175" r="125"/>
    <circle cx="190" cy="152.5" r="87.5"/>
  </g>
  <g stroke="#3b2f2f" stroke-width="1.6">
    <line x1="120" y1="100" x2="220" y2="175"/>
    <line x1="120" y1="100" x2="220" y2="135"/>
  </g>
  <line x1="220" y1="175" x2="220" y2="50" stroke="#a0522d" stroke-width="2.5"/>
  <g fill="#3b2f2f">
    <circle cx="120" cy="100" r="2.6"/>
    <circle cx="345" cy="175" r="2.6"/>
    <circle cx="200" cy="298.390" r="2.6"/>
    <circle cx="220" cy="70.304" r="2.6"/>
    <circle cx="170" cy="237.684" r="2.6"/>
    <circle cx="220" cy="175" r="2.6"/>
    <circle cx="220" cy="135" r="2.6"/>
    <circle cx="220" cy="50" r="2.6"/>
    <text x="100" y="96">A</text>
    <text x="355" y="181">B</text>
    <text x="191" y="320">C</text>
    <text x="198" y="94">D</text>
    <text x="151" y="256">E</text>
    <text x="226" y="195">F</text>
    <text x="230" y="141">G</text>
    <text x="215" y="37">H</text>
  </g>
</svg>
