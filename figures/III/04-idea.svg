<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" font-family="Georgia, 'Times New Roman', serif">
  <title>III.4 at a glance</title>
  <desc>Cross two straight lines in a circle away from the centre, and halve one (red): the pieces of the other (blue, yellow) come out unequal. They never halve each other.</desc>
  <rect x="0" y="0" width="400" height="300" rx="10" fill="#fbf7ee"/>
  <circle cx="200.0" cy="150.0" r="112.0" fill="none" stroke="#222222" stroke-width="3" stroke-opacity="0.6"/>
  <line x1="166.0" y1="180.0" x2="218.7" y2="39.6" stroke="#1f5aa6" stroke-width="7" stroke-linecap="round"/>
  <line x1="166.0" y1="180.0" x2="141.4" y2="245.5" stroke="#f2b705" stroke-width="7" stroke-linecap="round"/>
  <line x1="233.8" y1="256.8" x2="166.0" y2="180.0" stroke="#d0312d" stroke-width="7" stroke-linecap="round"/>
  <line x1="166.0" y1="180.0" x2="98.2" y2="103.2" stroke="#d0312d" stroke-width="7" stroke-linecap="round"/>
  <circle cx="200.0" cy="150.0" r="4.5" fill="#222222"/>
  <g font-size="14" fill="#222222" text-anchor="middle">
    <text x="85.5" y="102.3">A</text>
    <text x="133.6" y="263.2">B</text>
    <text x="238.3" y="276">C</text>
    <text x="221.2" y="29.7">D</text>
    <text x="183.8" y="182.2">E</text>
    <text x="200" y="140.4">F</text>
  </g>
</svg>
