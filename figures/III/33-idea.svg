<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" font-family="Georgia, 'Times New Roman', serif">
  <title>III.33 at a glance</title>
  <desc>Lay the given angle at C (red), here acute, on AB at A, as BAD. The circle that touches AD at A (blue) and passes through B cuts off a segment AEB (yellow) whose angles all equal it.</desc>
  <rect x="0" y="0" width="400" height="300" rx="10" fill="#fbf7ee"/>
  <circle cx="256.0" cy="149.84" r="112.27" fill="none" stroke="#222222" stroke-width="3" stroke-opacity="0.6"/>
  <path d="M34.0,158.0 L64.0,158.0 A30,30 0 0,0 53.3,135.0 Z" fill="#d0312d"/>
  <path d="M170.0,222.0 L208.0,222.0 A38,38 0 0,1 194.4,251.1 Z" fill="#d0312d"/>
  <path d="M342.0,77.7 L314.4,100.8 A36,36 0 0,0 342.0,113.7 Z" fill="#d0312d"/>
  <line data-unlettered="the arms of the given angle at C, which Heath's figure leaves without letters" x1="34.0" y1="158.0" x2="122.0" y2="158.0" stroke="#222222" stroke-width="4" stroke-linecap="round"/>
  <line data-unlettered="the arms of the given angle at C, which Heath's figure leaves without letters" x1="34.0" y1="158.0" x2="90.6" y2="90.6" stroke="#222222" stroke-width="4" stroke-linecap="round"/>
  <path d="M342.0,222.0 A112.27,112.27 0 1,0 170.0,222.0" fill="none" stroke="#f2b705" stroke-width="7" stroke-linecap="butt"/>
  <line x1="342.0" y1="77.7" x2="170.0" y2="222.0" stroke="#222222" stroke-width="3" stroke-linecap="round"/>
  <line x1="342.0" y1="77.7" x2="342.0" y2="222.0" stroke="#222222" stroke-width="3" stroke-linecap="round"/>
  <line data-unlettered="DA produced beyond A, which Heath's figure leaves without a letter" x1="141.7" y1="188.3" x2="217.6" y2="278.7" stroke="#1f5aa6" stroke-width="6" stroke-linecap="round"/>
  <line x1="170.0" y1="222.0" x2="342.0" y2="222.0" stroke="#222222" stroke-width="5" stroke-linecap="round"/>
  <g font-size="14" fill="#222222" text-anchor="middle">
    <text x="157.7" y="237.2">A</text>
    <text x="353.5" y="236.5">B</text>
