  <circle cx="200.0" cy="148.0" r="112.0" fill="none" stroke="#222222" stroke-width="3" stroke-opacity="0.6"/>
  <path d="M187.9,196.5 L194.7,169.3 A28,28 0 0,1 215.1,203.3 Z" fill="#f2b705"/>
  <path d="M187.9,196.5 L160.7,189.7 A28,28 0 0,1 194.7,169.3 Z" fill="#f2b705"/>
  <polyline points="199.5,199.4 202.5,187.8 190.8,184.9" fill="none" stroke="#222222" stroke-width="1.6"/>
  <polyline points="176.3,193.6 179.2,182.0 190.8,184.9" fill="none" stroke="#222222" stroke-width="1.6"/>
  <line x1="90.7" y1="172.3" x2="187.9" y2="196.5" stroke="#d0312d" stroke-width="7" stroke-linecap="round"/>
  <line x1="187.9" y1="196.5" x2="285.1" y2="220.8" stroke="#d0312d" stroke-width="7" stroke-linecap="round"/>
  <line x1="227.1" y1="39.3" x2="172.9" y2="256.7" stroke="#222222" stroke-width="5" stroke-linecap="round"/>
  <circle cx="200.0" cy="148.0" r="4.5" fill="#222222"/>
  <g font-size="14" fill="#222222" text-anchor="middle">
    <text x="76.1" y="180.5">A</text>
    <text x="296.5" y="235.5">B</text>
    <text x="230.7" y="29.6">C</text>
    <text x="169.3" y="276.2">D</text>
    <text x="213" y="149.9">E</text>
    <text x="197.2" y="218.8">F</text>
  </g>
</svg>
