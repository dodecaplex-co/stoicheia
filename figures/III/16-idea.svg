<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" font-family="Georgia, 'Times New Roman', serif">
  <title>III.16 at a glance</title>
  <desc>Stand a straight line (red) at right angles (yellow) to a diameter at its end, and it touches the circle. Tilt it ever so little (dashed) and it cuts in: no straight line fits between it and the circumference.</desc>
