<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" font-family="Georgia, 'Times New Roman', serif">
  <title>III.35 at a glance</title>
  <desc>Cross AC and BD at E in a circle (red, blue): the rectangle contained by AE, EC equals the rectangle contained by DE, EB (both yellow).</desc>
  <rect x="0" y="0" width="400" height="300" rx="10" fill="#fbf7ee"/>
  <circle cx="112.0" cy="150.0" r="88.0" fill="none" stroke="#222222" stroke-width="3" stroke-opacity="0.6"/>
  <line x1="110.2" y1="62.0" x2="169.8" y2="216.4" stroke="#d0312d" stroke-width="6" stroke-linecap="round"/>
  <line x1="198.5" y1="133.8" x2="93.0" y2="235.9" stroke="#1f5aa6" stroke-width="6" stroke-linecap="round"/>
  <circle cx="154.4" cy="176.5" r="4.5" fill="#222222"/>
  <g data-unlettered="the rectangles AE, EC and DE, EB drawn apart, which Heath's figure does not draw">
    <polygon points="243.9,89.3 286.6,89.3 286.6,212.0 243.9,212.0" fill="#f2b705" fill-opacity="0.95" stroke="#fbf7ee" stroke-width="2" stroke-linejoin="miter"/>
    <polygon points="324.6,126.6 386.0,126.6 386.0,212.0 324.6,212.0" fill="#f2b705" fill-opacity="0.95" stroke="#fbf7ee" stroke-width="2" stroke-linejoin="miter"/>
    <line x1="243.9" y1="224.0" x2="286.6" y2="224.0" stroke="#d0312d" stroke-width="7" stroke-linecap="butt"/>
    <line x1="231.9" y1="89.3" x2="231.9" y2="212.0" stroke="#d0312d" stroke-width="7" stroke-linecap="butt"/>
    <line x1="324.6" y1="224.0" x2="386.0" y2="224.0" stroke="#1f5aa6" stroke-width="7" stroke-linecap="butt"/>
    <line x1="312.6" y1="126.6" x2="312.6" y2="212.0" stroke="#1f5aa6" stroke-width="7" stroke-linecap="butt"/>
  </g>
  <g font-size="14" fill="#222222" text-anchor="middle">
    <text x="110.0" y="51.9">A</text>
    <text x="89.8" y="255.4">B</text>
    <text x="179.7" y="232.6">C</text>
    <text x="213.2" y="135.9">D</text>
    <text x="174.0" y="185.9">E</text>
  </g>
</svg>
