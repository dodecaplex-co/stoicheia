<svg xmlns="http://www.w3.org/2000/svg" width="400" height="350" viewBox="0 0 400 350">
  <title>Euclid III.13: a circle touches a circle at one point only</title>
  <rect width="400" height="350" rx="10" fill="#fbf7ee"/>
  <g fill="none">
    <circle cx="150" cy="210" r="112" stroke="#8c7b62" stroke-width="1.3"/>
    <ellipse cx="150" cy="210" rx="112" ry="55" stroke="#a0522d" stroke-width="2.4"/>
    <circle cx="276" cy="102" r="65" stroke="#a0522d" stroke-width="2.4"/>
    <path d="M 38,210 H 262 M 212.821,117.277 L 251.240,162.099" stroke="#3b2f2f" stroke-width="1.6"/>
  </g>
  <g fill="#3b2f2f">
    <circle cx="212.821" cy="117.277" r="2.6"/>
    <circle cx="38" cy="210" r="2.6"/>
    <circle cx="251.240" cy="162.099" r="2.6"/>
    <circle cx="262" cy="210" r="2.6"/>
    <circle cx="150" cy="155" r="2.6"/>
    <circle cx="150" cy="265" r="2.6"/>
    <circle cx="150" cy="210" r="2.6"/>
    <circle cx="207" cy="210" r="2.6"/>
    <circle cx="341" cy="102" r="2.6"/>
  </g>
  <g font-family="Georgia, serif" font-style="italic" font-size="17" fill="#3b2f2f">
    <text x="194" y="98">A</text>
    <text x="20" y="216">B</text>
    <text x="262" y="184">C</text>
    <text x="272" y="216">D</text>
    <text x="144" y="144">E</text>
