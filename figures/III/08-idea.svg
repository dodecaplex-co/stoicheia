<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" font-family="Georgia, 'Times New Roman', serif">
  <title>III.8 at a glance</title>
  <desc>From a point outside a circle, the straight line through the centre is greatest (red), and its part outside the circle least (yellow). The others pair off equal, one on each side, to the far circumference (blue) or the near (black).</desc>
  <rect x="0" y="0" width="400" height="300" rx="10" fill="#fbf7ee"/>
  <circle cx="236.0" cy="150.0" r="106.0" fill="none" stroke="#222222" stroke-width="3" stroke-opacity="0.6"/>
  <line x1="62.0" y1="150.0" x2="317.0" y2="218.3" stroke="#1f5aa6" stroke-width="6" stroke-linecap="round"/>
  <line x1="62.0" y1="150.0" x2="317.0" y2="81.7" stroke="#1f5aa6" stroke-width="6" stroke-linecap="round"/>
  <line x1="62.0" y1="150.0" x2="139.0" y2="192.7" stroke="#222222" stroke-width="6" stroke-linecap="round"/>
  <line x1="62.0" y1="150.0" x2="139.0" y2="107.3" stroke="#222222" stroke-width="6" stroke-linecap="round"/>
  <line x1="130.0" y1="150.0" x2="342.0" y2="150.0" stroke="#d0312d" stroke-width="6" stroke-linecap="butt"/>
  <line x1="62.0" y1="147.0" x2="130.0" y2="147.0" stroke="#d0312d" stroke-width="5" stroke-linecap="butt"/>
  <line x1="62.0" y1="153.0" x2="130.0" y2="153.0" stroke="#f2b705" stroke-width="5" stroke-linecap="butt"/>
  <circle cx="236.0" cy="150.0" r="4.5" fill="#222222"/>
  <circle cx="62.0" cy="150.0" r="4.5" fill="#222222"/>
</svg>
