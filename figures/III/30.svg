<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" font-family="Georgia, 'Times New Roman', serif" font-size="17">
  <title>Euclid III.30: to bisect a given circumference</title>
  <rect x="0" y="0" width="400" height="300" rx="10" fill="#fbf7ee"/>
  <polygon points="60,210 200,126 340,210" fill="#e9dcc0" fill-opacity="0.55"/>
  <g fill="none" stroke="#3b2f2f" stroke-width="1.6">
    <path d="M 60,210 H 340 L 200,126 Z"/>
    <path d="M 200,210 V 126"/>
  </g>
  <path d="M 200,198 H 212 V 210" fill="none" stroke="#8c7b62" stroke-width="1.3"/>
  <path d="M 60,210 A 158.6666667,158.6666667 0 0 1 340,210" fill="none" stroke="#a0522d" stroke-width="2.5"/>
  <g fill="#3b2f2f">
    <circle cx="60" cy="210" r="2.6"/>
    <circle cx="340" cy="210" r="2.6"/>
    <circle cx="200" cy="210" r="2.6"/>
    <circle cx="200" cy="126" r="2.6"/>
    <text x="49" y="234">A</text>
    <text x="336" y="234">B</text>
    <text x="194" y="234">C</text>
    <text x="194" y="110">D</text>
  </g>
</svg>
