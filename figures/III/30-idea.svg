<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" font-family="Georgia, 'Times New Roman', serif">
  <title>III.30 at a glance</title>
  <desc>Join the ends of the circumference, halve the straight line (yellow) and stand a perpendicular on its middle (black). The straight lines from where it meets the circumference to the ends (blue) are equal, so they cut off equal circumferences (red).</desc>
  <rect x="0" y="0" width="400" height="300" rx="10" fill="#fbf7ee"/>
  <polyline points="212.0,210.5 212.0,198.5 200.0,198.5" fill="none" stroke="#222222" stroke-width="1.6"/>
  <polyline points="188.0,210.5 188.0,198.5 200.0,198.5" fill="none" stroke="#222222" stroke-width="1.6"/>
  <path d="M200.0,100.0 A168.0,168.0 0 0,0 42.1,210.5" fill="none" stroke="#d0312d" stroke-width="6" stroke-linecap="round"/>
  <path d="M357.9,210.5 A168.0,168.0 0 0,0 200.0,100.0" fill="none" stroke="#d0312d" stroke-width="6" stroke-linecap="round"/>
  <line x1="42.1" y1="210.5" x2="200.0" y2="100.0" stroke="#1f5aa6" stroke-width="6" stroke-linecap="round"/>
  <line x1="200.0" y1="100.0" x2="357.9" y2="210.5" stroke="#1f5aa6" stroke-width="6" stroke-linecap="round"/>
  <line x1="42.1" y1="210.5" x2="200.0" y2="210.5" stroke="#f2b705" stroke-width="7" stroke-linecap="round"/>
  <line x1="200.0" y1="210.5" x2="357.9" y2="210.5" stroke="#f2b705" stroke-width="7" stroke-linecap="round"/>
  <line x1="200.0" y1="210.5" x2="200.0" y2="100.0" stroke="#222222" stroke-width="4" stroke-linecap="round"/>
  <circle cx="200.0" cy="210.5" r="4.5" fill="#222222"/>
  <circle cx="200.0" cy="100.0" r="4.5" fill="#222222"/>
</svg>
