  <line x1="78.7" y1="120.3" x2="50.0" y2="220.0" stroke="#222222" stroke-width="3" stroke-linecap="round"/>
  <line x1="78.7" y1="120.3" x2="182.0" y2="220.0" stroke="#222222" stroke-width="3" stroke-linecap="round"/>
  <line x1="50.0" y1="220.0" x2="182.0" y2="220.0" stroke="#1f5aa6" stroke-width="7" stroke-linecap="round"/>
