<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 340" font-family="Georgia, 'Times New Roman', serif" font-style="italic" font-size="17">
  <title>Euclid III.7: greatest, least, and equal straight lines from a point within a circle</title>
  <rect x="0" y="0" width="400" height="340" rx="10" fill="#fbf7ee"/>
  <g fill="#e9dcc0" fill-opacity="0.55" stroke="none">
    <polygon points="200,170 280,170 314.315,104"/>
    <polygon points="200,170 280,170 314.315,236"/>
  </g>
  <circle cx="200" cy="170" r="132" fill="none" stroke="#8c7b62" stroke-width="1.3"/>
  <!-- BE, CE, GE and EH; EK is dotted as in Heath's figure. -->
  <g stroke="#3b2f2f" stroke-width="1.6" fill="none">
    <line x1="200" y1="170" x2="80.367" y2="114.214"/>
    <line x1="200" y1="170" x2="130.051" y2="58.058"/>
    <line x1="200" y1="170" x2="314.315" y2="104"/>
    <line x1="200" y1="170" x2="314.315" y2="236"/>
    <line x1="200" y1="170" x2="286.600" y2="269.622" stroke-dasharray="2 5" stroke-linecap="round"/>
  </g>
  <!-- The straight lines compared from F, with FA and FD on the diameter AD. -->
  <g stroke="#a0522d" stroke-width="2.4" fill="none">
    <line x1="68" y1="170" x2="332" y2="170"/>
    <line x1="280" y1="170" x2="80.367" y2="114.214"/>
    <line x1="280" y1="170" x2="130.051" y2="58.058"/>
    <line x1="280" y1="170" x2="314.315" y2="104"/>
    <line x1="280" y1="170" x2="314.315" y2="236"/>
    <line x1="280" y1="170" x2="286.600" y2="269.622"/>
  </g>
  <g fill="#3b2f2f">
    <circle cx="68" cy="170" r="2.6"/>
    <circle cx="80.367" cy="114.214" r="2.6"/>
    <circle cx="130.051" cy="58.058" r="2.6"/>
    <circle cx="332" cy="170" r="2.6"/>
    <circle cx="200" cy="170" r="2.6"/>
    <circle cx="280" cy="170" r="2.6"/>
    <circle cx="314.315" cy="104" r="2.6"/>
    <circle cx="314.315" cy="236" r="2.6"/>
    <circle cx="286.600" cy="269.622" r="2.6"/>
    <text x="48" y="176">A</text>
    <text x="60" y="108">B</text>
    <text x="119" y="44">C</text>
    <text x="343" y="176">D</text>
    <text x="184" y="192">E</text>
    <text x="272" y="157">F</text>
    <text x="325" y="101">G</text>
    <text x="327" y="245">H</text>
    <text x="291" y="289">K</text>
  </g>
</svg>
