<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" font-family="Georgia, 'Times New Roman', serif">
  <title>III.9 at a glance</title>
  <desc>Let three equal straight lines (blue) fall from a point to the circle. Join their ends (red, yellow) and halve each at right angles (black): both black lines pass through the point and the centre, so the point is the centre.</desc>
  <rect x="0" y="0" width="400" height="300" rx="10" fill="#fbf7ee"/>
  <circle cx="200.0" cy="150.0" r="112.0" fill="none" stroke="#222222" stroke-width="3" stroke-opacity="0.6"/>
  <line x1="186.4" y1="38.8" x2="213.6" y2="261.2" stroke="#222222" stroke-width="3" stroke-linecap="round"/>
  <line x1="310.3" y1="169.4" x2="89.7" y2="130.6" stroke="#222222" stroke-width="3" stroke-linecap="round"/>
  <polyline points="204.1,84.8 205.5,96.7 193.6,98.1" fill="none" stroke="#222222" stroke-width="1.6"/>
  <polyline points="265.8,173.8 254.0,171.7 256.1,159.9" fill="none" stroke="#222222" stroke-width="1.6"/>
  <line x1="101.1" y1="97.4" x2="192.2" y2="86.2" stroke="#d0312d" stroke-width="6" stroke-linecap="round"/>
  <line x1="192.2" y1="86.2" x2="283.2" y2="75.1" stroke="#d0312d" stroke-width="6" stroke-linecap="round"/>
  <line x1="283.2" y1="75.1" x2="267.9" y2="162.0" stroke="#f2b705" stroke-width="6" stroke-linecap="round"/>
  <line x1="267.9" y1="162.0" x2="252.6" y2="248.9" stroke="#f2b705" stroke-width="6" stroke-linecap="round"/>
  <line x1="200.0" y1="150.0" x2="101.1" y2="97.4" stroke="#1f5aa6" stroke-width="7" stroke-linecap="round"/>
  <line x1="200.0" y1="150.0" x2="283.2" y2="75.1" stroke="#1f5aa6" stroke-width="7" stroke-linecap="round"/>
  <line x1="200.0" y1="150.0" x2="252.6" y2="248.9" stroke="#1f5aa6" stroke-width="7" stroke-linecap="round"/>
  <circle cx="200.0" cy="150.0" r="4.5" fill="#222222"/>
  <g font-size="14" fill="#222222" text-anchor="middle">
    <text x="87.9" y="95.3">A</text>
    <text x="294.3" y="70">B</text>
    <text x="259.6" y="267">C</text>
    <text x="189.5" y="165.4">D</text>
    <text x="181.7" y="104.5">E</text>
    <text x="281.8" y="157.1">F</text>
    <text x="215.3" y="280">G</text>
    <text x="75.9" y="133.1">H</text>
    <text x="184.7" y="29.8">K</text>
    <text x="324.1" y="176.7">L</text>
  </g>
</svg>
