<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" font-family="Georgia, 'Times New Roman', serif">
  <title>III.9 at a glance</title>
  <desc>If three equal straight lines (blue) fall from a point to a circle, it is the centre: the black straight lines, halving at right angles those joining their ends (red, yellow), pass through it and the centre, and cross once.</desc>
