<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" font-family="Georgia, 'Times New Roman', serif">
  <title>III.10 at a glance</title>
  <desc>Suppose two circles (red, blue) met at B, G, F, H: the red is a dashed oval, since no second circle can. Each black straight line, halving a yellow one at right angles, would pass through both centres: both at P, which III.5 forbids.</desc>
