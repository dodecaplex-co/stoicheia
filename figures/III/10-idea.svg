  <line x1="184.36" y1="51.23" x2="215.64" y2="248.77" stroke="#222222" stroke-width="3" stroke-linecap="round"/>
  <line x1="101.23" y1="165.64" x2="298.77" y2="134.36" stroke="#222222" stroke-width="3" stroke-linecap="round"/>
  <polyline points="203.08,99.11 204.80,109.98 193.93,111.70" fill="none" stroke="#222222" stroke-width="1.6"/>
  <polyline points="283.94,125.57 273.08,127.29 274.80,138.15" fill="none" stroke="#222222" stroke-width="1.6"/>
  <line x1="106.55" y1="114.40" x2="277.87" y2="87.26" stroke="#f2b705" stroke-width="6" stroke-linecap="round"/>
  <line x1="277.87" y1="87.26" x2="293.45" y2="185.60" stroke="#f2b705" stroke-width="6" stroke-linecap="round"/>
  <circle cx="277.87" cy="87.26" r="4.5" fill="#222222"/>
  <circle cx="293.45" cy="185.60" r="4.5" fill="#222222"/>
  <circle cx="122.13" cy="212.74" r="4.5" fill="#222222"/>
  <circle cx="106.55" cy="114.40" r="4.5" fill="#222222"/>
  <circle cx="200.00" cy="150.00" r="4.5" fill="#222222"/>
