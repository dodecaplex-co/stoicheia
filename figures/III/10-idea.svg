  <line x1="184.36" y1="51.23" x2="215.64" y2="248.77" stroke="#222222" stroke-width="3" stroke-linecap="round"/>
  <line x1="101.23" y1="165.64" x2="298.77" y2="134.36" stroke="#222222" stroke-width="3" stroke-linecap="round"/>
  <polyline points="199.80,78.44 201.52,89.30 190.66,91.02" fill="none" stroke="#222222" stroke-width="1.6"/>
  <polyline points="268.12,128.07 257.25,129.79 258.98,140.66" fill="none" stroke="#222222" stroke-width="1.6"/>
  <line x1="119.10" y1="91.22" x2="258.78" y2="69.10" stroke="#f2b705" stroke-width="6" stroke-linecap="round"/>
  <line x1="258.78" y1="69.10" x2="280.90" y2="208.78" stroke="#f2b705" stroke-width="6" stroke-linecap="round"/>
  <circle cx="258.78" cy="69.10" r="4.5" fill="#222222"/>
  <circle cx="280.90" cy="208.78" r="4.5" fill="#222222"/>
  <circle cx="141.22" cy="230.90" r="4.5" fill="#222222"/>
  <circle cx="119.10" cy="91.22" r="4.5" fill="#222222"/>
  <circle cx="200.00" cy="150.00" r="4.5" fill="#222222"/>
  <g font-size="14" fill="#222222" text-anchor="middle">
    <text x="178.4" y="43.2">A</text>
    <text x="269.0" y="60.4">B</text>
    <text x="221.6" y="266.8">C</text>
    <text x="145.0" y="253.0">F</text>
    <text x="291.0" y="226.0">G</text>
