<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" font-family="Georgia, 'Times New Roman', serif">
  <title>III.10 at a glance</title>
  <desc>Two circles (red, blue) cut one another at two points at most. Each black straight line, halving a yellow one at right angles, passes through the blue circle's centre, and two of them cross only there.</desc>
  <rect x="0" y="0" width="400" height="300" rx="10" fill="#fbf7ee"/>
  <circle cx="242.00" cy="156.00" r="90.00" fill="none" stroke="#1f5aa6" stroke-width="3" stroke-opacity="0.75"/>
  <circle cx="139.73" cy="124.73" r="69.22" fill="none" stroke="#d0312d" stroke-width="3" stroke-opacity="0.75"/>
  <line x1="126.34" y1="120.64" x2="339.54" y2="185.82" stroke="#222222" stroke-width="3" stroke-linecap="round"/>
  <line x1="254.43" y1="54.76" x2="229.57" y2="257.24" stroke="#222222" stroke-width="3" stroke-linecap="round"/>
  <polyline points="187.54,139.35 191.05,127.88 179.58,124.37" fill="none" stroke="#222222" stroke-width="1.6"/>
  <polyline points="248.94,99.48 237.03,98.02 238.49,86.11" fill="none" stroke="#222222" stroke-width="1.6"/>
  <line x1="159.15" y1="191.17" x2="192.98" y2="80.52" stroke="#f2b705" stroke-width="6" stroke-linecap="round"/>
  <line x1="192.98" y1="80.52" x2="307.82" y2="94.62" stroke="#f2b705" stroke-width="6" stroke-linecap="round"/>
  <circle cx="159.15" cy="191.17" r="4.5" fill="#222222"/>
  <circle cx="192.98" cy="80.52" r="4.5" fill="#222222"/>
  <circle cx="307.82" cy="94.62" r="4.5" fill="#222222"/>
  <circle cx="242.00" cy="156.00" r="4.5" fill="#222222"/>
  <circle cx="139.73" cy="124.73" r="4.5" fill="#222222"/>
</svg>
