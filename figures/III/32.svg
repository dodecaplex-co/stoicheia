<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" font-family="Georgia, 'Times New Roman', serif" font-style="italic" font-size="17">
  <title>Euclid III.32: the angle in the alternate segment</title>
  <rect x="0" y="0" width="400" height="300" rx="10" fill="#fbf7ee"/>
  <circle cx="200" cy="145" r="105" fill="none" stroke="#8c7b62" stroke-width="1.3"/>
  <g fill="none" stroke="#3b2f2f" stroke-width="1.6">
    <line x1="200" y1="250" x2="200" y2="40"/>
    <line x1="200" y1="250" x2="290.933" y2="92.5"/>
    <line x1="200" y1="40" x2="252.5" y2="54.067"/>
    <line x1="252.5" y1="54.067" x2="290.933" y2="92.5"/>
  </g>
  <g fill="none" stroke="#a0522d" stroke-width="2.4">
    <line x1="45" y1="250" x2="355" y2="250"/>
    <line x1="200" y1="250" x2="252.5" y2="54.067"/>
  </g>
  <g fill="#3b2f2f">
    <circle cx="200" cy="40" r="2.6"/>
    <circle cx="200" cy="250" r="2.6"/>
    <circle cx="290.933" cy="92.5" r="2.6"/>
    <circle cx="252.5" cy="54.067" r="2.6"/>
    <circle cx="45" cy="250" r="2.6"/>
    <circle cx="355" cy="250" r="2.6"/>
    <text x="194" y="25">A</text>
    <text x="194" y="273">B</text>
    <text x="302" y="96">C</text>
    <text x="260" y="45">D</text>
    <text x="39" y="273">E</text>
    <text x="349" y="273">F</text>
