<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" font-family="Georgia, 'Times New Roman', serif" font-style="italic" font-size="17">
  <title>Euclid III.3: bisection and right angles through the centre</title>
  <rect x="0" y="0" width="400" height="300" rx="10" fill="#fbf7ee"/>
  <g fill="#e9dcc0" fill-opacity="0.55">
    <polygon points="200,145 109.0673,197.5 200,197.5"/>
    <polygon points="200,145 290.9327,197.5 200,197.5"/>
  </g>
  <circle cx="200" cy="145" r="105" fill="none" stroke="#8c7b62" stroke-width="1.3"/>
  <g fill="none" stroke="#3b2f2f" stroke-width="1.6">
    <line x1="200" y1="145" x2="109.0673" y2="197.5"/>
    <line x1="200" y1="145" x2="290.9327" y2="197.5"/>
  </g>
  <g fill="none" stroke="#a0522d" stroke-width="2.5">
    <line x1="109.0673" y1="197.5" x2="290.9327" y2="197.5"/>
    <line x1="200" y1="40" x2="200" y2="250"/>
  </g>
  <polyline points="188,197.5 188,185.5 200,185.5" fill="none" stroke="#8c7b62" stroke-width="1.3"/>
  <g fill="#3b2f2f">
    <circle cx="109.0673" cy="197.5" r="2.6"/>
    <circle cx="290.9327" cy="197.5" r="2.6"/>
    <circle cx="200" cy="40" r="2.6"/>
    <circle cx="200" cy="250" r="2.6"/>
    <circle cx="200" cy="145" r="2.6"/>
    <circle cx="200" cy="197.5" r="2.6"/>
    <text x="89" y="215">A</text>
    <text x="301" y="215">B</text>
    <text x="194" y="27">C</text>
    <text x="194" y="273">D</text>
    <text x="211" y="140">E</text>
    <text x="210" y="217">F</text>
  </g>
</svg>
