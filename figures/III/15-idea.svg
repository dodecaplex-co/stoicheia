  <circle cx="200.00" cy="150.00" r="124.00" fill="none" stroke="#222222" stroke-width="3" stroke-opacity="0.6"/>
  <polyline points="191.73,121.16 201.34,118.41 198.59,108.79" fill="none" stroke="#222222" stroke-width="1.6"/>
  <polyline points="189.42,225.26 179.52,223.87 178.13,233.77" fill="none" stroke="#222222" stroke-width="1.6"/>
  <line x1="200.00" y1="150.00" x2="188.97" y2="111.55" stroke="#222222" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="200.00" y1="150.00" x2="188.03" y2="235.16" stroke="#222222" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="323.32" y1="137.04" x2="76.68" y2="162.96" stroke="#d0312d" stroke-width="6" stroke-linecap="round"/>
  <line x1="301.80" y1="79.20" x2="76.15" y2="143.90" stroke="#1f5aa6" stroke-width="6" stroke-linecap="round"/>
  <line x1="99.57" y1="222.73" x2="276.49" y2="247.60" stroke="#f2b705" stroke-width="6" stroke-linecap="round"/>
  <circle cx="200.00" cy="150.00" r="4.5" fill="#222222"/>
