<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 260" font-family="Georgia, 'Times New Roman', serif" font-size="17">
  <title>Euclid III.29: equal circumferences subtended by equal straight lines</title>
  <rect x="0" y="0" width="400" height="260" rx="10" fill="#fbf7ee"/>
  <g fill="none" stroke="#8c7b62" stroke-width="1.3">
    <circle cx="105" cy="125" r="75"/>
    <circle cx="295" cy="125" r="75"/>
  </g>
  <g fill="#e9dcc0" fill-opacity="0.55">
    <polygon points="45,170 105,125 165,170"/>
    <polygon points="235,170 295,125 355,170"/>
  </g>
  <g fill="none" stroke="#3b2f2f" stroke-width="1.6" stroke-linejoin="round">
    <path d="M 45,170 L 105,125 L 165,170 Z"/>
    <path d="M 235,170 L 295,125 L 355,170 Z"/>
  </g>
  <g fill="none" stroke="#a0522d" stroke-width="2.5">
    <path d="M 45,170 A 75,75 0 0 0 165,170"/>
    <path d="M 235,170 A 75,75 0 0 0 355,170"/>
  </g>
  <g fill="#3b2f2f">
    <circle cx="105" cy="50" r="2.6"/>
    <circle cx="45" cy="170" r="2.6"/>
    <circle cx="165" cy="170" r="2.6"/>
    <circle cx="295" cy="50" r="2.6"/>
    <circle cx="235" cy="170" r="2.6"/>
    <circle cx="355" cy="170" r="2.6"/>
    <circle cx="105" cy="200" r="2.6"/>
    <circle cx="295" cy="200" r="2.6"/>
    <circle cx="105" cy="125" r="2.6"/>
    <circle cx="295" cy="125" r="2.6"/>
    <text x="99" y="37">A</text>
    <text x="27" y="184">B</text>
    <text x="171" y="184">C</text>
    <text x="289" y="37">D</text>
    <text x="217" y="184">E</text>
    <text x="361" y="184">F</text>
    <text x="99" y="224">G</text>
    <text x="289" y="224">H</text>
    <text x="99" y="113">K</text>
    <text x="289" y="113">L</text>
  </g>
</svg>
