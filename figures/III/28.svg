    <circle cx="229.22" cy="144.94" r="2.6"/>
    <circle cx="360.78" cy="144.94" r="2.6"/>
    <circle cx="295" cy="51" r="2.6"/>
    <circle cx="105" cy="191" r="2.6"/>
