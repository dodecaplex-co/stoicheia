    <circle cx="105" cy="121" r="70"/>
    <circle cx="295" cy="121" r="70"/>
  </g>
  <g fill="none" stroke="#a0522d" stroke-width="2.5">
    <path d="M 39.22,144.94 A 70,70 0 0 0 170.78,144.94"/>
    <path d="M 229.22,144.94 A 70,70 0 0 0 360.78,144.94"/>
  </g>
  <g fill="none" stroke="#3b2f2f" stroke-width="1.6" stroke-linejoin="round">
