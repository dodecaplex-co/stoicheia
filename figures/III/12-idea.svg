<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" font-family="Georgia, 'Times New Roman', serif">
  <title>III.12 at a glance</title>
  <desc>Join the centres of two circles touching from outside: the straight line passes through the point of contact, a radius of each (blue, red) laid end to end.</desc>
  <rect x="0" y="0" width="400" height="300" rx="10" fill="#fbf7ee"/>
  <circle cx="133.22" cy="159.88" r="96.00" fill="none" stroke="#1f5aa6" stroke-width="3" stroke-opacity="0.75"/>
  <circle cx="292.78" cy="114.12" r="70.00" fill="none" stroke="#d0312d" stroke-width="3" stroke-opacity="0.75"/>
  <line x1="133.22" y1="159.88" x2="225.50" y2="133.42" stroke="#1f5aa6" stroke-width="6" stroke-linecap="butt"/>
  <line x1="225.50" y1="133.42" x2="292.78" y2="114.12" stroke="#d0312d" stroke-width="6" stroke-linecap="butt"/>
  <circle cx="133.22" cy="159.88" r="4.5" fill="#222222"/>
  <circle cx="292.78" cy="114.12" r="4.5" fill="#222222"/>
  <circle cx="225.50" cy="133.42" r="4.5" fill="#222222"/>
  <g font-style="italic" font-size="14" fill="#222222" text-anchor="middle">
    <text x="234" y="122.9">A</text>
    <text x="53.2" y="90.7">B</text>
    <text x="349.2" y="58.1">E</text>
    <text x="119" y="164.9">F</text>
    <text x="306.5" y="120.9">G</text>
  </g>
</svg>
