<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" font-family="Georgia, 'Times New Roman', serif">
  <title>I.9 at a glance</title>
  <desc>Mark equal lengths on the two arms (blue) and build an equilateral triangle on the gap (yellow): the straight line from the corner to its tip splits the angle into equal halves (red).</desc>
  <rect x="0" y="0" width="400" height="300" rx="10" fill="#fbf7ee"/>
  <path d="M106.9,167.6 L128.4,143.8 A32,32 0 0,1 138.6,163.1 Z" fill="#d0312d"/>
  <path d="M106.9,167.6 L138.6,163.1 A32,32 0 0,1 134.1,184.5 Z" fill="#d0312d"/>
  <polygon points="173.9,93.3 191.8,220.6 293.1,141.4" fill="#f2b705"/>
  <line x1="173.9" y1="93.3" x2="217.4" y2="45.0" stroke="#222222" stroke-width="3" stroke-linecap="round"/>
  <line x1="191.8" y1="220.6" x2="246.9" y2="255.0" stroke="#222222" stroke-width="3" stroke-linecap="round"/>
  <line x1="106.9" y1="167.6" x2="173.9" y2="93.3" stroke="#1f5aa6" stroke-width="6" stroke-linecap="round"/>
  <line x1="106.9" y1="167.6" x2="191.8" y2="220.6" stroke="#1f5aa6" stroke-width="6" stroke-linecap="round"/>
  <line x1="106.9" y1="167.6" x2="293.1" y2="141.4" stroke="#222222" stroke-width="5" stroke-linecap="round"/>
  <!-- Heath's letters -->
  <g font-size="14" fill="#222222" text-anchor="middle">
    <text x="90.9" y="173.2">A</text><text x="162.6" y="87.6">E</text><text x="182.6" y="239.3">D</text><text x="309.1" y="145.9">F</text>
    <text x="257.6" y="269.6">B</text><text x="228.9" y="42.6">C</text>
  </g>
</svg>
