<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" font-family="Georgia, 'Times New Roman', serif" font-size="17">
  <title>Euclid I.34: the diameter bisects the parallelogram</title>
  <rect x="0" y="0" width="400" height="240" rx="10" fill="#fbf7ee"/>
  <polygon points="118,70 90,178 312,178 340,70" fill="#e9dcc0" fill-opacity="0.55" stroke="#3b2f2f" stroke-width="1.6" stroke-linejoin="round"/>
  <line x1="340" y1="70" x2="90" y2="178" stroke="#a0522d" stroke-width="2.4"/>
  <g fill="#3b2f2f">
    <circle cx="118" cy="70" r="2.6"/>
    <circle cx="340" cy="70" r="2.6"/>
    <circle cx="90" cy="178" r="2.6"/>
    <circle cx="312" cy="178" r="2.6"/>
    <text x="107" y="56">A</text>
    <text x="339" y="56">B</text>
    <text x="76" y="201">C</text>
    <text x="310" y="201">D</text>
  </g>
</svg>
