<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" font-family="Georgia, 'Times New Roman', serif">
  <title>I.7 at a glance</title>
  <desc>Keep the base and the lengths of the two sides (red and blue), and the top can only go where the two circles cross. On each side of the base there is just one such place.</desc>
  <rect x="0" y="0" width="400" height="300" rx="10" fill="#fbf7ee"/>
  <circle cx="145.0" cy="152.0" r="92.0" fill="none" stroke="#d0312d" stroke-width="3" stroke-opacity="0.75"/>
  <circle cx="265.0" cy="152.0" r="78.0" fill="none" stroke="#1f5aa6" stroke-width="3" stroke-opacity="0.75"/>
  <line x1="145.0" y1="152.0" x2="265.0" y2="152.0" stroke="#222222" stroke-width="4"/>
  <line x1="145.0" y1="152.0" x2="214.9" y2="92.2" stroke="#d0312d" stroke-width="7" stroke-linecap="round"/>
  <line x1="265.0" y1="152.0" x2="214.9" y2="92.2" stroke="#1f5aa6" stroke-width="7" stroke-linecap="round"/>
  <circle cx="214.9" cy="92.2" r="4.5" fill="#222222"/>
  <!-- Heath's letters -->
  <g font-style="italic" font-size="14" fill="#222222" text-anchor="middle">
    <text x="131.1" y="165.6">A</text><text x="278.9" y="165.6">B</text><text x="214.9" y="79.8">C</text>
  </g>
</svg>
