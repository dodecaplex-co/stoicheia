<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" font-family="Georgia, 'Times New Roman', serif">
  <title>I.2 at a glance</title>
  <desc>The small circle turns the given straight line (blue, upper right) to run on from one red side; the big circle carries it round to the given point, on the other (blue, left). The red sides are equal, so the blue pieces beyond them are equal.</desc>
  <rect x="0" y="0" width="400" height="300" rx="10" fill="#fbf7ee"/>
  <circle cx="200.0" cy="146.0" r="110.0" fill="none" stroke="#222222" stroke-width="3" stroke-opacity="0.6"/>
  <circle cx="231.0" cy="199.7" r="48.0" fill="none" stroke="#1f5aa6" stroke-width="3" stroke-opacity="0.75"/>
  <polygon points="200.0,146.0 169.0,199.7 231.0,199.7" fill="#f2b705"/>
  <line x1="145.0" y1="241.3" x2="137.0" y2="255.1" stroke="#222222" stroke-width="3" stroke-linecap="round"/>
  <line x1="255.0" y1="241.3" x2="263.0" y2="255.1" stroke="#222222" stroke-width="3" stroke-linecap="round"/>
  <line x1="169.0" y1="199.7" x2="231.0" y2="199.7" stroke="#222222" stroke-width="3" stroke-linecap="round"/>
  <line x1="200.0" y1="146.0" x2="169.0" y2="199.7" stroke="#d0312d" stroke-width="6" stroke-linecap="round"/>
  <line x1="200.0" y1="146.0" x2="231.0" y2="199.7" stroke="#d0312d" stroke-width="6" stroke-linecap="round"/>
  <line x1="231.0" y1="199.7" x2="255.0" y2="241.3" stroke="#1f5aa6" stroke-width="7" stroke-linecap="round"/>
  <line x1="231.0" y1="199.7" x2="273.4" y2="177.2" stroke="#1f5aa6" stroke-width="7" stroke-linecap="round"/>
  <line x1="169.0" y1="199.7" x2="145.0" y2="241.3" stroke="#1f5aa6" stroke-width="7" stroke-linecap="round"/>
  <circle cx="169.0" cy="199.7" r="4.5" fill="#222222"/>
  <circle cx="231.0" cy="199.7" r="4.5" fill="#222222"/>
</svg>
