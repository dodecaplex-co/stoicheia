<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" font-family="Georgia, 'Times New Roman', serif">
  <title>I.3 at a glance</title>
  <desc>A circle about A, its radius AD placed equal to the less straight line C (blue), cuts off AE just as long (blue) from the greater, AB; the rest (red) is left over.</desc>
  <rect x="0" y="0" width="400" height="300" rx="10" fill="#fbf7ee"/>
  <circle cx="114.0" cy="158.0" r="74.0" fill="none" stroke="#1f5aa6" stroke-width="3" stroke-opacity="0.75"/>
  <line x1="188.0" y1="158.0" x2="354.0" y2="158.0" stroke="#d0312d" stroke-width="6" stroke-linecap="round"/>
  <line x1="114.0" y1="158.0" x2="68.4" y2="99.7" stroke="#1f5aa6" stroke-width="7" stroke-linecap="round"/>
  <line x1="114.0" y1="158.0" x2="188.0" y2="158.0" stroke="#1f5aa6" stroke-width="7" stroke-linecap="round"/>
  <line x1="244.0" y1="72.0" x2="318.0" y2="72.0" data-unlettered="the given straight line C, which Heath names by one letter, not by its ends" stroke="#1f5aa6" stroke-width="7" stroke-linecap="round"/>
  <circle cx="114.0" cy="158.0" r="4.5" fill="#222222"/>
  <!-- Heath's letters -->
  <g font-style="italic" font-size="14" fill="#222222" text-anchor="middle">
    <text x="114" y="180.6">A</text><text x="197.2" y="176.7">E</text><text x="354" y="180.6">B</text><text x="55.3" y="96.1">D</text>
    <text x="69.5" y="240.7">F</text><text x="281" y="61.6">C</text>
  </g>
</svg>
