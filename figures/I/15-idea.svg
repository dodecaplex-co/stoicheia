<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" font-family="Georgia, 'Times New Roman', serif">
  <title>I.15 at a glance</title>
  <desc>When two straight lines cross, the angles opposite each other are equal: red matches red, and blue matches blue.</desc>
  <rect x="0" y="0" width="400" height="300" rx="10" fill="#fbf7ee"/>
  <path d="M200.0,150.0 L230.4,140.1 A32,32 0 0,0 180.3,124.8 Z" fill="#d0312d"/>
  <path d="M200.0,150.0 L169.6,159.9 A32,32 0 0,0 219.7,175.2 Z" fill="#d0312d"/>
  <path d="M200.0,150.0 L180.3,124.8 A32,32 0 0,0 169.6,159.9 Z" fill="#1f5aa6"/>
  <path d="M200.0,150.0 L219.7,175.2 A32,32 0 0,0 230.4,140.1 Z" fill="#1f5aa6"/>
  <line x1="356.9" y1="99.0" x2="43.1" y2="201.0" stroke="#222222" stroke-width="4" stroke-linecap="round"/>
  <line x1="123.0" y1="51.5" x2="277.0" y2="248.5" stroke="#222222" stroke-width="4" stroke-linecap="round"/>
  <!-- Heath's letters -->
  <g font-size="14" fill="#222222" text-anchor="middle">
    <text x="212.6" y="114.5">E</text><text x="113.8" y="45.3">A</text><text x="286.2" y="265.9">B</text><text x="371.2" y="100">C</text>
    <text x="28.8" y="211.2">D</text>
  </g>
</svg>
