<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" font-family="Georgia, 'Times New Roman', serif">
  <title>I.43 at a glance</title>
  <desc>Through any point K on the diameter AC (black), cut the parallelogram ABCD parallel to its sides. AEKH (blue) and KGCF (red) are the parallelograms about the diameter; the two pieces it misses, EBGK and HKFD (yellow), which Euclid calls the complements, always have equal area.</desc>
  <rect x="0" y="0" width="400" height="300" rx="10" fill="#fbf7ee"/>
  <polygon points="45.0,252.5 109.5,252.5 138.0,191.0 73.5,191.0" fill="#1f5aa6" fill-opacity="0.9"/>
  <polygon points="138.0,191.0 288.5,191.0 355.0,47.5 204.5,47.5" fill="#d0312d" fill-opacity="0.9"/>
  <polygon points="109.5,252.5 260.0,252.5 288.5,191.0 138.0,191.0" fill="#f2b705" fill-opacity="0.95"/>
  <polygon points="73.5,191.0 138.0,191.0 204.5,47.5 140.0,47.5" fill="#f2b705" fill-opacity="0.95"/>
  <line x1="109.5" y1="252.5" x2="204.5" y2="47.5" stroke="#fbf7ee" stroke-width="2"/>
  <line x1="73.5" y1="191.0" x2="288.5" y2="191.0" stroke="#fbf7ee" stroke-width="2"/>
  <line x1="45.0" y1="252.5" x2="355.0" y2="47.5" stroke="#222222" stroke-width="4" stroke-linecap="round"/>
  <circle cx="138.0" cy="191.0" r="4.5" fill="#222222"/>
  <g font-size="14" fill="#222222" text-anchor="middle">
    <text x="31.5" y="266.4">A</text>
    <text x="268.6" y="271.2">B</text>
    <text x="368.5" y="44.1">C</text>
    <text x="131.4" y="39.3">D</text>
    <text x="109.5" y="273.8">E</text>
    <text x="204.5" y="36.8">F</text>
    <text x="303" y="203">G</text>
    <text x="59" y="189.5">H</text>
    <text x="126" y="184.2">K</text>
  </g>
</svg>
