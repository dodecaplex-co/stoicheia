<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" font-family="Georgia, 'Times New Roman', serif" font-size="17">
  <title>Euclid I.14: when two angles make a straight line</title>
  <rect x="0" y="0" width="400" height="240" rx="10" fill="#fbf7ee"/>
  <!-- the angle ABE, the less, shaded -->
  <path d="M 205,185 L 188.73,148.46 A 40 40 0 0 1 233.77,157.21 Z" fill="#e9dcc0" fill-opacity="0.8"/>
  <!-- the angle ABD, the greater -->
  <path d="M 183.04,135.67 A 54 54 0 0 1 259,185" fill="none" stroke="#8c7b62" stroke-width="1.3"/>
  <!-- CB and BD, in a straight line -->
  <line x1="55" y1="185" x2="345" y2="185" stroke="#3b2f2f" stroke-width="2"/>
  <!-- AB, standing on it -->
  <line x1="205" y1="185" x2="154.16" y2="70.81" stroke="#3b2f2f" stroke-width="2"/>
  <!-- BE, supposed to be in a straight line with CB -->
  <line x1="205" y1="185" x2="323.69" y2="70.38" stroke="#a0522d" stroke-width="2.6"/>
  <g fill="#3b2f2f">
    <circle cx="55" cy="185" r="2.6"/><circle cx="205" cy="185" r="2.6"/><circle cx="345" cy="185" r="2.6"/>
    <circle cx="154.16" cy="70.81" r="2.6"/><circle cx="323.69" cy="70.38" r="2.6"/>
    <text x="134" y="74">A</text><text x="330" y="66">E</text>
    <text x="48" y="208">C</text><text x="199" y="208">B</text><text x="340" y="208">D</text>
  </g>
</svg>
