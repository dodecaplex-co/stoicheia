<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" font-family="Georgia, 'Times New Roman', serif">
  <title>I.30 at a glance</title>
  <desc>Two straight lines (blue), each parallel to a third (red), are parallel to each other: a straight line falling on all three meets each at the same angle (yellow).</desc>
  <rect x="0" y="0" width="400" height="300" rx="10" fill="#fbf7ee"/>
  <path d="M234.6,85.0 L248.6,58.5 A30,30 0 0,1 264.6,85.0 Z" fill="#f2b705"/>
  <path d="M200.0,150.0 L214.1,123.5 A30,30 0 0,1 230.0,150.0 Z" fill="#f2b705"/>
  <path d="M165.4,215.0 L179.5,188.5 A30,30 0 0,1 195.4,215.0 Z" fill="#f2b705"/>
  <line x1="255.7" y1="45.3" x2="144.3" y2="254.7" data-unlettered="the straight line GK runs on past G and K, to ends Heath leaves without letters" stroke="#222222" stroke-width="3" stroke-linecap="round"/>
  <line x1="45.0" y1="85.0" x2="355.0" y2="85.0" stroke="#1f5aa6" stroke-width="7" stroke-linecap="round"/>
  <line x1="45.0" y1="150.0" x2="355.0" y2="150.0" stroke="#d0312d" stroke-width="7" stroke-linecap="round"/>
  <line x1="45.0" y1="215.0" x2="355.0" y2="215.0" stroke="#1f5aa6" stroke-width="7" stroke-linecap="round"/>
  <!-- Heath's letters -->
  <g font-style="italic" font-size="14" fill="#222222" text-anchor="middle">
    <text x="29" y="90.6">A</text><text x="371" y="90.6">B</text><text x="29" y="155.6">E</text><text x="371" y="155.6">F</text><text x="29" y="220.6">C</text><text x="371" y="220.6">D</text><text x="220" y="74.1">G</text><text x="185.4" y="139.1">H</text><text x="150.8" y="204.1">K</text>
  </g>
</svg>
