<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 260" font-family="Georgia, 'Times New Roman', serif" font-style="italic" font-size="17">
  <title>Euclid I.3: cutting off from AB a straight line equal to C</title>
  <rect x="0" y="0" width="400" height="260" rx="10" fill="#fbf7ee"/>
  <!-- circle DEF: centre A, radius AD -->
  <circle cx="90" cy="160" r="90" fill="none" stroke="#8c7b62" stroke-width="1.3"/>
  <!-- AB, the greater -->
  <line x1="90" y1="160" x2="350" y2="160" stroke="#3b2f2f" stroke-width="1.6"/>
  <!-- AE, cut off -->
  <line x1="90" y1="160" x2="180" y2="160" stroke="#a0522d" stroke-width="3.2"/>
  <!-- AD, placed at A -->
  <line x1="90" y1="160" x2="32.1" y2="91.1" stroke="#3b2f2f" stroke-width="1.6"/>
  <!-- C, the less -->
  <line x1="250" y1="62" x2="340" y2="62" stroke="#3b2f2f" stroke-width="2.4"/>
  <g fill="#3b2f2f">
    <circle cx="90" cy="160" r="2.6"/><circle cx="350" cy="160" r="2.6"/><circle cx="180" cy="160" r="2.6"/>
    <circle cx="32.1" cy="91.1" r="2.6"/>
    <text x="80" y="182">A</text><text x="352" y="182">B</text><text x="184" y="182">E</text>
    <text x="16" y="90">D</text><text x="54" y="258">F</text><text x="288" y="52">C</text>
  </g>
</svg>
