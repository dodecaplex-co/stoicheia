<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 260" font-family="Georgia, 'Times New Roman', serif" font-style="italic" font-size="17">
  <title>Euclid I.7: two straight lines AD, DB that cannot be equal to AC, CB</title>
  <rect x="0" y="0" width="400" height="260" rx="10" fill="#fbf7ee"/>
  <!-- the given straight lines AC, CB on AB -->
  <polygon points="80,220 320,220 150,55" fill="#e9dcc0" fill-opacity="0.55" stroke="#3b2f2f" stroke-width="2" stroke-linejoin="round"/>
  <!-- the other two, AD and DB, on the same side of AB -->
  <line x1="80" y1="220" x2="250" y2="75" stroke="#3b2f2f" stroke-width="1.6"/>
  <line x1="250" y1="75" x2="320" y2="220" stroke="#3b2f2f" stroke-width="1.6"/>
  <!-- and let CD be joined -->
  <line x1="150" y1="55" x2="250" y2="75" stroke="#a0522d" stroke-width="2.6"/>
  <g fill="#3b2f2f">
    <circle cx="80" cy="220" r="2.6"/><circle cx="320" cy="220" r="2.6"/>
    <circle cx="150" cy="55" r="2.6"/><circle cx="250" cy="75" r="2.6"/>
    <text x="62" y="240">A</text><text x="326" y="240">B</text>
    <text x="136" y="46">C</text><text x="256" y="68">D</text>
  </g>
</svg>
