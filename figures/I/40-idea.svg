<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" font-family="Georgia, 'Times New Roman', serif">
  <title>I.40 at a glance</title>
  <desc>If the triangles ABC, CDE on equal bases BC, CE (red) in one straight line, and on the same side of it, are equal in area (yellow), the straight line AD through their tips is parallel to BE (blue).</desc>
  <rect x="0" y="0" width="400" height="300" rx="10" fill="#fbf7ee"/>
  <polygon points="105.0,85.0 60.0,215.0 160.0,215.0" fill="#f2b705" fill-opacity="0.9"/>
  <polygon points="285.0,85.0 160.0,215.0 260.0,215.0" fill="#f2b705" fill-opacity="0.9"/>
  <g data-unlettered="the parallels drawn on past the figure, to ends that are no points of Heath's">
    <line x1="45.0" y1="85.0" x2="355.0" y2="85.0" stroke="#1f5aa6" stroke-width="7" stroke-linecap="round"/>
    <line x1="45.0" y1="215.0" x2="355.0" y2="215.0" stroke="#1f5aa6" stroke-width="7" stroke-linecap="round"/>
  </g>
  <line x1="60.0" y1="215.0" x2="160.0" y2="215.0" stroke="#d0312d" stroke-width="7" stroke-linecap="butt"/>
  <line x1="160.0" y1="215.0" x2="260.0" y2="215.0" stroke="#d0312d" stroke-width="7" stroke-linecap="butt"/>
  <circle cx="105.0" cy="85.0" r="4.5" fill="#222222"/>
  <circle cx="285.0" cy="85.0" r="4.5" fill="#222222"/>
  <circle cx="160.0" cy="215.0" r="4.5" fill="#222222"/>
  <g font-size="14" fill="#222222" text-anchor="middle">
    <text x="105" y="74.2">A</text>
    <text x="285" y="74.2">D</text>
    <text x="60" y="236.2">B</text>
    <text x="160" y="236.2">C</text>
    <text x="260" y="236.2">E</text>
  </g>
</svg>
