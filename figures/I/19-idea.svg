  <path d="M184.4,94.5 L160.2,115.5 A32,32 0 0,0 210.6,112.9 Z" fill="#d0312d"/>
  <path d="M345.0,207.0 L318.8,188.6 A32,32 0 0,0 313.0,207.0 Z" fill="#1f5aa6"/>
  <line x1="184.4" y1="94.5" x2="345.0" y2="207.0" stroke="#222222" stroke-width="4" stroke-linecap="round"/>
  <line x1="55.0" y1="207.0" x2="345.0" y2="207.0" stroke="#d0312d" stroke-width="6" stroke-linecap="round"/>
  <line x1="184.4" y1="94.5" x2="55.0" y2="207.0" stroke="#1f5aa6" stroke-width="6" stroke-linecap="round"/>
  <!-- Heath's letters -->
