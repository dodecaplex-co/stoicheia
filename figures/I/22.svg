<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 320" font-family="Georgia, 'Times New Roman', serif" font-style="italic" font-size="17">
  <title>Euclid I.22: a triangle out of three straight lines equal to A, B, C</title>
  <rect x="0" y="0" width="440" height="320" rx="10" fill="#fbf7ee"/>
  <!-- the three given straight lines A, B, C -->
  <line x1="34" y1="30" x2="124" y2="30" stroke="#3b2f2f" stroke-width="2.4"/>
  <line x1="34" y1="54" x2="154" y2="54" stroke="#3b2f2f" stroke-width="2.4"/>
  <line x1="34" y1="78" x2="134" y2="78" stroke="#3b2f2f" stroke-width="2.4"/>
  <!-- circle DKL: centre F, distance FD -->
  <circle cx="150" cy="200" r="90" fill="none" stroke="#8c7b62" stroke-width="1.3"/>
  <!-- circle KLH: centre G, distance GH -->
  <circle cx="270" cy="200" r="100" fill="none" stroke="#8c7b62" stroke-width="1.3"/>
  <!-- the triangle KFG -->
  <polygon points="150,200 270,200 202.1,126.6" fill="#e9dcc0" fill-opacity="0.55" stroke="#3b2f2f" stroke-width="2" stroke-linejoin="round"/>
  <!-- DE, terminated at D, with DF, FG, GH equal to A, B, C -->
  <line x1="60" y1="200" x2="414" y2="200" stroke="#3b2f2f" stroke-width="1.6"/>
  <g fill="#3b2f2f">
    <circle cx="60" cy="200" r="2.6"/><circle cx="150" cy="200" r="2.6"/><circle cx="270" cy="200" r="2.6"/>
    <circle cx="370" cy="200" r="2.6"/><circle cx="202.1" cy="126.6" r="2.6"/><circle cx="202.1" cy="273.4" r="2.6"/>
    <text x="14" y="36">A</text><text x="14" y="60">B</text><text x="14" y="84">C</text>
    <text x="42" y="222">D</text><text x="144" y="222">F</text><text x="274" y="222">G</text>
    <text x="374" y="222">H</text><text x="410" y="222">E</text>
    <text x="196" y="116">K</text><text x="196" y="296">L</text>
  </g>
</svg>
