<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 260" font-family="Georgia, 'Times New Roman', serif" font-size="17">
  <title>Euclid I.10: to bisect a given finite straight line</title>
  <rect x="0" y="0" width="400" height="260" rx="10" fill="#fbf7ee"/>
  <!-- the equilateral triangle ABC on AB [I. 1] -->
  <polygon points="110,215 290,215 200,59.12" fill="#e9dcc0" fill-opacity="0.55" stroke="#3b2f2f" stroke-width="2"/>
  <!-- CD, bisecting the angle ACB [I. 9], meets AB at D -->
  <line x1="200" y1="59.12" x2="200" y2="215" stroke="#3b2f2f" stroke-width="1.6"/>
  <!-- the equal angles ACD, BCD -->
  <path d="M 183 88.56 A 34 34 0 0 0 200 93.12" fill="none" stroke="#8c7b62" stroke-width="1.4"/>
  <path d="M 200 93.12 A 34 34 0 0 0 217 88.56" fill="none" stroke="#8c7b62" stroke-width="1.4"/>
  <line x1="192.24" y1="88.10" x2="190.17" y2="95.82" stroke="#8c7b62" stroke-width="1.4"/>
  <line x1="207.76" y1="88.10" x2="209.83" y2="95.82" stroke="#8c7b62" stroke-width="1.4"/>
  <!-- the bases AD, DB, proved equal [I. 4] -->
  <line x1="110" y1="215" x2="290" y2="215" stroke="#a0522d" stroke-width="3"/>
  <line x1="155" y1="208" x2="155" y2="222" stroke="#a0522d" stroke-width="1.8"/>
  <line x1="245" y1="208" x2="245" y2="222" stroke="#a0522d" stroke-width="1.8"/>
  <g fill="#3b2f2f">
    <circle cx="110" cy="215" r="2.6"/><circle cx="290" cy="215" r="2.6"/>
    <circle cx="200" cy="59.12" r="2.6"/><circle cx="200" cy="215" r="2.6"/>
    <text x="194" y="48">C</text><text x="92" y="236">A</text><text x="296" y="236">B</text>
    <text x="194" y="239">D</text>
  </g>
</svg>
