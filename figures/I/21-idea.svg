  <path d="M182.0,54.0 L166.6,79.7 A30,30 0 0,0 200.6,77.5 Z" fill="#1f5aa6"/>
  <path d="M214.0,176.0 L186.8,188.7 A30,30 0 0,0 240.0,191.0 Z" fill="#d0312d"/>
  <line x1="68.0" y1="244.0" x2="332.0" y2="244.0" stroke="#222222" stroke-width="4" stroke-linecap="round"/>
  <line x1="182.0" y1="54.0" x2="68.0" y2="244.0" stroke="#1f5aa6" stroke-width="6" stroke-linecap="round"/>
  <line x1="182.0" y1="54.0" x2="332.0" y2="244.0" stroke="#1f5aa6" stroke-width="6" stroke-linecap="round"/>
  <line x1="214.0" y1="176.0" x2="68.0" y2="244.0" stroke="#d0312d" stroke-width="6" stroke-linecap="round"/>
  <line x1="214.0" y1="176.0" x2="332.0" y2="244.0" stroke="#d0312d" stroke-width="6" stroke-linecap="round"/>
</svg>
