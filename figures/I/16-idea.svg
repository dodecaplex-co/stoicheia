  <path d="M45.0,223.1 L77.0,223.1 A32,32 0 0,0 69.5,202.5 Z" fill="#1f5aa6"/>
  <line x1="245.0" y1="223.1" x2="355.0" y2="223.1" stroke="#222222" stroke-width="3" stroke-linecap="round"/>
  <polygon points="219.2,76.9 45.0,223.1 245.0,223.1" fill="none" stroke="#222222" stroke-width="4" stroke-linejoin="round"/>
