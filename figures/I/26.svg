<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 255" font-family="Georgia, 'Times New Roman', serif" font-size="17">
  <title>Euclid I.26: two angles and a side determine the triangle</title>
  <rect x="0" y="0" width="400" height="255" rx="10" fill="#fbf7ee"/>
  <g fill="#e9dcc0" fill-opacity="0.55" stroke="#3b2f2f" stroke-width="1.6" stroke-linejoin="round">
    <polygon points="60,45 30,215 180,215"/>
    <polygon points="250,45 220,215 370,215"/>
  </g>
  <!-- The remaining sides, proved equal. -->
  <g fill="none" stroke="#a0522d" stroke-width="2.6" stroke-linejoin="round">
    <path d="M 30 215 L 60 45 L 180 215"/>
    <path d="M 220 215 L 250 45 L 370 215"/>
  </g>
  <!-- GC in the adjoining-side case; AH in the subtending-side case. -->
  <g stroke="#3b2f2f" stroke-width="1.6">
    <line x1="51" y1="96" x2="180" y2="215"/>
    <line x1="60" y1="45" x2="138" y2="215"/>
  </g>
  <g fill="#3b2f2f">
    <circle cx="60" cy="45" r="2.6"/>
    <circle cx="30" cy="215" r="2.6"/>
    <circle cx="180" cy="215" r="2.6"/>
    <circle cx="250" cy="45" r="2.6"/>
    <circle cx="220" cy="215" r="2.6"/>
    <circle cx="370" cy="215" r="2.6"/>
    <circle cx="51" cy="96" r="2.6"/>
    <circle cx="138" cy="215" r="2.6"/>
    <text x="52" y="31">A</text>
    <text x="20" y="239">B</text>
    <text x="177" y="239">C</text>
    <text x="242" y="31">D</text>
    <text x="210" y="239">E</text>
    <text x="367" y="239">F</text>
    <text x="30" y="100">G</text>
    <text x="130" y="239">H</text>
  </g>
</svg>
