<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" font-family="Georgia, 'Times New Roman', serif">
  <title>I.36 at a glance</title>
  <desc>The parallelograms ABCD, EFGH on equal bases BC, FG (red) and between the same parallels (blue) are equal (yellow), however differently they lean.</desc>
  <rect x="0" y="0" width="400" height="300" rx="10" fill="#fbf7ee"/>
  <polygon points="55.0,85.0 70.0,215.0 160.0,215.0 145.0,85.0" fill="#f2b705" fill-opacity="0.9"/>
  <polygon points="255.0,85.0 190.0,215.0 280.0,215.0 345.0,85.0" fill="#f2b705" fill-opacity="0.9"/>
  <line x1="55.0" y1="85.0" x2="70.0" y2="215.0" stroke="#222222" stroke-width="3" stroke-linecap="round"/>
  <line x1="145.0" y1="85.0" x2="160.0" y2="215.0" stroke="#222222" stroke-width="3" stroke-linecap="round"/>
  <line x1="255.0" y1="85.0" x2="190.0" y2="215.0" stroke="#222222" stroke-width="3" stroke-linecap="round"/>
  <line x1="345.0" y1="85.0" x2="280.0" y2="215.0" stroke="#222222" stroke-width="3" stroke-linecap="round"/>
  <g data-unlettered="the parallels drawn on past the figure, to ends that are no points of Heath's">
    <line x1="45.0" y1="85.0" x2="355.0" y2="85.0" stroke="#1f5aa6" stroke-width="7" stroke-linecap="round"/>
    <line x1="45.0" y1="215.0" x2="355.0" y2="215.0" stroke="#1f5aa6" stroke-width="7" stroke-linecap="round"/>
  </g>
  <line x1="70.0" y1="215.0" x2="160.0" y2="215.0" stroke="#d0312d" stroke-width="7"/>
  <line x1="190.0" y1="215.0" x2="280.0" y2="215.0" stroke="#d0312d" stroke-width="7"/>
  <g font-style="italic" font-size="14" fill="#222222" text-anchor="middle">
    <text x="55" y="74.2">A</text>
    <text x="145" y="74.2">D</text>
    <text x="255" y="74.2">E</text>
    <text x="345" y="74.2">H</text>
    <text x="70" y="236.2">B</text>
    <text x="160" y="236.2">C</text>
    <text x="190" y="236.2">F</text>
    <text x="280" y="236.2">G</text>
  </g>
</svg>
