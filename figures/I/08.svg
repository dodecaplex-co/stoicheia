<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 260" font-family="Georgia, 'Times New Roman', serif" font-style="italic" font-size="17">
  <title>Euclid I.8: two triangles with their three sides equal</title>
  <rect x="0" y="0" width="400" height="260" rx="10" fill="#fbf7ee"/>
  <!-- triangle ABC -->
  <polygon points="80,70 40,210 170,210" fill="#e9dcc0" fill-opacity="0.55" stroke="#3b2f2f" stroke-width="2"/>
  <!-- triangle DEF, equal to it side for side -->
  <polygon points="260,70 220,210 350,210" fill="#e9dcc0" fill-opacity="0.55" stroke="#3b2f2f" stroke-width="2"/>
  <!-- EG, GF: where BA, AC would fall if they did not coincide with ED, DF -->
  <polyline points="220,210 306,92 350,210" fill="none" stroke="#8c7b62" stroke-width="1.4" stroke-dasharray="5 4"/>
  <!-- the angles BAC and EDF, proved equal -->
  <path d="M 73.96 91.15 A 22 22 0 0 0 91.90 88.51" fill="none" stroke="#a0522d" stroke-width="2.4"/>
  <path d="M 253.96 91.15 A 22 22 0 0 0 271.90 88.51" fill="none" stroke="#a0522d" stroke-width="2.4"/>
  <g fill="#3b2f2f">
    <circle cx="80" cy="70" r="2.6"/><circle cx="40" cy="210" r="2.6"/><circle cx="170" cy="210" r="2.6"/>
    <circle cx="260" cy="70" r="2.6"/><circle cx="220" cy="210" r="2.6"/><circle cx="350" cy="210" r="2.6"/>
    <circle cx="306" cy="92" r="2.4"/>
    <text x="74" y="58">A</text><text x="24" y="232">B</text><text x="172" y="232">C</text>
    <text x="254" y="58">D</text><text x="204" y="232">E</text><text x="352" y="232">F</text>
    <text x="312" y="88">G</text>
  </g>
</svg>
