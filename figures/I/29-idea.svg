  <path d="M222.6,107.5 L246.6,107.5 A24,24 0 0,1 211.3,128.7 Z" fill="#d0312d"/>
  <path d="M222.6,107.5 L198.6,107.5 A24,24 0 0,1 233.9,86.3 Z" fill="#d0312d"/>
  <path d="M177.4,192.5 L191.5,166.0 A30,30 0 0,1 207.4,192.5 Z" fill="#f2b705"/>
  <path d="M177.4,192.5 L163.3,219.0 A30,30 0 0,1 147.4,192.5 Z" fill="#f2b705"/>
  <path d="M177.4,192.5 L201.4,192.5 A24,24 0 0,1 166.1,213.7 Z" fill="#d0312d"/>
  <path d="M177.4,192.5 L153.4,192.5 A24,24 0 0,1 188.7,171.3 Z" fill="#d0312d"/>
  <line x1="251.7" y1="52.8" x2="148.3" y2="247.2" stroke="#222222" stroke-width="3" stroke-linecap="round"/>
  <line x1="45.0" y1="107.5" x2="355.0" y2="107.5" stroke="#1f5aa6" stroke-width="7" stroke-linecap="round"/>
  <line x1="45.0" y1="192.5" x2="355.0" y2="192.5" stroke="#1f5aa6" stroke-width="7" stroke-linecap="round"/>
  <!-- Heath's letters -->
  <g font-size="14" fill="#222222" text-anchor="middle">
    <text x="29" y="113.1">A</text><text x="371" y="113.1">B</text><text x="29" y="198.1">C</text><text x="371" y="198.1">D</text><text x="265" y="57.6">E</text><text x="135" y="250.6">F</text><text x="203" y="80.5">G</text><text x="197" y="229.3">H</text>
