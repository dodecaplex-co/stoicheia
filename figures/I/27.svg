<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 250" font-family="Georgia, 'Times New Roman', serif" font-size="17">
  <title>Euclid I.27: equal alternate angles make the straight lines parallel</title>
  <rect x="0" y="0" width="420" height="250" rx="10" fill="#fbf7ee"/>
  <!-- the triangle GEF, which AB, CD would make with EF if, produced, they met at G -->
  <polygon points="388.0,140.0 172.0,94.1 128.0,195.3" fill="#e9dcc0" fill-opacity="0.55"/>
  <!-- the straight lines AB, CD, and EF falling on them -->
  <line x1="40.0" y1="66.0" x2="292.0" y2="119.6" stroke="#3b2f2f" stroke-width="2"/>
  <line x1="40.0" y1="214.0" x2="292.0" y2="160.4" stroke="#3b2f2f" stroke-width="2"/>
  <line x1="184.0" y1="66.6" x2="116.0" y2="222.8" stroke="#3b2f2f" stroke-width="1.6"/>
  <!-- AB, CD produced in the direction of B, D, and supposed to meet at G -->
  <line x1="292.0" y1="119.6" x2="388.0" y2="140.0" stroke="#3b2f2f" stroke-width="1.4"/>
  <line x1="292.0" y1="160.4" x2="388.0" y2="140.0" stroke="#3b2f2f" stroke-width="1.4"/>
  <!-- the alternate angles AEF, EFD, made equal; EFD is also the angle EFG of the triangle -->
  <path d="M 150.5 89.5 A 22 22 0 0 0 163.2 114.2" fill="none" stroke="#a0522d" stroke-width="2.4"/>
  <path d="M 136.8 175.1 A 22 22 0 0 1 149.5 190.7" fill="none" stroke="#a0522d" stroke-width="2.4"/>
  <g fill="#3b2f2f">
    <circle cx="40.0" cy="66.0" r="2.6"/><circle cx="292.0" cy="119.6" r="2.6"/><circle cx="40.0" cy="214.0" r="2.6"/><circle cx="292.0" cy="160.4" r="2.6"/><circle cx="172.0" cy="94.1" r="2.6"/><circle cx="128.0" cy="195.3" r="2.6"/><circle cx="388.0" cy="140.0" r="2.6"/>
    <text x="20" y="58">A</text><text x="288" y="110">B</text><text x="20" y="236">C</text><text x="286" y="184">D</text><text x="150" y="81">E</text><text x="136" y="215">F</text><text x="396" y="146">G</text>
  </g>
</svg>
