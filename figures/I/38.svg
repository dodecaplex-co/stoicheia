<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" font-family="Georgia, 'Times New Roman', serif" font-style="italic" font-size="17">
  <title>Euclid I.38: triangles on equal bases and in the same parallels</title>
  <rect x="0" y="0" width="400" height="240" rx="10" fill="#fbf7ee"/>
  <g fill="#e9dcc0" fill-opacity="0.55">
    <polygon points="140,55 90,195 170,195"/>
    <polygon points="250,55 240,195 320,195"/>
  </g>
  <g fill="none" stroke="#3b2f2f" stroke-width="1.6">
    <line x1="60" y1="55" x2="330" y2="55"/>
    <line x1="90" y1="195" x2="320" y2="195"/>
    <line x1="90" y1="195" x2="60" y2="55"/>
    <line x1="320" y1="195" x2="330" y2="55"/>
  </g>
  <g fill="none" stroke="#a0522d" stroke-width="2.6" stroke-linejoin="round">
    <polygon points="140,55 90,195 170,195"/>
    <polygon points="250,55 240,195 320,195"/>
  </g>
  <g fill="#3b2f2f">
    <circle cx="60" cy="55" r="2.6"/>
    <circle cx="140" cy="55" r="2.6"/>
    <circle cx="250" cy="55" r="2.6"/>
    <circle cx="330" cy="55" r="2.6"/>
    <circle cx="90" cy="195" r="2.6"/>
    <circle cx="170" cy="195" r="2.6"/>
    <circle cx="240" cy="195" r="2.6"/>
    <circle cx="320" cy="195" r="2.6"/>
    <text x="39" y="60">G</text>
    <text x="134" y="41">A</text>
    <text x="244" y="41">D</text>
    <text x="341" y="60">H</text>
    <text x="84" y="219">B</text>
    <text x="164" y="219">C</text>
    <text x="234" y="219">E</text>
    <text x="314" y="219">F</text>
  </g>
</svg>
