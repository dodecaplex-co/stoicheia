<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 270" font-family="Georgia, 'Times New Roman', serif" font-style="italic" font-size="17">
  <title>Euclid I.18: the greater side AC subtends the greater angle ABC</title>
  <rect x="0" y="0" width="400" height="270" rx="10" fill="#fbf7ee"/>
  <!-- the triangle BCD, of which ADB is an exterior angle, shaded -->
  <polygon points="55.0,232.0 345.0,232.0 279.0,174.4" fill="#e9dcc0" fill-opacity="0.55"/>
  <!-- the triangle ABC -->
  <polygon points="125.0,40.0 55.0,232.0 345.0,232.0" fill="none" stroke="#3b2f2f" stroke-width="2" stroke-linejoin="round"/>
  <!-- AB, and AD made equal to it [I. 3] -->
  <line x1="125.0" y1="40.0" x2="55.0" y2="232.0" stroke="#a0522d" stroke-width="3.2"/>
  <line x1="125.0" y1="40.0" x2="279.0" y2="174.4" stroke="#a0522d" stroke-width="3.2"/>
  <!-- BD, joined -->
  <line x1="55.0" y1="232.0" x2="279.0" y2="174.4" stroke="#3b2f2f" stroke-width="1.6"/>
  <!-- the equal angles ABD, ADB -->
  <path d="M 65.3 203.8 A 30 30 0 0 1 84.1 224.5" fill="none" stroke="#a0522d" stroke-width="2.4"/>
  <path d="M 256.4 154.6 A 30 30 0 0 0 249.9 181.9" fill="none" stroke="#a0522d" stroke-width="2.4"/>
  <!-- the angle DCB, less than the exterior angle ADB [I. 16] -->
  <path d="M 314.9 205.7 A 40 40 0 0 0 305.0 232.0" fill="none" stroke="#8c7b62" stroke-width="1.3"/>
  <!-- the whole angle ABC, greater than its part ABD -->
  <path d="M 70.8 188.8 A 46 46 0 0 1 101.0 232.0" fill="none" stroke="#8c7b62" stroke-width="1.3"/>
  <g fill="#3b2f2f">
    <circle cx="125.0" cy="40.0" r="2.6"/><circle cx="55.0" cy="232.0" r="2.6"/><circle cx="345.0" cy="232.0" r="2.6"/><circle cx="279.0" cy="174.4" r="2.6"/>
    <text x="119" y="30">A</text><text x="37" y="250">B</text><text x="351" y="250">C</text><text x="287" y="170">D</text>
  </g>
</svg>
