<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" font-family="Georgia, 'Times New Roman', serif">
  <title>I.42 at a glance</title>
  <desc>A parallelogram FECG equal to the triangle ABC (yellow), in a given angle D (red): stand it on EC, half the base BC (blue), between the same parallels.</desc>
  <rect x="0" y="0" width="400" height="300" rx="10" fill="#fbf7ee"/>
  <polygon points="95.0,125.0 40.0,255.0 200.0,255.0" fill="#f2b705" fill-opacity="0.9"/>
  <polygon points="120.0,255.0 200.0,255.0 252.5,125.0 172.5,125.0" fill="#f2b705" fill-opacity="0.9"/>
  <path d="M120.0,255.0 L148.0,255.0 A28,28 0 0,0 130.5,229.0 Z" fill="#d0312d"/>
  <path d="M40.0,88.0 L68.0,88.0 A28,28 0 0,0 50.5,62.0 Z" fill="#d0312d"/>
  <polygon points="95.0,125.0 40.0,255.0 200.0,255.0" fill="none" stroke="#222222" stroke-width="3" stroke-linejoin="round"/>
  <polygon points="120.0,255.0 200.0,255.0 252.5,125.0 172.5,125.0" fill="none" stroke="#222222" stroke-width="3" stroke-linejoin="round"/>
  <g data-unlettered="the parallels drawn on past the figure, to ends that are no points of Heath's">
    <line x1="30.0" y1="125.0" x2="370.0" y2="125.0" stroke="#222222" stroke-width="3" stroke-linecap="round"/>
    <line x1="30.0" y1="255.0" x2="370.0" y2="255.0" stroke="#222222" stroke-width="3" stroke-linecap="round"/>
  </g>
  <g data-unlettered="the arms of the given angle D, whose ends Heath leaves without letters">
    <line x1="40.0" y1="88.0" x2="98.0" y2="88.0" stroke="#222222" stroke-width="3" stroke-linecap="round"/>
    <line x1="40.0" y1="88.0" x2="61.0" y2="36.1" stroke="#222222" stroke-width="3" stroke-linecap="round"/>
  </g>
  <line x1="40.0" y1="255.0" x2="120.0" y2="255.0" stroke="#1f5aa6" stroke-width="7" stroke-linecap="round"/>
  <line x1="120.0" y1="255.0" x2="200.0" y2="255.0" stroke="#1f5aa6" stroke-width="7" stroke-linecap="round"/>
  <circle cx="120.0" cy="255.0" r="4.5" fill="#222222"/>
  <g font-size="14" fill="#222222" text-anchor="middle">
    <text x="95" y="116.2">A</text>
    <text x="172.5" y="116.2">F</text>
    <text x="252.5" y="116.2">G</text>
    <text x="40" y="275.2">B</text>
    <text x="120" y="275.2">E</text>
    <text x="200" y="275.2">C</text>
    <text x="30.4" y="106">D</text>
  </g>
</svg>
