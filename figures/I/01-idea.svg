<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" font-family="Georgia, 'Times New Roman', serif">
  <title>I.1 at a glance</title>
  <desc>Each side of the triangle is a radius of the circle in its colour (blue, red), and the base, drawn in both colours, is a radius of both. So all three sides are equal.</desc>
  <rect x="0" y="0" width="400" height="300" rx="10" fill="#fbf7ee"/>
  <circle cx="150" cy="150" r="100" fill="none" stroke="#1f5aa6" stroke-width="3" stroke-opacity="0.75"/>
  <circle cx="250" cy="150" r="100" fill="none" stroke="#d0312d" stroke-width="3" stroke-opacity="0.75"/>
  <polygon points="150,150 250,150 200,63.4" fill="#f2b705"/>
  <line x1="150" y1="150" x2="200.0" y2="63.4" stroke="#1f5aa6" stroke-width="6" stroke-linecap="round"/>
  <line x1="250" y1="150" x2="200.0" y2="63.4" stroke="#d0312d" stroke-width="6" stroke-linecap="round"/>
  <line x1="150" y1="147" x2="250" y2="147" stroke="#1f5aa6" stroke-width="5"/>
  <line x1="150" y1="153" x2="250" y2="153" stroke="#d0312d" stroke-width="5"/>
  <circle cx="150" cy="150" r="4.5" fill="#222222"/><circle cx="250" cy="150" r="4.5" fill="#222222"/>
</svg>
