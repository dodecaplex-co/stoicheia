<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 260" font-family="Georgia, 'Times New Roman', serif" font-style="italic" font-size="17">
  <title>Euclid I.1: an equilateral triangle on AB</title>
  <rect x="0" y="0" width="400" height="260" rx="10" fill="#fbf7ee"/>
  <!-- circle BCD: centre A, through B -->
  <circle cx="150" cy="150" r="100" fill="none" stroke="#8c7b62" stroke-width="1.3"/>
  <!-- circle ACE: centre B, through A -->
  <circle cx="250" cy="150" r="100" fill="none" stroke="#8c7b62" stroke-width="1.3"/>
  <!-- triangle ABC -->
  <polygon points="150,150 250,150 200,63.4" fill="#e9dcc0" fill-opacity="0.55" stroke="#3b2f2f" stroke-width="2"/>
  <g fill="#3b2f2f">
    <circle cx="150" cy="150" r="2.6"/><circle cx="250" cy="150" r="2.6"/><circle cx="200" cy="63.4" r="2.6"/>
    <text x="132" y="172">A</text><text x="256" y="172">B</text><text x="194" y="54">C</text>
    <text x="33" y="156">D</text><text x="353" y="156">E</text>
  </g>
</svg>
