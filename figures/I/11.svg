<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 250" font-family="Georgia, 'Times New Roman', serif" font-style="italic" font-size="17">
  <title>Euclid I.11: a straight line at right angles to AB from C</title>
  <rect x="0" y="0" width="400" height="250" rx="10" fill="#fbf7ee"/>
  <!-- the equilateral triangle FDE, on DE -->
  <polygon points="120,200 280,200 200,61.4" fill="#e9dcc0" fill-opacity="0.55" stroke="#3b2f2f" stroke-width="2"/>
  <!-- AB, the given straight line, with D, C, E on it; CE equal to CD -->
  <line x1="40" y1="200" x2="360" y2="200" stroke="#3b2f2f" stroke-width="1.6"/>
  <!-- FC, joined -->
  <line x1="200" y1="61.4" x2="200" y2="200" stroke="#3b2f2f" stroke-width="1.6"/>
  <!-- the adjacent angles DCF and FCE, proved equal, and so right -->
  <polyline points="186,200 186,186 200,186" fill="none" stroke="#a0522d" stroke-width="2"/>
  <polyline points="214,200 214,186 200,186" fill="none" stroke="#a0522d" stroke-width="2"/>
  <g fill="#3b2f2f">
    <circle cx="40" cy="200" r="2.6"/><circle cx="120" cy="200" r="2.6"/><circle cx="200" cy="200" r="2.6"/>
    <circle cx="280" cy="200" r="2.6"/><circle cx="360" cy="200" r="2.6"/><circle cx="200" cy="61.4" r="2.6"/>
    <text x="30" y="224">A</text><text x="113" y="224">D</text><text x="194" y="224">C</text>
    <text x="274" y="224">E</text><text x="355" y="224">B</text><text x="194" y="50">F</text>
  </g>
</svg>
