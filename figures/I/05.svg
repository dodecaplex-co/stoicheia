<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 310" font-family="Georgia, 'Times New Roman', serif" font-style="italic" font-size="17">
  <title>Euclid I.5: the angles at the base of an isosceles triangle</title>
  <rect x="0" y="0" width="400" height="310" rx="10" fill="#fbf7ee"/>
  <!-- triangle ABC, AB equal to AC -->
  <polygon points="200,32 150,132 250,132" fill="#e9dcc0" fill-opacity="0.55" stroke="none"/>
  <!-- AB produced to D, AC produced to E -->
  <line x1="200" y1="32" x2="78" y2="276" stroke="#3b2f2f" stroke-width="1.6"/>
  <line x1="200" y1="32" x2="322" y2="276" stroke="#3b2f2f" stroke-width="1.6"/>
  <!-- the base BC -->
  <line x1="150" y1="132" x2="250" y2="132" stroke="#3b2f2f" stroke-width="2"/>
  <!-- FC and GB, joined -->
  <line x1="110" y1="212" x2="250" y2="132" stroke="#3b2f2f" stroke-width="1.3"/>
  <line x1="290" y1="212" x2="150" y2="132" stroke="#3b2f2f" stroke-width="1.3"/>
  <!-- the angles at the base, ABC and ACB -->
  <path d="M 166 132 A 16 16 0 0 0 157.2 117.7" fill="none" stroke="#a0522d" stroke-width="2.2"/>
  <path d="M 234 132 A 16 16 0 0 1 242.8 117.7" fill="none" stroke="#a0522d" stroke-width="2.2"/>
  <!-- the angles under the base, CBD and BCE -->
  <path d="M 162 132 A 12 12 0 0 1 144.6 142.7" fill="none" stroke="#a0522d" stroke-width="1.6"/>
  <path d="M 238 132 A 12 12 0 0 0 255.4 142.7" fill="none" stroke="#a0522d" stroke-width="1.6"/>
  <g fill="#3b2f2f">
    <circle cx="200" cy="32" r="2.6"/><circle cx="150" cy="132" r="2.6"/><circle cx="250" cy="132" r="2.6"/>
    <circle cx="110" cy="212" r="2.6"/><circle cx="290" cy="212" r="2.6"/>
    <circle cx="78" cy="276" r="2.6"/><circle cx="322" cy="276" r="2.6"/>
    <text x="194" y="22">A</text><text x="130" y="134">B</text><text x="258" y="134">C</text>
    <text x="92" y="216">F</text><text x="297" y="216">G</text>
    <text x="62" y="296">D</text><text x="326" y="296">E</text>
  </g>
</svg>
