<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 330" font-family="Georgia, 'Times New Roman', serif" font-size="17">
  <title>Euclid I.16: the exterior angle ACD is greater than the angle BAC</title>
  <rect x="0" y="0" width="420" height="330" rx="10" fill="#fbf7ee"/>
  <!-- the triangle ABC -->
  <polygon points="115.0,40.0 40.0,230.0 250.0,230.0" fill="#e9dcc0" fill-opacity="0.55" stroke="#3b2f2f" stroke-width="2" stroke-linejoin="round"/>
  <!-- BC produced to D, and AC drawn through to G -->
  <line x1="250.0" y1="230.0" x2="385.0" y2="230.0" stroke="#3b2f2f" stroke-width="2"/>
  <line x1="250.0" y1="230.0" x2="306.7" y2="309.8" stroke="#3b2f2f" stroke-width="1.6"/>
  <!-- BE joined and produced to F, EF equal to BE; and FC joined -->
  <line x1="40.0" y1="230.0" x2="325.0" y2="40.0" stroke="#3b2f2f" stroke-width="1.4"/>
  <line x1="325.0" y1="40.0" x2="250.0" y2="230.0" stroke="#3b2f2f" stroke-width="1.4"/>
  <!-- the angles BAE and ECF, proved equal -->
  <path d="M 106.9 60.5 A 22 22 0 0 0 127.7 57.9" fill="none" stroke="#a0522d" stroke-width="2.4"/>
  <path d="M 237.3 212.1 A 22 22 0 0 1 258.1 209.5" fill="none" stroke="#a0522d" stroke-width="2.4"/>
  <!-- the exterior angle ACD, of which ECF is a part -->
  <path d="M 229.1 200.7 A 36 36 0 0 1 286.0 230.0" fill="none" stroke="#a0522d" stroke-width="1.3"/>
  <g fill="#3b2f2f">
    <circle cx="115.0" cy="40.0" r="2.6"/><circle cx="40.0" cy="230.0" r="2.6"/><circle cx="250.0" cy="230.0" r="2.6"/><circle cx="385.0" cy="230.0" r="2.6"/><circle cx="182.5" cy="135.0" r="2.6"/><circle cx="325.0" cy="40.0" r="2.6"/><circle cx="306.7" cy="309.8" r="2.6"/>
    <text x="109" y="30">A</text><text x="22" y="248">B</text><text x="228" y="250">C</text><text x="389" y="250">D</text><text x="182" y="122">E</text><text x="332" y="38">F</text><text x="314" y="324">G</text>
  </g>
</svg>
