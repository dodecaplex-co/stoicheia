<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 340" font-family="Georgia, 'Times New Roman', serif" font-style="italic" font-size="17">
  <title>Euclid I.20: BA, AC together are greater than BC</title>
  <rect x="0" y="0" width="400" height="340" rx="10" fill="#fbf7ee"/>
  <!-- the triangle ABC -->
  <polygon points="125.0,212.0 40.0,305.0 340.0,305.0" fill="#e9dcc0" fill-opacity="0.55" stroke="#3b2f2f" stroke-width="2" stroke-linejoin="round"/>
  <!-- BA drawn through to D, DA made equal to CA -->
  <line x1="125.0" y1="212.0" x2="283.0" y2="39.1" stroke="#3b2f2f" stroke-width="1.6"/>
  <!-- DC joined -->
  <line x1="283.0" y1="39.1" x2="340.0" y2="305.0" stroke="#3b2f2f" stroke-width="1.6"/>
  <!-- the angles ADC and ACD, equal by I.5 -->
  <path d="M 266.8 56.8 A 24 24 0 0 0 288.1 62.6" fill="none" stroke="#a0522d" stroke-width="2.4"/>
  <path d="M 307.0 290.7 A 36 36 0 0 1 332.5 269.8" fill="none" stroke="#a0522d" stroke-width="2.4"/>
  <!-- the angle BCD, greater than ACD -->
  <path d="M 282.0 305.0 A 58 58 0 0 1 327.9 248.3" fill="none" stroke="#a0522d" stroke-width="1.3"/>
  <g fill="#3b2f2f">
    <circle cx="125.0" cy="212.0" r="2.6"/><circle cx="40.0" cy="305.0" r="2.6"/><circle cx="340.0" cy="305.0" r="2.6"/><circle cx="283.0" cy="39.1" r="2.6"/>
    <text x="105" y="214">A</text><text x="26" y="325">B</text><text x="344" y="325">C</text><text x="277" y="30">D</text>
  </g>
</svg>
