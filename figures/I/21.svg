<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 270" font-family="Georgia, 'Times New Roman', serif" font-style="italic" font-size="17">
  <title>Euclid I.21: two straight lines meeting within a triangle</title>
  <rect x="0" y="0" width="400" height="270" rx="10" fill="#fbf7ee"/>
  <!-- the triangle ABC -->
  <polygon points="150.0,42.0 40.0,232.0 360.0,232.0" fill="#e9dcc0" fill-opacity="0.55" stroke="#3b2f2f" stroke-width="2" stroke-linejoin="round"/>
  <!-- BD drawn through to E, on AC -->
  <line x1="212.0" y1="180.0" x2="279.9" y2="159.5" stroke="#3b2f2f" stroke-width="1.4"/>
  <!-- BD, DC, constructed on BC and meeting within the triangle -->
  <polyline points="40.0,232.0 212.0,180.0 360.0,232.0" fill="none" stroke="#a0522d" stroke-width="2.6" stroke-linejoin="round"/>
  <!-- the angle BAC, less than the angle CEB, which is less than the angle BDC -->
  <path d="M 137.98 62.77 A 24 24 0 0 0 167.80 58.10" fill="none" stroke="#a0522d" stroke-width="1.6"/>
  <path d="M 293.20 171.56 A 18 18 0 0 1 262.62 164.70" fill="none" stroke="#8c7b62" stroke-width="1.4"/>
  <path d="M 192.86 185.79 A 20 20 0 0 0 230.87 186.63" fill="none" stroke="#a0522d" stroke-width="1.6"/>
  <g fill="#3b2f2f">
    <circle cx="150.0" cy="42.0" r="2.6"/><circle cx="40.0" cy="232.0" r="2.6"/><circle cx="360.0" cy="232.0" r="2.6"/><circle cx="212.0" cy="180.0" r="2.6"/><circle cx="279.9" cy="159.5" r="2.6"/>
    <text x="144" y="31">A</text><text x="22" y="251">B</text><text x="364" y="251">C</text><text x="196" y="171">D</text><text x="288" y="155">E</text>
  </g>
</svg>
