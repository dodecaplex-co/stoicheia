<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" font-family="Georgia, 'Times New Roman', serif">
  <title>I.12 at a glance</title>
  <desc>Swing a circle round the point so that it cuts the straight line twice (blue), halve the piece between the cuts (red), and the straight line from the point to that middle stands on it at right angles (yellow).</desc>
  <rect x="0" y="0" width="400" height="300" rx="10" fill="#fbf7ee"/>
  <circle cx="200.0" cy="145.0" r="110" fill="none" stroke="#1f5aa6" stroke-width="3" stroke-opacity="0.75"/>
  <path d="M200.0,213.0 L200.0,185.0 A28,28 0 0,0 172.0,213.0 Z" fill="#f2b705"/>
  <path d="M200.0,213.0 L228.0,213.0 A28,28 0 0,0 200.0,185.0 Z" fill="#f2b705"/>
  <polyline points="212.0,213.0 212.0,201.0 200.0,201.0" fill="none" stroke="#222222" stroke-width="1.6"/>
  <polyline points="200.0,201.0 188.0,201.0 188.0,213.0" fill="none" stroke="#222222" stroke-width="1.6"/>
  <line x1="35.0" y1="213.0" x2="365.0" y2="213.0" stroke="#222222" stroke-width="3" stroke-linecap="round"/>
  <line x1="200.0" y1="145.0" x2="113.5" y2="213.0" stroke="#1f5aa6" stroke-width="6" stroke-linecap="round"/>
  <line x1="200.0" y1="145.0" x2="286.5" y2="213.0" stroke="#1f5aa6" stroke-width="6" stroke-linecap="round"/>
  <line x1="113.5" y1="213.0" x2="200.0" y2="213.0" stroke="#d0312d" stroke-width="7" stroke-linecap="round"/>
  <line x1="200.0" y1="213.0" x2="286.5" y2="213.0" stroke="#d0312d" stroke-width="7" stroke-linecap="round"/>
  <line x1="200.0" y1="145.0" x2="200.0" y2="213.0" stroke="#222222" stroke-width="6" stroke-linecap="round"/>
  <circle cx="200.0" cy="145.0" r="4.5" fill="#222222"/>
  <circle cx="251.8" cy="242.0" r="3.5" fill="#222222"/>
  <!-- Heath's letters -->
  <g font-size="14" fill="#222222" text-anchor="middle">
    <text x="200" y="133.6">C</text><text x="106.7" y="233.1">G</text><text x="200" y="235.6">H</text><text x="293.3" y="233.1">E</text>
    <text x="44" y="235.6">A</text><text x="356" y="235.6">B</text><text x="258.7" y="261">D</text><text x="200" y="26.6">F</text>
  </g>
</svg>
