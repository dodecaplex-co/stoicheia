<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" font-family="Georgia, 'Times New Roman', serif" font-style="italic" font-size="17">
  <title>Euclid I.37: triangles on the same base and in the same parallels</title>
  <rect x="0" y="0" width="400" height="240" rx="10" fill="#fbf7ee"/>
  <g fill="#e9dcc0" fill-opacity="0.55">
    <path d="M 160,55 L 120,195 L 220,195 Z"/>
    <path d="M 250,55 L 120,195 L 220,195 Z"/>
  </g>
  <g fill="none" stroke="#3b2f2f" stroke-width="1.6" stroke-linejoin="round">
    <path d="M 60,55 H 350 L 220,195 M 60,55 L 120,195"/>
  </g>
  <g fill="none" stroke="#a0522d" stroke-width="2.4" stroke-linejoin="round">
    <path d="M 120,195 L 160,55 L 220,195 Z M 120,195 L 250,55 L 220,195"/>
  </g>
  <g fill="#3b2f2f">
    <circle cx="60" cy="55" r="2.6"/>
    <circle cx="160" cy="55" r="2.6"/>
    <circle cx="250" cy="55" r="2.6"/>
    <circle cx="350" cy="55" r="2.6"/>
    <circle cx="120" cy="195" r="2.6"/>
    <circle cx="220" cy="195" r="2.6"/>
  </g>
  <g fill="#3b2f2f">
    <text x="40" y="59">E</text>
    <text x="154" y="40">A</text>
    <text x="244" y="40">D</text>
    <text x="360" y="59">F</text>
    <text x="112" y="220">B</text>
    <text x="215" y="220">C</text>
  </g>
</svg>
