<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" font-family="Georgia, 'Times New Roman', serif">
  <title>I.17 at a glance</title>
  <desc>Put any two angles of a triangle side by side (blue and yellow), and they always fall short of a straight line, which makes two right angles.</desc>
  <rect x="0" y="0" width="400" height="300" rx="10" fill="#fbf7ee"/>
  <path d="M40.0,200.0 L72.0,200.0 A32,32 0 0,0 59.7,174.8 Z" fill="#1f5aa6"/>
  <path d="M185.0,200.0 L170.0,171.7 A32,32 0 0,0 153.0,200.0 Z" fill="#f2b705"/>
  <polygon points="126.3,89.6 40.0,200.0 185.0,200.0" fill="none" stroke="#222222" stroke-width="4" stroke-linejoin="round"/>
  <g data-unlettered="the angles at B and C set side by side, which Heath's figure does not draw">
    <path d="M288.0,200.0 L320.0,200.0 A32,32 0 0,0 307.7,174.8 Z" fill="#1f5aa6"/>
    <path d="M288.0,200.0 L307.7,174.8 A32,32 0 0,0 275.0,170.8 Z" fill="#f2b705"/>
    <path d="M275.0,170.8 A32,32 0 0,0 256.0,200.0" fill="none" stroke="#222222" stroke-width="2" stroke-dasharray="4 4"/>
    <line x1="208.0" y1="200.0" x2="368.0" y2="200.0" stroke="#222222" stroke-width="3" stroke-linecap="round"/>
    <line x1="288.0" y1="200.0" x2="349.6" y2="121.2" stroke="#222222" stroke-width="3" stroke-linecap="round"/>
    <line x1="288.0" y1="200.0" x2="247.3" y2="108.6" stroke="#222222" stroke-width="3" stroke-linecap="round"/>
    <circle cx="288.0" cy="200.0" r="4.5" fill="#222222"/>
  </g>
  <!-- Heath's letters -->
  <g font-style="italic" font-size="14" fill="#222222" text-anchor="middle">
    <text x="126.3" y="79.6">A</text><text x="30" y="219.6">B</text><text x="183" y="221">C</text>
  </g>
</svg>
