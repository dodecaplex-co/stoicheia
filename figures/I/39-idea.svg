<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" font-family="Georgia, 'Times New Roman', serif">
  <title>I.39 at a glance</title>
  <desc>If two triangles on the same base (red), and on the same side of it, are equal in area (yellow), the straight line through their tips is parallel to the base (blue).</desc>
  <rect x="0" y="0" width="400" height="300" rx="10" fill="#fbf7ee"/>
  <polygon points="70.0,85.0 150.0,215.0 250.0,215.0" fill="#f2b705" fill-opacity="0.9"/>
  <polygon points="295.0,85.0 150.0,215.0 250.0,215.0" fill="#f2b705" fill-opacity="0.9"/>
  <polygon points="70.0,85.0 150.0,215.0 250.0,215.0" fill="none" stroke="#222222" stroke-width="3" stroke-linejoin="round"/>
  <polygon points="295.0,85.0 150.0,215.0 250.0,215.0" fill="none" stroke="#222222" stroke-width="3" stroke-linejoin="round"/>
  <line x1="45.0" y1="85.0" x2="355.0" y2="85.0" stroke="#1f5aa6" stroke-width="7" stroke-linecap="round"/>
  <line x1="45.0" y1="215.0" x2="355.0" y2="215.0" stroke="#1f5aa6" stroke-width="7" stroke-linecap="round"/>
  <line x1="150.0" y1="215.0" x2="250.0" y2="215.0" stroke="#d0312d" stroke-width="7" stroke-linecap="butt"/>
  <circle cx="70.0" cy="85.0" r="4.5" fill="#222222"/>
  <circle cx="295.0" cy="85.0" r="4.5" fill="#222222"/>
</svg>
