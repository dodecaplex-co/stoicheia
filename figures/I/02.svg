<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" font-family="Georgia, 'Times New Roman', serif" font-style="italic" font-size="17">
  <title>Euclid I.2: placing at A a straight line equal to BC</title>
  <rect x="0" y="0" width="400" height="300" rx="10" fill="#fbf7ee"/>
  <!-- circle GKL: centre D, radius DG -->
  <circle cx="200" cy="150" r="135" fill="none" stroke="#8c7b62" stroke-width="1.3"/>
  <!-- circle CGH: centre B, radius BC -->
  <circle cx="240" cy="219.3" r="55" fill="none" stroke="#8c7b62" stroke-width="1.3"/>
  <!-- DA produced to E, DB produced to F -->
  <line x1="200" y1="150" x2="120" y2="288.6" stroke="#3b2f2f" stroke-width="1.6"/>
  <line x1="200" y1="150" x2="280" y2="288.6" stroke="#3b2f2f" stroke-width="1.6"/>
  <!-- AB, BC -->
  <line x1="160" y1="219.3" x2="240" y2="219.3" stroke="#3b2f2f" stroke-width="1.6"/>
  <line x1="240" y1="219.3" x2="291.7" y2="238.1" stroke="#3b2f2f" stroke-width="2.4"/>
  <!-- AL, the answer -->
  <line x1="160" y1="219.3" x2="132.5" y2="266.9" stroke="#a0522d" stroke-width="3"/>
  <g fill="#3b2f2f">
    <circle cx="200" cy="150" r="2.6"/><circle cx="160" cy="219.3" r="2.6"/><circle cx="240" cy="219.3" r="2.6"/>
    <circle cx="291.7" cy="238.1" r="2.6"/><circle cx="267.5" cy="266.9" r="2.6"/><circle cx="132.5" cy="266.9" r="2.6"/>
    <text x="194" y="140">D</text><text x="142" y="216">A</text><text x="246" y="212">B</text>
    <text x="303" y="256">C</text><text x="284" y="273">G</text><text x="108" y="272">L</text>
    <text x="105" y="291">E</text><text x="284" y="292">F</text>
    <text x="270" y="166">H</text><text x="340" y="150">K</text>
  </g>
</svg>
