  <path d="M70.0,220.0 L84.3,191.4 A32,32 0 0,1 102.0,220.0 Z" fill="#f2b705"/>
  <line x1="330.0" y1="80.0" x2="70.0" y2="220.0" stroke="#222222" stroke-width="3" stroke-linecap="round"/>
