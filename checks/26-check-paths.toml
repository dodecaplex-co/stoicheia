# Check every tracked path's name, type and mode against the standard (docs/WORKFLOW.md,
# section 4, "File names"). It reads the index, so it judges exactly what is committed;
# --self-test first plants a fault of each kind and expects each caught. It needs no Lean,
# and runs before the build.
order = 6
name = "python3 scripts/check_paths.py --self-test"
job = "check"
command = ["python3", "scripts/check_paths.py", "--self-test"]
section8 = "python3 scripts/check_paths.py --self-test"
