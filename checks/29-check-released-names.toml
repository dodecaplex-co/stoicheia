# Check that main keeps every name the last release tag declares, as tests/released_names.txt
# lists them, under its own name or a deprecated alias, unless the tag deprecated it
# (docs/FORMALIZATION.md, section 2). A probe reads the library that `lake build` made above,
# once `lake build --no-build Elements` finds it current; --self-test first plants
# declarations in the probe's own file and judges planted lists on its output, then runs the
# check on the same output: one Lean file, a few seconds.
order = 148
name = "python3 -I scripts/check_released_names.py --self-test"
job = "check"
command = ["python3", "-I", "scripts/check_released_names.py", "--self-test"]
section8 = "python3 -I scripts/check_released_names.py --self-test"
