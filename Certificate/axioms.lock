# Certificate/axioms.lock
#
# The exact statement of every assumption the propositions may rest on: Euclid's
# postulates, Definition 15 and the tacit rules, all declared in Elements/Foundations/.
# After them, every definition, instance, structure and opaque word of this project that
# those statements reach, or that the statement of a proposition, a porism or a
# companion reaches, so that neither an assumption nor a claim can change its meaning
# through a word it uses. Lean prints both, as Certificate/FIELDS.md says: full names,
# no notation, one line each.
#
# scripts/check_fidelity.py compares this file with facts.json in both directions, and
# takes the number of Euclid's assumptions from it. Change it only with a decision,
# recorded in a decision entry of its own, docs/decisions/<YYYY-MM-DD>-<slug>.md
# (docs/WORKFLOW.md, section 10, "Decision entries"), and then only by running
#
#     python3 scripts/check_fidelity.py --write-lock

[axioms]  # 49
"Definition15" = "∀ {A B C : Elements.Point} {α : Elements.Circle}, Elements.Centre A α → Elements.OnCircle B α → Elements.OnCircle C α → Eq (Elements.len A B) (Elements.len A C)"
"Postulate1" = "∀ (A B : Elements.Point), Ne A B → Exists fun (L : Elements.Line) => And (Elements.OnLine A L) (Elements.OnLine B L)"
"Postulate2" = "∀ {B C : Elements.Point} {L : Elements.Line}, Elements.OnLine B L → Elements.OnLine C L → Ne B C → ∀ (avoid : List Elements.Point), Exists fun (A : Elements.Point) => And (Elements.OnLine A L) (And (Elements.Between B C A) (Not (Membership.mem avoid A)))"
"Postulate3" = "∀ (A B : Elements.Point), Ne A B → Exists fun (α : Elements.Circle) => And (Elements.Centre A α) (Elements.OnCircle B α)"
"Postulate4" = "∀ {A B C : Elements.Point}, Elements.IsRightAngle A B C → Eq (Elements.ang A B C) Elements.rightAngle"
"Postulate5" = "∀ {A B C D : Elements.Point} {L M N : Elements.Line}, Elements.OnLine A L → Elements.OnLine B L → Elements.OnLine B M → Elements.OnLine C M → Elements.OnLine C N → Elements.OnLine D N → Ne B C → Elements.SameSide A D M → LT.lt (HAdd.hAdd (Elements.ang A B C) (Elements.ang B C D)) (HAdd.hAdd Elements.rightAngle Elements.rightAngle) → Exists fun (E : Elements.Point) => And (Elements.OnLine E L) (And (Elements.OnLine E N) (Elements.SameSide E A M))"
"Tacit.add_assoc" = "∀ {k : Elements.Kind} (a b c : Elements.Magnitude k), Eq (HAdd.hAdd (HAdd.hAdd a b) c) (HAdd.hAdd a (HAdd.hAdd b c))"
"Tacit.add_comm" = "∀ {k : Elements.Kind} (a b : Elements.Magnitude k), Eq (HAdd.hAdd a b) (HAdd.hAdd b a)"
"Tacit.add_lt_add_right" = "∀ {k : Elements.Kind} {a b : Elements.Magnitude k} (c : Elements.Magnitude k), LT.lt a b → LT.lt (HAdd.hAdd a c) (HAdd.hAdd b c)"
"Tacit.add_zero" = "∀ {k : Elements.Kind} (a : Elements.Magnitude k), Eq (HAdd.hAdd a 0) a"
"Tacit.angle_add_of_inside" = "∀ {A B C D : Elements.Point} {L M : Elements.Line}, Elements.OnLine A L → Elements.OnLine A M → Elements.OnLine B L → Elements.OnLine C M → Ne A B → Ne A C → Not (Elements.OnLine D L) → Not (Elements.OnLine D M) → Ne L M → Elements.SameSide B D M → Elements.SameSide C D L → Eq (Elements.ang B A C) (HAdd.hAdd (Elements.ang B A D) (Elements.ang D A C))"
"Tacit.angle_eq_of_same_rays" = "∀ {A B C : Elements.Point} {L M : Elements.Line} {B' C' : Elements.Point}, Elements.OnLine A L → Elements.OnLine B L → Elements.OnLine B' L → Elements.OnLine A M → Elements.OnLine C M → Elements.OnLine C' M → Ne B A → Ne B' A → Ne C A → Ne C' A → Not (Elements.Between B A B') → Not (Elements.Between C A C') → Eq (Elements.ang B A C) (Elements.ang B' A C')"
"Tacit.angle_eq_zero_of_same_ray" = "∀ {A B C : Elements.Point} {L : Elements.Line}, Ne A B → Ne A C → Elements.OnLine A L → Elements.OnLine B L → Elements.OnLine C L → Not (Elements.Between B A C) → Eq (Elements.ang B A C) 0"
"Tacit.angle_le_two_right" = "∀ (A B C : Elements.Point), LE.le (Elements.ang A B C) (HAdd.hAdd Elements.rightAngle Elements.rightAngle)"
"Tacit.angle_symm" = "∀ {A B C : Elements.Point}, Ne A B → Ne C B → Eq (Elements.ang A B C) (Elements.ang C B A)"
"Tacit.area_add_of_between" = "∀ {A B C D : Elements.Point} {L : Elements.Line}, Elements.OnLine A L → Elements.OnLine B L → Elements.OnLine C L → Ne A B → Ne A C → Ne B C → Not (Elements.OnLine D L) → Elements.Between A C B → Eq (HAdd.hAdd (Elements.area A C D) (Elements.area D C B)) (Elements.area A D B)"
"Tacit.area_congruent" = "∀ {A B C D E F : Elements.Point}, Eq (Elements.len A B) (Elements.len D E) → Eq (Elements.len B C) (Elements.len E F) → Eq (Elements.len C A) (Elements.len F D) → Eq (Elements.ang A B C) (Elements.ang D E F) → Eq (Elements.ang B C A) (Elements.ang E F D) → Eq (Elements.ang C A B) (Elements.ang F D E) → Eq (Elements.area A B C) (Elements.area D E F)"
"Tacit.area_degenerate" = "∀ (A B : Elements.Point), Eq (Elements.area A A B) 0"
"Tacit.area_eq_zero_of_on_line" = "∀ {A B C : Elements.Point} {L : Elements.Line}, Elements.OnLine A L → Elements.OnLine B L → Ne A B → Elements.OnLine C L → Eq (Elements.area A B C) 0"
"Tacit.area_rotate" = "∀ (A B C : Elements.Point), Eq (Elements.area A B C) (Elements.area C A B)"
"Tacit.between_cases" = "∀ {A B C : Elements.Point} {L : Elements.Line}, Ne A B → Ne B C → Ne A C → Elements.OnLine A L → Elements.OnLine B L → Elements.OnLine C L → Or (Elements.Between A B C) (Or (Elements.Between B A C) (Elements.Between A C B))"
"Tacit.between_of_inside_chord" = "∀ {A B C : Elements.Point} {L : Elements.Line} {α : Elements.Circle}, Elements.OnLine A L → Elements.OnLine B L → Elements.OnLine C L → Elements.InsideCircle A α → Elements.OnCircle B α → Elements.OnCircle C α → Ne B C → Elements.Between B A C"
"Tacit.between_symm" = "∀ {A B C : Elements.Point}, Elements.Between A B C → Elements.Between C B A"
"Tacit.circle_eq" = "∀ {A B C : Elements.Point} {α β : Elements.Circle}, Elements.Centre A α → Elements.Centre A β → Elements.OnCircle B α → Elements.OnCircle C β → Eq (Elements.len A B) (Elements.len A C) → Eq α β"
"Tacit.circles_meet" = "∀ {A B : Elements.Point} {α β : Elements.Circle}, Elements.OnCircle A α → Elements.InsideCircle B α → Elements.InsideCircle A β → Elements.OnCircle B β → Elements.CirclesMeet α β"
"Tacit.circles_meet_same_side" = "∀ {α β : Elements.Circle} {B C D : Elements.Point} {L : Elements.Line}, Elements.CirclesMeet α β → Elements.Centre C α → Elements.Centre D β → Elements.OnLine C L → Elements.OnLine D L → Not (Elements.OnLine B L) → Exists fun (A : Elements.Point) => And (Elements.OnCircle A α) (And (Elements.OnCircle A β) (Elements.SameSide A B L))"
"Tacit.exists_centre" = "∀ (α : Elements.Circle), Exists fun (O : Elements.Point) => Elements.Centre O α"
"Tacit.exists_point" = "∀ (avoid : List Elements.Point), Exists fun (A : Elements.Point) => Not (Membership.mem avoid A)"
"Tacit.exists_point_inside_circle" = "∀ (α : Elements.Circle) (avoid : List Elements.Point), Exists fun (A : Elements.Point) => And (Elements.InsideCircle A α) (Not (Membership.mem avoid A))"
"Tacit.exists_point_on_line" = "∀ (L : Elements.Line) (avoid : List Elements.Point), Exists fun (A : Elements.Point) => And (Elements.OnLine A L) (Not (Membership.mem avoid A))"
"Tacit.len_add_of_between" = "∀ {A B C : Elements.Point}, Elements.Between A B C → Eq (HAdd.hAdd (Elements.len A B) (Elements.len B C)) (Elements.len A C)"
"Tacit.len_self" = "∀ (A : Elements.Point), Eq (Elements.len A A) 0"
"Tacit.len_symm" = "∀ (A B : Elements.Point), Eq (Elements.len A B) (Elements.len B A)"
"Tacit.line_circle_between" = "∀ {B C : Elements.Point} {L : Elements.Line} {α : Elements.Circle}, Elements.InsideCircle B α → Elements.OnLine B L → Elements.OutsideCircle C α → Elements.OnLine C L → Exists fun (A : Elements.Point) => And (Elements.OnCircle A α) (And (Elements.OnLine A L) (Elements.Between B A C))"
"Tacit.line_circle_beyond" = "∀ {B C : Elements.Point} {L : Elements.Line} {α : Elements.Circle}, Elements.InsideCircle B α → Elements.OnLine B L → Elements.OnLine C L → Ne C B → Exists fun (A : Elements.Point) => And (Elements.OnCircle A α) (And (Elements.OnLine A L) (Elements.Between A B C))"
"Tacit.line_unique" = "∀ {A B : Elements.Point} {L M : Elements.Line}, Ne A B → Elements.OnLine A L → Elements.OnLine B L → Elements.OnLine A M → Elements.OnLine B M → Eq L M"
"Tacit.lines_meet_of_opposite_sides" = "∀ {A B : Elements.Point} {L M : Elements.Line}, Elements.OppositeSides A B L → Elements.OnLine A M → Elements.OnLine B M → Elements.LinesMeet L M"
"Tacit.lt_irrefl" = "∀ {k : Elements.Kind} (a : Elements.Magnitude k), Not (LT.lt a a)"
"Tacit.lt_trans" = "∀ {k : Elements.Kind} {a b c : Elements.Magnitude k}, LT.lt a b → LT.lt b c → LT.lt a c"
"Tacit.lt_trichotomy" = "∀ {k : Elements.Kind} (a b : Elements.Magnitude k), Or (LT.lt a b) (Or (Eq a b) (LT.lt b a))"
"Tacit.not_between_of_between" = "∀ {A B C : Elements.Point}, Elements.Between A B C → Not (Elements.Between B A C)"
"Tacit.not_lt_zero" = "∀ {k : Elements.Kind} (a : Elements.Magnitude k), Not (LT.lt a 0)"
"Tacit.not_on_line_of_same_side" = "∀ {A B : Elements.Point} {L : Elements.Line}, Elements.SameSide A B L → Not (Elements.OnLine A L)"
"Tacit.on_line_of_area_eq_zero" = "∀ {A B C : Elements.Point} {L : Elements.Line}, Elements.OnLine A L → Elements.OnLine B L → Ne A B → Eq (Elements.area A B C) 0 → Elements.OnLine C L"
"Tacit.pasch2" = "∀ {A B C : Elements.Point} {L : Elements.Line}, Elements.Between A B C → Elements.OnLine A L → Not (Elements.OnLine B L) → Elements.SameSide B C L"
"Tacit.radius_ne_zero" = "∀ {A B : Elements.Point} {α : Elements.Circle}, Elements.Centre A α → Elements.OnCircle B α → Ne (Elements.len A B) 0"
"Tacit.same_ray_of_angle_eq_zero" = "∀ {A B C : Elements.Point} {L : Elements.Line}, Ne A B → Ne A C → Elements.OnLine A L → Elements.OnLine B L → Eq (Elements.ang B A C) 0 → And (Elements.OnLine C L) (Not (Elements.Between B A C))"
"Tacit.same_side_trans" = "∀ {A B C : Elements.Point} {L : Elements.Line}, Elements.SameSide A B L → Elements.SameSide A C L → Elements.SameSide B C L"
"Tacit.superposition" = "Elements.Superposition.Rule Elements.primitives"

[vocabulary]  # 268
"Angle" = "def : Type := Elements.Magnitude Elements.Kind.angle"
"Apart" = "structure : Type"
"Apart.area" = "def : Elements.Apart → Elements.Area := fun (R : Elements.Apart) => Elements.Magnitude.sum (List.map (fun (t : Prod Elements.Point (Prod Elements.Point Elements.Point)) => Elements.area (Prod.fst t) (Prod.fst (Prod.snd t)) (Prod.snd (Prod.snd t))) (Elements.Apart.pieces R))"
"Apart.mk" = "constructor : (pieces : List (Prod Elements.Point (Prod Elements.Point Elements.Point))) → Ne pieces List.nil → (∀ (t : Prod Elements.Point (Prod Elements.Point Elements.Point)), Membership.mem pieces t → Elements.Triangle (Prod.fst t) (Prod.fst (Prod.snd t)) (Prod.snd (Prod.snd t))) → List.Pairwise (fun (s s' : Prod Elements.Point (Prod Elements.Point Elements.Point)) => ∀ (Y : Elements.Point), Elements.InsideTriangle Y (Prod.fst s) (Prod.fst (Prod.snd s)) (Prod.snd (Prod.snd s)) → Not (Elements.InsideTriangle Y (Prod.fst s') (Prod.fst (Prod.snd s')) (Prod.snd (Prod.snd s')))) pieces → Elements.Apart"
"Apart.pieces" = "def : Elements.Apart → List (Prod Elements.Point (Prod Elements.Point Elements.Point)) := fun (self : Elements.Apart) => self.1"
"Arc" = "structure : Type"
"Arc.B" = "def : Elements.Arc → Elements.Point := fun (self : Elements.Arc) => self.2"
"Arc.C" = "def : Elements.Arc → Elements.Point := fun (self : Elements.Arc) => self.3"
"Arc.Congruent" = "def : Elements.Arc → Elements.Arc → Prop := fun (a b : Elements.Arc) => Exists fun (f : Elements.Point → Elements.Point) => And (Eq (f (Elements.Arc.B a)) (Elements.Arc.B b)) (And (Eq (f (Elements.Arc.C a)) (Elements.Arc.C b)) (And (Elements.Places f (fun (x : Elements.Point) => Elements.InSegment x a) fun (x : Elements.Point) => Elements.InSegment x b) (Elements.Places f (fun (x : Elements.Point) => Elements.OnArc x a) fun (x : Elements.Point) => Elements.OnArc x b)))"
"Arc.Drawn" = "def : Elements.Arc → Prop := fun (a : Elements.Arc) => And (Elements.OnCircle (Elements.Arc.B a) (Elements.Arc.circle a)) (And (Elements.OnCircle (Elements.Arc.C a) (Elements.Arc.circle a)) (Not (Elements.Collinear (Elements.Arc.B a) (Elements.Arc.C a) (Elements.Arc.K a))))"
"Arc.Greater" = "def : Elements.Arc → Prop := fun (a : Elements.Arc) => Exists fun (O : Elements.Point) => And (Elements.Centre O (Elements.Arc.circle a)) (Elements.SameSideOf O (Elements.Arc.K a) (Elements.Arc.B a) (Elements.Arc.C a))"
"Arc.K" = "def : Elements.Arc → Elements.Point := fun (self : Elements.Arc) => self.4"
"Arc.Less" = "def : Elements.Arc → Prop := fun (a : Elements.Arc) => Exists fun (O : Elements.Point) => And (Elements.Centre O (Elements.Arc.circle a)) (Elements.OppositeSidesOf O (Elements.Arc.K a) (Elements.Arc.B a) (Elements.Arc.C a))"
"Arc.Semicircle" = "def : Elements.Arc → Prop := fun (a : Elements.Arc) => Exists fun (O : Elements.Point) => And (Elements.Centre O (Elements.Arc.circle a)) (Elements.Collinear (Elements.Arc.B a) (Elements.Arc.C a) O)"
"Arc.circle" = "def : Elements.Arc → Elements.Circle := fun (self : Elements.Arc) => self.1"
"Arc.measure" = "def : Elements.Arc → Elements.Angle := fun (a : Elements.Arc) => Elements.circumference (Elements.Arc.circle a) (Elements.Arc.B a) (Elements.Arc.K a) (Elements.Arc.C a)"
"Arc.mk" = "constructor : Elements.Circle → Elements.Point → Elements.Point → Elements.Point → Elements.Arc"
"AreParallel" = "def : Elements.Point → Elements.Point → Elements.Point → Elements.Point → Prop := fun (A B C D : Elements.Point) => And (Ne A B) (And (Ne C D) (∀ (L M : Elements.Line), Elements.OnLine A L → Elements.OnLine B L → Elements.OnLine C M → Elements.OnLine D M → Elements.Parallel L M))"
"Area" = "def : Type := Elements.Magnitude Elements.Kind.area"
"Between" = "opaque : Elements.Point → Elements.Point → Elements.Point → Prop"
"Centre" = "opaque : Elements.Point → Elements.Circle → Prop"
"Circle" = "opaque : Type"
"CirclesCut" = "def : Elements.Circle → Elements.Circle → Prop := fun (α β : Elements.Circle) => And (Elements.CirclesMeet α β) (And (Exists fun (P : Elements.Point) => And (Elements.OnCircle P α) (Elements.InsideCircle P β)) (Exists fun (P : Elements.Point) => And (Elements.OnCircle P β) (Elements.InsideCircle P α)))"
"CirclesMeet" = "def : Elements.Circle → Elements.Circle → Prop := fun (α β : Elements.Circle) => Exists fun (A : Elements.Point) => Exists fun (B : Elements.Point) => And (Ne A B) (And (Elements.OnCircle A α) (And (Elements.OnCircle A β) (And (Elements.OnCircle B α) (Elements.OnCircle B β))))"
"CirclesTouch" = "def : Elements.Circle → Elements.Circle → Elements.Point → Prop := fun (α β : Elements.Circle) (C : Elements.Point) => Or (Elements.TouchesInternally α β C) (Or (Elements.TouchesInternally β α C) (Elements.TouchesExternally α β C))"
"CirclesTouchAt" = "def : Elements.Circle → Elements.Circle → Elements.Point → Prop := fun (α β : Elements.Circle) (C : Elements.Point) => Or (Elements.TouchesInternallyAt α β C) (Or (Elements.TouchesInternallyAt β α C) (Elements.TouchesExternallyAt α β C))"
"Collinear" = "def : Elements.Point → Elements.Point → Elements.Point → Prop := fun (A B C : Elements.Point) => Exists fun (L : Elements.Line) => And (Elements.OnLine A L) (And (Elements.OnLine B L) (Elements.OnLine C L))"
"Contain" = "def : Elements.Length → Elements.Length → Elements.Area → Prop := fun (a b : Elements.Length) (x : Elements.Area) => Or (And (Or (Eq a 0) (Eq b 0)) (Eq x 0)) (Exists fun (P : Elements.Point) => Exists fun (Q : Elements.Point) => Exists fun (R : Elements.Point) => Exists fun (S : Elements.Point) => And (Elements.Rectangle P Q R S) (And (Eq (Elements.len P Q) a) (And (Eq (Elements.len P S) b) (Eq (Elements.quadArea P Q R S) x))))"
"Corners" = "def : Prod Elements.Point (Prod Elements.Point Elements.Point) → Elements.Point → Elements.Point → Elements.Point → Prop := fun (t : Prod Elements.Point (Prod Elements.Point Elements.Point)) (P Q R : Elements.Point) => Or (Eq t (Prod.mk P (Prod.mk Q R))) (Or (Eq t (Prod.mk Q (Prod.mk R P))) (Or (Eq t (Prod.mk R (Prod.mk P Q))) (Or (Eq t (Prod.mk Q (Prod.mk P R))) (Or (Eq t (Prod.mk P (Prod.mk R Q))) (Eq t (Prod.mk R (Prod.mk Q P)))))))"
"EqualCircles" = "def : Elements.Circle → Elements.Circle → Prop := fun (α β : Elements.Circle) => Exists fun (G : Elements.Point) => Exists fun (H : Elements.Point) => Exists fun (P : Elements.Point) => Exists fun (Q : Elements.Point) => And (Elements.Centre G α) (And (Elements.Centre H β) (And (Elements.OnCircle P α) (And (Elements.OnCircle Q β) (Eq (Elements.len G P) (Elements.len H Q)))))"
"Equilateral" = "def : Elements.Point → Elements.Point → Elements.Point → Prop := fun (A B C : Elements.Point) => And (Elements.Triangle A B C) (And (Eq (Elements.len A B) (Elements.len B C)) (Eq (Elements.len B C) (Elements.len C A)))"
"Figures.CompatibleLoops" = "def : List Elements.Point → List Elements.Point → Prop := fun (ps qs : List Elements.Point) => And (∀ (X : Elements.Point), Elements.Figures.LoopBoundary ps X → Elements.Figures.LoopBoundary qs X → Or (Membership.mem ps X) (Membership.mem qs X)) (Or (∀ (X : Elements.Point), Elements.Figures.LoopInside ps X → Not (Elements.Figures.LoopInside qs X)) (Or (∀ (X : Elements.Point), Elements.Figures.LoopRegion ps X → Elements.Figures.LoopRegion qs X) (∀ (X : Elements.Point), Elements.Figures.LoopRegion qs X → Elements.Figures.LoopRegion ps X)))"
"Figures.Covers" = "def : List (Prod Elements.Point (Prod Elements.Point Elements.Point)) → Elements.Point → Prop := fun (ts : List (Prod Elements.Point (Prod Elements.Point Elements.Point))) (X : Elements.Point) => Exists fun (t : Prod Elements.Point (Prod Elements.Point Elements.Point)) => And (Membership.mem ts t) (Elements.OnOrInsideTriangle X (Prod.fst t) (Prod.fst (Prod.snd t)) (Prod.snd (Prod.snd t)))"
"Figures.Divides" = "def : (Elements.Point → Prop) → Elements.Apart → Prop := fun (U : Elements.Point → Prop) (R : Elements.Apart) => ∀ (X : Elements.Point), Iff (Elements.Figures.Covers (Elements.Apart.pieces R) X) (U X)"
"Figures.GoodRay" = "def : List Elements.Point → Elements.Point → Elements.Point → Prop := fun (ps : List Elements.Point) (X Q : Elements.Point) => And (Ne X Q) (∀ (V : Elements.Point), Membership.mem ps V → Not (Elements.Collinear X Q V))"
"Figures.LoopBoundary" = "def : List Elements.Point → Elements.Point → Prop := fun (ps : List Elements.Point) (X : Elements.Point) => Exists fun (s : Prod Elements.Point Elements.Point) => And (Membership.mem (Elements.Figures.sides ps) s) (Elements.OnFiniteLine X (Prod.fst s) (Prod.snd s))"
"Figures.LoopInside" = "def : List Elements.Point → Elements.Point → Prop := fun (ps : List Elements.Point) (X : Elements.Point) => And (Not (Elements.Figures.LoopBoundary ps X)) (Exists fun (Q : Elements.Point) => And (Elements.Figures.GoodRay ps X Q) (Eq (HMod.hMod (Elements.Figures.crossingCount ps X Q) 2) 1))"
"Figures.LoopRegion" = "def : List Elements.Point → Elements.Point → Prop := fun (ps : List Elements.Point) (X : Elements.Point) => Or (Elements.Figures.LoopBoundary ps X) (Elements.Figures.LoopInside ps X)"
"Figures.Outline" = "structure : Type"
"Figures.Outline.Boundary" = "def : Elements.Figures.Outline → Elements.Point → Prop := fun (F : Elements.Figures.Outline) (X : Elements.Point) => Exists fun (ps : List Elements.Point) => And (Membership.mem (Elements.Figures.Outline.loops F) ps) (Elements.Figures.LoopBoundary ps X)"
"Figures.Outline.Inside" = "def : Elements.Figures.Outline → Elements.Point → Prop := fun (F : Elements.Figures.Outline) (X : Elements.Point) => And (Not (Elements.Figures.Outline.Boundary F X)) (Eq (HMod.hMod (Elements.Figures.Outline.depth F X) 2) 1)"
"Figures.Outline.Region" = "def : Elements.Figures.Outline → Elements.Point → Prop := fun (F : Elements.Figures.Outline) (X : Elements.Point) => Or (Elements.Figures.Outline.Boundary F X) (Elements.Figures.Outline.Inside F X)"
"Figures.Outline.area" = "def : Elements.Figures.Outline → Elements.Area := fun (F : Elements.Figures.Outline) => Classical.epsilon fun (a : Elements.Area) => Exists fun (R : Elements.Apart) => And (Elements.Figures.Divides (Elements.Figures.Outline.Region F) R) (Eq (Elements.Apart.area R) a)"
"Figures.Outline.depth" = "def : Elements.Figures.Outline → Elements.Point → Nat := fun (F : Elements.Figures.Outline) (X : Elements.Point) => List.length (List.filter (fun (ps : List Elements.Point) => Decidable.decide (Elements.Figures.LoopInside ps X)) (Elements.Figures.Outline.loops F))"
"Figures.Outline.loops" = "def : Elements.Figures.Outline → List (List Elements.Point) := fun (self : Elements.Figures.Outline) => self.1"
"Figures.Outline.mk" = "constructor : (loops : List (List Elements.Point)) → Ne loops List.nil → (∀ (ps : List Elements.Point), Membership.mem loops ps → Elements.Figures.SimpleLoop ps) → List.Pairwise Elements.Figures.CompatibleLoops loops → Elements.Figures.Outline"
"Figures.RayCrosses" = "def : Elements.Point → Elements.Point → Prod Elements.Point Elements.Point → Prop := fun (X Q : Elements.Point) (s : Prod Elements.Point Elements.Point) => Exists fun (Y : Elements.Point) => And (Elements.OnRay Y X Q) (Elements.Between (Prod.fst s) Y (Prod.snd s))"
"Figures.SimpleLoop" = "def : List Elements.Point → Prop := fun (ps : List Elements.Point) => And (LE.le 3 (List.length ps)) (And (List.Nodup ps) (And (∀ (s : Prod Elements.Point Elements.Point), Membership.mem (Elements.Figures.sides ps) s → Ne (Prod.fst s) (Prod.snd s)) (List.Pairwise (fun (s t : Prod Elements.Point Elements.Point) => ∀ (X : Elements.Point), Elements.OnFiniteLine X (Prod.fst s) (Prod.snd s) → Elements.OnFiniteLine X (Prod.fst t) (Prod.snd t) → And (Or (Eq X (Prod.fst s)) (Eq X (Prod.snd s))) (Or (Eq X (Prod.fst t)) (Eq X (Prod.snd t)))) (Elements.Figures.sides ps))))"
