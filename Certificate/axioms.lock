# Certificate/axioms.lock
#
# The exact statement of every assumption the propositions may rest on: Euclid's
# postulates, Definition 15 and the tacit rules, all declared in Elements/Foundations/.
# After them, every definition, instance, structure and opaque word of this project that
# those statements reach, so that no assumption can change its meaning through a word it
# uses. Lean prints both, as Certificate/FIELDS.md says: full names, no notation, one
# line each.
#
# scripts/check_fidelity.py compares this file with facts.json in both directions, and
# takes the number of Euclid's assumptions from it. Change it only with a decision,
# recorded in docs/briefs/0002-decisions.md, and then only by running
#
#     python3 scripts/check_fidelity.py --write-lock

[axioms]  # 87
"Definition15" = "∀ {A B C : Elements.Point} {α : Elements.Circle}, Elements.Centre A α → Elements.OnCircle B α → Elements.OnCircle C α → Eq (Elements.len A B) (Elements.len A C)"
"Postulate1" = "∀ (A B : Elements.Point), Ne A B → Exists fun (L : Elements.Line) => And (Elements.OnLine A L) (Elements.OnLine B L)"
"Postulate2" = "∀ {B C : Elements.Point} {L : Elements.Line}, Elements.OnLine B L → Elements.OnLine C L → Ne B C → ∀ (avoid : List Elements.Point), Exists fun (A : Elements.Point) => And (Elements.OnLine A L) (And (Elements.Between B C A) (Not (Membership.mem avoid A)))"
"Postulate3" = "∀ (A B : Elements.Point), Ne A B → Exists fun (α : Elements.Circle) => And (Elements.Centre A α) (Elements.OnCircle B α)"
"Postulate4" = "∀ {A B C : Elements.Point}, Elements.IsRightAngle A B C → Eq (Elements.ang A B C) Elements.rightAngle"
"Postulate5" = "∀ {A B C D : Elements.Point} {L M N : Elements.Line}, Elements.OnLine A L → Elements.OnLine B L → Elements.OnLine B M → Elements.OnLine C M → Elements.OnLine C N → Elements.OnLine D N → Ne B C → Elements.SameSide A D M → LT.lt (HAdd.hAdd (Elements.ang A B C) (Elements.ang B C D)) (HAdd.hAdd Elements.rightAngle Elements.rightAngle) → Exists fun (E : Elements.Point) => And (Elements.OnLine E L) (And (Elements.OnLine E N) (Elements.SameSide E A M))"
"Tacit.add_assoc" = "∀ {k : Elements.Kind} (a b c : Elements.Magnitude k), Eq (HAdd.hAdd (HAdd.hAdd a b) c) (HAdd.hAdd a (HAdd.hAdd b c))"
"Tacit.add_comm" = "∀ {k : Elements.Kind} (a b : Elements.Magnitude k), Eq (HAdd.hAdd a b) (HAdd.hAdd b a)"
"Tacit.add_lt_add_right" = "∀ {k : Elements.Kind} {a b : Elements.Magnitude k} (c : Elements.Magnitude k), LT.lt a b → LT.lt (HAdd.hAdd a c) (HAdd.hAdd b c)"
"Tacit.add_zero" = "∀ {k : Elements.Kind} (a : Elements.Magnitude k), Eq (HAdd.hAdd a 0) a"
"Tacit.adjacent_eq_of_right" = "∀ {A B C D : Elements.Point} {L : Elements.Line}, Elements.OnLine A L → Elements.OnLine B L → Elements.Between A C B → Not (Elements.OnLine D L) → Eq (Elements.ang A C D) Elements.rightAngle → Eq (Elements.ang A C D) (Elements.ang D C B)"
"Tacit.angle_add_of_inside" = "∀ {A B C D : Elements.Point} {L M : Elements.Line}, Elements.OnLine A L → Elements.OnLine A M → Elements.OnLine B L → Elements.OnLine C M → Ne A B → Ne A C → Not (Elements.OnLine D L) → Not (Elements.OnLine D M) → Ne L M → Elements.SameSide B D M → Elements.SameSide C D L → Eq (Elements.ang B A C) (HAdd.hAdd (Elements.ang B A D) (Elements.ang D A C))"
"Tacit.angle_eq_of_same_rays" = "∀ {A B C : Elements.Point} {L M : Elements.Line} {B' C' : Elements.Point}, Elements.OnLine A L → Elements.OnLine B L → Elements.OnLine B' L → Elements.OnLine A M → Elements.OnLine C M → Elements.OnLine C' M → Ne B A → Ne B' A → Ne C A → Ne C' A → Not (Elements.Between B A B') → Not (Elements.Between C A C') → Eq (Elements.ang B A C) (Elements.ang B' A C')"
"Tacit.angle_eq_zero_of_same_ray" = "∀ {A B C : Elements.Point} {L : Elements.Line}, Ne A B → Ne A C → Elements.OnLine A L → Elements.OnLine B L → Elements.OnLine C L → Not (Elements.Between B A C) → Eq (Elements.ang B A C) 0"
"Tacit.angle_le_two_right" = "∀ (A B C : Elements.Point), LE.le (Elements.ang A B C) (HAdd.hAdd Elements.rightAngle Elements.rightAngle)"
"Tacit.angle_symm" = "∀ {A B C : Elements.Point}, Ne A B → Ne C B → Eq (Elements.ang A B C) (Elements.ang C B A)"
"Tacit.area_add_of_between" = "∀ {A B C D : Elements.Point} {L : Elements.Line}, Elements.OnLine A L → Elements.OnLine B L → Elements.OnLine C L → Ne A B → Ne A C → Ne B C → Not (Elements.OnLine D L) → Elements.Between A C B → Eq (HAdd.hAdd (Elements.area A C D) (Elements.area D C B)) (Elements.area A D B)"
"Tacit.area_congruent" = "∀ {A B C D E F : Elements.Point}, Eq (Elements.len A B) (Elements.len D E) → Eq (Elements.len B C) (Elements.len E F) → Eq (Elements.len C A) (Elements.len F D) → Eq (Elements.ang A B C) (Elements.ang D E F) → Eq (Elements.ang B C A) (Elements.ang E F D) → Eq (Elements.ang C A B) (Elements.ang F D E) → Eq (Elements.area A B C) (Elements.area D E F)"
"Tacit.area_degenerate" = "∀ (A B : Elements.Point), Eq (Elements.area A A B) 0"
"Tacit.area_eq_zero_of_on_line" = "∀ {A B C : Elements.Point} {L : Elements.Line}, Elements.OnLine A L → Elements.OnLine B L → Ne A B → Elements.OnLine C L → Eq (Elements.area A B C) 0"
"Tacit.area_rotate" = "∀ (A B C : Elements.Point), Eq (Elements.area A B C) (Elements.area C A B)"
"Tacit.area_swap" = "∀ (A B C : Elements.Point), Eq (Elements.area A B C) (Elements.area A C B)"
"Tacit.between_cases" = "∀ {A B C : Elements.Point} {L : Elements.Line}, Ne A B → Ne B C → Ne A C → Elements.OnLine A L → Elements.OnLine B L → Elements.OnLine C L → Or (Elements.Between A B C) (Or (Elements.Between B A C) (Elements.Between A C B))"
"Tacit.between_of_area_add" = "∀ {A B C D : Elements.Point} {L : Elements.Line}, Elements.OnLine A L → Elements.OnLine B L → Elements.OnLine C L → Ne A B → Ne A C → Ne B C → Not (Elements.OnLine D L) → Eq (HAdd.hAdd (Elements.area A C D) (Elements.area D C B)) (Elements.area A D B) → Elements.Between A C B"
"Tacit.between_of_between_left" = "∀ {A B C D : Elements.Point}, Elements.Between A B C → Elements.Between A D B → Elements.Between A D C"
"Tacit.between_of_between_right" = "∀ {A B C D : Elements.Point}, Elements.Between A B C → Elements.Between B C D → Elements.Between A B D"
"Tacit.between_of_inside_chord" = "∀ {A B C : Elements.Point} {L : Elements.Line} {α : Elements.Circle}, Elements.OnLine A L → Elements.OnLine B L → Elements.OnLine C L → Elements.InsideCircle A α → Elements.OnCircle B α → Elements.OnCircle C α → Ne B C → Elements.Between B A C"
"Tacit.between_symm" = "∀ {A B C : Elements.Point}, Elements.Between A B C → Elements.Between C B A"
"Tacit.centre_inside" = "∀ {A : Elements.Point} {α : Elements.Circle}, Elements.Centre A α → Elements.InsideCircle A α"
"Tacit.centre_unique" = "∀ {A B : Elements.Point} {α : Elements.Circle}, Elements.Centre A α → Elements.Centre B α → Eq A B"
"Tacit.circle_eq" = "∀ {A B C : Elements.Point} {α β : Elements.Circle}, Elements.Centre A α → Elements.Centre A β → Elements.OnCircle B α → Elements.OnCircle C β → Eq (Elements.len A B) (Elements.len A C) → Eq α β"
"Tacit.circles_meet" = "∀ {A B : Elements.Point} {α β : Elements.Circle}, Elements.OnCircle A α → Elements.InsideCircle B α → Elements.InsideCircle A β → Elements.OnCircle B β → Elements.CirclesMeet α β"
"Tacit.circles_meet_of_on_inside_outside" = "∀ {A B : Elements.Point} {α β : Elements.Circle}, Elements.OnCircle A α → Or (Elements.InsideCircle B α) (Elements.OnCircle B α) → Elements.InsideCircle A β → Elements.OutsideCircle B β → Elements.CirclesMeet α β"
"Tacit.circles_meet_opposite_side" = "∀ {α β : Elements.Circle} {B C D : Elements.Point} {L : Elements.Line}, Elements.CirclesMeet α β → Elements.Centre C α → Elements.Centre D β → Elements.OnLine C L → Elements.OnLine D L → Not (Elements.OnLine B L) → Exists fun (A : Elements.Point) => And (Elements.OnCircle A α) (And (Elements.OnCircle A β) (Elements.OppositeSides A B L))"
"Tacit.circles_meet_same_side" = "∀ {α β : Elements.Circle} {B C D : Elements.Point} {L : Elements.Line}, Elements.CirclesMeet α β → Elements.Centre C α → Elements.Centre D β → Elements.OnLine C L → Elements.OnLine D L → Not (Elements.OnLine B L) → Exists fun (A : Elements.Point) => And (Elements.OnCircle A α) (And (Elements.OnCircle A β) (Elements.SameSide A B L))"
"Tacit.eq_of_len_eq_zero" = "∀ {A B : Elements.Point}, Eq (Elements.len A B) 0 → Eq A B"
"Tacit.exists_point" = "∀ (avoid : List Elements.Point), Exists fun (A : Elements.Point) => Not (Membership.mem avoid A)"
"Tacit.exists_point_between" = "∀ {B C : Elements.Point} {L : Elements.Line}, Elements.OnLine B L → Elements.OnLine C L → Ne B C → ∀ (avoid : List Elements.Point), Exists fun (A : Elements.Point) => And (Elements.OnLine A L) (And (Elements.Between B A C) (Not (Membership.mem avoid A)))"
"Tacit.exists_point_inside_circle" = "∀ (α : Elements.Circle) (avoid : List Elements.Point), Exists fun (A : Elements.Point) => And (Elements.InsideCircle A α) (Not (Membership.mem avoid A))"
"Tacit.exists_point_on_circle" = "∀ (α : Elements.Circle) (avoid : List Elements.Point), Exists fun (A : Elements.Point) => And (Elements.OnCircle A α) (Not (Membership.mem avoid A))"
"Tacit.exists_point_on_line" = "∀ (L : Elements.Line) (avoid : List Elements.Point), Exists fun (A : Elements.Point) => And (Elements.OnLine A L) (Not (Membership.mem avoid A))"
"Tacit.exists_point_on_line_off_line" = "∀ {L M : Elements.Line}, Ne L M → ∀ (avoid : List Elements.Point), Exists fun (A : Elements.Point) => And (Elements.OnLine A L) (And (Not (Elements.OnLine A M)) (Not (Membership.mem avoid A)))"
"Tacit.exists_point_opposite_side" = "∀ {B : Elements.Point} {L : Elements.Line}, Not (Elements.OnLine B L) → ∀ (avoid : List Elements.Point), Exists fun (A : Elements.Point) => And (Elements.OppositeSides A B L) (Not (Membership.mem avoid A))"
"Tacit.exists_point_outside_circle" = "∀ (α : Elements.Circle) (avoid : List Elements.Point), Exists fun (A : Elements.Point) => And (Elements.OutsideCircle A α) (Not (Membership.mem avoid A))"
"Tacit.exists_point_same_side" = "∀ {B : Elements.Point} {L : Elements.Line}, Not (Elements.OnLine B L) → ∀ (avoid : List Elements.Point), Exists fun (A : Elements.Point) => And (Elements.SameSide A B L) (Not (Membership.mem avoid A))"
"Tacit.inside_not_on" = "∀ {A : Elements.Point} {α : Elements.Circle}, Elements.InsideCircle A α → Not (Elements.OnCircle A α)"
"Tacit.inside_of_angle_add" = "∀ {A B C D : Elements.Point} {L M : Elements.Line}, Elements.OnLine A L → Elements.OnLine A M → Elements.OnLine B L → Elements.OnLine C M → Ne A B → Ne A C → Not (Elements.OnLine D L) → Not (Elements.OnLine D M) → Ne L M → Eq (Elements.ang B A C) (HAdd.hAdd (Elements.ang B A D) (Elements.ang D A C)) → And (Elements.SameSide B D M) (Elements.SameSide C D L)"
"Tacit.inside_of_between" = "∀ {A B C : Elements.Point} {α : Elements.Circle}, Or (Elements.InsideCircle A α) (Elements.OnCircle A α) → Or (Elements.InsideCircle B α) (Elements.OnCircle B α) → Elements.Between A C B → Elements.InsideCircle C α"
"Tacit.inside_of_len_lt" = "∀ {A B C : Elements.Point} {α : Elements.Circle}, Elements.Centre A α → Elements.OnCircle B α → LT.lt (Elements.len A C) (Elements.len A B) → Elements.InsideCircle C α"
"Tacit.len_add_of_between" = "∀ {A B C : Elements.Point}, Elements.Between A B C → Eq (HAdd.hAdd (Elements.len A B) (Elements.len B C)) (Elements.len A C)"
"Tacit.len_lt_of_inside" = "∀ {A B C : Elements.Point} {α : Elements.Circle}, Elements.Centre A α → Elements.OnCircle B α → Elements.InsideCircle C α → LT.lt (Elements.len A C) (Elements.len A B)"
"Tacit.len_self" = "∀ (A : Elements.Point), Eq (Elements.len A A) 0"
"Tacit.len_symm" = "∀ (A B : Elements.Point), Eq (Elements.len A B) (Elements.len B A)"
"Tacit.line_circle_between" = "∀ {B C : Elements.Point} {L : Elements.Line} {α : Elements.Circle}, Elements.InsideCircle B α → Elements.OnLine B L → Elements.OutsideCircle C α → Elements.OnLine C L → Exists fun (A : Elements.Point) => And (Elements.OnCircle A α) (And (Elements.OnLine A L) (Elements.Between B A C))"
"Tacit.line_circle_beyond" = "∀ {B C : Elements.Point} {L : Elements.Line} {α : Elements.Circle}, Elements.InsideCircle B α → Elements.OnLine B L → Elements.OnLine C L → Ne C B → Exists fun (A : Elements.Point) => And (Elements.OnCircle A α) (And (Elements.OnLine A L) (Elements.Between A B C))"
"Tacit.line_meets_circle_of_inside" = "∀ {A : Elements.Point} {L : Elements.Line} {α : Elements.Circle}, Elements.InsideCircle A α → Elements.OnLine A L → Elements.LineMeetsCircle L α"
"Tacit.line_meets_circle_of_opposite_sides" = "∀ {A B : Elements.Point} {L : Elements.Line} {α : Elements.Circle}, Or (Elements.InsideCircle A α) (Elements.OnCircle A α) → Or (Elements.InsideCircle B α) (Elements.OnCircle B α) → Elements.OppositeSides A B L → Elements.LineMeetsCircle L α"
"Tacit.line_unique" = "∀ {A B : Elements.Point} {L M : Elements.Line}, Ne A B → Elements.OnLine A L → Elements.OnLine B L → Elements.OnLine A M → Elements.OnLine B M → Eq L M"
"Tacit.lines_meet_of_opposite_sides" = "∀ {A B : Elements.Point} {L M : Elements.Line}, Elements.OppositeSides A B L → Elements.OnLine A M → Elements.OnLine B M → Elements.LinesMeet L M"
"Tacit.lt_irrefl" = "∀ {k : Elements.Kind} (a : Elements.Magnitude k), Not (LT.lt a a)"
"Tacit.lt_trans" = "∀ {k : Elements.Kind} {a b c : Elements.Magnitude k}, LT.lt a b → LT.lt b c → LT.lt a c"
"Tacit.lt_trichotomy" = "∀ {k : Elements.Kind} (a b : Elements.Magnitude k), Or (LT.lt a b) (Or (Eq a b) (LT.lt b a))"
"Tacit.ne_of_between" = "∀ {A B C : Elements.Point}, Elements.Between A B C → Ne A B"
"Tacit.ne_of_between_ends" = "∀ {A B C : Elements.Point}, Elements.Between A B C → Ne A C"
"Tacit.not_between_of_between" = "∀ {A B C : Elements.Point}, Elements.Between A B C → Not (Elements.Between B A C)"
"Tacit.not_between_of_between_between" = "∀ {A B C D : Elements.Point}, Elements.Between A B C → Elements.Between A B D → Not (Elements.Between C B D)"
"Tacit.not_lt_zero" = "∀ {k : Elements.Kind} (a : Elements.Magnitude k), Not (LT.lt a 0)"
"Tacit.not_on_line_of_same_side" = "∀ {A B : Elements.Point} {L : Elements.Line}, Elements.SameSide A B L → Not (Elements.OnLine A L)"
"Tacit.not_same_side_of_circles_meet" = "∀ {A B C D : Elements.Point} {L : Elements.Line} {α β : Elements.Circle}, Ne α β → Elements.OnCircle C α → Elements.OnCircle C β → Elements.OnCircle D α → Elements.OnCircle D β → Ne C D → Elements.Centre A α → Elements.Centre B β → Elements.OnLine A L → Elements.OnLine B L → Not (Elements.SameSide C D L)"
"Tacit.on_circle_of_len_eq" = "∀ {A B C : Elements.Point} {α : Elements.Circle}, Elements.Centre A α → Elements.OnCircle B α → Eq (Elements.len A C) (Elements.len A B) → Elements.OnCircle C α"
"Tacit.on_line_of_area_eq_zero" = "∀ {A B C : Elements.Point} {L : Elements.Line}, Elements.OnLine A L → Elements.OnLine B L → Ne A B → Eq (Elements.area A B C) 0 → Elements.OnLine C L"
"Tacit.on_line_of_between" = "∀ {A B C : Elements.Point} {L : Elements.Line}, Elements.Between A B C → Elements.OnLine A L → Elements.OnLine B L → Elements.OnLine C L"
"Tacit.on_line_of_between_ends" = "∀ {A B C : Elements.Point} {L : Elements.Line}, Elements.Between A B C → Elements.OnLine A L → Elements.OnLine C L → Elements.OnLine B L"
"Tacit.outside_of_between" = "∀ {A B C : Elements.Point} {α : Elements.Circle}, Or (Elements.InsideCircle A α) (Elements.OnCircle A α) → Not (Elements.InsideCircle C α) → Elements.Between A C B → Elements.OutsideCircle B α"
"Tacit.pasch1" = "∀ {A B C : Elements.Point} {L : Elements.Line}, Elements.Between A B C → Elements.SameSide A C L → Elements.SameSide A B L"
"Tacit.pasch2" = "∀ {A B C : Elements.Point} {L : Elements.Line}, Elements.Between A B C → Elements.OnLine A L → Not (Elements.OnLine B L) → Elements.SameSide B C L"
"Tacit.pasch3" = "∀ {A B C : Elements.Point} {L : Elements.Line}, Elements.Between A B C → Elements.OnLine B L → Not (Elements.SameSide A C L)"
"Tacit.pasch4" = "∀ {A B C : Elements.Point} {L M : Elements.Line}, Ne L M → Elements.OnLine B L → Elements.OnLine B M → Elements.OnLine A M → Elements.OnLine C M → Ne A C → Ne A B → Ne C B → Not (Elements.SameSide A C L) → Elements.Between A B C"
"Tacit.same_ray_of_angle_eq_zero" = "∀ {A B C : Elements.Point} {L : Elements.Line}, Ne A B → Ne A C → Elements.OnLine A L → Elements.OnLine B L → Eq (Elements.ang B A C) 0 → And (Elements.OnLine C L) (Not (Elements.Between B A C))"
"Tacit.same_side_or" = "∀ {A B C : Elements.Point} {L : Elements.Line}, Not (Elements.OnLine A L) → Not (Elements.OnLine B L) → Not (Elements.OnLine C L) → Not (Elements.SameSide A B L) → Or (Elements.SameSide A C L) (Elements.SameSide B C L)"
"Tacit.same_side_refl" = "∀ {A : Elements.Point} {L : Elements.Line}, Not (Elements.OnLine A L) → Elements.SameSide A A L"
"Tacit.same_side_symm" = "∀ {A B : Elements.Point} {L : Elements.Line}, Elements.SameSide A B L → Elements.SameSide B A L"
"Tacit.same_side_trans" = "∀ {A B C : Elements.Point} {L : Elements.Line}, Elements.SameSide A B L → Elements.SameSide A C L → Elements.SameSide B C L"
"Tacit.superposition" = "∀ {A B C D G H : Elements.Point} {L : Elements.Line}, Elements.Triangle A B C → Elements.OnLine D L → Elements.OnLine G L → Ne D G → Not (Elements.OnLine H L) → Exists fun (B' : Elements.Point) => Exists fun (C' : Elements.Point) => And (Elements.OnLine B' L) (And (Not (Elements.Between B' D G)) (And (Elements.SameSide C' H L) (And (Eq (Elements.len D B') (Elements.len A B)) (And (Eq (Elements.len B' C') (Elements.len B C)) (And (Eq (Elements.len C' D) (Elements.len C A)) (And (Eq (Elements.ang B' D C') (Elements.ang B A C)) (And (Eq (Elements.ang D C' B') (Elements.ang A C B)) (Eq (Elements.ang C' B' D) (Elements.ang C B A)))))))))"
"Tacit.triple_incidence1" = "∀ {A B C D : Elements.Point} {L M N : Elements.Line}, Elements.OnLine A L → Elements.OnLine A M → Elements.OnLine A N → Elements.OnLine B L → Elements.OnLine C M → Elements.OnLine D N → Elements.SameSide C D L → Elements.SameSide B C N → Not (Elements.SameSide B D M)"
"Tacit.triple_incidence2" = "∀ {A B C D : Elements.Point} {L M N : Elements.Line}, Elements.OnLine A L → Elements.OnLine A M → Elements.OnLine A N → Elements.OnLine B L → Elements.OnLine C M → Elements.OnLine D N → Elements.SameSide C D L → Not (Elements.SameSide B D M) → Not (Elements.OnLine D M) → Ne B A → Elements.SameSide B C N"
"Tacit.triple_incidence3" = "∀ {A B C D E : Elements.Point} {L M N : Elements.Line}, Elements.OnLine A L → Elements.OnLine A M → Elements.OnLine A N → Elements.OnLine B L → Elements.OnLine C M → Elements.OnLine D N → Elements.SameSide C D L → Elements.SameSide B C N → Elements.SameSide D E M → Elements.SameSide C E N → Elements.SameSide C E L"

[vocabulary]  # 37
"Angle" = "def : Type := Elements.Magnitude Elements.Kind.angle"
"Area" = "def : Type := Elements.Magnitude Elements.Kind.area"
"Between" = "opaque : Elements.Point → Elements.Point → Elements.Point → Prop"
"Centre" = "opaque : Elements.Point → Elements.Circle → Prop"
"Circle" = "opaque : Type"
"CirclesMeet" = "def : Elements.Circle → Elements.Circle → Prop := fun (α β : Elements.Circle) => Exists fun (A : Elements.Point) => Exists fun (B : Elements.Point) => And (Ne A B) (And (Elements.OnCircle A α) (And (Elements.OnCircle A β) (And (Elements.OnCircle B α) (Elements.OnCircle B β))))"
"Collinear" = "def : Elements.Point → Elements.Point → Elements.Point → Prop := fun (A B C : Elements.Point) => Exists fun (L : Elements.Line) => And (Elements.OnLine A L) (And (Elements.OnLine B L) (Elements.OnLine C L))"
"InsideCircle" = "opaque : Elements.Point → Elements.Circle → Prop"
"IsRightAngle" = "def : Elements.Point → Elements.Point → Elements.Point → Prop := fun (A B C : Elements.Point) => Exists fun (D : Elements.Point) => And (Elements.Between A B D) (And (Not (Elements.Collinear A B C)) (Eq (Elements.ang A B C) (Elements.ang C B D)))"
"Kind" = "inductive : Type"
"Kind.angle" = "constructor : Elements.Kind"
"Kind.area" = "constructor : Elements.Kind"
"Kind.length" = "constructor : Elements.Kind"
"Length" = "def : Type := Elements.Magnitude Elements.Kind.length"
"Line" = "opaque : Type"
"LineMeetsCircle" = "def : Elements.Line → Elements.Circle → Prop := fun (L : Elements.Line) (α : Elements.Circle) => Exists fun (A : Elements.Point) => Exists fun (B : Elements.Point) => And (Ne A B) (And (Elements.OnLine A L) (And (Elements.OnCircle A α) (And (Elements.OnLine B L) (Elements.OnCircle B α))))"
"LinesMeet" = "def : Elements.Line → Elements.Line → Prop := fun (L M : Elements.Line) => And (Ne L M) (Exists fun (A : Elements.Point) => And (Elements.OnLine A L) (Elements.OnLine A M))"
"Magnitude" = "def : Elements.Kind → Type := fun (k : Elements.Kind) => NonemptyType.type (Elements.MagnitudeImpl k)"
"Magnitude.add" = "opaque : {k : Elements.Kind} → Elements.Magnitude k → Elements.Magnitude k → Elements.Magnitude k"
"Magnitude.lt" = "opaque : {k : Elements.Kind} → Elements.Magnitude k → Elements.Magnitude k → Prop"
"Magnitude.zero" = "opaque : {k : Elements.Kind} → Elements.Magnitude k"
"MagnitudeImpl" = "opaque : Elements.Kind → NonemptyType"
"OnCircle" = "opaque : Elements.Point → Elements.Circle → Prop"
"OnLine" = "opaque : Elements.Point → Elements.Line → Prop"
"OppositeSides" = "def : Elements.Point → Elements.Point → Elements.Line → Prop := fun (A B : Elements.Point) (L : Elements.Line) => And (Not (Elements.OnLine A L)) (And (Not (Elements.OnLine B L)) (Not (Elements.SameSide A B L)))"
"OutsideCircle" = "def : Elements.Point → Elements.Circle → Prop := fun (A : Elements.Point) (α : Elements.Circle) => And (Not (Elements.InsideCircle A α)) (Not (Elements.OnCircle A α))"
"Point" = "opaque : Type"
"SameSide" = "opaque : Elements.Point → Elements.Point → Elements.Line → Prop"
"Triangle" = "def : Elements.Point → Elements.Point → Elements.Point → Prop := fun (A B C : Elements.Point) => Not (Elements.Collinear A B C)"
"ang" = "opaque : Elements.Point → Elements.Point → Elements.Point → Elements.Angle"
"area" = "opaque : Elements.Point → Elements.Point → Elements.Point → Elements.Area"
"instAddMagnitude" = "instance : {k : Elements.Kind} → Add (Elements.Magnitude k) := fun {k : Elements.Kind} => Add.mk Elements.Magnitude.add"
"instLEMagnitude" = "instance : {k : Elements.Kind} → LE (Elements.Magnitude k) := fun {k : Elements.Kind} => LE.mk fun (a b : Elements.Magnitude k) => Not (LT.lt b a)"
"instLTMagnitude" = "instance : {k : Elements.Kind} → LT (Elements.Magnitude k) := fun {k : Elements.Kind} => LT.mk Elements.Magnitude.lt"
"instOfNatMagnitudeOfNatNat" = "instance : {k : Elements.Kind} → OfNat (Elements.Magnitude k) 0 := fun {k : Elements.Kind} => OfNat.mk Elements.Magnitude.zero"
"len" = "opaque : Elements.Point → Elements.Point → Elements.Length"
"rightAngle" = "opaque : Elements.Angle"
